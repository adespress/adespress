se respond with "AI configuration test successful!" to confirm you are working properly.`,settings:e}),r=Date.now()-t,i=e.selectedModels.text;return n.toLowerCase().includes(`successful`)?{success:!0,message:`✅ Test successful! ${i} (${e.provider}) is working properly (${r}ms).`,latencyMs:r}:{success:!0,message:`✅ Connected to ${i} (${r}ms). Response: ${n.substring(0,80)}`,latencyMs:r}}catch(e){return{success:!1,message:`❌ Test failed: ${e.message||`Connection failed`}`,latencyMs:Date.now()-t}}}var k=`It is not the strongest of the species that survives, but the one most adaptable to change. - Charles Darwin(In every walk with nature, one receives far more than they seek. - John Muir(The Earth does not belong to us; we belong to the Earth. - Chief Seattle(Permaculture is a philosophy of working with, rather than against nature. - Bill Mollison(The care of the Earth is our most ancient and most worthy responsibility. - Wendell Berry(Agriculture is not crop production as popular belief holds - it's the production of food and fiber from the world's land and waters. - Jared Diamond(A garden requires patient labor and attention. Plants and flowers thrive with love and care. - Liberty Hyde Bailey(The best time to plant a tree was 20 years ago. The second best time is now. - Chinese Proverb(To plant a garden is to believe in tomorrow. - Audrey Hepburn(All gardening is landscape painting. - William Kent(A society grows great when old men plant trees whose shade they know they shall never sit in. - Greek Proverb(The glory of gardening: hands in the dirt, head in the sun, heart with nature. - Alfred Austin(Diversity creates stability. - David Holmgren(Nature does not hurry, yet everything is accomplished. - Lao Tzu(One touch of nature makes the whole world kin. - William Shakespeare(No one will protect what they don't care about, and no one will care about what they have never experienced. - David Attenborough(The living world is a unique and spectacular marvel; yet the way we humans are treating it is beyond heartbreaking. - David Attenborough(Plants and animals don't fight the winter; they don't pretend it's not happening and attempt to carry on living the same lives. They prepare. - David Attenborough(There is no compost more enriching, or catalyst more potent, than working with nature. - Charles Dowding(The soil is much more important than the seed. Growing is about creating conditions, not forcing results. - Charles Dowding(Patience is the gardener's greatest tool after the spade. - Monty Don(Gardens and gardening connect us not just to nature, but to our own essential nature. - Monty Don(The garden is a metaphor for life, and gardening is a way of life. - Monty Don(A garden is a grand teacher. It teaches patience and careful watchfulness. - Monty Don(Life is a process of creating abundance and diversity, not scarcity and simplification. - Ernst Gotsch(The secret to agriculture is not to fight nature but to cooperate with it. - Ernst Gotsch(Every species is a solution to a problem posed by the environment. - Charles Darwin(From the war of nature, from famine and death, the most exalted object of which we are capable of conceiving, namely, the production of the higher animals, directly follows. - Charles Darwin(Geography has made us neighbors. History has made us friends. Economics has made us partners. And necessity has made us allies. - Jared Diamond(The difference between civilizations and the rest of life lies in how we modify our environment. - Jared Diamond(Traditional environmental knowledge is based on a lifetime of direct contact with the environment and on information shared by others. - Jared Diamond(Much of human history has consisted of unequal conflicts between the haves and the have-nots. - Jared Diamond(Adaptation is not just survival - it is the art of thriving through change. - Ernst Gotsch(The forest teaches us that cooperation, not competition, is the foundation of abundance. - Ernst Gotsch(Every plant is a teacher, every ecosystem a classroom, every season a curriculum. - David Attenborough`.split(`(`),A=[`🌳 Tree Guilds: Plant nitrogen-fixing shrubs like comfrey around fruit trees to create beneficial plant communities that support each other's growth.`,`🌿 Observe & Interact: Spend time observing your garden through all seasons before making major changes - understanding comes before action.`,`🌸 Beneficial Flowers: Plant nasturtiums as trap crops for aphids, and marigolds to deter nematodes and many garden pests.`,`🌳 Tree Spacing: Plant fruit trees considering their mature size - dwarf varieties need 6-8 feet, standard trees need 25-30 feet apart.`,`🦋 Edge Effect: Create diverse edges where different habitats meet - these transition zones support the most biodiversity.`,`🌱 Use Small & Slow Solutions: Start with small garden experiments and expand gradually - this builds knowledge and prevents overwhelming yourself.`,`🐛 Beneficial Insects: Leave some 'messy' areas with native plants and hollow stems where beneficial insects can overwinter.`,`🥦 Brassica Rotation: Never plant cabbage family crops in the same spot two years running to prevent clubroot and other soil-borne diseases.`,`🌰 Food Forests: Create layers - canopy trees, understory, shrubs, herbaceous plants, ground cover, and root crops for maximum productivity.`,`♻️ Use & Value Renewable Resources: Compost kitchen scraps, save seeds, and use natural materials - work with nature's cycles, not against them.`,`👁️ Read Your Land: Before planting anything, observe where water naturally flows during rain - work with these patterns, not against them.`,`🏃‍♂️ Let Fast Growers Lead: Plant quick-growing pioneers like willow, comfrey, and clover first - they'll prepare the ground for slower permanent crops.`,`🌊 Water Walks Downhill: Follow water movement across your land - the lowest, wettest spots often make the best food production areas.`,`😴 Lazy Gardener's Secret: Perennial plants do the work for you year after year - invest time once, harvest for decades.`,`🚫 Stop Disturbing Soil: Instead of digging, layer organic matter on top and let earthworms do the mixing - they work 24/7 for free.`,`🍃 Zone Your Energy: Place high-maintenance plants closest to your house where you'll naturally tend them more often.`,`🌿 Self-Seeding Saves Work: Let plants like calendula, dill, and lettuce go to seed - they'll replant themselves next season without effort.`,`🔄 Stack Functions: Choose plants that serve multiple purposes - fruit trees provide food, shade, windbreak, and wildlife habitat all at once.`,`🐛 Problems Are Solutions: Weeds show soil conditions - dandelions indicate compacted earth, plantain shows where people walk frequently.`,`🌳 Start with Trees: Plant your largest, slowest elements first - trees take years to establish but create the framework for everything else.`,`💧 Catch & Store Energy: Position rain barrels, swales, and mulch where gravity naturally brings water and organic matter.`,`🌱 Minimum Viable Intervention: Do the smallest action that creates the biggest positive change - often it's just adding mulch.`,`🔍 Microclimates Matter: Observe sun, shade, wind, and moisture patterns - different areas of your land have different growing personalities.`,`🌿 Pioneer Plant Strategy: Use fast-growing nitrogen-fixers like beans and peas to build soil fertility before planting long-term crops.`,`🎯 Work from Patterns to Details: Design your whole system first, then worry about which specific varieties to plant where.`,`🌸 Diversity Prevents Problems: Monocultures invite pests and diseases - mixed plantings create natural pest control through confusion.`,`💪 Use Biological Resources: Instead of adding fertilizer, add plants that naturally accumulate and concentrate nutrients from deep in the soil.`,`🦆 Animals Do Work: Chickens clear weeds and debug gardens, ducks eat slugs, goats clear brush - let animals solve problems for you.`,`🌊 Design for Water First: Plan where water will go during heavy rains - this prevents erosion and captures resources for dry times.`,`⭕ Create Beneficial Relationships: Plant companions that help each other - corn supports beans, beans feed corn nitrogen, squash shades soil.`,`🌱 Use Edge & Value Marginal: The borders between different areas (forest/field, wet/dry) are often the most productive spaces.`,`🔄 Apply Self-Regulation: Set up systems that maintain themselves - groundcovers that suppress weeds, mulches that feed soil organisms.`,`🌿 Use Renewable Resources First: Before buying inputs, use what you have - fallen leaves for mulch, kitchen scraps for compost, saved seeds.`,`🎨 Value Diversity: Grow many different plants to spread risk - if one crop fails, others will succeed in the same season.`,`🌳 Work with Natural Succession: Instead of fighting plant succession, guide it - let pioneer plants prepare soil for your desired long-term plants.`,`🐌 Small & Slow Solutions Work: Start small gardens that you can manage well, then expand gradually as your skills and energy allow.`,`💡 Observe & Listen: Spend quiet time in your garden regularly - plants and soil will tell you what they need if you pay attention.`,`🌿 Use What You Have: Before buying anything new, look around for materials already available - logs for raised beds, leaves for mulch.`,`🔄 Think in Systems: Every element should serve multiple functions and every function should be supported by multiple elements for resilience.`,`🌊 Water is the Master Resource: Design your entire garden around how water moves through it - everything else follows water patterns.`,`🌱 Start with Soil Biology: Healthy soil full of microorganisms will solve most plant problems - feed the soil, not just the plants.`,`🎯 Design from Zone 1 Out: Start improvements closest to your house and work outward - maintain intensive areas before expanding extensively.`,`🌸 Use Beneficial Weeds: Many 'weeds' are actually useful - dandelion roots break up clay, nettle makes excellent compost, plantain heals wounds.`,`⚡ Relative Location is Key: Place elements where they naturally support each other - compost near kitchen, herbs near house, ducks near sluggy areas.`,`🍃 Yield is Abundance: Design for multiple yields from each element - fruit trees give food, shade, windbreak, habitat, and beauty.`,`🌿 Use Natural Patterns: Copy patterns you see in nature - spirals for herb gardens, clusters for tree plantings, flowing curves for paths.`,`🔍 Problem is the Solution: Turn problems into opportunities - wet spots become ponds, slopes become terraces, pests indicate imbalanced systems.`,`🌱 Each Element Should Support System: Every plant, structure, or animal you add should contribute to the overall health and productivity of your land.`,`🌊 Design with Climate Change in Mind: Choose resilient plants and systems that can handle weather extremes - diversity and deep roots survive stress.`,`💚 Care for Earth & People: Make decisions that heal the land while meeting human needs - sustainable systems benefit both nature and communities.`,`🔄 Creatively Use & Respond to Change: Adapt your garden design as conditions change - flexibility and observation matter more than rigid plans.`],Te={winter:[`❄️ Planning Season: Use winter to plan next year's garden, order seeds, and study companion planting combinations.`,`🌿 Indoor Herbs: Start an indoor herb garden on a sunny windowsill - basil, parsley, and chives grow well indoors.`,`🌱 Seed Starting Prep: Clean and organize seed starting equipment for spring - sterilize trays and check grow lights.`,`🌳 Tree Pruning: Prune dormant fruit trees and berry bushes on mild days when temps are above freezing.`,`🍂 Compost Maintenance: Turn compost piles and add brown materials to balance green kitchen scraps.`,`🍃 Lazy Winter Mulch: Let fallen leaves stay as natural mulch instead of raking - they'll break down and feed soil organisms all winter.`,`👀 Winter Observation: Walk your space during winter storms to see where water naturally flows and pools - these are your future swales and ponds.`,`🌨️ Snow as Fertilizer: Fresh snow contains nitrogen - let it melt naturally on garden beds instead of shoveling it away from growing areas.`,`🐦 Wildlife Tracking: Follow animal tracks in snow to understand wildlife corridors - design your garden to work with these natural pathways.`,`☀️ Winter Sun Mapping: On sunny winter days, note which areas get light - these will be your earliest warm microclimates in spring.`,`🌿 Wild Greens Season: Learn to identify winter wild edibles like chickweed and dandelion - nature provides food even in dormant seasons.`,`🔥 Biomass Banking: Collect pruned branches and dead plant matter for biochar or hugel beds - winter is the perfect time to gather materials.`],spring:[`🌱 Seed Starting: Start tomato and pepper seeds indoors 6-8 weeks before last frost date for healthy transplants.`,`🥬 Cool Weather Crops: Plant lettuce, spinach, peas, and radishes - they thrive in cool spring temperatures.`,`🌿 Soil Preparation: Add compost to garden beds and test soil pH before planting season begins.`,`🌸 Beneficial Flowers: Plant calendula and sweet alyssum early - they attract beneficial insects and tolerate light frost.`,`🥕 Carrot Companions: Plant carrots with chives, onions, or leeks - their strong scents confuse carrot fly pests naturally.`,`🌳 Tree Planting: Spring is ideal for planting new fruit trees - the soil is workable and trees can establish before summer heat.`,`🌱 Pioneer Plant Strategy: Let volunteer weeds like clover and chickweed establish first in bare areas - they'll fix nitrogen and prepare soil naturally.`,`💧 Spring Water Reading: Watch where puddles form during spring rains - these low spots are perfect for establishing swales and water-loving plants.`,`🐛 Beneficial Insect Hotels: Leave some 'messy' areas undisturbed through spring - overwintering beneficial insects are emerging and need habitat.`,`🌿 Forage Before You Sow: Harvest early spring wild edibles like violet leaves and nettle tips before establishing new garden beds in those areas.`,`🌤️ Microclimate Mapping: Notice which areas warm up first in spring - these south-facing, protected spots are your earliest planting zones.`,`🌱 Natural Succession Timing: Plant perennial food crops when soil naturally warms rather than rushing - let the land tell you when it's ready.`,`🍃 Minimal Soil Disturbance: Instead of tilling, simply lay cardboard over grass and add compost on top - let earthworms do the soil preparation.`,`🌸 Wild Pollinator Support: Leave dandelions and other early 'weeds' flowering - they provide crucial early nectar when little else is blooming.`],summer:[`🍅 Tomato Deep Watering: Water tomatoes deeply but less frequently to encourage deep root growth and prevent blossom end rot.`,`🥒 Cucumber Trellising: Train cucumbers vertically on trellises to save space, improve air circulation, and prevent soil-borne diseases.`,`💧 Water Management: Apply 3-4 inches of mulch around plants to retain moisture and reduce watering needs during hot weather.`,`🌽 Three Sisters Method: Plant corn, beans, and squash together - corn provides support, beans fix nitrogen, squash suppresses weeds.`,`🥬 Succession Planting: Sow lettuce and other quick crops every 2-3 weeks for continuous harvests through summer.`,`🌻 Dynamic Accumulators: Plant comfrey and sunflowers - they mine deep nutrients and concentrate them in their leaves for compost.`,`🥔 Potato Hilling: Gradually hill soil around potato plants as they grow to increase tuber production and prevent greening.`,`☀️ Drought-Proof Design: Observe which areas stay moist longest during dry spells - these are your natural water collection zones for future plantings.`,`🌿 Living Mulch Systems: Let beneficial 'weeds' like purslane and lamb's quarters grow between crops - they protect soil and provide edible greens.`,`🦋 Pollinator Corridors: Notice which flowers attract the most bees and butterflies, then plant more of these varieties to create continuous blooming paths.`,`🌱 Heat-Stressed Plant Reading: Plants that wilt first show you the driest microclimates - install shade structures or water catchment in these areas.`,`🌳 Canopy Management: Observe how tree shadows move throughout the day - use this knowledge to place heat-sensitive plants in natural cooling zones.`,`💧 Greywater Opportunities: During peak water use season, direct kitchen and bath greywater to thirsty fruit trees and large plants.`,`🌾 Seed Setting Season: Let some crops go to seed naturally for next year's free plants - focus on varieties that perform best in your specific conditions.`,`🐛 Natural Pest Balance: When you see pest insects, wait and observe - beneficial predators often arrive within days to restore natural balance.`],fall:[`🌾 Cover Crops: Plant winter rye or clover in empty beds to prevent erosion, add nitrogen, and improve soil structure.`,`🥦 Fall Brassicas: Plant kale, broccoli, and Brussels sprouts - they taste sweeter after light frost exposure.`,`🍂 Leaf Collection: Collect fallen leaves for compost - they provide essential brown material and improve soil structure.`,`🌰 Harvest Storage: Properly cure and store winter squash, onions, and potatoes in cool, dry places for winter eating.`,`💧 Rain Water Harvesting: Install rain barrels and swales to capture fall rains for next year's growing season.`,`🌱 Seed Saving: Collect seeds from open-pollinated varieties to preserve genetic diversity and adapt plants to your climate.`,`🍃 Lazy Leaf Management: Instead of raking, use fallen leaves as instant mulch around perennials - they'll break down into perfect soil amendment.`,`🌧️ Fall Storm Observation: Watch how water moves during autumn rains - this is the perfect time to plan swales and drainage improvements.`,`🌿 Self-Seeding Allies: Let beneficial plants like calendula, dill, and cilantro drop seeds naturally - they'll emerge exactly when conditions are right.`,`🍂 Biomass Harvesting: Cut back perennial plants but leave 6-inch stalks - they'll catch snow, provide wildlife habitat, and mark plant locations.`,`🌰 Wild Food Mapping: Note where wild foods like acorns, rose hips, and persimmons are abundant - these areas have ideal growing conditions for similar plants.`,`🌱 Natural Succession Planning: Observe which 'weeds' thrive in different areas after harvest - they indicate soil conditions and suggest what to plant next.`,`❄️ Winter Protection Setup: Use natural materials like leaves, straw, and brush to protect tender plants - work with available resources rather than buying supplies.`]},Ee={"temperate-north":Te,tropical:{"wet-season":[`🌧️ Drainage First: Create swales and raised beds before wet season - standing water kills more plants than drought in the tropics.`,`🍄 Fungal Prevention: Increase air circulation and reduce leaf wetness - wet season brings fungal disease challenges that require proactive management.`,`🌿 Living Mulch Power: Use fast-growing ground covers like sweet potato vines to protect soil from heavy tropical rains and erosion.`,`🌊 Monsoon Water Harvest: Install gutters, rain chains, and large storage during wet season - capture abundance for dry months ahead.`,`🦠 Disease Prevention: Space plants wider for airflow and choose resistant varieties - humidity creates perfect conditions for plant pathogens.`,`🌱 Fast Succession: Plant quick crops like kangkung and Asian greens every 2 weeks - wet season growth is explosive, maximize it.`,`🐛 Beneficial Habitat: Maintain dry refuges for beneficial insects during heavy rains - they need shelter to survive monsoon periods.`,`💨 Wind Protection: Install windbreaks before storm season - tropical storms can destroy unprotected gardens in hours.`,`🌾 Cover Crop Timing: Sow nitrogen-fixing cover crops like cowpeas at wet season start - they'll establish before dry season stress.`,`🏠 Elevated Growing: Use raised beds, containers, and vertical systems - wet season flooding can be deadly to root systems.`],"dry-season":[`☀️ Deep Shade Systems: Create multiple canopy layers with banana, coconut, papaya, and understory shrubs for natural cooling and water conservation.`,`💧 Water Banking: Dig ponds and swales during dry season to capture next wet season's abundance - work with seasonal patterns.`,`🌵 Drought Champions: Plant drought-tolerant natives like moringa, cassava, and dragon fruit before rains return - establish during stress for resilience.`,`🌳 Canopy Creation: Plant fast-growing pioneer trees like papaya and banana for instant shade - they'll provide microclimates for sensitive plants.`,`🌿 Xerophytic Allies: Use succulent ground covers and cacti for water-wise landscaping - they thrive in tropical dry conditions.`,`⏰ Early Morning Focus: Do all watering and garden work before 8am - midday tropical sun is brutal on plants and people.`,`🍃 Leaf Litter Gold: Collect and stockpile organic matter during dry season - wet season will decompose it rapidly into soil amendment.`,`🌊 Greywater Systems: Redirect all household water to thirsty trees during dry months - every drop counts in water-scarce periods.`,`🌱 Dormancy Respect: Let deciduous tropicals rest during dry season - forcing growth during stress wastes water and weakens plants.`,`🔥 Fire Prevention: Clear dry vegetation around structures and create firebreaks - tropical dry seasons bring serious fire risk.`]},"temperate-south":{summer:[`☀️ Summer Solstice Power: December brings peak growing energy - plant heat-loving crops like tomatoes, peppers, and eggplant now.`,`🌊 Water Wise Summer: Establish deep mulch systems before peak heat - Southern Hemisphere summer can be intense and prolonged.`,`🌿 Christmas Harvest: Plan December harvests of stone fruits, berries, and summer vegetables for festive seasonal eating.`,`🦋 Pollinator Paradise: Summer flowers are crucial for native pollinators - plant native summer bloomers like eucalyptus and banksia.`,`🌳 Tree Stress Watch: Monitor established trees during hot periods - even drought-tolerant species need support during extreme heat.`,`🌱 Succession Summer: Continue planting quick crops through summer - lettuce, radish, and herbs can handle moderate summer conditions.`,`💧 Morning Watering: Water early morning to reduce evaporation - afternoon watering in summer heat can actually harm plants.`,`🌾 Summer Cover: Plant living mulches like New Zealand spinach to protect soil during intense summer sun exposure.`],autumn:[`🍂 Autumn Abundance: March-May is prime planting time for cool season crops - plant brassicas, root vegetables, and leafy greens.`,`🌰 Harvest Festival: Collect and process nuts, late fruits, and seed crops during stable autumn weather conditions.`,`🌿 Autumn Prep: Prepare garden beds with compost during mild autumn weather - winter rest period allows soil biology to establish.`,`🌧️ Rain Preparation: Install water collection systems before winter rains arrive - autumn setup prevents winter garden damage.`,`🌱 Tree Planting Season: Autumn is ideal for planting natives and fruit trees - they establish roots during winter rest period.`,`🍃 Leaf Management: Collect autumn leaves for compost and mulch - they'll break down perfectly during winter moisture periods.`,`🌾 Cover Crop Time: Sow winter cover crops like oats and field peas - they'll protect and feed soil through winter months.`],winter:[`❄️ Winter Growing: June-August is prime time for brassicas, root crops, and hardy greens - embrace winter as growing season.`,`🌿 Cold Frame Benefits: Use cold frames and row covers to extend growing season - winter sun is gentler but still productive.`,`🌧️ Winter Water: Manage winter rainfall with swales and drainage - too much water can be as harmful as drought.`,`🌱 Winter Pruning: Prune deciduous fruit trees during dormant winter period - shape trees for next year's production.`,`🔥 Frost Protection: Protect tender plants from winter frosts - use covers, thermal mass, and microclimates strategically.`,`🌰 Winter Storage: Properly store winter harvests of root vegetables and preserved foods for spring transition period.`,`🌾 Soil Building: Add organic matter during winter rest - slow decomposition builds stable soil structure for spring growth.`],spring:[`🌸 Spring Explosion: September brings rapid growth - prepare for intense spring energy with adequate water and nutrition systems.`,`🌱 Spring Planting Rush: Plant summer crops like tomatoes and peppers in early spring - they need full season to establish.`,`🦋 Native Spring: Support native wildlife during spring breeding season - provide water, shelter, and native food plants.`,`🌿 Weed Management: Stay ahead of spring weeds with thick mulch and ground covers - prevention is easier than removal.`,`🌧️ Spring Storms: Prepare for spring weather variability - protect young plants from late frosts and strong winds.`,`🌳 Tree Care: Support trees breaking dormancy with water and mulch - spring growth requires significant energy investment.`,`🌾 Spring Cover: Terminate winter cover crops before they set seed - incorporate green manure for spring soil fertility.`]},mediterranean:{"wet-winter":[`🌧️ Wet Season Advantage: October-March rains are your growing window - plant Mediterranean natives and cool-season crops now.`,`🌿 Winter Greens: Focus on brassicas, lettuce, and herbs during wet season - they thrive in cool, moist conditions.`,`💧 Rain Capture: Install cisterns and swales during wet season - capture precious water for dry summer months ahead.`,`🌱 Tree Establishment: Plant olive, citrus, and native trees during wet season - they need winter rains to establish deep roots.`,`🌾 Cover Crop Power: Sow leguminous cover crops during wet season - they'll fix nitrogen and build soil for summer stress.`,`🍃 Mulch Preparation: Collect and prepare organic mulches during wet season - they'll be crucial for summer water retention.`,`🌸 Wildflower Season: Enjoy native wildflower blooms and collect seeds - wet season is when Mediterranean landscapes come alive.`],"dry-summer":[`☀️ Drought Adaptation: April-September is survival mode - focus on water conservation and shade creation for plant protection.`,`🌵 Mediterranean Natives: Plant drought-tolerant natives like lavender, rosemary, and sage - they're adapted to summer drought stress.`,`💧 Deep Watering: Water deeply but infrequently - encourage deep root systems that can access groundwater during drought.`,`🌳 Shade Creation: Use trees, arbors, and shade cloth strategically - afternoon shade is crucial for plant and human comfort.`,`🌿 Summer Dormancy: Respect natural summer dormancy of Mediterranean plants - don't force growth during stress periods.`,`🏺 Ancient Techniques: Use ollas (buried clay pots) for efficient water delivery - traditional methods work in Mediterranean climates.`,`🔥 Fire Prevention: Maintain defensible space around structures - Mediterranean climates have serious wildfire risk during dry season.`]},arid:{"hot-season":[`🌵 Heat Survival: April-September is extreme stress time - focus on shade, water conservation, and heat-adapted species only.`,`🌙 Night Work: Do all garden work during pre-dawn and evening hours - midday heat is dangerous for plants and people.`,`💧 Micro-irrigation: Use drip systems and micro-sprinklers - every drop must be precisely delivered to plant root zones.`,`🌿 Desert Natives: Plant only proven arid-adapted species like prickly pear, agave, and desert marigold during hot season.`,`🏠 Thermal Mass: Use stones, walls, and thermal mass to moderate temperature swings - desert temperature extremes stress all life.`,`🌬️ Ventilation Focus: Create airflow channels and wind-powered cooling - moving air is crucial for survival in extreme heat.`,`⏰ Water Timing: Water during coolest parts of night - midday watering wastes water through evaporation and can shock plants.`],"cool-season":[`🌱 Growing Window: October-March is your main growing season - cool weather allows more plant establishment and growth.`,`🌧️ Rare Rain Capture: Capture every drop of winter precipitation - arid regions may only get 2-4 inches annually.`,`🌿 Cool Season Crops: Plant hardy vegetables like kale, chard, and root crops - they can handle cool nights and warm days.`,`🌳 Tree Establishment: Plant desert-adapted trees during cool season - they need cooler weather to establish before summer stress.`,`🌸 Desert Bloom: Support native wildflowers during cool season - brief windows of moisture create spectacular blooms.`,`🪨 Rock Mulch: Use gravel and stone mulches - they conserve moisture without rotting in arid conditions.`,`🌾 Cool Season Cover: Plant desert-adapted cover crops like desert lupine - they'll fix nitrogen during the growing window.`]}},j=[{value:`companion-plants`,label:`What companion plants should I grow with my vegetables and fruit trees?`},{value:`trees-support-species`,label:`What trees and support species would work well in my growing space and climate?`},{value:`fruit-tree-guilds`,label:`What should I plant under my fruit trees to create a productive guild?`},{value:`soil-building`,label:`How can I build healthy soil naturally without chemical inputs?`},{value:`nitrogen-fixers`,label:`What nitrogen-fixing plants can I use to improve my soil fertility?`},{value:`ground-covers`,label:`What are the best ground covers and living mulches for my area?`},{value:`food-forest-design`,label:`How do I design a food forest or polyculture system for my space?`},{value:`perennial-vegetables`,label:`What perennial vegetables and herbs can I grow for low-maintenance food production?`},{value:`water-management`,label:`How can I manage water naturally through swales, mulching, and plant selection?`},{value:`beneficial-insects`,label:`What plants attract beneficial insects and support biodiversity in my garden?`},{value:`succession-planting`,label:`How do I plan seasonal succession planting for continuous harvests?`},{value:`natural-pest-management`,label:`What are effective natural methods for pest and disease management?`},{value:`edge-zones`,label:`How can I create productive edge zones and maximize my growing space?`},{valu
