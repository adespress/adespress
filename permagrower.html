<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PermaGrower AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#5D5CDE',
            'green-accent': '#80d99e',
            'green-light': '#a3fcb2',
            'green-info': '#7dd3a0',
            'green-advice': '#4db070',
            'green-visualize': '#95e3ad'

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .gradient-bg { background: linear-gradient(135deg, #80d99e, #a3fcb2); }
    .gradient-info { background: linear-gradient(135deg, #60a5fa, #93c5fd); }
    .gradient-advice { background: linear-gradient(135deg, #10b981, #34d399, #6ee7b7); }
    .gradient-visualize { background: linear-gradient(135deg, #95e3ad, #aae8bd); }

    .dynamic-btn {
      position: relative;
      overflow: hidden;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      letter-spacing: 0.025em;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.08);
      touch-action: manipulation;
    }
    .dynamic-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px 0 rgba(0, 0, 0, 0.14);
    }
    .dynamic-btn:active {
      transform: translateY(0);
    }

    .btn-daily-check {
      background: linear-gradient(135deg, #ef4444, #dc2626, #b91c1c);
      animation: subtle-pulse 3s ease-in-out infinite;
    }
    .btn-seasonal { background: linear-gradient(135deg, #5D5CDE, #4338ca, #3730a3); }
    .btn-personal { background: linear-gradient(135deg, #80d99e, #4ade80, #22c55e); }
    .btn-advice-nav { background: linear-gradient(135deg, #10b981, #34d399, #6ee7b7); }

    @keyframes subtle-pulse {
      0%, 100% { box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.1), 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.1), 0 0 0 5px rgba(239, 68, 68, 0.2); }
    }

    /* AI Output Typographic Rhythm & Generous Section Spacing */
    .ai-output {
      line-height: 1.7;
      font-size: 0.95rem;
    }
    .ai-output p {
      margin-bottom: 1.1em;
    }
    .ai-output h1 {
      font-size: 1.45rem;
      font-weight: 800;
      margin-top: 1.7em;
      margin-bottom: 0.6em;
      color: #15803d;
    }
    .dark .ai-output h1 { color: #86efac; }
    .ai-output h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      color: #166534;
    }
    .dark .ai-output h2 { color: #a7f3d0; }
    .ai-output h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 1.3em;
      margin-bottom: 0.4em;
      color: #1f2937;
    }
    .dark .ai-output h3 { color: #e5e7eb; }
    .ai-output ul, .ai-output ol {
      margin: 1em 0;
      padding-left: 1.5em;
    }
    .ai-output li {
      margin-bottom: 0.6em;
    }
    .ai-output strong {
      font-weight: 700;
      color: #111827;
    }
    .dark .ai-output strong {
      color: #f9fafb;
    }
    .ai-output blockquote {
      border-left: 4px solid #10b981;
      padding: 0.75em 1.2em;
      margin: 1.4em 0;
      background: rgba(16, 185, 129, 0.08);
      border-radius: 0 10px 10px 0;
      font-style: italic;
      color: #374151;
    }
    .dark .ai-output blockquote {
      background: rgba(16, 185, 129, 0.15);
      color: #d1d5db;
    }
  </style>
</head>
<body class="bg-gray-200/90 dark:bg-[#111317] text-gray-900 dark:text-gray-100 min-h-screen transition-colors">

    const INSPIRING_QUOTES = [

    const GENERAL_TIPS = [
      "🌳 Tree Guilds: Plant nitrogen-fixing shrubs like comfrey around fruit trees to create beneficial plant communities that support each other's growth.",
      "🌿 Observe & Interact: Spend time observing your garden through all seasons before making major changes - understanding comes before action.",

      "🌱 Use Small & Slow Solutions: Start with small garden experiments and expand gradually - this builds knowledge and prevents overwhelming yourself.",

      "🥦 Brassica Rotation: Never plant cabbage family crops in the same spot two years running to prevent soil-borne diseases.",
      "🚫 Stop Disturbing Soil: Instead of digging, layer organic matter on top and let earthworms do the mixing - they work 24/7 for free.",

      "🔄 Stack Functions: Choose plants that serve multiple purposes - fruit trees provide food, shade, windbreak, and wildlife habitat all at once.",
      "💧 Catch & Store Energy: Position rain barrels, swales, and mulch where gravity naturally brings water and organic matter."
    ];

    const COSY_PENDING_PHRASES = [
      "🌱 Fermenting comfrey tea & composting your query...",
      "🌿 Mulching ideas and consulting the mycelial network...",
      "🐝 Buzzing through pollinator pathways for advice...",
      "🌾 Consulting companion guild wisdom, please hold...",
      "☀️ Photosynthesizing your custom garden guidance...",
      "🥕 Digging into the root zone for natural solutions...",
      "🌧️ Harvesting rainwater thoughts & brewing organic answers...",
      "🐛 Listening to the earthworms aerate the soil...",
      "🌻 Turning towards the sun to gather insights..."
    ];

    function getRandomPendingPhrase() {
      return COSY_PENDING_PHRASES[Math.floor(Math.random() * COSY_PENDING_PHRASES.length)];
    }

    // Web Audio API tactile organic click sound
    let audioCtx = null;
    let soundEnabled = true;

    function playClick() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.038);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.042);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.045);
      } catch (e) {}
    }

    function parseMarkdown(text) {
      if (!text) return '';
      let r = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      
      // Tables
      r = r.replace(/((?:\|[^\n]+\|\r?\n)+)/g, match => {
        const rows = match.trim().split('\n').map(x => x.trim()).filter(Boolean);
        if (rows.length < 2) return match;
        const isHeaderSep = /^\|[\s\-:]+(\|[\s\-:]+)+\|?$/.test(rows[1]);
        let t = '<div class="overflow-x-auto my-4 rounded-xl border border-gray-300 dark:border-gray-600"><table class="min-w-full divide-y divide-gray-300 dark:divide-gray-600 text-sm text-left">';
        let startIdx = 0;
        if (isHeaderSep) {
          const headers = rows[0].split('|').slice(1, -1).map(h => h.trim());
          t += '<thead class="bg-gray-200 dark:bg-gray-800 font-bold"><tr>';
          headers.forEach(h => t += `<th class="px-4 py-2">${h}</th>`);
          t += '</tr></thead><tbody class="divide-y divide-gray-300 dark:divide-gray-600 bg-white dark:bg-gray-700/60">';
          startIdx = 2;
        } else {
          t += '<tbody class="divide-y divide-gray-300 dark:divide-gray-600 bg-white dark:bg-gray-700/60">';
        }
        for (let i = startIdx; i < rows.length; i++) {
          const cols = rows[i].split('|').slice(1, -1).map(c => c.trim());
          t += '<tr class="hover:bg-gray-100/60 dark:hover:bg-gray-600/40">';
          cols.forEach(c => t += `<td class="px-4 py-2">${c}</td>`);
          t += '</tr>';
        }
        t += '</tbody></table></div>';
        return t;
      });

      r = r.replace(/^###\s+(.*$)/gim, '<h3>$1</h3>');
      r = r.replace(/^##\s+(.*$)/gim, '<h2>$1</h2>');
      r = r.replace(/^#\s+(.*$)/gim, '<h1>$1</h1>');
      r = r.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
      r = r.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      r = r.replace(/\*(.*?)\*/g, '<em>$1</em>');
      r = r.replace(/^&gt;\s+(.*$)/gim, '<blockquote>$1</blockquote>');
      r = r.replace(/^(?:---|\*\*\*|___)\s*$/gim, '<div class="my-6 border-t border-emerald-300/60 dark:border-emerald-800/60 flex items-center justify-center"><span class="px-2 text-emerald-600">🌱</span></div>');
      r = r.replace(/^[\-\*]\s+(.*$)/gim, '<li class="my-1 leading-relaxed">$1</li>');
      r = r.replace(/^(\d+)\.\s+(.*$)/gim, '<li class="my-1 leading-relaxed list-decimal ml-4">$2</li>');
      r = r.replace(/((?:<li class="my-1 leading-relaxed">.*<\/li>\s*)+)/g, '<ul class="my-3 pl-4 space-y-1">$1</ul>');
      
      const paragraphs = r.split(/\n{2,}/);
      return paragraphs.map(p => {
        const trimmed = p.trim();
        if (!trimmed) return '';
        if (trimmed.startsWith('<h') || trimmed.startsWith('<ul') || trimmed.startsWith('<ol') || trimmed.startsWith('<blockquote') || trimmed.startsWith('<div') || trimmed.startsWith('<table')) {
          return trimmed;
        }
        return `<p>${trimmed.replace(/\n/g, '<br/>')}</p>`;
      }).join('');
    }

    function App() {
      const [activeTab, setActiveTab] = useState('profile');
      
      // Persistent Dark Mode
      const [isDark, setIsDark] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_THEME);
          if (saved) return saved === 'dark';
          return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch { return false; }
      });

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.body.classList.add('dark');
          try { localStorage.setItem(STORAGE_KEY_THEME, 'dark'); } catch {}
        } else {
          document.documentElement.classList.remove('dark');
          document.body.classList.remove('dark');
          try { localStorage.setItem(STORAGE_KEY_THEME, 'light'); } catch {}
        }
      }, [isDark]);

      // Sound toggle state
      const [soundOn, setSoundOn] = useState(() => {
        try {
          const s = localStorage.getItem(STORAGE_KEY_SOUND);
          const enabled = s === null ? true : s === 'true';
          soundEnabled = enabled;
          return enabled;
        } catch { return true; }
      });

      const toggleSound = () => {
        const next = !soundOn;
        setSoundOn(next);
        soundEnabled = next;
        try { localStorage.setItem(STORAGE_KEY_SOUND, next ? 'true' : 'false'); } catch {}
        if (next) playClick();
      };

      const [quote, setQuote] = useState(() => INSPIRING_QUOTES[Math.floor(Math.random() * INSPIRING_QUOTES.length)]);
      const [adviceTip, setAdviceTip] = useState(() => GENERAL_TIPS[Math.floor(Math.random() * GENERAL_TIPS.length)]);
      const [chatTip, setChatTip] = useState(() => GENERAL_TIPS[Math.floor(Math.random() * GENERAL_TIPS.length)]);
      const [currentDateTime, setCurrentDateTime] = useState(() => new Date().toLocaleDateString(navigator.language || 'en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }));

      // Custom dialog modal
      const [dialog, setDialog] = useState(null);
      const showAlert = (message) => new Promise(resolve => setDialog({ type: 'alert', message, onResolve: () => { setDialog(null); resolve(); } }));
      const showConfirm = (message) => new Promise(resolve => setDialog({ type: 'confirm', message, onResolve: (v) => { setDialog(null); resolve(v); } }));

      // Profile & Logbook data
      const [profile, setProfile] = useState(() => {
        try {
          const s = localStorage.getItem(STORAGE_KEY_DATA);
          return s ? (JSON.parse(s).profile || { name: '', projectName: '', location: '', space: '', goals: '', approach: '' }) : { name: '', projectName: '', location: '', space: '', goals: '', approach: '' };
        } catch { return { name: '', projectName: '', location: '', space: '', goals: '', approach: '' }; }
      });

      const [logEntries, setLogEntries] = useState(() => {
        try {
          const s = localStorage.getItem(STORAGE_KEY_DATA);
          return s ? (JSON.parse(s).logEntries || []) : [];
        } catch { return []; }
      });

      const [backupDismissed, setBackupDismissed] = useState(false);

      const [aiSettings, setAiSettings] = useState(() => {
        try {
          const s = localStorage.getItem(STORAGE_KEY_SETTINGS);
          if (s) return JSON.parse(s);
        } catch {}
        return {
          provider: 'gemini',
          geminiApiKey: '',
          openRouterApiKey: '',
          selectedModels: {
            text: 'gemini-2.5-flash',
            vision: 'gemini-2.5-flash',
            audio: 'gemini-2.5-flash',
            reasoning: 'gemini-2.5-pro',
            imageGen: 'gemini-2.5-flash'
          },
          availableGeminiModels: DEFAULT_GEMINI_MODELS,
          availableOpenRouterModels: DEFAULT_OPENROUTER_MODELS
        };
      });

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify({ profile, logEntries })); } catch {}
      }, [profile, logEntries]);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(aiSettings)); } catch {}
      }, [aiSettings]);

      // Form & Logbook view states
      const [logEntryText, setLogEntryText] = useState('');
      const [isFullLogbookView, setIsFullLogbookView] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [timeFilter, setTimeFilter] = useState('all-time');
      const [entriesPerPage, setEntriesPerPage] = useState(25);
      const [currentPage, setCurrentPage] = useState(1);
      const [adviceMessages, setAdviceMessages] = useState([]);
      const [chatMessages, setChatMessages] = useState([]);
      const [aiQuestion, setAiQuestion] = useState('');
      const [configStatus, setConfigStatus] = useState('');
      const [isTestingConfig, setIsTestingConfig] = useState(false);

      // Visualize tab state
      const [visualPrompt, setVisualPrompt] = useState('');
      const [visualResult, setVisualResult] = useState('');
      const [uploadedVisualImage, setUploadedVisualImage] = useState(null);
      const [isVisualLoading, setIsVisualLoading] = useState(false);
      const [visualPendingMsg, setVisualPendingMsg] = useState('');

      // In-Browser Audio Recording (MediaRecorder API)
      const [isRecording, setIsRecording] = useState(false);
      const [recSeconds, setRecSeconds] = useState(0);
      const [recTarget, setRecTarget] = useState(null);
      const mediaRecRef = useRef(null);
      const audioChunksRef = useRef([]);
      const timerIntervalRef = useRef(null);
      const mediaStreamRef = useRef(null);

      // Uploaded photo for Smart Advice / Diagnostics
      const [uploadedImage, setUploadedImage] = useState(null);

      const startRecording = async (target) => {
        playClick();
        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            showAlert('Microphone not supported on this browser.');
            return;
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaStreamRef.current = stream;
          audioChunksRef.current = [];

          let mimeType = 'audio/webm';
          if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported) {
            if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
            else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
          }

          const recorder = new MediaRecorder(stream);
          mediaRecRef.current = recorder;

          recorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: mimeType });
            const r = new FileReader();
            r.onloadend = () => {
              if (target === 'logbook') {
                const now = new Date();
                setLogEntries(prev => [{
                  id: Date.now(),
                  date: now.toLocaleDateString(),
                  time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                  content: `🎙️ Voice Note (${recSeconds}s) recorded at ${now.toLocaleTimeString()}`
                }, ...prev]);
                showAlert('✓ Voice log recorded and added to entries!');
              }
            };
            r.readAsDataURL(blob);
            mediaStreamRef.current?.getTracks().forEach(t => t.stop());
            mediaStreamRef.current = null;
          };

          recorder.start(250);
          setIsRecording(true);
          setRecTarget(target);
          setRecSeconds(0);
          timerIntervalRef.current = setInterval(() => setRecSeconds(s => s + 1), 1000);
        } catch (err) {
          showAlert(`Microphone error: ${err.message || 'Permission denied'}`);
        }
      };

      const stopRecording = () => {
        playClick();
        if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') {
          mediaRecRef.current.stop();
        }
        if (timerIntervalRef.current) {
          clearInterval(timerIntervalRef.current);
          timerIntervalRef.current = null;
        }
        setIsRecording(false);
      };

      // =========================================================================
      // Unified BYOK Execution Engine with Real-Time SSE Streaming
      // =========================================================================
      async function executeAICall(prompt, task = 'text', attachment = null, onChunk = null) {
        const provider = aiSettings.provider;
        const model = aiSettings.selectedModels?.[task] || (provider === 'gemini' ? 'gemini-2.5-flash' : 'anthropic/claude-3.5-sonnet');

        if (provider === 'gemini') {
          const key = aiSettings.geminiApiKey?.trim();
          if (!key) throw new Error('Missing Google Gemini API Key. Please enter your key in ⚙️ Configure.');
          const cleanModel = model.replace(/^models\//, '');
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:streamGenerateContent?key=${key}&alt=sse`;
          
          const parts = [];
          if (attachment && attachment.dataBase64) {
            let b64 = attachment.dataBase64;
            if (b64.includes(';base64,')) b64 = b64.split(';base64,')[1];
            parts.push({
              inlineData: {
                mimeType: attachment.mimeType || 'image/jpeg',
                data: b64
              }
            });
          }
          parts.push({ text: prompt });

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ role: 'user', parts }] })
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            let msg = err.error?.message || `Gemini Error ${res.status}`;
            if (res.status === 429 || msg.toLowerCase().includes('quota') || msg.toLowerCase().includes('rate limit')) {
              msg = `⚠️ Rate Limit or Quota Reached for model "${cleanModel}" (HTTP 429).\n💡 Remedy: Try switching to another model (e.g. gemini-2.5-flash) in ⚙️ Configure or wait 20s before retrying.\n\nDetails: ${msg}`;
            }
            throw new Error(msg);
          }

          const reader = res.body?.getReader();
          if (!reader) throw new Error('Streaming not supported in this browser.');

          const decoder = new TextDecoder('utf-8');
          let accumulated = '';
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('data: ')) {
                const jsonStr = trimmed.slice(6);
                if (jsonStr === '[DONE]') continue;
                try {
                  const parsed = JSON.parse(jsonStr);
                  const chunk = parsed.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
                  if (chunk) {
                    accumulated += chunk;
                    if (onChunk) onChunk(accumulated);
                  }
                } catch {}
              }
            }
          }
          return accumulated;
        } else {
          // OpenRouter SSE streaming
          const key = aiSettings.openRouterApiKey?.trim();
          if (!key) throw new Error('Missing OpenRouter API Key. Please enter your key in ⚙️ Configure.');
          const messages = [];
          if (attachment && attachment.dataBase64) {
            let dataUrl = attachment.dataBase64;
            if (!dataUrl.startsWith('data:')) {
              dataUrl = `data:${attachment.mimeType || 'image/jpeg'};base64,${dataUrl}`;
            }
            messages.push({
              role: 'user',
              content: [
                { type: 'text', text: prompt },
                { type: 'image_url', image_url: { url: dataUrl } }
              ]
            });
          } else {
            messages.push({ role: 'user', content: prompt });
          }

          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${key}`,
              'HTTP-Referer': window.location.origin,
              'X-Title': 'PermaGrower'
            },
            body: JSON.stringify({
              model: model || 'anthropic/claude-3.5-sonnet',
              messages,
              stream: true
            })
          });

          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            let msg = err.error?.message || `OpenRouter Error ${res.status}`;
            if (res.status === 429 || msg.toLowerCase().includes('rate limit') || msg.toLowerCase().includes('credit')) {
              msg = `⚠️ OpenRouter Rate Limit or Credit Issue for "${model}" (${res.status}).\n💡 Remedy: Check your balance at openrouter.ai or choose another model in ⚙️ Configure.\n\nDetails: ${msg}`;
            }
            throw new Error(msg);
          }

          const reader = res.body?.getReader();
          if (!reader) throw new Error('Streaming not supported.');

          const decoder = new TextDecoder('utf-8');
          let accumulated = '';
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('data: ')) {
                const jsonStr = trimmed.slice(6);
                if (jsonStr === '[DONE]') continue;
                try {
                  const parsed = JSON.parse(jsonStr);
                  const chunk = parsed.choices?.[0]?.delta?.content || '';
                  if (chunk) {
                    accumulated += chunk;
                    if (onChunk) onChunk(accumulated);
                  }
                } catch {}
              }
            }
          }
          return accumulated;
        }
      }

      // Stream advice request helper
      async function requestAdvice(prompt, label = 'Advice', attachment = uploadedImage) {
        const cosy = getRandomPendingPhrase();
        const id = Date.now();
        setAdviceMessages(prev => [{ id, label, content: `${cosy}\n\n*Please wait, cultivating response...*`, isLoading: true }, ...prev]);
        try {
          const r = await executeAICall(prompt, 'text', attachment, (accumulated) => {
            setAdviceMessages(prev => prev.map(m => m.id === id ? { ...m, content: accumulated, isLoading: false } : m));
          });
          setAdviceMessages(prev => prev.map(m => m.id === id ? { ...m, content: r, isLoading: false } : m));
        } catch (err) {
          setAdviceMessages(prev => prev.map(m => m.id === id ? { ...m, content: `**Error:** ${err.message}`, isLoading: false } : m));
        }
      }

      // Stream chat request helper

        if (!aiQuestion.trim()) return;
        const q = aiQuestion.trim();

        const cosy = getRandomPendingPhrase();

                <button
                  onClick={() => { playClick(); setAiSettings({...aiSettings, provider: 'gemini'}); }}
                  className={`p-4 rounded-xl border-2 font-bold text-left ${aiSettings.provider === 'gemini' ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/40 ring-1 ring-emerald-500' : 'border-gray-300 dark:border-gray-600'}`}
                >
                  ✨ Google Gemini
                  <p className="text-xs font-normal text-gray-500 mt-1">Official Google endpoint with Gemini 2.5 &amp; 3 series.</p>
                </button>
                <button
                  onClick={() => { playClick(); setAiSettings({...aiSettings, provider: 'openrouter'}); }}
                  className={`p-4 rounded-xl border-2 font-bold text-left ${aiSettings.provider === 'openrouter' ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/40 ring-1 ring-indigo-500' : 'border-gray-300 dark:border-gray-600'}`}
                >
                  🌐 OpenRouter
                  <p className="text-xs font-normal text-gray-500 mt-1">Access Claude 3.7, Llama 3.3, DeepSeek R1, GPT-4o.</p>
                </button>
              </div>

              {/* API Key Inputs */}
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold mb-1">Google Gemini API Key</label>
                  <input
                    type="password"
                    value={aiSettings.geminiApiKey}
                    onChange={e => setAiSettings({...aiSettings, geminiApiKey: e.target.value})}
                    placeholder="AIzaSy..."
                    className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-[#1a202c] font-mono text-sm"
                  />
                </div>

                <div>
                  <label className="block text-sm font-semibold mb-1">OpenRouter API Key</label>
                  <input
                    type="password"
                    value={aiSettings.openRouterApiKey}
                    onChange={e => setAiSettings({...aiSettings, openRouterApiKey: e.target.value})}
                    placeholder="sk-or-v1-..."
                    className="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-[#1a202c] font-mono text-sm"
                  />
                </div>
              </div>

              {/* Full Task Model Dropdowns */}
              <div className="space-y-4 pt-2 border-t border-gray-200 dark:border-gray-700">
                <h3 className="font-bold text-base text-gray-900 dark:text-gray-100">Specific Role Model Assignments</h3>

                {/* 1. Text Model */}
                <div className="p-3 bg-gray-50 dark:bg-[#252c3b] rounded-xl border border-gray-200 dark:border-gray-700">
                  <label className="block text-xs font-bold text-gray-800 dark:text-gray-200 mb-1">🤖 Text AI Model (Advice, Chat, Tips)</label>
                  <select
                    value={aiSettings.selectedModels.text}
                    onChange={e => setAiSettings({...aiSettings, selectedModels: {...aiSettings.selectedModels, text: e.target.value}})}
                    className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a202c] text-xs font-mono"
                  >
                    {(aiSettings.provider === 'gemini' ? DEFAULT_GEMINI_MODELS : DEFAULT_OPENROUTER_MODELS).map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>

                {/* 2. Image Analysis Model */}
                <div className="p-3 bg-gray-50 dark:bg-[#252c3b] rounded-xl border border-gray-200 dark:border-gray-700">
                  <label className="block text-xs font-bold text-gray-800 dark:text-gray-200 mb-1">🔍 Image Analysis AI Model (Photo Diagnosis &amp; Plant ID)</label>
                  <select
                    value={aiSettings.selectedModels.vision}
                    onChange={e => setAiSettings({...aiSettings, selectedModels: {...aiSettings.selectedModels, vision: e.target.value}})}
                    className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a202c] text-xs font-mono"
                  >
                    {(aiSettings.provider === 'gemini' ? DEFAULT_GEMINI_MODELS : DEFAULT_OPENROUTER_MODELS).map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>

                {/* 3. Image Generation / Space Layout Model */}
                <div className="p-3 bg-gray-50 dark:bg-[#252c3b] rounded-xl border border-gray-200 dark:border-gray-700">
                  <label className="block text-xs font-bold text-gray-800 dark:text-gray-200 mb-1">🎨 Image Generation AI Model (Visualizations &amp; Space Layouts)</label>
                  <select
                    value={aiSettings.selectedModels.imageGen}
                    onChange={e => setAiSettings({...aiSettings, selectedModels: {...aiSettings.selectedModels, imageGen: e.target.value}})}
                    className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a202c] text-xs font-mono"
                  >
                    {(aiSettings.provider === 'gemini' ? DEFAULT_GEMINI_MODELS : DEFAULT_OPENROUTER_MODELS).map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>

                {/* 4. Audio Analysis Model */}
                <div className="p-3 bg-gray-50 dark:bg-[#252c3b] rounded-xl border border-gray-200 dark:border-gray-700">
                  <label className="block text-xs font-bold text-gray-800 dark:text-gray-200 mb-1">🎧 Audio Analysis AI Model (Voice Log Notes)</label>
                  <select
                    value={aiSettings.selectedModels.audio}
                    onChange={e => setAiSettings({...aiSettings, selectedModels: {...aiSettings.selectedModels, audio: e.target.value}})}
                    className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a202c] text-xs font-mono"
                  >
                    {(aiSettings.provider === 'gemini' ? DEFAULT_GEMINI_MODELS : DEFAULT_OPENROUTER_MODELS).map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>

                {/* 5. Advanced Analysis Model */}
                <div className="p-3 bg-gray-50 dark:bg-[#252c3b] rounded-xl border border-gray-200 dark:border-gray-700">
                  <label className="block text-xs font-bold text-gray-800 dark:text-gray-200 mb-1">🧙‍♂️ Advanced Analysis AI Model (Complex Guild Reasoning &amp; Statistics)</label>
                  <select
                    value={aiSettings.selectedModels.reasoning}
                    onChange={e => setAiSettings({...aiSettings, selectedModels: {...aiSettings.selectedModels, reasoning: e.target.value}})}
                    className="w-full p-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-[#1a202c] text-xs font-mono"
                  >
                    {(aiSettings.provider === 'gemini' ? DEFAULT_GEMINI_MODELS : DEFAULT_OPENROUTER_MODELS).map(m => (
                      <option key={m} value={m}>{m}</option>
                    ))}
                  </select>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-wrap gap-3 pt-3">
                <button
                  onClick={() => {
                    playClick();
                    setConfigStatus('✅ Configuration saved in your browser localStorage!');
                    setTimeout(() => setConfigStatus(''), 4000);
                  }}
                  className="bg-[#5D5CDE] text-white px-6 py-2.5 rounded-xl font-bold text-sm hover:opacity-90 shadow-sm"
                >
                  💾 Save AI Configuration
                </button>

                <button
                  disabled={isTestingConfig}
                  onClick={async () => {
                    playClick();
                    setIsTestingConfig(true);
                    setConfigStatus('🧪 Testing connection to selected model...');
                    try {
                      const res = await executeAICall('Respond with exactly: Connection successful! Permaculture ready.', 'text');
                      setConfigStatus(`✅ Connection test passed! Model replied: "${res.trim()}"`);
                    } catch (e) {
                      setConfigStatus(`❌ Connection test failed: ${e.message}`);
                    } finally {
                      setIsTestingConfig(false);
                    }
                  }}
                  className="bg-emerald-600 text-white px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-emerald-700 disabled:opacity-50"
                >
                  {isTestingConfig ? 'Testing...' : '🧪 Test Configuration'}
                </button>

                <button
                  onClick={() => {
                    playClick();
                    const isGem = aiSettings.provider === 'gemini';
                    setAiSettings(prev => ({
                      ...prev,
                      selectedModels: {
                        text: isGem ? 'gemini-2.5-flash' : 'anthropic/claude-3.5-sonnet',
                        vision: isGem ? 'gemini-2.5-flash' : 'anthropic/claude-3.5-sonnet',
                        audio: isGem ? 'gemini-2.5-flash' : 'anthropic/claude-3.5-sonnet',
                        reasoning: isGem ? 'gemini-2.5-pro' : 'anthropic/claude-3.7-sonnet',
                        imageGen: isGem ? 'gemini-2.5-flash' : 'anthropic/claude-3.5-sonnet'
                      }
                    }));
                    setConfigStatus('🔄 Reset to default recommended models.');
                    setTimeout(() => setConfigStatus(''), 3000);
                  }}
                  className="bg-gray-500 text-white px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-gray-600"
                >
                  🔄 Reset Defaults
                </button>
              </div>

              {configStatus && (
                <div className={`p-3 rounded-xl text-xs font-bold ${configStatus.includes('❌') ? 'bg-red-100 text-red-800 dark:bg-red-950/60 dark:text-red-300' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300'}`}>
                  {configStatus}
                </div>
              )}
            </div>
          )}

          {/* Dialog Modal */}
          {dialog && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-[#1e2430] p-6 rounded-2xl max-w-md w-full border border-gray-300 dark:border-gray-600 shadow-2xl">
                <p className="text-sm mb-4 whitespace-pre-wrap">{dialog.message}</p>
                <div className="flex justify-end gap-2">
                  {dialog.type === 'confirm' && (
                    <button onClick={() => { playClick(); dialog.onResolve(false); }} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-xl text-xs font-bold">Cancel</button>
                  )}
                  <button onClick={() => { playClick(); dialog.onResolve(true); }} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">OK</button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="text-center mt-12 pb-6 text-xs text-gray-500 dark:text-gray-400">
            Made with 💚 in 2025+ by Ade&apos;s Press • Standalone Offline-Capable PermaGrower AI
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
