  <script>
    const TAROT_CARDS = [{"number":0,"roman":"0","name":"The Red Player","traditional":"The Fool","meaning":"Represents innocence, spontaneity, and new beginnings. The Red Player signifies the start of a natural journey, where players enter the world with curiosity and a sense of adventure.","invertedMeaning":"Missteps at the outset. Naïveté becomes recklessness. A disconnection from nature's guidance. Beware of acting without awareness or respect for your environment. This may be a time when your natural instincts are clouded, leading to poor judgment in new ventures or relationships.","arweaveUrl":"https://dyjqdoaytkyzx4yx5z2edwy32xgun2nwlw3ud4jejhzqa72bi5wq.arweave.net/HhMBuBiasZvzF-50Qdsb1c1G6bZdt0HxJEnzAH9BR20","element":"Air · Dawn Breath","ecologicalTheme":"Pioneer species & first footsteps on Fountain Island","symbolism":"A crimson-cloaked traveler stepping onto an untamed shoreline, carrying unshaped potential, wild seeds, and open sensory awareness."},{"number":1,"roman":"I","name":"The Guardian","traditional":"The Magician","meaning":"Symbolizes power, transformation, and the ability to manifest one's desires. The Guardian card reflects a role in guiding players and teaching them about their energy and powers within the realm of nature.","invertedMeaning":"Power misused or blocked. Manifestation without intention. Losing connection to purpose. Your natural gifts may be ignored or exploited. This is a time when your abilities may feel scattered or when others may take advantage of your willingness to help without giving back.","arweaveUrl":"https://wugsin76lkezaemtd3rxx2e7ebyhnyy3mbmkwcsdv4v4yyotcu7a.arweave.net/tQ0kN_5aiZARkx7je-ifIHB24xtgWKsKQ68rzGHTFT4","element":"Ether & Sun · Focused Will","ecologicalTheme":"Conscious stewardship & channeling elemental forces","symbolism":"Greenwise standing amidst living roots and luminous canopy light, bridging earth, water, air, and fire through mindful craft."},{"number":2,"roman":"II","name":"The Damselfly","traditional":"The High Priestess","meaning":"Signifies intuition, mystery, and accessing hidden knowledge. The Damselfly card represents the mystical aspect of nature, reflecting the deeper insights and secrets players can uncover.","invertedMeaning":"Intuition clouded. Secrets hidden too deeply. Mistrust in the natural cycles. You may be resisting the wisdom that waits in stillness. This suggests a need to quiet the mental noise and allow your inner knowing to surface through patience and meditation.","arweaveUrl":"https://jczvhc52ig2vm2453zpnlzhshsvsttd5s3neygkdno7camkm6kda.arweave.net/SLNTi7pBtVZrnd5e1eTyPKspzH2W2kwZQ2u-IDFM8oY","element":"Water · Stillness & Reflection","ecologicalTheme":"Riparian threshold between unseen depths and sunlit air","symbolism":"Iridescent wings poised over a mirror-still forest pool, symbolizing liminal perception and the quiet voice beneath surface ripples."},{"number":3,"roman":"III","name":"The Green Player","traditional":"The Empress","meaning":"Represents nurturing, permaculture, abundance, and fertility. The Green Player embodies the natural world and the harmony players can achieve by embracing its ecosystem. It is the sustainable things in your life.","invertedMeaning":"Overgrowth or depletion. Unsustainable habits. Neglecting self-care or your ecosystem. Time to re-evaluate what you nurture. You may be giving too much to others while neglecting yourself, or allowing growth without proper boundaries and structure.","arweaveUrl":"https://khlqlcbpdien3xycajcnzlo2hmxkejbwa2dkkrpjbvs72asxpwfq.arweave.net/UdcFiC8aCN3fAgJE3K3aOy6iJDYGhqVF6Q1l_QJXfYs","element":"Earth · Living Soil","ecologicalTheme":"Permaculture guilds, polyculture abundance & regeneration","symbolism":"A figure woven into a thriving food forest where blossoms, mycelium, and clear water nourish one another in reciprocal balance."},{"number":4,"roman":"IV","name":"The Game of Nature","traditional":"The Emperor","meaning":"Symbolizes authority, structure, and control. The Game of Nature card reflects the players' role as bound players within their environment, where their choices influence the balance of the virtual ecosystem.","invertedMeaning":"Oppressive control. Rigidity in systems. Ecological imbalance. Your environment may be reflecting an inner lack of harmony or trust. This calls for examining whether you're forcing solutions instead of allowing natural order to emerge, or if you're being controlled by external forces that don't serve your highest good.","arweaveUrl":"https://cuzsrgqdkuo5wkf5n6dblv5pu7xnxfwqw542suwdnyipqhse6qea.arweave.net/FTMomgNVHdsovW-GFdevp-7bltC3ealSw24Q-B5E9Ag","element":"Earth & Stone · Natural Law","ecologicalTheme":"Watershed boundaries, trophic structure & ecological order","symbolism":"Ancient terraced stone and overarching canopy patterns showing that true authority arises from respecting natural laws."},{"number":5,"roman":"V","name":"The Bleak Lord","traditional":"The Pope","meaning":"Represents conformity, authority, mental obsession and external influences. The Bleak Lord card reflects the danger posed by obsessive or unsustainable mental ideas within the game of nature, urging players to remain true to themselves.","invertedMeaning":"Blind conformity. Toxic ideologies. The mind overpowering the heart. You may be caught in systems that exploit rather than nurture. This suggests breaking free from limiting beliefs or authority figures who demand obedience without wisdom or compassion.","arweaveUrl":"https://hu5hqp2hzopqvrpazbahtdhk5esmhexebttj4tonxjldvfyuqk6q.arweave.net/PTp4P0fLnwrF4MhAeYzq6STDkuQM5p5NzbpWOpcUgr0","element":"Iron & Fog · Rigid Dogma","ecologicalTheme":"Monoculture mentality vs. living biodiversity","symbolism":"A austere figure of rigid geometry reminding the seeker to question synthetic dogmas and return to authentic living truth."},{"number":6,"roman":"VI","name":"The Emberfolk","traditional":"The Lovers","meaning":"Signifies love, harmony, goodness and choice. The Emberfolk card represents the connection between players and the island's inhabitants, highlighting the importance of collaboration and relationships.","invertedMeaning":"Disconnection, fractured relationships, or choices made out of fear. Trust and unity with others -- and with the land -- may be strained. This calls for healing wounds in partnerships and reconnecting with community values that honor both personal growth and collective wellbeing.","arweaveUrl":"https://gqc3nwrkgdwm5os3fa7z73ee35d2artkyavjggscauflokl2q5ca.arweave.net/NAW22iow7M66Wyg_n-yE30egRmrAKpMaQgUKtyl6h0Q","element":"Warm Hearth · Symbiosis","ecologicalTheme":"Mutualism, kinship & conscious community choice","symbolism":"Islanders gathered by a warm hearth beneath ancient boughs, embodying cooperative trust and heart-aligned choices."},{"number":7,"roman":"VII","name":"The Colours of Progression","traditional":"The Chariot","meaning":"Symbolizes determination, willpower, and overcoming obstacles. The Colours of Progression card reflects players' journey through the different regions, driven by their desire to unlock insights and progress.","invertedMeaning":"Stagnation or misdirected effort. Pushing forward without wisdom or awareness. Progress becomes burnout when not in sync with nature. This calls for reassessing your direction and slowing down to ensure your actions align with your deeper values and natural rhythms.","arweaveUrl":"https://jyfx6zx55xbb5tnt7tkxaa35ta6bbl4kysxo4qwnzimk6c34szaa.arweave.net/Tgt_Zv3twh7Ns_zVcAN9mDwQr4rEru5CzcoYrwt8lkA","element":"Spectrum Light · Directed Momentum","ecologicalTheme":"Succession stages from bare rock to old-growth forest","symbolism":"Bands of vibrant natural color arcing across the island terrain, charting purposeful advancement through balanced forces."},{"number":8,"roman":"VIII","name":"The Long-Eared Owl","traditional":"Justice","meaning":"Represents fairness, balance, and truth. The Owl card symbolizes the role and use of knowledge and the nature of the entire island. It's also the quest for justice within nature, where players aim to restore equilibrium and protect biodiversity.","invertedMeaning":"Justice denied or evaded. Ecological harm ignored. Truth is being distorted. Your voice may be needed to restore balance. This signals a time when fairness has been compromised and where speaking truth to power becomes essential for restoring natural order.","arweaveUrl":"https://jgzcwss2d3k2jy7rpon4k54kdomqax2fmsbi4g77xlvtyagvpc6q.arweave.net/SbIrSloe1aTj8XubxXeKG5kAX0Vkgo4b_7rrPADVeL0","element":"Night Air · Clear Sight","ecologicalTheme":"Predator-prey equilibrium & unflinching ecological truth","symbolism":"A silent owl perched in twilight branches, hearing the slightest imbalance in the forest and calling for reciprocity."},{"number":9,"roman":"IX","name":"The Ruined Monastery","traditional":"The Hermit","meaning":"Signifies introspection, solitude, and inner guidance. The Ruined Monastery card reflects moments of self-discovery and contemplation within the game, where players seek wisdom from within.","invertedMeaning":"Isolation that numbs rather than heals. Withdrawal from growth. Dwelling too long in the past. Let go and re-engage with the living world. This suggests you may be avoiding necessary connections or hiding from opportunities for meaningful growth and renewal.","arweaveUrl":"https://y27p3scynowmid2zkxan6lqbiytucjalwxxgoil2x3aj7fz5bcqa.arweave.net/xr79yFhrrMQPWVXA3y4BRidBJAu17mcher7An5c9CKA","element":"Moss & Stone · Sanctuary","ecologicalTheme":"Rewilding of ancient ruins & quiet inner germination","symbolism":"Ivy-draped stone arches reclaimed by ferns and starlight, offering a quiet cloister where inner truth is heard."},{"number":10,"roman":"X","name":"The Routes to the North","traditional":"The Wheel of Fortune","meaning":"Symbolizes cycles, destiny, and change. The Routes to the North card reflects the ever-evolving nature of the planet, where players navigate through different paths and experiences.","invertedMeaning":"Resistance to change. Fate feared or denied. You are avoiding a necessary turning point. The forest changes -- and so must you. This suggests clinging to old patterns or fighting against life's natural cycles when adaptation would serve you better.","arweaveUrl":"https://gdrak2ovw56hevgyxdsuyvzpphzf7zn27dbazqmsb7r6omuuvlrq.arweave.net/MOIFadW3fHJU2LjlTFcvefJf5br4wgzBkg_j5zKUquM","element":"Wind & Compass · Seasonal Turning","ecologicalTheme":"Migration corridors, planetary cycles & shifting weather","symbolism":"diverging mountain trails winding toward the aurora-lit north, reminding travelers that every season opens a new route."},{"number":11,"roman":"XI","name":"The Stones at the Fountain","traditional":"Strength","meaning":"Represents inner strength, heart, permanence, courage, and resilience. The Stones at the Fountain card embodies the challenges players face and the inner power they possess to overcome obstacles.","invertedMeaning":"Inner strength weakened. Courage overshadowed by fear. You may be placing your trust in the wrong support. Return to heart-truths. This invites you to reconnect with your authentic source of power rather than relying on external validation or temporary fixes.","arweaveUrl":"https://sxrjw35t2bnu5wbqb5misidxuv42wb3eyq54ixi773qgrchxm6ya.arweave.net/leKbb7PQW07YMA9YiSB3pXmrB2TEO8RdH_7gaIj3Z7A","element":"Bedrock & Spring · Enduring Heart","ecologicalTheme":"Deep mineral foundations & patient water shaping stone","symbolism":"Standing megaliths ringing the island spring, unmoved by storms yet cradling crystal-clear living waters."},{"number":12,"roman":"XII","name":"The Doorway","traditional":"The Hanged Man","meaning":"Signifies surrender, new perspectives, and letting go. The Doorway card reflects moments of transformation and surrender within the game, where players must embrace change to progress.","invertedMeaning":"Surrender avoided. New perspectives rejected. You cling to an outdated view that blocks your evolution. Look inward, not away. This suggests resistance to letting go of control and allowing life's deeper currents to guide you toward necessary transformation.","arweaveUrl":"https://qenjybhrz3mwc7s6dmxq2tjfnkgeuj73pbzu3jinktyi3aom72ja.arweave.net/gRqcBPHO2WF-XhsvDU0laoxKJ_t4c02lDVTwjYHM_pI","element":"Threshold Mist · Inverted Sight","ecologicalTheme":"Chrysalis suspension & seeing the ecosystem upside-down","symbolism":"An archway of intertwined boughs opening onto an unfamiliar dimension, inviting pause before crossing."},{"number":13,"roman":"XIII","name":"The Shaper of Nature","traditional":"Death","meaning":"Symbolizes transformation, rebirth, and new beginnings. The Shaper of Nature card signifies the evolving nature, and the opportunities for players to embrace change and adapt.","invertedMeaning":"Stagnation in transformation. Death without rebirth. You are resisting the composting of what no longer serves. You may need to actively engage with letting go - whether that's decluttering physical spaces, releasing old grudges, or acknowledging that certain relationships or situations have run their course. Trust the cycles, but also participate in them by consciously choosing what to release.","arweaveUrl":"https://oubrccce4rh7sik67asdspkdshc7dsnmftrwrxufola7i5uvwiga.arweave.net/dQMRCETkT_khXvgkOT1DkcXxyaws42jehXLB9HaVsgw","element":"Autumn Leaf & Humus · Compost & Rebirth","ecologicalTheme":"Nutrient cycling, fungal decomposition & forest renewal","symbolism":"Fallen leaves dissolving into rich dark humus from which luminous new shoots emerge in the eternal cycle of life."},{"number":14,"roman":"XIV","name":"The Dreamspire","traditional":"Temperance","meaning":"Represents the perception of glory and power. The Dreamspire card symbolizes the need for balance and moderation as players strive to achieve Insights and restore equilibrium.","invertedMeaning":"Imbalance. Overreaching. Striving for illusions of grandeur. Your pursuit of insight may be out of sync with deeper needs. You may be chasing achievements or recognition that don't align with your authentic self, or pushing toward goals without considering their true cost. Take time to reassess what truly matters to you versus what looks impressive to others.","arweaveUrl":"https://smxlihic33puwf4usozicovk7gy6xgf4zu3w6dzn4fxprz53wviq.arweave.net/ky60HQLe30sXlJOygTqq-bHrmLzNN28PLeFu-Oe7tVE","element":"Cloud & Peak · Alchemy of Balance","ecologicalTheme":"Dynamic homeostasis between skyward ambition and deep roots","symbolism":"A soaring spire rising through mist, teaching that visionary height requires grounded equilibrium."},{"number":15,"roman":"XV","name":"The Stoker","traditional":"The Devil","meaning":"Signifies temptation, bondage, and materialism. The Stoker card reflects the allure of power and control within the game, warning players against succumbing to negative influences, but also encouraging preparation and action.","invertedMeaning":"Enslavement to desire. Seduced by control or fear. Ignoring your deeper agency. Time to cut cords from toxic habits or systems. You may need to examine what or who holds power over your choices and decisions. This could involve breaking free from addictive patterns, manipulative relationships, or systems that diminish your autonomy and authentic expression.","arweaveUrl":"https://5g3zl7nryk4p4ny2kshu7lyynuetv6c62nbgaoreyfxt547mbcna.arweave.net/6beV_bHCuP43GlSPT68YbQk6-F7TQmA6JMFvPvPsCJo","element":"Furnace & Smoke · Consuming Fire","ecologicalTheme":"Extractive burnout vs. disciplined tending of energy","symbolism":"A relentless furnace keeper stoking hungry flames, warning against extractive habits while teaching mastery over raw energy."},{"number":16,"roman":"XVI","name":"The Spiral Tower","traditional":"The Tower","meaning":"Symbolizes chaos, upheaval, and sudden change. The Spiral Tower card represents moments of confrontation with illusion, deception and disruption within nature (and the human mind), forcing players to adapt to unexpected challenges, possibly by recalling more timeless, natural forces.","invertedMeaning":"Collapse without awareness. A refusal to see the lesson in upheaval. Holding on to illusions. Nature has spoken -- have you listened? You may be avoiding necessary changes or ignoring warning signs that transformation is needed. Sometimes we need to actively participate in letting structures fall that no longer serve us, rather than clinging to what feels familiar but has become stagnant.","arweaveUrl":"https://46k5yy4quk7ldzxg4rxpeivgkcp54falxcdjvemr4vu4ncw2m6qa.arweave.net/55XcY5CivrHm5uRu8iKmUJ_eFAu4hpqRkeVpxoraZ6A","element":"Lightning & Tempest · Sudden Clearing","ecologicalTheme":"Wildfire & storm disturbance opening the canopy for new life","symbolism":"A spiraling stone tower struck by elemental sky-fire, shattering false constructs so timeless truth can breathe."},{"number":17,"roman":"XVII","name":"The Insight in the Chakra","traditional":"The Star","meaning":"Represents hope, inspiration, and spiritual insight. The Insight in the Chakra card signifies the moments of clarity and inspiration players experience as they unlock insights and gain deeper understanding.","invertedMeaning":"Hope fading. Disconnect from inner light. Spiritual insight lost to distraction. Find stillness and reconnect to your Source. You may need to step away from overwhelming noise and distractions, whether digital, social, or mental, to rediscover your inner clarity and spiritual direction.","arweaveUrl":"https://cxhpgcizykp3r74zt427csniuqpwtgtd5ysu3j2t6frie3blkaoq.arweave.net/Fc7zCRnCn7j_mZ818UmopB9pmmPuJU2nU_FigmwrUB0","element":"Starlight & Dew · Luminous Clarity","ecologicalTheme":"Bioluminescence, celestial navigation & cellular coherence","symbolism":"A radiant lotus-star of energy aligning body, earth, and cosmos in serene post-storm renewal."},{"number":18,"roman":"XVIII","name":"The Blue Forge","traditional":"The Moon","meaning":"Signifies illusion, intuition, and the subconscious. The Blue Forge card reflects the dreamlike aspects of the Game of Life and the need for players to trust their intuition as they navigate the world.","invertedMeaning":"Lost in illusion. Intuition misread. The subconscious overwhelms or is blocked. Re-ground through touch, soil, breath. You may be caught in confusing dreams or unclear emotions that cloud your judgment. Step away from abstract thinking and reconnect with your physical body and the tangible world around you.","arweaveUrl":"https://gwnacfuud5yi76rclgxcctvx2x6a3qbot7n6nvsyvhn7supzjyma.arweave.net/NZoBFpQfcI_6IlmuIU631fwNwC6f2-bWWKnb-VH5Thg","element":"Moonlight & Indigo Flame · Subconscious Craft","ecologicalTheme":"Nocturnal rhythms, tidal pulls & dream-work","symbolism":"A cobalt-glowing forge under lunar mist where unseen feelings and intuitions are tempered into wisdom."},{"number":19,"roman":"XIX","name":"The Village of Embertime","traditional":"The Sun","meaning":"Symbolizes success, vitality, and joy. The Village of Embertime card embodies the moments of celebration and fulfilment players experience as they connect with the Emberfolk and the village.","invertedMeaning":"Joy delayed or false. Vitality suppressed. Are you celebrating too soon -- or not at all? You may need to seek social or environmental contact and more nurturing before fully re-joining the rhythms of real community support, or to feel such effects that you most likely, are lacking.","arweaveUrl":"https://pk5grpi6hccfavcrhc2oppow3z4i7jy4a7j4xq5w6nxovexy5ska.arweave.net/erpovR44hFBUUTi0573W3niPpxwH08vDtvNu6pL47JQ","element":"Golden Sun · Harvest & Vitality","ecologicalTheme":"Photosynthetic peak, harvest festivals & shared abundance","symbolism":"Sun-drenched timber dwellings and thriving gardens where community warmth and natural vitality flourish."},{"number":20,"roman":"XX","name":"The Fall of the Tower","traditional":"Judgment","meaning":"Represents transformation, awakening, and self-reflection. The     // Web Audio API Sound Synthesizer (Safari / iOS webkitAudioContext compatible)
    let audioCtx = null;
    let lastWhooshTimestamp = 0;
    function getAudioCtx() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) {
        try { audioCtx = new AC(); } catch (e) { return null; }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playClickSound(force) {
      if (!force && !state.soundEnabled) return;
      if (!force && Date.now() - lastWhooshTimestamp < 90) return;
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const clickGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1650, now);
        osc.frequency.exponentialRampToValueAtTime(240, now + 0.016);
        clickGain.gain.setValueAtTime(0.085, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);
        osc.connect(clickGain);
        clickGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.02);

        const snapSize = Math.max(1, Math.floor(ctx.sampleRate * 0.008));
        const snapBuffer = ctx.createBuffer(1, snapSize, ctx.sampleRate);
        const snapData = snapBuffer.getChannelData(0);
        for (let i = 0; i < snapSize; i++) {
          snapData[i] = (Math.random() * 2 - 1) * (1 - i / snapSize);
        }
        const snapSource = ctx.createBufferSource();
        snapSource.buffer = snapBuffer;
        const hpFilter = ctx.createBiquadFilter();
        hpFilter.type = 'highpass';
        hpFilter.frequency.setValueAtTime(1800, now);
        const snapGain = ctx.createGain();
        snapGain.gain.setValueAtTime(0.05, now);
        snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.008);
        snapSource.connect(hpFilter);
        hpFilter.connect(snapGain);
        snapGain.connect(ctx.destination);
        snapSource.start(now);
        snapSource.stop(now + 0.009);
      } catch (e) {}
    }

    function playSoftWhoosh(durationSec, peakFreq) {
      if (!state.soundEnabled) return;
      lastWhooshTimestamp = Date.now();
      const ctx = getAudioCtx();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * durationSec));
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.997 * b0 + white * 0.029;
          b1 = 0.985 * b1 + white * 0.032;
          b2 = 0.95 * b2 + white * 0.048;
          const pink = b0 + b1 + b2 + white * 0.18;
          output[i] = pink * Math.sin((i / bufferSize) * Math.PI);
        }
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.setValueAtTime(1.35, now);
        filter.frequency.setValueAtTime(210, now);
        filter.frequency.exponentialRampToValueAtTime(peakFreq, now + durationSec * 0.45);
        filter.frequency.exponentialRampToValueAtTime(180, now + durationSec);
        const whooshGain = ctx.createGain();
        whooshGain.gain.setValueAtTime(0.002, now);
        whooshGain.gain.linearRampToValueAtTime(0.075, now + durationSec * 0.4);
        whooshGain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);
        noiseSource.connect(filter);
        filter.connect(whooshGain);
        whooshGain.connect(ctx.destination);
        noiseSource.start(now);
        noiseSource.stop(now + durationSec + 0.01);
      } catch (e) {}
    }

    async function resolveStandaloneGeminiModel(requestedId, kind) {
      if (requestedId && !requestedId.startsWith('gemini-auto') && !requestedId.includes('/')) {
        return requestedId;
      }
      const key = (state.aiConfig.geminiKey || '').trim();
      if (key) {
        try {
          const gRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key));
          if (gRes.ok) {
            const gData = await gRes.json();
            if (Array.isArray(gData.models)) {
              const valid = gData.models
                .map(m => (m.name || '').replace('models/', ''))
                .filter(id => id && !id.includes('1.5') && !id.includes('2.0') && !id.includes('embedding') && !id.includes('tts') && !id.includes('aqa'));
              if (kind === 'image') {
                const imgMatch = valid.find(id => id.toLowerCase().includes('image') || id.toLowerCase().includes('imagen') || id.toLowerCase().includes('banana'));
                if (imgMatch) return imgMatch;
              } else {
                if (requestedId === 'gemini-auto-pro') {
                  const proMatch = valid.find(id => id.toLowerCase().includes('pro') || id.toLowerCase().includes('argon'));
                  if (proMatch) return proMatch;
                }
                const flashMatch = valid.find(id => id.toLowerCase().includes('flash') && !id.toLowerCase().includes('image'));
                if (flashMatch) return flashMatch;
                if (valid.length > 0) return valid[0];
              }
            }
          }
        } catch (e) {}
      }
      const detectedPool = (kind === 'image' ? IMAGE_MODELS : TEXT_MODELS).filter(m => m.provider === 'gemini' && !m.id.startsWith('gemini-auto'));
      if (detectedPool.length > 0) return detectedPool[0].id;
      return kind === 'image' ? 'gemini-2.5-flash-image' : 'gemini-2.5-flash';
    }

    async function manifestCardArt(mode, forceOffline) {
      const rec = state.drawnSpread[state.selectedSlot];
      if (!rec) return;
      const im = IMAGE_MODELS.find(x => x.id === state.aiConfig.imageModel) || IMAGE_MODELS[0];
      if (forceOffline || im.provider === 'offline') {
        rec.customImageUrl = makeSvgCard(rec.card, mode);
        state.requiresKeyForImage = false;
        state.imageNotice = 'Manifested sacred botanical emblem (Built-In Offline Renderer).';
        playCardDrawSound();
        render();
        return;
      }
      const hasKey = (im.provider === 'gemini' && state.aiConfig.geminiKey.trim()) || (im.provider === 'openrouter' && state.aiConfig.openrouterKey.trim());
      if (!hasKey) {
        state.requiresKeyForImage = true;
        state.imageNotice = 'Unable to manifest without the power of AI — enter your key in Settings.';
        render();
        return;
      }
      state.requiresKeyForImage = false;
      state.imageNotice = 'Summoning custom card artwork...';
      render();
      const artPrompt = mode === 'naturewise'
        ? ('A mystical tarot card illustration of "' + rec.card.name + '" (traditionally ' + rec.card.traditional + ') ' + state.aiConfig.customArtStyle + '. No text or words in the image.')
        : ('A traditional tarot card illustration of "' + rec.card.traditional + '" in classic Rider-Waite-Smith tarot deck style. No text or words in the image.');
      if (im.provider === 'openrouter') {
        try {
          let targetOrImg = im.id;
          if (!targetOrImg || targetOrImg === 'openrouter-auto-image' || !targetOrImg.includes('/')) {
            const detectedOrImg = IMAGE_MODELS.find(x => x.provider === 'openrouter' && x.id.includes('/'));
            targetOrImg = detectedOrImg ? detectedOrImg.id : 'black-forest-labs/flux-1.1-pro';
          }
          const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + state.aiConfig.openrouterKey,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: targetOrImg,
              modalities: ['image', 'text'],
              messages: [{ role: 'user', content: artPrompt }]
            })
          });
          if (r.ok) {
            const j = await r.json();
            const imgUrl = j.choices?.[0]?.message?.images?.[0]?.image_url?.url;
            if (imgUrl) {
              rec.customImageUrl = imgUrl;
              state.imageNotice = 'Manifested card artwork.';
              playCardDrawSound();
              render();
              return;
            }
          }
        } catch (e) {}
      }
      if (im.provider === 'gemini') {
        try {
          const targetGemImg = await resolveStandaloneGeminiModel(im.id, 'image');
          const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(targetGemImg) + ':generateContent?key=' + encodeURIComponent(state.aiConfig.geminiKey);
          const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: artPrompt }] }] })
          });
          if (r.ok) {
            const j = await r.json();
            const parts = j.candidates?.[0]?.content?.parts || [];
            for (const p of parts) {
              if (p.inlineData && p.inlineData.data) {
                rec.customImageUrl = 'data:' + (p.inlineData.mimeType || 'image/png') + ';base64,' + p.inlineData.data;
                state.imageNotice = 'Manifested card artwork.';
                playCardDrawSound();
                render();
                return;
              }
            }
          }
        } catch (e) {}
      }
      rec.customImageUrl = makeSvgCard(rec.card, mode);
      state.imageNotice = 'Manifested sacred botanical card emblem.';
      playCardDrawSound();
      render();
    }

    function drawSlot(slotId, forceRedraw) {
      playCardDrawSound();
      state.imageNotice = '';
      state.requiresKeyForImage = false;
      if (!state.drawnSpread[slotId] || forceRedraw) {
        const card = TAROT_CARDS[Math.floor(Math.random() * TAROT_CARDS.length)];
        const inverted = Math.random() < 0.5;
        const reading = getContextualReading(card, slotId, inverted);
        state.drawnSpread[slotId] = {
          card,
          inverted,
          readingType: slotId,
          date: formatDateOrdinal(new Date()),
          reading
        };
        delete state.deeperAnalysisMap[slotId];
        state.wisdomEntries.unshift({
          id: Date.now() + '-' + slotId,
          readingType: slotId,
          card,
          inverted,
          date: formatDateOrdinal(new Date()),
          reading
        });
      }
      state.selectedSlot = slotId;
      state.activeTab = 'card-viewer';
      render();

    function saveBookTxt(onlyOverall) {
      let out = 'NATUREWISE TAROT - BOOK OF INSIGHT\nGenerated: ' + formatDateOrdinal(new Date()) + '\n==================================================\n\n';
      if (state.personalNotes) out += 'PERSONAL NOTES:\n' + state.personalNotes + '\n\n';
      const list = onlyOverall ? state.wisdomEntries.filter(e => e.readingType === 'overall-insight') : state.wisdomEntries;
      list.forEach((e, i) => {
        out += (i + 1) + '. ' + (e.card ? (e.card.name + ' (' + e.card.traditional + ')') : 'OVERALL INSIGHT') + ' [' + e.date + ']\n' + e.reading + '\n\n';
      });
      const blob = new Blob([out], { type: 'text/plain' });

      a.click();
      document.body.removeChild(a);

    async function autoDetectModels() {
      const statusEl = document.getElementById('detectStatus');
      if (statusEl) statusEl.textContent = 'Scanning Gemini & OpenRouter APIs for latest text & image models...';
      try {
        const orRes = await fetch('https://openrouter.ai/api/v1/models');
        if (orRes.ok) {
          const data = await orRes.json();
          if (Array.isArray(data.data)) {
            data.data.forEach(m => {
              const id = (m.id || '').toLowerCase();
              const outMods = (m.architecture && m.architecture.output_modalities) || [];
              const isImg = outMods.includes('image') || id.includes('image') || id.includes('flux') || id.includes('seedream') || id.includes('riverflow');
              if (isImg) {
                if (!IMAGE_MODELS.some(im => im.id === m.id)) {
                  IMAGE_MODELS.push({ id: m.id, name: (m.name || m.id) + ' (OpenRouter)', provider: 'openrouter', type: 'image', description: m.description || 'Auto-detected OpenRouter image model' });
                }
              } else if (!TEXT_MODELS.some(tm => tm.id === m.id) && TEXT_MODELS.length < 75) {
                TEXT_MODELS.push({ id: m.id, name: (m.name || m.id) + ' (OpenRouter)', provider: 'openrouter', type: 'text', description: m.description || 'Auto-detected OpenRouter text model' });
              }
            });
          }
        }
        if (state.aiConfig.geminiKey) {
          const gRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(state.aiConfig.geminiKey));
          if (gRes.ok) {
            const gData = await gRes.json();
            if (Array.isArray(gData.models)) {
              gData.models.forEach(m => {
                const cleanId = (m.name || '').replace('models/', '');
                if (cleanId && !cleanId.includes('1.5') && !cleanId.includes('2.0')) {
                  if (cleanId.includes('image') || cleanId.includes('imagen')) {
                    if (!IMAGE_MODELS.some(im => im.id === cleanId)) {
                      IMAGE_MODELS.push({ id: cleanId, name: (m.displayName || cleanId) + ' (Gemini)', provider: 'gemini', type: 'image', description: m.description || 'Auto-detected Gemini image model' });
                    }
                  } else if (!TEXT_MODELS.some(tm => tm.id === cleanId)) {
                    TEXT_MODELS.push({ id: cleanId, name: (m.displayName || cleanId) + ' (Gemini)', provider: 'gemini', type: 'text', description: m.description || 'Auto-detected Gemini model' });
                  }
                }
              });
            }
          }
        }
        render();
        const afterEl = document.getElementById('detectStatus');
        if (afterEl) afterEl.textContent = 'Latest Gemini & OpenRouter text and image models auto-detected!';
      } catch (e) {
        if (statusEl) statusEl.textContent = 'Using built-in curated model catalog.';
      }
    }
