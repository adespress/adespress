        } else {
          const maturity = Math.max(0.18, Math.min(1.0, h / (plant.maxHeightMeters || 4.5)));
          const caliper = 1.3 + maturity * 8.5;
          const flareW = caliper * (1.05 + maturity * 0.65);
          const baseW = caliper * 0.92;
          const topW = Math.max(1.1, caliper * 0.5);
          const crotchY = cy + crownRadius * 0.36;
          const crotchSpread = Math.max(8, crownRadius * 0.38);
          const boughLen = Math.max(7, crownRadius * 0.32);

          drawGroundContactShadow(flareW);
          drawNurseryStake(crotchY);

          const defaultGrad = createCylindricalTrunkGradient(px + sway * 0.2, baseW * 1.1, '#78350f', '#451a03', '#190a03', '#2e1408');
          ctx.fillStyle = defaultGrad;
          ctx.beginPath();
          ctx.moveTo(px - flareW, baseY + 2);
          ctx.quadraticCurveTo(px - baseW * 1.15, baseY - 4, px - baseW, baseY - 10);
          ctx.quadraticCurveTo(px - baseW * 0.8 + sway * 0.15, (baseY + crotchY) * 0.5, px - topW + sway * 0.35, crotchY);
          ctx.quadraticCurveTo(px - topW - 2 + sway * 0.35, crotchY - boughLen * 0.5, px - crotchSpread + sway * 0.4, crotchY - boughLen);
          ctx.lineTo(px - crotchSpread + caliper * 0.35 + sway * 0.4, crotchY - boughLen - 2);
          ctx.quadraticCurveTo(px + sway * 0.3, crotchY + 3, px + crotchSpread - caliper * 0.35 + sway * 0.4, crotchY - boughLen - 2);
          ctx.lineTo(px + crotchSpread + sway * 0.4, crotchY - boughLen);
          ctx.quadraticCurveTo(px + topW + 2 + sway * 0.35, crotchY - boughLen * 0.5, px + topW + sway * 0.35, crotchY);
          ctx.quadraticCurveTo(px + baseW * 0.8 + sway * 0.15, (baseY + crotchY) * 0.5, px + baseW, baseY - 10);
          ctx.quadraticCurveTo(px + baseW * 1.15, baseY - 4, px + flareW, baseY + 2);
          ctx.quadraticCurveTo(px, baseY + 1, px - flareW, baseY + 2);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#1b0a03';
          ctx.lineWidth = 0.9;
          ctx.stroke();

          drawBarkLivingAccents(px, flareW, baseW, crotchY, h, maturity > 0.55, true);
          drawCanopyAmbientOcclusion(px + sway * 0.35, crotchY, crotchSpread, 16);
        }
        ctx.restore();

        switch (silhouette) {
          case 'atlas_cedar':
            drawAtlasCedarCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'giant_redwood':
            drawGiantRedwoodCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'columnar_fastigiate':
            drawColumnarFastigiateCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'citrus_evergreen':
            drawCitrusCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'broadleaf_ornamental':
            drawBroadleafOrnamentalCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase, traits);
            break;
          case 'apple_pome':
            drawAppleTreeCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'pear_pome':
            drawPearTreeCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'quince_pome':
            drawQuinceTreeCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'cherry_stone':
            drawSweetCherryCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'peach_stone':
            drawPeachTreeCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'plum_stone':
            drawPlumMirabelleCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'olive_fig':
            drawOliveFigCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'persimmon_kaki':
            drawPersimmonCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'chestnut_oak':
            drawChestnutOakCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'weeping_willow':
            drawWeepingWillowCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'parasol_mulberry':
            drawParasolMulberryCrown(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'palm_banana':
            drawPalmCrown(ctx, px, py, crownRadius, plant, sway, animTime, bioActive);
            break;
          case 'berry_shrub':
            drawShrubCluster(ctx, px, baseY, crownRadius, plant, sway, animTime, bioActive, seasonPhase);
            break;
          case 'support_spire':
            drawPioneerSpire(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
            break;
          default:
            drawBroadleafCrown(ctx, px, py, crownRadius, plant, sway, animTime, bioActive, seasonPhase);
            break;
        }
      }

      function drawTwilightSky(ctx, width, height, skyMode, simulatedYears, animTime, scrollX, totalWidth = 3600) {
        ctx.save();
        let effectiveMode = skyMode;
        if (skyMode === 'auto') {
          const cycle = (simulatedYears * 1.5 + animTime * 0.05) % 1;
          effectiveMode = cycle < 0.25 ? 'twilight' : cycle < 0.55 ? 'dusk' : cycle < 0.85 ? 'night' : 'day';
        }

        const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        if (effectiveMode === 'twilight') {
          // Dawn / Early morning twilight
          skyGrad.addColorStop(0, '#03071e');
          skyGrad.addColorStop(0.35, '#0a192f');
          skyGrad.addColorStop(0.7, '#132e35');
          skyGrad.addColorStop(1, '#064e3b');
        } else if (effectiveMode === 'day') {
          // Soft, natural daytime atmosphere (balanced luminous cerulean to soft mist)
          skyGrad.addColorStop(0, '#1a334a');
          skyGrad.addColorStop(0.35, '#254b68');
          skyGrad.addColorStop(0.7, '#3b677e');
          skyGrad.addColorStop(0.9, '#4c7b8c');
          skyGrad.addColorStop(1, '#1b3f37');
        } else if (effectiveMode === 'dusk') {
          // Golden hour / Sunset
          skyGrad.addColorStop(0, '#1a0b2e');
          skyGrad.addColorStop(0.3, '#4a154b');
          skyGrad.addColorStop(0.65, '#9a3412');
          skyGrad.addColorStop(0.88, '#ea580c');
          skyGrad.addColorStop(1, '#064e3b');
        } else {
          // Nocturnal / Night
          skyGrad.addColorStop(0, '#020617');
          skyGrad.addColorStop(0.45, '#030d1a');
          skyGrad.addColorStop(0.8, '#041d1a');
          skyGrad.addColorStop(1, '#021a12');
        }
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // Render celestial elements matching diurnal atmospheric phase
        if (effectiveMode === 'day') {
          const sunX = width * 0.22;
          const sunY = 55;
          const sunGlow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 75);
          sunGlow.addColorStop(0, 'rgba(254, 243, 199, 0.4)');
          sunGlow.addColorStop(0.45, 'rgba(253, 230, 138, 0.12)');
          sunGlow.addColorStop(1, 'rgba(253, 230, 138, 0)');
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 75, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fef3c7';
          ctx.beginPath();
          ctx.arc(sunX, sunY, 13, 0, Math.PI * 2);
          ctx.fill();

          // Subtle, soft daytime cloud drifts
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          [-30, 190, 430, 710].forEach((cx, idx) => {
            const cloudX = ((cx + animTime * 5) % (width + 320)) - 120;
            const cloudY = 38 + (idx % 3) * 22;
            ctx.beginPath();
            ctx.ellipse(cloudX, cloudY, 62, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cloudX + 22, cloudY - 5, 42, 17, 0, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (effectiveMode === 'dusk') {
          // Golden hour / Sunset
          skyGrad.addColorStop(0, '#1a0b2e');
          skyGrad.addColorStop(0.3, '#4a154b');
          skyGrad.addColorStop(0.65, '#9a3412');
          skyGrad.addColorStop(0.88, '#ea580c');
          skyGrad.addColorStop(1, '#064e3b');
        } else {
          // Nocturnal / Night
          skyGrad.addColorStop(0, '#020617');
          skyGrad.addColorStop(0.45, '#030d1a');
          skyGrad.addColorStop(0.8, '#041d1a');
          skyGrad.addColorStop(1, '#021a12');
        }
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // Render celestial elements matching diurnal atmospheric phase
        if (effectiveMode === 'day') {
          const sunX = width * 0.22;
          const sunY = 55;
          const sunGlow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 70);
          sunGlow.addColorStop(0, 'rgba(254, 240, 138, 0.85)');
          sunGlow.addColorStop(0.4, 'rgba(251, 191, 36, 0.25)');
          sunGlow.addColorStop(1, 'rgba(251, 191, 36, 0)');
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 70, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(sunX, sunY, 15, 0, Math.PI * 2);
          ctx.fill();
        } else if (effectiveMode === 'dusk') {
          const sunX = width * 0.18;
          const sunY = height * 0.62;
          const duskGlow = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 95);
          duskGlow.addColorStop(0, 'rgba(249, 115, 22, 0.9)');
          duskGlow.addColorStop(0.45, 'rgba(234, 88, 12, 0.35)');
          duskGlow.addColorStop(1, 'rgba(234, 88, 12, 0)');
          ctx.fillStyle = duskGlow;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 95, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Night / Dawn stars and moon
          const starCount = effectiveMode === 'night' ? 45 : 22;
          for (let i = 0; i < starCount; i++) {
            const sx = ((i * 137 + animTime * 3) % width);
            const sy = (i * 43) % (height * 0.55);
            const twinkle = Math.sin(animTime * 3 + i * 2.1) * 0.4 + 0.6;
            ctx.fillStyle = `rgba(254, 240, 138, ${twinkle * 0.75})`;
            ctx.beginPath();
            ctx.arc(sx, sy, (i % 2 === 0 ? 1.4 : 1.0), 0, Math.PI * 2);
            ctx.fill();
          }
          const moonX = width * 0.82;
          const moonY = 50;
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(moonX, moonY, 12, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
        return effectiveMode;
      }

      function drawMycorrhizalWeb(ctx, linePlants, baseY, animTime, bioActive = true) {
        if (!linePlants || linePlants.length < 2) return;
        const sorted = [...linePlants].sort((a, b) => (Number(a.linePosition) || 1) - (Number(b.linePosition) || 1));
        ctx.save();

        for (let i = 0; i < sorted.length - 1; i++) {
          const p1 = sorted[i];
          const p2 = sorted[i + 1];
          const x1 = 140 + ((Number(p1.linePosition) || 1) - 1) * 145;
          const x2 = 140 + ((Number(p2.linePosition) || 1) - 1) * 145;
          if (Math.abs(x2 - x1) > 460) continue;

          const y1 = baseY + 18;
          const y2 = baseY + 18;
          const midX = (x1 + x2) / 2;
          const sag = 10 + Math.sin(animTime * 1.5 + i * 1.2) * 4;
          const ctrlY = baseY + 24 + sag;

          const isNitrogenBridge = p1.nitrogenFixer || p2.nitrogenFixer;
          ctx.strokeStyle = isNitrogenBridge ? 'rgba(52, 211, 153, 0.45)' : 'rgba(56, 189, 248, 0.32)';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo(midX, ctrlY, x2, y2);
          ctx.stroke();

          // Animated nutrient / sugar bio-packet traveling along hyphae
          const t = (animTime * 0.35 + (i * 0.29)) % 1;
          const nx = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * midX + t * t * x2;
          const ny = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * ctrlY + t * t * y2;

          ctx.fillStyle = isNitrogenBridge ? '#facc15' : '#67e8f9';
          ctx.beginPath();
          ctx.arc(nx, ny, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      // ======================================================================
      // 12. INTERACTIVE CANVAS COMPONENT (ABSTRACTED TREES + RAISED BEDS)
      // ======================================================================
      function InteractiveTreeLinesCanvas({ plants, simulatedYears, timeScale = 'macro', microMonth = 7, availableLines = [1, 2, 3], activeLineFilter = 'all', initialSkyMode, onSelectLineFilter, onSelectPlant }) {
        const canvasRef = useRef(null);
        const containerRef = useRef(null);
        const [scrollX, setScrollX] = useState(0);
        const [scrollY, setScrollY] = useState(0);
        const [isDragging, setIsDragging] = useState(false);
        const [bioluminescence, setBioluminescence] = useState(true);
        const [skyMode, setSkyMode] = useState(() => initialSkyMode || SYSTEM_DATE.diurnalPhase || 'day');
        const dragStart = useRef({ x: 0, y: 0, scrollX: 0, scrollY: 0 });
        const touchMoved = useRef(false);

        const filteredPlants = useMemo(() => {
          return plants.filter(p => p.line != null && (activeLineFilter === 'all' || Number(p.line) === Number(activeLineFilter)));
        }, [plants, activeLineFilter]);

        const linesToDraw = useMemo(() => {
          return activeLineFilter === 'all' ? availableLines : [Number(activeLineFilter)];
        }, [activeLineFilter, availableLines]);

        const maxPosition = useMemo(() => {
          let max = 15;
          plants.forEach(p => {
            const pos = Number(p.linePosition);
            if (!isNaN(pos) && pos > max) max = pos;
          });
          return max;
        }, [plants]);

        const TOTAL_WIDTH = useMemo(() => {
          return Math.max(1800, (maxPosition + 3) * 145);
        }, [maxPosition]);

        const totalTerrainHeight = useMemo(() => {
          if (activeLineFilter !== 'all') return 520;
          return Math.max(520, 200 + (linesToDraw.length - 1) * 160 + 100);
        }, [activeLineFilter, linesToDraw]);

        const maxScrollY = Math.max(0, totalTerrainHeight - 520);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animId;

          const render = () => {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const width = containerRef.current?.clientWidth || 900;
            const height = containerRef.current?.clientHeight || (window.innerWidth < 640 ? 440 : 520);

            if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
              canvas.width = Math.floor(width * dpr);
              canvas.height = Math.floor(height * dpr);
            }

            ctx.save();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const animTime = performance.now() * 0.002;
            drawTwilightSky(ctx, width, height, skyMode, simulatedYears, animTime, scrollX, TOTAL_WIDTH);

            ctx.save();
            ctx.translate(-scrollX, -scrollY);

            linesToDraw.forEach((lineNum, idx) => {
              const baseY = activeLineFilter === 'all' ? (190 + idx * 160) : 380;
              const palette = ['#38bdf8', '#34d399', '#facc15', '#a855f7', '#fb923c', '#2dd4bf'];
              const lineColor = palette[(lineNum - 1) % palette.length];
              const linePlants = filteredPlants.filter(p => Number(p.line) === lineNum);
              const isVegBed = linePlants.some(p => p.isVegetable || p.lifecycleType === 'annual' || p.category?.startsWith('vegetable_'));

              // Grounded Headboard Signpost at Bed/Line Entrance (replaces raw floating text)
              const plaqueX = 26;
              const plaqueY = baseY - 32;
              const plaqueW = 96;
              const plaqueH = 24;

              // Timber / metal ground posts anchoring sign to the bed entrance
              ctx.fillStyle = isVegBed ? '#573312' : '#334155';
              ctx.fillRect(plaqueX + 8, baseY - 10, 3, 10);
              ctx.fillRect(plaqueX + plaqueW - 11, baseY - 10, 3, 10);

              // Plaque body with dark background and border matching line color
              ctx.fillStyle = 'rgba(2, 6, 23, 0.92)';
              ctx.beginPath();
              if (ctx.roundRect) {
                ctx.roundRect(plaqueX, plaqueY, plaqueW, plaqueH, 4);
              } else {
                ctx.rect(plaqueX, plaqueY, plaqueW, plaqueH);
              }
              ctx.fill();
              ctx.strokeStyle = lineColor;
              ctx.lineWidth = 1.2;
              ctx.stroke();

              // Clean, crisp typography inside the signpost plaque
              ctx.save();
              ctx.textAlign = 'center';
              ctx.font = '800 8.5px "Orbitron", sans-serif';
              ctx.fillStyle = lineColor;
              ctx.fillText(isVegBed ? `BED ${lineNum}` : `LINE ${lineNum}`, plaqueX + plaqueW / 2, plaqueY + 10);

              ctx.font = '700 5.5px "Press Start 2P", monospace';
              ctx.fillStyle = isVegBed ? '#fbbf24' : '#94a3b8';
              ctx.fillText(isVegBed ? 'RAISED BED' : 'ORCHARD', plaqueX + plaqueW / 2, plaqueY + 19);
              ctx.restore();

              // ----------------- STAGE 3 TERRAIN ABSTRACTION -----------------
              if (isVegBed) {
                // RAISED VEGETABLE BED PROFILE
                const bedDepth = 54;
                
                // 1. Subterranean Compost Cross-Section (Rich dark humus)
                const compostGrad = ctx.createLinearGradient(0, baseY, 0, baseY + bedDepth);
                compostGrad.addColorStop(0, '#292524');
                compostGrad.addColorStop(0.3, '#1c1917');
                compostGrad.addColorStop(1, '#0c0a09');
                ctx.fillStyle = compostGrad;
                ctx.fillRect(20, baseY, TOTAL_WIDTH, bedDepth);

                // 2. Straw / Organic Mulch Layer Blanket
                ctx.fillStyle = '#b45309';
                ctx.fillRect(20, baseY - 4, TOTAL_WIDTH, 4);

                // 3. Heavy Timber Edge Planks & Steel Corner Brackets
                ctx.fillStyle = '#78350f';
                ctx.fillRect(20, baseY - 12, TOTAL_WIDTH, 8);
                ctx.strokeStyle = '#451a03';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(20, baseY - 12, TOTAL_WIDTH, 8);

                // Wood grain lines
                ctx.strokeStyle = '#92400e';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(20, baseY - 8);
                ctx.lineTo(TOTAL_WIDTH + 20, baseY - 8);
                ctx.stroke();

                // Corner Brackets with Hex Rivets
                [20, 240, 560, 920, 1340, 1780, 2200, 2600].forEach(bx => {
                  ctx.fillStyle = '#334155';
                  ctx.fillRect(bx, baseY - 14, 10, bedDepth + 14);
                  ctx.strokeStyle = '#0f172a';
                  ctx.lineWidth = 1;
                  ctx.strokeRect(bx, baseY - 14, 10, bedDepth + 14);

                  // Rivet dots
                  ctx.fillStyle = '#94a3b8';
                  ctx.beginPath();
                  ctx.arc(bx + 5, baseY - 8, 1.5, 0, Math.PI * 2);
                  ctx.arc(bx + 5, baseY + 12, 1.5, 0, Math.PI * 2);
                  ctx.arc(bx + 5, baseY + 36, 1.5, 0, Math.PI * 2);
                  ctx.fill();
                });

                // Depth markings on left edge
                ctx.font = '600 7px monospace';
                ctx.fillStyle = '#fbbf24';
                ctx.textAlign = 'right';
                ctx.fillText('0cm', 18, baseY);
                ctx.fillText('-15cm', 18, baseY + 20);
                ctx.fillText('-30cm', 18, baseY + 42);

                // Soil mycorrhizal & micro-life particles in compost
                for (let mp = 0; mp < 24; mp++) {
                  const mpx = (animTime * 20 + mp * 85) % TOTAL_WIDTH + 20;
                  const mpy = baseY + 6 + (mp % 5) * 8;
                  ctx.fillStyle = mp % 2 === 0 ? 'rgba(250, 204, 21, 0.45)' : 'rgba(74, 222, 128, 0.4)';
                  ctx.beginPath();
                  ctx.arc(mpx, mpy, 1.2, 0, Math.PI * 2);
                  ctx.fill();
                }

              } else {
                // ORCHARD & AGROFORESTRY TREE LINE PROFILE (Flat Ground / Undulating Swale)
                const groundGrad = ctx.createLinearGradient(0, baseY, 0, baseY + 48);
                groundGrad.addColorStop(0, '#14532d');
                groundGrad.addColorStop(0.35, '#1c1917');
                groundGrad.addColorStop(1, 'rgba(6, 78, 59, 0.2)');
                ctx.fillStyle = groundGrad;
                ctx.fillRect(20, baseY, TOTAL_WIDTH, 48);

                // Undulating Green Grass Turf Line
                ctx.beginPath();
                ctx.moveTo(20, baseY);
                for (let t = 20; t <= TOTAL_WIDTH; t += 15) {
                  const wave = Math.sin(t * 0.03 + lineNum) * 2.2;
                  ctx.lineTo(t, baseY + wave);
                }
                ctx.strokeStyle = lineColor;
                ctx.lineWidth = 1.8;
                ctx.stroke();

                // Fungal Mycorrhizal Hyphae Network linking tree lines
                drawMycorrhizalWeb(ctx, linePlants, baseY, animTime, bioluminescence);
              }

              // Grid Stations
              for (let s = 0; s <= maxPosition + 2; s++) {
                const sx = 140 + s * 145;
                ctx.beginPath();
                ctx.moveTo(sx, baseY);
                ctx.lineTo(sx, baseY + (isVegBed ? 12 : 8));
                ctx.strokeStyle = isVegBed ? 'rgba(251, 191, 36, 0.35)' : 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.font = '7px monospace';
                ctx.fillStyle = isVegBed ? 'rgba(252, 211, 77, 0.75)' : 'rgba(148, 163, 184, 0.6)';
                ctx.textAlign = 'center';
                ctx.fillText(isVegBed ? `P${s + 1} (${s * 50}cm)` : `+${s * 2}m`, sx, baseY + 26);
              }

              // Render Each Plant / Vegetable with Stage 3 Geometric Renderers
              linePlants.forEach(p => {
                const px = 140 + ((Number(p.linePosition) || 1) - 1) * 145;
                const isVeg = p.isVegetable || p.lifecycleType === 'annual' || p.category?.startsWith('vegetable_');
                const pheno = getCropMicroPhenology(p, timeScale === 'micro' ? microMonth : ((simulatedYears % 1) * 12 + 1));

                if (isVeg) {
                  // STAGE 3 PROCEDURAL GEOMETRIC VEGETABLE RENDERERS
                  if (p.category === 'vegetable_root' || p.growthHabit === 'root_subterranean') {
                    drawRootCrop(ctx, px, baseY, p, animTime, bioluminescence, pheno);
                  } else if (p.category === 'vegetable_leafy' || p.growthHabit === 'rosette') {
                    drawLeafyGreen(ctx, px, baseY, p, animTime, bioluminescence, pheno);
                  } else if (p.category === 'vegetable_legume' || p.growthHabit === 'climbing_trellis' || /tomato|bean|pea|cucumber/i.test(p.name)) {

      // ======================================================================
      function normalizeSectorCode(val) {
        if (!val) return 'S';
        const str = String(val).trim().toUpperCase();
        if (['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'].includes(str)) return str;
        if (/^(NORTH[- ]?WEST|NW|NORD[- ]?OUEST)$/i.test(str)) return 'NW';
        if (/^(NORTH[- ]?EAST|NE|NORD[- ]?EST)$/i.test(str)) return 'NE';
        if (/^(SOUTH[- ]?WEST|SW|SUD[- ]?OUEST)$/i.test(str)) return 'SW';
        if (/^(SOUTH[- ]?EAST|SE|SUD[- ]?EST)$/i.test(str)) return 'SE';
        if (/^(NORTH|NORD|SEPTENTRIONAL)$/i.test(str)) return 'N';
        if (/^(SOUTH|SUD|PLEIN SUD)$/i.test(str)) return 'S';
        if (/^(EAST|EST|LEVANT)$/i.test(str)) return 'E';
        if (/^(WEST|OUEST|COUCHANT)$/i.test(str)) return 'W';
        return 'S';
      }

      const CARDINAL_SECTORS = [
        { code: 'N', name: 'North', compassDeg: 0, aspect: 'Cold Polar Gales • Climax Shade • Winter Frost Buffer', defaultColor: '#38bdf8' },
        { code: 'NE', name: 'North-East', compassDeg: 45, aspect: 'Early Morning Sun • Cold Continental Winds', defaultColor: '#818cf8' },
        { code: 'E', name: 'East', compassDeg: 90, aspect: 'Gentle Awakening Dawn Heat • Morning Insolation', defaultColor: '#c084fc' },
        { code: 'SE', name: 'South-East', compassDeg: 135, aspect: 'High Morning Light • Early Solar Thermal Gain', defaultColor: '#f472b6' },
        { code: 'S', name: 'South', compassDeg: 180, aspect: 'Maximum Solar Radiation • High Midday Insolation', defaultColor: '#facc15' },
        { code: 'SW', name: 'South-West', compassDeg: 225, aspect: 'Intense Afternoon Heat • Warm Western Winds', defaultColor: '#fb923c' },
        { code: 'W', name: 'West', compassDeg: 270, aspect: 'Late Afternoon Heat • Prevailing Atlantic Squalls', defaultColor: '#f87171' },
        { code: 'NW', name: 'North-West', compassDeg: 315, aspect: 'Violent Winter Storms • Late Sunset Light', defaultColor: '#2dd4bf' }
      ];

      function calculateSectorDefenseTelemetry(plants, simulatedYears, sectorConfig = DEFAULT_SECTOR_CONFIG) {
        const winterSector = normalizeSectorCode(sectorConfig.winterWindSector || 'NW');
        const frostSector = normalizeSectorCode(sectorConfig.frostHazardSector || 'N');

        // 1. Windbreak Shielding Rating (sentinels defending against calibrated winter gale sector)
        const windbreakSentinels = plants.filter(p => {
          const sec = normalizeSectorCode(p.cardinalSector);
          const isGuardingSector = sec === winterSector || sec === 'N' || sec === 'NW';
          const isSentinel = p.category === 'canopy_timber' || p.isSupportSpecies || /sequoia|cedar|pine|oak|poplar|willow|chestnut/i.test(p.name);
          return isGuardingSector && isSentinel;
        });

        let totalEffectiveHeight = 0;
        windbreakSentinels.forEach(p => {
          const h = (p.initialHeightMeters || 1.0) + (p.growthRateMPerYear || 0.5) * simulatedYears;
          totalEffectiveHeight += h;
        });
        const windbreakEfficiency = Math.min(98, Math.max(15, Math.round((totalEffectiveHeight / 28) * 100)));

        // 2. Solar Capture Index: Fruiting crops & vegetables situated in prime solar arc (SE, S, SW)
        const sunLovingCrops = plants.filter(p => p.category === 'fruit_tree' || p.category === 'vegetable_fruit' || p.isVegetable);
        const wellPlacedSunCrops = sunLovingCrops.filter(p => {
          const sec = normalizeSectorCode(p.cardinalSector);
          return sec === 'S' || sec === 'SW' || sec === 'SE';
        });
        const solarCaptureIndex = sunLovingCrops.length > 0 
          ? Math.round((wellPlacedSunCrops.length / sunLovingCrops.length) * 100) 
          : 90;

        // 3. Hydrological Swale & Runoff Infiltration
        const waterInterceptors = plants.filter(p => {
          const blob = (p.name + ' ' + (p.landmarkAnchor || '') + ' ' + (p.boundaryAssignment || '')).toLowerCase();
          return blob.includes('swale') || blob.includes('pond') || blob.includes('willow') || blob.includes('comfrey') || blob.includes('banana');
        });
        const waterCatchmentRating = Math.min(96, Math.max(25, Math.round(waterInterceptors.length * 10)));

        // 4. Thermal Stone & Courtyard Microclimate Heat Sinks
        const heatSinkPlants = plants.filter(p => {
          const blob = ((p.sunAspect || '') + ' ' + (p.landmarkAnchor || '') + ' ' + (p.notes || '')).toLowerCase();
          return blob.includes('heat sink') || blob.includes('stone wall') || blob.includes('courtyard') || blob.includes('terrace');
        });

        // 5. Frost Vulnerability Diagnostic: Tender crops planted in the designated frost hazard sector
        const vulnerableCrops = plants.filter(p => {
          const sec = normalizeSectorCode(p.cardinalSector);
          if (sec !== frostSector) return false;
          const isTender = /apricot|abricot|peach|peche|fig|figue|tomato|tomate|pepper|zucchini/i.test(p.name);
          return isTender;
        });

        // Composite Resilience Score (0 - 100)
        const resilienceScore = Math.min(100, Math.round(
          (windbreakEfficiency * 0.35) + 
          (solarCaptureIndex * 0.35) + 
          (waterCatchmentRating * 0.20) + 
          (Math.min(10, heatSinkPlants.length) * 1.0)
        ));

        return {
          northSentinelsCount: windbreakSentinels.length,
          windbreakEfficiency,
          solarCaptureIndex,
          waterCatchmentRating,
          waterInterceptorsCount: waterInterceptors.length,
          heatSinkCount: heatSinkPlants.length,
          vulnerableCrops,
          resilienceScore,
          isNorthProtected: windbreakEfficiency >= 60
        };
      }

      function PermacultureSectorRadarView({ plants, simulatedYears, timeScale = 'macro', microMonth = 7, sectorConfig = DEFAULT_SECTOR_CONFIG, onOpenCalibration, onOpenAudit, onSelectPlant }) {
        const radarCanvasRef = useRef(null);
        const containerRef = useRef(null);
        const [activeSector, setActiveSector] = useState('all');
        const [hoveredPlant, setHoveredPlant] = useState(null);
        const [hoveredSector, setHoveredSector] = useState(null);
        const [isRadarRotating, setIsRadarRotating] = useState(true);
        const lastTouchTime = useRef(0);

        // Stage 2: Toggleable Wild Energy Layers
        const [energyLayers, setEnergyLayers] = useState({
          solar: true,
          wind: true,
          hydrology: true,
          thermal: true
        });

        const toggleLayer = (layerKey) => {
          soundEngine.playTone(540, 0.03, 'sine');
          setEnergyLayers(prev => ({ ...prev, [layerKey]: !prev[layerKey] }));
        };

        const defenseTelemetry = useMemo(() => {
          return calculateSectorDefenseTelemetry(plants, simulatedYears, sectorConfig);
        }, [plants, simulatedYears, sectorConfig]);

        const sectorStats = useMemo(() => {
          const map = {};
          CARDINAL_SECTORS.forEach(sec => {
            const list = plants.filter(p => normalizeSectorCode(p.cardinalSector) === sec.code);
            map[sec.code] = {
              ...sec,
              count: list.length,
              plants: list,
              vegetableCount: list.filter(p => p.isVegetable || p.lifecycleType === 'annual').length,
              treeCount: list.filter(p => !p.isVegetable && p.lifecycleType !== 'annual').length
            };
          });
          return map;
        }, [plants]);

        const displayedPlants = useMemo(() => {
          if (activeSector === 'all') return plants;
          return plants.filter(p => normalizeSectorCode(p.cardinalSector) === activeSector);
        }, [plants, activeSector]);

        useEffect(() => {
          const canvas = radarCanvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animId;

          const renderRadar = () => {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const width = containerRef.current?.clientWidth || 700;
            const height = Math.min(560, Math.max(460, width * 0.85));

            if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
              canvas.width = Math.floor(width * dpr);
              canvas.height = Math.floor(height * dpr);
            }

            ctx.save();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const animTime = performance.now() * 0.001;
            const cx = width / 2;
            const cy = height / 2;
            const maxR = Math.min(cx, cy) - 34;

            ctx.clearRect(0, 0, width, height);

            // 1. Dark Deep Space Canvas Background
            const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxR + 25);
            bgGrad.addColorStop(0, '#020617');
            bgGrad.addColorStop(0.65, '#030d1a');
            bgGrad.addColorStop(1, '#021812');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // ----------------- STAGE 2 LAYER 1: THERMAL MICROCLIMATES & FROST -----------------
            if (energyLayers.thermal) {
              ctx.save();
              const frostSecCode = normalizeSectorCode(sectorConfig.frostHazardSector || 'N');
              const frostSecDef = CARDINAL_SECTORS.find(s => s.code === frostSecCode) || CARDINAL_SECTORS[0];
              const frostRad = ((frostSecDef.compassDeg - 90) * Math.PI) / 180;
              const frostDist = maxR * 0.65;
              const frostCx = cx + Math.cos(frostRad) * frostDist;
              const frostCy = cy + Math.sin(frostRad) * frostDist;

              const frostGrad = ctx.createRadialGradient(frostCx, frostCy, 10, frostCx, frostCy, maxR * 0.42);
              frostGrad.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
              frostGrad.addColorStop(0.7, 'rgba(14, 165, 233, 0.06)');
              frostGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
              ctx.fillStyle = frostGrad;
              ctx.beginPath();
              ctx.arc(frostCx, frostCy, maxR * 0.42, 0, Math.PI * 2);
              ctx.fill();

              // Radiant South Stone Wall Heat Sink Terrace in Zone 1 (Warm Amber Pulse)
              const heatPulse = Math.sin(animTime * 2.2) * 0.05 + 0.95;
              const heatGrad = ctx.createRadialGradient(cx + 8, cy + 24, 4, cx + 8, cy + 24, 48 * heatPulse);
              heatGrad.addColorStop(0, 'rgba(251, 146, 60, 0.35)');
              heatGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.14)');
              heatGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
              ctx.fillStyle = heatGrad;
              ctx.beginPath();
              ctx.arc(cx + 8, cy + 24, 48 * heatPulse, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            // ----------------- STAGE 2 LAYER 2: HYDROLOGICAL SLOPE & RUNOFF -----------------
            if (energyLayers.hydrology) {
              ctx.save();
              const slopeSecCode = normalizeSectorCode(sectorConfig.slopeDirection || 'S');
              const slopeSecDef = CARDINAL_SECTORS.find(s => s.code === slopeSecCode) || CARDINAL_SECTORS[4];
              const slopeRad = ((slopeSecDef.compassDeg - 90) * Math.PI) / 180;

              ctx.strokeStyle = 'rgba(6, 182, 212, 0.38)';
              ctx.lineWidth = 1.2;
              ctx.setLineDash([4, 6]);

              // Topography swale contour lines
              [0.36, 0.58].forEach(ratio => {
                ctx.beginPath();
                const r = maxR * ratio;
                ctx.ellipse(cx, cy + r * 0.25, r, r * 0.6, 0.15, Math.PI * 0.1, Math.PI * 0.9);
                ctx.stroke();
              });
              ctx.setLineDash([]);

              // Animated Overland Runoff Flow Beads (flowing outward downhill towards perimeter swales & pond)
              for (let drop = 0; drop < 7; drop++) {
                const tDrop = (animTime * 0.35 + drop * 0.16) % 1;
                const startDist = maxR * 0.15;
                const endDist = maxR * (0.65 + (drop % 3) * 0.1);
                const curDist = startDist + (endDist - startDist) * tDrop;
                const lateral = ((drop - 3) * 12);
                const curX = cx + Math.cos(slopeRad) * curDist + Math.sin(slopeRad) * lateral;
                const curY = cy + Math.sin(slopeRad) * curDist - Math.cos(slopeRad) * lateral;

                ctx.fillStyle = 'rgba(103, 232, 249, 0.75)';
                ctx.beginPath();
                ctx.arc(curX, curY, 1.8, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();
            }

            // 2. 8 Cardinal Sector Wedges
            CARDINAL_SECTORS.forEach(sec => {
              const compassDeg = sec.compassDeg;
              const isSelected = activeSector === sec.code;
              const isHovered = hoveredSector === sec.code;

              const startRad = ((compassDeg - 22.5 - 90) * Math.PI) / 180;
              const endRad = ((compassDeg + 22.5 - 90) * Math.PI) / 180;

              ctx.save();
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, maxR, startRad, endRad);
              ctx.closePath();

              if (isSelected) {
                ctx.fillStyle = 'rgba(245, 158, 11, 0.18)';
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2.0;
                ctx.stroke();
              } else if (isHovered) {
                ctx.fillStyle = 'rgba(6, 182, 212, 0.12)';
                ctx.fill();
                ctx.strokeStyle = '#06b6d4';
                ctx.lineWidth = 1.4;
                ctx.stroke();
              } else {
                ctx.strokeStyle = 'rgba(30, 41, 59, 0.6)';
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
              ctx.restore();

              // Cardinal Sector Label on Outer Rim
              const midRad = ((compassDeg - 90) * Math.PI) / 180;
              const labelR = maxR + 18;
              const lx = cx + Math.cos(midRad) * labelR;
              const ly = cy + Math.sin(midRad) * labelR;

              ctx.font = '800 8.5px "Press Start 2P", monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = isSelected ? '#fbbf24' : isHovered ? '#38bdf8' : sec.defaultColor;
              ctx.fillText(sec.code, lx, ly);
            });

            // ----------------- STAGE 2 LAYER 3: DYNAMIC SOLAR ARC TRAJECTORY -----------------
            if (energyLayers.solar) {
              ctx.save();
              const monthFloat = timeScale === 'micro' ? microMonth : ((simulatedYears % 1) * 12 + 1);
              const m = Math.floor(monthFloat);
              const isSummer = m >= 5 && m <= 8;
              const isWinter = m === 12 || m <= 2;

              const sunriseDeg = isSummer ? 58 : isWinter ? 124 : 90;
              const sunsetDeg = isSummer ? 302 : isWinter ? 236 : 270;

              const sunStartRad = ((sunriseDeg - 90) * Math.PI) / 180;
              const sunEndRad = ((sunsetDeg - 90) * Math.PI) / 180;

              ctx.beginPath();
              ctx.arc(cx, cy, maxR * 0.76, sunStartRad, sunEndRad);
              ctx.strokeStyle = 'rgba(251, 191, 36, 0.65)';
              ctx.lineWidth = 2.4;
              ctx.setLineDash([5, 4]);
              ctx.stroke();
              ctx.setLineDash([]);

              const solarBeamGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxR * 0.85);
              solarBeamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.02)');
              solarBeamGrad.addColorStop(0.5, 'rgba(251, 191, 36, 0.08)');
              solarBeamGrad.addColorStop(1, 'rgba(251, 191, 36, 0)');
              ctx.fillStyle = solarBeamGrad;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, maxR * 0.85, sunStartRad, sunEndRad);
              ctx.closePath();
              ctx.fill();

              const sunProgress = (animTime * 0.15) % 1;
              const currentSunRad = sunStartRad + (sunEndRad - sunStartRad) * sunProgress;
              const sunOrbX = cx + Math.cos(currentSunRad) * (maxR * 0.76);
              const sunOrbY = cy + Math.sin(currentSunRad) * (maxR * 0.76);

              ctx.fillStyle = '#fde047';
              ctx.beginPath();
              ctx.arc(sunOrbX, sunOrbY, 4.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            // ----------------- STAGE 2 LAYER 4: WIND VECTORS & WINDBREAK DEFLECTION -----------------
            if (energyLayers.wind) {
              ctx.save();
              const isShielded = defenseTelemetry.isNorthProtected;
              const winterSecCode = normalizeSectorCode(sectorConfig.winterWindSector || 'NW');
              const winterSecDef = CARDINAL_SECTORS.find(s => s.code === winterSecCode) || CARDINAL_SECTORS[7];
              const baseCompassDeg = winterSecDef.compassDeg;

              [-24, -8, 8, 24].forEach((offsetDeg, wIdx) => {
                const windPhase = (animTime * 1.5 + wIdx * 0.28) % 1;
                const windCompassDeg = (baseCompassDeg + offsetDeg + 360) % 360;
                const rad = ((windCompassDeg - 90) * Math.PI) / 180;
                const startDist = maxR * 1.15;
                const hitDist = maxR * 0.86;

                if (windPhase < 0.6 || !isShielded) {
                  const curDist = startDist - (startDist - hitDist) * (windPhase / 0.6);
                  const wx = cx + Math.cos(rad) * curDist;
                  const wy = cy + Math.sin(rad) * curDist;

                  ctx.fillStyle = 'rgba(56, 189, 248, 0.8)';
                  ctx.beginPath();
                  ctx.arc(wx, wy, 2.0, 0, Math.PI * 2);
                  ctx.fill();

                  ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                  ctx.lineWidth = 1.2;
                  ctx.beginPath();
                  ctx.moveTo(wx, wy);
                  ctx.lineTo(wx - Math.cos(rad) * 12, wy - Math.sin(rad) * 12);
                  ctx.stroke();
                } else {
                  const deflectT = (windPhase - 0.6) / 0.4;
                  const deflectAngle = rad + (wIdx % 2 === 0 ? 0.38 : -0.38) * deflectT;
                  const deflectDist = hitDist - (hitDist * 0.15 * deflectT);
                  const dwx = cx + Math.cos(deflectAngle) * deflectDist;
                  const dwy = cy + Math.sin(deflectAngle) * deflectDist;

                  ctx.fillStyle = 'rgba(52, 211, 153, 0.55)';
                  ctx.beginPath();
                  ctx.arc(dwx, dwy, 1.4, 0, Math.PI * 2);
                  ctx.fill();
                }
              });

              const summerSecCode = normalizeSectorCode(sectorConfig.summerWindSector || 'SW');
              const summerSecDef = CARDINAL_SECTORS.find(s => s.code === summerSecCode) || CARDINAL_SECTORS[5];
              const swPhase = (animTime * 0.8) % 1;
              const swRad = ((summerSecDef.compassDeg - 90) * Math.PI) / 180;
              const swDist = maxR * 0.95 - (maxR * 0.6 * swPhase);
              ctx.fillStyle = 'rgba(251, 146, 60, 0.55)';
              ctx.beginPath();
              ctx.arc(cx + Math.cos(swRad) * swDist, cy + Math.sin(swRad) * swDist, 1.8, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            // 3. Concentric Permaculture Zone Rings
            const zoneRings = [
              { zone: 1, ratio: 0.28, label: 'Z1: HOMESTEAD & BEDS', color: 'rgba(56, 189, 248, 0.35)' },
              { zone: 2, ratio: 0.54, label: 'Z2: ORCHARD & GUILDS', color: 'rgba(52, 211, 153, 0.35)' },
              { zone: 3, ratio: 0.78, label: 'Z3: COPPICE & BANANA', color: 'rgba(250, 204, 21, 0.35)' },
              { zone: 4, ratio: 1.00, label: 'Z4: REDWOOD WINDBREAK', color: 'rgba(168, 85, 247, 0.35)' }
            ];

            zoneRings.forEach(z => {
              const r = maxR * z.ratio;
              ctx.beginPath();
              ctx.arc(cx, cy, r, 0, Math.PI * 2);
              ctx.strokeStyle = z.color;
              ctx.lineWidth = 1.0;
              ctx.setLineDash([3, 4]);
              ctx.stroke();
              ctx.setLineDash([]);

              ctx.font = '600 6.5px "Space Grotesk", monospace';
              ctx.fillStyle = z.color;
              ctx.textAlign = 'left';
              ctx.fillText(z.label, cx + 6, cy - r + 8);
            });

            // 4. Center Anchor (Homestead Center Core)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏡', cx, cy);

            // 5. Rotating Sci-Fi / Arcade Radar Sweep
            if (isRadarRotating) {
              const sweepAngle = (animTime * 0.9) % (Math.PI * 2);
              ctx.save();
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, maxR, sweepAngle - 0.35, sweepAngle);
              ctx.closePath();

              const sweepGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, maxR);
              sweepGrad.addColorStop(0, 'rgba(52, 211, 153, 0)');
              sweepGrad.addColorStop(1, 'rgba(52, 211, 153, 0.22)');
              ctx.fillStyle = sweepGrad;
              ctx.fill();

              ctx.strokeStyle = 'rgba(110, 231, 183, 0.85)';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(cx + Math.cos(sweepAngle) * maxR, cy + Math.sin(sweepAngle) * maxR);
              ctx.stroke();
              ctx.restore();
            }

            // 6. Plot Each Specimen Node
            plants.forEach((p, idx) => {
              const secCode = normalizeSectorCode(p.cardinalSector);
              const secDef = CARDINAL_SECTORS.find(s => s.code === secCode) || CARDINAL_SECTORS[4];
              const isMatch = activeSector === 'all' || activeSector === secCode;
              const isHighlighted = hoveredPlant?.id === p.id;

              const compassDeg = secDef.compassDeg;
              const angleJitter = ((idx % 7) - 3) * 3.4;
              const rad = ((compassDeg + angleJitter - 90) * Math.PI) / 180;

              const zone = Number(p.zone) || 2;
              const zoneBase = zone === 1 ? 0.16 : zone === 2 ? 0.38 : zone === 3 ? 0.65 : 0.88;
              const radiusJitter = ((idx % 5) - 2) * (maxR * 0.035);
              const nodeR = Math.max(24, Math.min(maxR - 6, maxR * zoneBase + radiusJitter));

              const nx = cx + Math.cos(rad) * nodeR;
              const ny = cy + Math.sin(rad) * nodeR;

              const isVeg = p.isVegetable || p.lifecycleType === 'annual';
              const isSupport = p.isSupportSpecies;
              const isConifer = /sequoia|cedar|pine|oak|conifer/i.test(p.name);
              const nodeColor = isVeg ? '#f59e0b' : isSupport ? '#10b981' : isConifer ? '#38bdf8' : '#ec4899';

              ctx.save();
              ctx.globalAlpha = isMatch ? 1.0 : 0.22;

              if (isHighlighted) {
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 12;
              }

              // Draw Node Icon / Dot
              ctx.fillStyle = nodeColor;
              ctx.beginPath();
              if (isVeg) {
                ctx.moveTo(nx, ny - 4);
                ctx.lineTo(nx + 4, ny);
                ctx.lineTo(nx, ny + 4);
                ctx.lineTo(nx - 4, ny);
                ctx.closePath();
              } else if (isSupport) {
                ctx.moveTo(nx, ny - 4.5);
                ctx.lineTo(nx + 4, ny + 3.5);
                ctx.lineTo(nx - 4, ny + 3.5);
                ctx.closePath();
              } else {
                ctx.arc(nx, ny, isHighlighted ? 4.5 : 3.2, 0, Math.PI * 2);
              }
              ctx.fill();

              ctx.strokeStyle = isHighlighted ? '#ffffff' : '#020617';
              ctx.lineWidth = 1;
              ctx.stroke();

              ctx.restore();
            });

            ctx.restore();
            animId = requestAnimationFrame(renderRadar);
          };

          animId = requestAnimationFrame(renderRadar);
          return () => cancelAnimationFrame(animId);
        }, [plants, activeSector, hoveredSector, hoveredPlant, isRadarRotating, energyLayers, defenseTelemetry, timeScale, microMonth, simulatedYears]);

        const handleCanvasMouseMove = (e) => {
          const canvas = radarCanvasRef.current;
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) return;

          const width = containerRef.current?.clientWidth || 700;
          const height = Math.min(560, Math.max(460, width * 0.85));
          const scaleX = width / rect.width;
          const scaleY = height / rect.height;

          const mx = (e.clientX - rect.left) * scaleX;
          const my = (e.clientY - rect.top) * scaleY;

          const cx = width / 2;
          const cy = height / 2;
          const dx = mx - cx;
          const dy = my - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);

          let foundPlant = null;
          let closestDist = Infinity;
          const maxR = Math.min(cx, cy) - 34;

          plants.forEach((p, idx) => {
            const secCode = normalizeSectorCode(p.cardinalSector);
            const secDef = CARDINAL_SECTORS.find(s => s.code === secCode) || CARDINAL_SECTORS[4];

                  style: { borderColor: pheno.stageColor, color: pheno.stageColor }

              /* 12-Month Micro Calendar Ribbon */
              React.createElement('div', { className: 'grid grid-cols-12 gap-0.5 pt-1' },
                CALENDAR_MONTHS.map(mItem => {

                  }, mItem.code[0]);

            ),

            React.createElement('div', { className: 'bg-black/70 p-2.5 rounded-xl border border-cyan-500/40 flex flex-wrap items-center justify-between gap-2 text-xs font-mono' },
              React.createElement('div', { className: 'flex items-center gap-2' },

                  `🧭 SECTOR: ${plant.cardinalSector || 'S'}`

                React.createElement('span', { className: 'text-slate-300 text-[8.5px]' }, plant.sunAspect || 'Full Sun Exposure')
              ),
              plant.landmarkAnchor && React.createElement('span', { className: 'text-amber-300 text-[8px] font-bold' },
                `📍 ${plant.landmarkAnchor}`
              )
            ),

            /* Spacing and Days to Maturity for Garden Vegetables */
            isVeg && React.createElement('div', { className: 'grid grid-cols-3 gap-2 bg-black/60 p-2.5 rounded-xl border border-slate-800 text-center font-mono' },
              React.createElement('div', null,
                React.createElement('span', { className: 'text-[6.5px] font-arcade text-slate-400 block' }, 'SPACING'),
                React.createElement('span', { className: 'text-sm font-bold text-amber-300' }, `${plant.spacingCm || 30} cm`)
              ),
              React.createElement('div', null,
                React.createElement('span', { className: 'text-[6.5px] font-arcade text-cyan-300 block' }, 'DAYS TO HARVEST'),
                React.createElement('span', { className: 'text-sm font-bold text-cyan-300' }, plant.daysToMaturity ? `${plant.daysToMaturity} days` : 'Continuous')
              ),
              React.createElement('div', null,
                React.createElement('span', { className: 'text-[6.5px] font-arcade text-emerald-400 block' }, 'GROWTH HABIT'),
                React.createElement('span', { className: 'text-[9px] font-bold text-emerald-300 block truncate' }, (plant.growthHabit || 'upright').replace('_', ' '))
              )
            ),

            /* Heights & Dimensions for Trees and Perennials */
            !isVeg && React.createElement('div', { className: 'grid grid-cols-3 gap-2 bg-black/60 p-2.5 rounded-xl border border-slate-800 text-center font-mono' },
              React.createElement('div', null,
                React.createElement('span', { className: 'text-[7px] font-arcade text-slate-400 block' }, 'INITIAL'),
                React.createElement('span', { className: 'text-sm font-bold text-slate-200' }, `${plant.initialHeightMeters || 0.5}m`)
              ),
              React.createElement('div', null,
                React.createElement('span', { className: 'text-[7px] font-arcade text-emerald-400 block' }, `CURRENT (+${simulatedYears.toFixed(1)}y)`),
                React.createElement('span', { className: 'text-base font-black text-amber-300' }, `${currentHeight.toFixed(2)}m`)
              ),
              React.createElement('div', null,
                React.createElement('span', { className: 'text-[7px] font-arcade text-cyan-300 block' }, 'MAX CANOPY'),
                React.createElement('span', { className: 'text-sm font-bold text-cyan-200' }, `${plant.maxHeightMeters || 4}m`)
              )

            /* Companion Plants Synergies */
            plant.companionPlants && plant.companionPlants.length > 0 && React.createElement('div', { className: 'p-2.5 rounded-xl bg-black/60 border border-slate-800 space-y-1' },
              React.createElement('span', { className: 'font-arcade text-[6.5px] text-emerald-400 block' }, '🐝 SYNERGISTIC COMPANIONS:'),
              React.createElement('div', { className: 'flex flex-wrap gap-1' },
                plant.companionPlants.map((comp, idx) => React.createElement('span', {
                  key: idx,
                  className: 'px-1.5 py-0.5 rounded bg-emerald-950/80 text-emerald-300 border border-emerald-500/40 text-[8px] font-mono'
                }, `+ ${comp}`))
              )
            ),

            hasHornetRisk && React.createElement('div', { className: 'p-2.5 rounded-lg bg-rose-950/70 border border-rose-500/80 text-[8.5px] font-mono text-rose-200 space-y-1' },
              React.createElement('div', { className: 'flex items-center gap-1.5 text-rose-300 font-bold font-arcade text-[7px]' },
                React.createElement('span', null, '⚠️'),
                React.createElement('span', null, 'STINGING INSECT ADVISORY (ACTIVE)')
              ),
              React.createElement('p', null,
                'Overripe sugar exuded in late summer and autumn creates significant attraction for European & Asian hornets. Inspect fruits and windfalls prior to hand harvesting.'
              )
            ),

            React.createElement('div', { className: 'bg-emerald-950/30 border border-emerald-500/40 rounded-xl p-3 text-xs font-mono text-emerald-100' },
              React.createElement('span', { className: 'font-arcade text-[6.5px] text-emerald-400 block mb-1' }, 'BOTANICAL LOG ENTRY:'),
              React.createElement('p', null, plant.notes || 'Thriving specimen in the food forest network.')
            ),

            React.createElement('div', { className: 'flex justify-between items-center pt-2' },
              plant.isSupportSpecies ? React.createElement('button', {
                onClick: () => { onChopAndDrop(plant.id); onClose(); },
                className: 'px-3 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-600 font-arcade text-[7px] text-white active:scale-95'
              }, '✂️ CHOP AND DROP') : React.createElement('div', null),
              React.createElement('button', {
                onClick: onClose,

      }

      // ======================================================================
      // 14c. SECTOR CALIBRATION MODAL & AI AUDIT MODAL (STAGE 3)
      // ======================================================================
      function SectorCalibrationModal({ isOpen, config, onClose, onSave }) {
        if (!isOpen) return null;
        const [winterWind, setWinterWind] = useState(config.winterWindSector || 'NW');
        const [summerWind, setSummerWind] = useState(config.summerWindSector || 'SW');
        const [slopeDir, setSlopeDir] = useState(config.slopeDirection || 'S');
        const [frostSector, setFrostSector] = useState(config.frostHazardSector || 'N');

        const handleSubmit = (e) => {
          e.preventDefault();
          onSave({
            winterWindSector: winterWind,
            summerWindSector: summerWind,
            slopeDirection: slopeDir,
            frostHazardSector: frostSector
          });
          onClose();
        };

        return React.createElement('div', { className: 'fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto' },
          React.createElement('div', { className: 'relative w-full max-w-md bg-slate-950 border-2 border-amber-500/70 rounded-2xl p-5 shadow-2xl text-left space-y-3.5 my-auto' },
            React.createElement('div', { className: 'flex items-center justify-between border-b border-slate-800 pb-2' },
              React.createElement('div', null,
                React.createElement('h3', { className: 'font-sci-fi font-black text-sm text-amber-300' }, '⚙️ PERMACULTURE SECTOR CALIBRATION'),
                React.createElement('p', { className: 'font-mono text-[9px] text-slate-400' }, 'Calibrate your site\'s external wild energy corridors')
              ),
              React.createElement('button', { onClick: onClose, className: 'text-slate-400 hover:text-white font-mono text-base' }, '✕')
            ),

            React.createElement('form', { onSubmit: handleSubmit, className: 'space-y-3 text-xs font-mono' },
              React.createElement('div', null,
                React.createElement('label', { className: 'font-arcade text-[6.5px] text-cyan-300 block mb-1' }, 'PREVAILING WINTER STORM GALE SECTOR:'),
                React.createElement('select', {
                  value: winterWind,
                  onChange: e => setWinterWind(e.target.value),
                  className: 'w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white font-bold'
                },
                  ['NW', 'N', 'NE', 'W'].map(s => React.createElement('option', { key: s, value: s }, `${s} (e.g. Cold Arctic/Atlantic Storms)`))
                )
              ),

              React.createElement('div', null,
                React.createElement('label', { className: 'font-arcade text-[6.5px] text-amber-400 block mb-1' }, 'SUMMER DRY WIND / FIRE HAZARD SECTOR:'),
                React.createElement('select', {
                  value: summerWind,
                  onChange: e => setSummerWind(e.target.value),
                  className: 'w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white font-bold'
                },
                  ['SW', 'S', 'SE', 'W'].map(s => React.createElement('option', { key: s, value: s }, `${s} (e.g. Afternoon Heat & Desiccating Winds)`))
                )
              ),

              React.createElement('div', null,
                React.createElement('label', { className: 'font-arcade text-[6.5px] text-teal-300 block mb-1' }, 'TOPOGRAPHY & RUNOFF SLOPE ASPECT:'),
                React.createElement('select', {
                  value: slopeDir,
                  onChange: e => setSlopeDir(e.target.value),
                  className: 'w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white font-bold'
                },
                  ['S', 'SE', 'SW', 'E', 'W', 'N'].map(s => React.createElement('option', { key: s, value: s }, `Sloping downward towards ${s} (Hydrological Flow)`))
                )
              ),

              React.createElement('div', null,
                React.createElement('label', { className: 'font-arcade text-[6.5px] text-rose-300 block mb-1' }, 'COLD AIR DRAINAGE / FROST POCKET SECTOR:'),
                React.createElement('select', {
                  value: frostSector,
                  onChange: e => setFrostSector(e.target.value),
                  className: 'w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-white font-bold'
                },
                  ['N', 'NE', 'NW', 'E'].map(s => React.createElement('option', { key: s, value: s }, `${s} (Low-lying cold pooling basin)`))
                )
              ),

              React.createElement('div', { className: 'flex justify-between items-center pt-2' },
                React.createElement('button', {
                  type: 'button',
                  onClick: () => {
                    setWinterWind(DEFAULT_SECTOR_CONFIG.winterWindSector);
                    setSummerWind(DEFAULT_SECTOR_CONFIG.summerWindSector);
                    setSlopeDir(DEFAULT_SECTOR_CONFIG.slopeDirection);
                    setFrostSector(DEFAULT_SECTOR_CONFIG.frostHazardSector);
                  },
                  className: 'px-2 py-1 rounded bg-slate-900 text-slate-400 font-arcade text-[6.5px]'
                }, 'RESET DEFAULTS'),
                React.createElement('div', { className: 'flex gap-2' },
                  React.createElement('button', { type: 'button', onClick: onClose, className: 'px-3 py-1.5 rounded bg-slate-900 border border-slate-700 font-arcade text-[6.5px] text-slate-300' }, 'CANCEL'),
                  React.createElement('button', { type: 'submit', className: 'px-4 py-1.5 rounded bg-amber-600 hover:bg-amber-500 font-arcade text-[7px] text-white shadow font-bold' }, 'SAVE CALIBRATION')
                )
              )
            )
          )
        );
      }

      function SectorAuditModal({ isOpen, gardenMeta, plants, simulatedYears, sectorConfig, apiKey, onClose, onAskGemini }) {
        if (!isOpen) return null;
        const telemetry = calculateSectorDefenseTelemetry(plants, simulatedYears, sectorConfig);
        const [copied, setCopied] = useState(false);

        const auditSummaryText = `=== PERMACULTURE SECTOR & MICROCLIMATE AUDIT ===
Site: ${gardenMeta.name} (${gardenMeta.location})
Simulated Horizon: Year ${gardenMeta.baselineYear + Math.floor(simulatedYears)} (+${simulatedYears.toFixed(1)}y)

1. SITE RESILIENCE SCORE: ${telemetry.resilienceScore} / 100
2. WINDBREAK EFFICIENCY (${sectorConfig.winterWindSector} Gales): ${telemetry.windbreakEfficiency}% Attenuation (${telemetry.northSentinelsCount} Sentinels)
3. SOLAR CAPTURE INDEX: ${telemetry.solarCaptureIndex}% of fruiting crops in prime SE-S-SW solar arc
4. HYDROLOGY INFILTRATION: ${telemetry.waterCatchmentRating}% capture towards ${sectorConfig.slopeDirection} (${telemetry.waterInterceptorsCount} Swale/Pond Interceptors)
5. THERMAL RESERVOIRS: ${telemetry.heatSinkCount} stone/courtyard heat sinks
6. FROST HAZARD (${sectorConfig.frostHazardSector} Sector): ${telemetry.vulnerableCrops.length} tender crops situated in cold drainage corridor:
${telemetry.vulnerableCrops.map(p => `   - ${p.name} (Zone ${p.zone} ${p.line ? `Bed ${p.line}` : ''})`).join('\n') || '   - None identified'}

KEY RECOMMENDATIONS:
- ${telemetry.windbreakEfficiency < 70 ? `Reinforce ${sectorConfig.winterWindSector} windbreak with evergreen conifer sentinels (Atlas Cedar, Sequoia).` : `Windbreak buffer along ${sectorConfig.winterWindSector} is sturdy and well-established.`}
- ${telemetry.vulnerableCrops.length > 0 ? `Relocate or add thermal stone heat sinks / living mulch around tender crops in ${sectorConfig.frostHazardSector}.` : `Thermal zoning protects tender fruit crops.`}
- Maintain swale contours along the ${sectorConfig.slopeDirection} runoff axis to retain maximum rainfall.`;

        const copyAudit = () => {
          soundEngine.playTone(600, 0.04, 'triangle');
          try {
            const ta = document.createElement('textarea');
            ta.value = auditSummaryText;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          } catch(e) {}
        };

        return React.createElement('div', { className: 'fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 overflow-y-auto' },
          React.createElement('div', { className: 'relative w-full max-w-2xl bg-slate-950 border-2 border-purple-500/80 rounded-2xl p-4 sm:p-6 shadow-2xl text-left space-y-3.5 my-auto max-h-[92vh] overflow-y-auto' },
            React.createElement('div', { className: 'flex items-center justify-between border-b border-purple-500/30 pb-2' },
              React.createElement('div', { className: 'flex items-center gap-2' },
                React.createElement('span', { className: 'text-2xl drop-shadow-[0_0_10px_#a855f7]' }, '🧭'),
                React.createElement('div', null,
                  React.createElement('h3', { className: 'font-sci-fi font-black text-sm text-purple-300' }, 'PERMACULTURE SECTOR & ENERGY AUDIT'),
                  React.createElement('p', { className: 'font-mono text-[9px] text-slate-400' }, `${gardenMeta.name} • Ecological Defense & Wild Energy Analysis`)
                )
              ),
              React.createElement('button', { onClick: onClose, className: 'text-slate-400 hover:text-white font-mono text-base' }, '✕')
            ),

            React.createElement('div', { className: 'grid grid-cols-2 sm:grid-cols-4 gap-2 font-mono text-center text-[9px]' },
              React.createElement('div', { className: 'p-2 rounded bg-black/70 border border-purple-500/30' },
                React.createElement('span', { className: 'font-arcade text-[6px] text-purple-300 block' }, 'RESILIENCE'),
                React.createElement('span', { className: 'text-sm font-bold text-white' }, `${telemetry.resilienceScore} / 100`)
              ),
              React.createElement('div', { className: 'p-2 rounded bg-black/70 border border-cyan-500/30' },
                React.createElement('span', { className: 'font-arcade text-[6px] text-cyan-300 block' }, 'WINDBREAK'),
                React.createElement('span', { className: `text-sm font-bold ${telemetry.windbreakEfficiency >= 60 ? 'text-emerald-400' : 'text-amber-400'}` }, `${telemetry.windbreakEfficiency}%`)
              ),
              React.createElement('div', { className: 'p-2 rounded bg-black/70 border border-amber-500/30' },
                React.createElement('span', { className: 'font-arcade text-[6px] text-amber-300 block' }, 'SOLAR CAPTURE'),
                React.createElement('span', { className: 'text-sm font-bold text-amber-300' }, `${telemetry.solarCaptureIndex}%`)
              ),
              React.createElement('div', { className: 'p-2 rounded bg-black/70 border border-teal-500/30' },
                React.createElement('span', { className: 'font-arcade text-[6px] text-teal-300 block' }, 'INFILTRATION'),
                React.createElement('span', { className: 'text-sm font-bold text-teal-300' }, `${telemetry.waterCatchmentRating}%`)
              )
            ),

            React.createElement('div', { className: 'space-y-2 max-h-[300px] overflow-y-auto pr-1 font-mono text-xs' },
              React.createElement('div', { className: 'p-3 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1.5' },
                React.createElement('h4', { className: 'font-arcade text-[7px] text-cyan-300 font-bold' }, `💨 1. WINDBREAK SHIELDING (${sectorConfig.winterWindSector} GALE DEFENSE)`),
                React.createElement('p', { className: 'text-[9.5px] text-slate-300 leading-relaxed' },
                  telemetry.isNorthProtected 
                    ? `Excellent perimeter buffer! ${telemetry.northSentinelsCount} climax sentinels (Giant Sequoias, Atlas Cedars, Poplars) achieve ${telemetry.windbreakEfficiency}% windspeed attenuation, sheltering Zone 1 homestead and central food forest alleys.`
                    : `⚠️ Moderate exposure detected along Sector ${sectorConfig.winterWindSector}. Sentinel canopy is still establishing (+${simulatedYears.toFixed(1)}y). Consider planting additional fast-growing pioneer biomass whips (White Willow, Black Poplar) to accelerate wind deflection.`
                )
              ),

              React.createElement('div', { className: 'p-3 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1.5' },
                React.createElement('h4', { className: 'font-arcade text-[7px] text-amber-300 font-bold' }, '☀️ 2. SOLAR RADIATION UTILIZATION'),
                React.createElement('p', { className: 'text-[9.5px] text-slate-300 leading-relaxed' },
                  `High solar efficiency (${telemetry.solarCaptureIndex}%): fruiting trees and annual kitchen garden beds are correctly arranged along South, South-East, and South-West alignments, maximizing photosynthetic gain without shading lower understory berry guilds.`
                )
              ),

              React.createElement('div', { className: `p-3 rounded-xl border space-y-1.5 ${telemetry.vulnerableCrops.length > 0 ? 'bg-rose-950/40 border-rose-500/50' : 'bg-slate-900/80 border-slate-800'}` },
                React.createElement('h4', { className: `font-arcade text-[7px] font-bold ${telemetry.vulnerableCrops.length > 0 ? 'text-rose-300' : 'text-emerald-400'}` },
                  `❄️ 3. FROST POCKET & COLD DRAINAGE (SECTOR ${sectorConfig.frostHazardSector})`
                ),
                telemetry.vulnerableCrops.length > 0 ? React.createElement('div', { className: 'space-y-1' },
                  React.createElement('p', { className: 'text-[9.5px] text-rose-200' },
                    `Warning: Found ${telemetry.vulnerableCrops.length} tender crop(s) planted in Sector ${sectorConfig.frostHazardSector} which is designated as a cold drainage / frost settlement pocket:`
                  ),
                  telemetry.vulnerableCrops.map(p => React.createElement('div', { key: p.id, className: 'text-[9px] text-amber-300 font-bold pl-2' },
                    `• ${p.name} (Zone ${p.zone}${p.line ? ` Bed ${p.line}` : ''})`
                  )),
                  React.createElement('p', { className: 'text-[8.5px] text-slate-400 pt-1' },
                    'Action: Move tender crops to South terrace heat sink or install thermal stone mass to buffer frost.'
                  )
                ) : React.createElement('p', { className: 'text-[9.5px] text-emerald-300' },
                  `No tender crops detected in the cold air drainage basin (Sector ${sectorConfig.frostHazardSector}). Planting allocations align with thermal microclimates.`
                )
              )
            ),

            React.createElement('div', { className: 'flex justify-between items-center border-t border-slate-800 pt-2.5 flex-wrap gap-2' },
              React.createElement('button', {
                onClick: copyAudit,
                className: 'px-3 py-1.5 rounded bg-slate-900 border border-slate-700 hover:border-cyan-400 text-cyan-300 font-arcade text-[6.5px] active:scale-95 flex items-center gap-1'
              }, copied ? '✓ COPIED!' : '📋 COPY AUDIT REPORT'),

              React.createElement('div', { className: 'flex items-center gap-2' },
                apiKey && React.createElement('button', {
                  onClick: () => onAskGemini && onAskGemini(auditSummaryText),
                  className: 'px-3.5 py-1.5 rounded bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-arcade text-[7px] border border-purple-400 shadow active:scale-95'
                }, '🤖 ASK GEMINI ABOUT SECTORS'),

                React.createElement('button', {
                  onClick: onClose,
                  className: 'px-4 py-1.5 rounded bg-slate-900 border border-slate-700 font-arcade text-[7px] text-slate-300'
                }, 'CLOSE')
              )
            )
          )
        );
      }

      // Render Application to DOM
      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FoodForestDashboard));
    </script>
  </body>
</html>
