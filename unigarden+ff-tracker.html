      }

      function drawPersimmonCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cy = py + crownRadius * 0.55;

        ctx.strokeStyle = '#57534e';
        ctx.lineWidth = 3.0;
        ctx.beginPath();
        ctx.moveTo(px, cy + crownRadius * 0.45);
        ctx.lineTo(px, cy);
        ctx.lineTo(px - crownRadius * 0.55 + sway * 0.3, cy - crownRadius * 0.25);
        ctx.moveTo(px, cy);
        ctx.lineTo(px + crownRadius * 0.55 + sway * 0.3, cy - crownRadius * 0.25);
        ctx.stroke();

        if (seasonPhase === 'spring_blossom' || seasonPhase === 'summer') {
          drawSculptedFoliageBillow(ctx, px, cy, crownRadius * 0.8, crownRadius * 0.65, plant.foliageColor || '#15803d', '#86efac', '#052e16', 31.2, sway);
        }

        if (seasonPhase === 'autumn_foliar' || seasonPhase === 'winter') {
          [-crownRadius * 0.48, -crownRadius * 0.2, crownRadius * 0.22, crownRadius * 0.48].forEach(fxOffset => {
            const fx = px + fxOffset + sway * 0.4;
            const fy = cy + (Math.abs(fxOffset) > crownRadius * 0.3 ? 8 : -crownRadius * 0.1);

            ctx.fillStyle = '#292524';
            ctx.fillRect(fx - 3, fy - 6, 6, 2.5);

            const fGrad = ctx.createRadialGradient(fx - 1.5, fy - 1.5, 1, fx, fy, 5.5);
            fGrad.addColorStop(0, '#fef08a');
            fGrad.addColorStop(0.5, '#ea580c');
            fGrad.addColorStop(1, '#9a3412');
            ctx.fillStyle = fGrad;
            ctx.beginPath();
            ctx.arc(fx, fy, 5.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#7c2d12';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          });
        }
        ctx.restore();
      }

      function drawWeepingWillowCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const crownH = height * 0.85;
        const crownW = crownRadius * 1.25;

        ctx.strokeStyle = '#71717a';
        ctx.lineWidth = 3.2;
        [-crownW * 0.45, crownW * 0.45].forEach(bx => {
          ctx.beginPath();
          ctx.moveTo(px, py + crownH * 0.6);
          ctx.quadraticCurveTo(px + bx * 0.5, py + crownH * 0.1, px + bx + sway * 0.4, py + crownH * 0.3);
          ctx.stroke();
        });

        const whips = 14;
        for (let w = 0; w < whips; w++) {
          const ratio = (w / (whips - 1)) * 2 - 1;
          const startX = px + ratio * (crownW * 0.55) + sway * 0.5;
          const startY = py + crownH * 0.25 + Math.abs(ratio) * 10;
          const endX = startX + Math.sin(animTime * 2.5 + w * 0.6) * 6;
          const endY = py + crownH * 0.88 + (w % 3) * 6;

          ctx.strokeStyle = seasonPhase === 'winter' ? '#ca8a04' : (w % 2 === 0 ? '#4ade80' : '#22c55e');
          ctx.lineWidth = seasonPhase === 'winter' ? 1.2 : 1.8;
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.quadraticCurveTo((startX + endX) / 2 + sway, (startY + endY) / 2, endX, endY);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawParasolMulberryCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        // Generous spread for mature courtyard shade tree
        const tableW = Math.max(48, crownRadius * 1.45);
        const domeH = Math.max(34, crownRadius * 0.75);
        const scaffoldY = py + height * 0.42;
        const crownCenterY = scaffoldY - domeH * 0.35;

        // 1. Muscular Pollard Knuckles ("Têtes de chat") & Horizontal Cantilevered Boughs
        ctx.strokeStyle = '#3b1803';
        ctx.lineWidth = 4.2;
        ctx.beginPath();
        ctx.moveTo(px, py + height * 0.72);
        ctx.lineTo(px, scaffoldY);
        ctx.stroke();

        // Pollard knuckle crown at the central branch junction
        ctx.fillStyle = '#29180c';
        ctx.beginPath();
        ctx.arc(px, scaffoldY, 5.5, 0, Math.PI * 2);
        ctx.fill();

        // 5 Cantilevered radiating framework boughs arching slightly, then holding horizontal
        const armOffsets = [-tableW * 0.82, -tableW * 0.42, 0, tableW * 0.42, tableW * 0.82];
        ctx.lineWidth = 2.8;
        armOffsets.forEach(bx => {
          ctx.beginPath();
          ctx.moveTo(px, scaffoldY);
          const midX = px + bx * 0.5;
          const midY = scaffoldY - 6;
          const endX = px + bx + sway * 0.3;
          const endY = scaffoldY + (Math.abs(bx) > tableW * 0.5 ? 4 : -2);
          ctx.quadraticCurveTo(midX, midY, endX, endY);
          ctx.stroke();

          // Knuckle nodules at branch elbows
          ctx.fillStyle = '#451a03';
          ctx.fillRect(endX - 2.5, endY - 2.5, 5, 5);
        });

        // 2. Winter Skeleton Mode: Reveal sculptural bare pollarded umbrella framework
        if (seasonPhase === 'winter') {
          armOffsets.forEach(bx => {
            const endX = px + bx + sway * 0.3;
            const endY = scaffoldY + 2;
            for (let rod = -1; rod <= 1; rod++) {
              ctx.strokeStyle = '#57534e';
              ctx.lineWidth = 1.4;
              ctx.beginPath();
              ctx.moveTo(endX, endY);
              ctx.lineTo(endX + rod * 8, endY - 12 - Math.abs(rod) * 3);
              ctx.stroke();
            }
          });
          ctx.restore();
          return;
        }

        // 3. Volumetric 3D Multi-Tiered Parasol Foliage
        let highlightCol, baseCol, shadowCol;
        if (seasonPhase === 'autumn_foliar') {
          highlightCol = '#fef08a'; baseCol = '#f59e0b'; shadowCol = '#78350f';
        } else if (seasonPhase === 'spring_blossom') {
          highlightCol = '#bef264'; baseCol = '#4ade80'; shadowCol = '#14532d';
        } else {
          highlightCol = '#86efac'; baseCol = plant.foliageColor || '#15803d'; shadowCol = '#052e16';
        }

        // Deep under-canopy ambient shadow layer creating palpable under-terrace shade
        ctx.fillStyle = shadowCol;
        ctx.beginPath();
        ctx.ellipse(px + sway * 0.3, scaffoldY + 4, tableW * 0.88, domeH * 0.36, 0, 0, Math.PI * 2);
        ctx.fill();

        // Lower lateral stepped billows (giving breadth and depth to the parasol wings)
        drawSculptedFoliageBillow(ctx, px - tableW * 0.52, scaffoldY, tableW * 0.44, domeH * 0.48, baseCol, highlightCol, shadowCol, 14.2, sway * 0.25);
        drawSculptedFoliageBillow(ctx, px + tableW * 0.52, scaffoldY, tableW * 0.44, domeH * 0.48, baseCol, highlightCol, shadowCol, 15.6, sway * 0.25);

        // Mid-tier inner billows filling the canopy volume
        drawSculptedFoliageBillow(ctx, px - tableW * 0.24, crownCenterY + 4, tableW * 0.46, domeH * 0.54, baseCol, highlightCol, shadowCol, 16.8, sway * 0.35);
        drawSculptedFoliageBillow(ctx, px + tableW * 0.24, crownCenterY + 4, tableW * 0.46, domeH * 0.54, baseCol, highlightCol, shadowCol, 17.5, sway * 0.35);

        // Top crowning sunlit dome plate (smooth flat-topped table pavilion)
        drawSculptedFoliageBillow(ctx, px, crownCenterY - domeH * 0.22, tableW * 0.65, domeH * 0.45, baseCol, highlightCol, shadowCol, 18.9, sway * 0.45);

        // 4. Large Plane-Tree Style Leaf Silhouette Tufts Breaking the Outer Perimeter
        ctx.fillStyle = highlightCol;
        [-tableW * 0.78, -tableW * 0.38, 0, tableW * 0.38, tableW * 0.78].forEach((lx, idx) => {
          const ly = scaffoldY - (idx === 2 ? domeH * 0.55 : 2);
          ctx.beginPath();
          ctx.ellipse(px + lx + sway * 0.3, ly, 7, 4.5, (idx - 2) * 0.15, 0, Math.PI * 2);
          ctx.fill();
        });

        // 5. Hanging Clusters of Plump Summer Mulberries (Syncarps)
        if (seasonPhase === 'summer' || seasonPhase === 'autumn_foliar') {
          const berryLocations = [
            { dx: -tableW * 0.62, dy: 10 },
            { dx: -tableW * 0.32, dy: 14 },
            { dx: -tableW * 0.08, dy: 12 },
            { dx: tableW * 0.22, dy: 15 },
            { dx: tableW * 0.54, dy: 9 }
          ];

          berryLocations.forEach(loc => {
            const bx = px + loc.dx + sway * 0.3;
            const by = scaffoldY + loc.dy;

            // Slender curved green fruit stem
            ctx.strokeStyle = '#65a30d';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(bx, by - 6);
            ctx.lineTo(bx, by);
            ctx.stroke();

            // Cylindrical aggregate mulberry syncarp
            const fruitGrad = ctx.createLinearGradient(bx - 2, by, bx + 2, by + 9);
            fruitGrad.addColorStop(0, '#581c87');
            fruitGrad.addColorStop(0.5, '#3b0764');
            fruitGrad.addColorStop(1, '#1e1b4b');

            ctx.fillStyle = fruitGrad;
            ctx.beginPath();
            ctx.ellipse(bx, by + 4.5, 3.2, 5.2, 0.05, 0, Math.PI * 2);
            ctx.fill();

            // Drupelet bead texture specks
            ctx.fillStyle = '#a855f7';
            ctx.fillRect(bx - 1.2, by + 2, 1.4, 1.4);
            ctx.fillRect(bx + 0.6, by + 5, 1.4, 1.4);
          });
        }
        ctx.restore();
      }

      function drawPalmCrown(ctx, px, py, crownRadius, plant, sway, animTime, bioActive) {
        ctx.save();
        const frondCount = 9;
        const palmRadius = Math.max(26, crownRadius * 1.3);
        const headY = py + crownRadius * 0.45;

        // Draw arching broad paddle fronds with realistic central midribs and wind-split lobes
        for (let f = 0; f < frondCount; f++) {
          const angle = (f / (frondCount - 1)) * (Math.PI * 1.15) - (Math.PI * 1.075);
          const frondLen = palmRadius * (1.15 + (f % 2) * 0.25);
          const wave = Math.sin(animTime * 2.4 + f * 0.65) * 5;
          const endX = px + Math.cos(angle) * frondLen + sway + wave;
          const endY = headY + Math.sin(angle) * frondLen * 0.85;
          const midX = (px + endX) / 2 + wave * 0.4;
          const midY = headY - 18 - (f % 3) * 3;

          // Broad banana paddle leaf surface with radial lighting
          const leafGrad = ctx.createLinearGradient(px, headY, endX, endY);
          leafGrad.addColorStop(0, '#15803d');
          leafGrad.addColorStop(0.4, f % 2 === 0 ? '#22c55e' : '#16a34a');
          leafGrad.addColorStop(0.85, '#4ade80');
          leafGrad.addColorStop(1, '#86efac');

          ctx.fillStyle = leafGrad;
          ctx.beginPath();
          ctx.moveTo(px, headY);
          ctx.quadraticCurveTo(midX - 10, midY - 6, endX, endY);
          ctx.quadraticCurveTo(midX + 10, midY + 12, px, headY);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#052e16';
          ctx.lineWidth = 0.8;
          ctx.stroke();

          // Prominent thick chartreuse central midrib
          ctx.strokeStyle = '#d9f99d';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(px, headY);
          ctx.quadraticCurveTo(midX, midY, endX, endY);
          ctx.stroke();

          // Lateral leaf tears / natural shredded wind slits
          ctx.strokeStyle = '#14532d';
          ctx.lineWidth = 0.9;
          [-0.3, 0, 0.3].forEach(off => {
            const qx = (px + endX) / 2 + off * 14;
            const qy = (headY + endY) / 2;
            ctx.beginPath();
            ctx.moveTo(qx, qy);
            ctx.lineTo(qx + 5, qy + 6);
            ctx.stroke();
          });
        }

        // Emerging juvenile vertical spear leaf rising straight from the pseudostem heart
        const spearH = palmRadius * 0.95;
        ctx.strokeStyle = '#bef264';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(px, headY);
        ctx.lineTo(px + sway * 0.4, headY - spearH);
        ctx.stroke();

        // Hanging chartreuse banana bunch and deep maroon-purple flower bract
        const bx = px + 12 + sway * 0.5;
        const by = headY + 16;
        ctx.strokeStyle = '#65a30d';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(px, headY);
        ctx.quadraticCurveTo(px + 10, headY + 8, bx, by);
        ctx.stroke();

        // Finger bananas
        ctx.fillStyle = '#84cc16';
        [-4, 0, 4].forEach(dx => {
          ctx.beginPath();
          ctx.ellipse(bx + dx, by + 4, 2.5, 5, 0.2, 0, Math.PI * 2);
          ctx.fill();
        });

        // Maroon terminal pendant flower bell
        ctx.fillStyle = '#881337';
        ctx.beginPath();
        ctx.moveTo(bx - 3, by + 10);
        ctx.lineTo(bx + 3, by + 10);
        ctx.lineTo(bx, by + 18);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawPioneerSpire(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cy = py + crownRadius * 0.5;
        const isCoppiced = plant.status === 'coppiced';

        if (isCoppiced) {
          drawCoppiceStool(ctx, px, py + treePixelHeight, plant, crownRadius, sway, animTime, bioActive, seasonPhase);
          ctx.restore();
          return;
        }

        if (seasonPhase === 'winter') {
          ctx.strokeStyle = '#52525b';
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.moveTo(px, py + treePixelHeight * 0.7);
          ctx.lineTo(px, cy);
          ctx.lineTo(px - crownRadius * 0.45 + sway * 0.3, cy - crownRadius * 0.3);
          ctx.moveTo(px, cy);
          ctx.lineTo(px + crownRadius * 0.45 + sway * 0.3, cy - crownRadius * 0.3);
          ctx.stroke();
          ctx.restore();
          return;
        }

        let highlightCol, baseCol, shadowCol;
        if (seasonPhase === 'autumn_foliar') {
          highlightCol = '#fef08a'; baseCol = '#eab308'; shadowCol = '#78350f';
        } else {
          highlightCol = '#86efac'; baseCol = plant.foliageColor || '#22c55e'; shadowCol = '#064e3b';
        }

        // Multi-tiered massive cordate (heart-shaped) foliage billows (Paulownia & Black Locust)
        drawSculptedFoliageBillow(ctx, px - crownRadius * 0.36, cy + 4, crownRadius * 0.54, crownRadius * 0.46, baseCol, highlightCol, shadowCol, 12.4, sway * 0.3);
        drawSculptedFoliageBillow(ctx, px + crownRadius * 0.36, cy + 4, crownRadius * 0.54, crownRadius * 0.46, baseCol, highlightCol, shadowCol, 13.8, sway * 0.3);
        drawSculptedFoliageBillow(ctx, px, cy - crownRadius * 0.28, crownRadius * 0.62, crownRadius * 0.52, baseCol, highlightCol, shadowCol, 15.2, sway * 0.45);

        // Huge elephant-ear cordate leaf accents breaking the outline
        ctx.fillStyle = highlightCol;
        [-crownRadius * 0.42, 0, crownRadius * 0.42].forEach((lx, idx) => {
          const ly = cy + (idx === 1 ? -crownRadius * 0.38 : 10);
          ctx.beginPath();
          ctx.ellipse(px + lx + sway * 0.35, ly, 8.5, 6.5, (idx - 1) * 0.25, 0, Math.PI * 2);
          ctx.fill();
        });

        // Upright violet bell panicles in Spring (Paulownia signature foxglove-like blooms)
        if (plant.bloomColor || seasonPhase === 'spring_blossom') {
          const panicleColor = plant.bloomColor || '#c084fc';
          [-crownRadius * 0.22, crownRadius * 0.22, 0].forEach((fx, idx) => {
            const fy = cy - crownRadius * 0.45 - (idx === 2 ? 8 : 0);
            ctx.fillStyle = panicleColor;
            ctx.beginPath();
            ctx.ellipse(px + fx + sway * 0.4, fy, 4.5, 8.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fdf4ff';
            ctx.fillRect(px + fx + sway * 0.4 - 1.2, fy - 3, 2.4, 3);
          });
        }
        ctx.restore();
      }

      function drawArborVineTrellis(ctx, px, baseY, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const postH = Math.min(100, Math.max(70, height * 0.9));
        const postTopY = baseY - postH;
        const tbarW = 60;

        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 4.0;
        ctx.beginPath();
        ctx.moveTo(px, baseY);
        ctx.lineTo(px, postTopY);
        ctx.moveTo(px - tbarW / 2, postTopY);
        ctx.lineTo(px + tbarW / 2, postTopY);
        ctx.stroke();

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1;
        [-tbarW * 0.45, tbarW * 0.45].forEach(wx => {
          ctx.beginPath();
          ctx.moveTo(px + wx, postTopY);
          ctx.lineTo(px + wx, baseY);
          ctx.stroke();
        });

        if (seasonPhase === 'winter') {
          ctx.strokeStyle = '#451a03';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.lineTo(px - 6, postTopY + 14);
          ctx.lineTo(px + tbarW * 0.35, postTopY);
          ctx.stroke();
          ctx.restore();
          return;
        }

        drawSculptedFoliageBillow(ctx, px, postTopY, tbarW * 0.65, 18, plant.foliageColor || '#15803d', '#86efac', '#052e16', 32.5, sway * 0.3);

        if (seasonPhase === 'summer' || seasonPhase === 'autumn_foliar') {
          [-14, 14].forEach(gx => {
            const gy = postTopY + 18;
            ctx.fillStyle = plant.fruitColor || '#84cc16';
            [{ dx: 0, dy: 0 }, { dx: -3, dy: 4 }, { dx: 3, dy: 4 }, { dx: 0, dy: 7 }].forEach(d => {
              ctx.beginPath();
              ctx.arc(px + gx + d.dx + sway * 0.3, gy + d.dy, 2.5, 0, Math.PI * 2);
              ctx.fill();
            });
          });
        }
        ctx.restore();
      }

      function drawCoppiceStool(ctx, px, baseY, plant, crownRadius, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const stoolW = Math.max(16, (crownRadius || 20) * 0.6);
        const stoolH = 9;
        const topY = baseY - stoolH;

        ctx.fillStyle = '#57534e';
        ctx.fillRect(px - stoolW / 2, topY, stoolW, stoolH);
        ctx.strokeStyle = '#292524';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(px - stoolW / 2, topY, stoolW, stoolH);

        ctx.fillStyle = '#a8a29e';
        ctx.beginPath();
        ctx.ellipse(px, topY, stoolW / 2, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#78716c';
        ctx.stroke();

        ctx.fillStyle = '#65a30d';
        ctx.fillRect(px - stoolW * 0.4, topY + 2, 4, 3);
        ctx.fillRect(px + stoolW * 0.2, topY + 4, 5, 2.5);

        const whipCount = 7;
        for (let w = 0; w < whipCount; w++) {
          const ratio = (w / (whipCount - 1)) * 2 - 1;
          const startX = px + ratio * (stoolW * 0.42);
          const whipH = 18 + (w % 3) * 6;
          const endX = startX + ratio * 8 + sway * 0.8;
          const endY = topY - whipH;

          ctx.strokeStyle = w % 2 === 0 ? '#22c55e' : '#4ade80';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(startX, topY);
          ctx.quadraticCurveTo(startX + ratio * 3, topY - whipH * 0.5, endX, endY);
          ctx.stroke();

          ctx.fillStyle = '#bef264';
          ctx.fillRect(endX - 1.5, endY - 2, 3, 3);
        }
        ctx.restore();
      }

      function drawComfreyGuild(ctx, px, baseY, crownRadius, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cRadius = Math.max(16, crownRadius * 0.9);

        const tapDepth = 48;
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(px, baseY);
        ctx.lineTo(px, baseY + tapDepth);
        ctx.stroke();

        ctx.lineWidth = 1.2;
        [-1, 1].forEach(side => {
          [12, 24, 36].forEach(ry => {
            ctx.beginPath();
            ctx.moveTo(px, baseY + ry);
            ctx.lineTo(px + side * 10, baseY + ry + 6);
            ctx.stroke();
          });
        });

        const pulseT = (animTime * 1.2) % 1;
        const pulseY = baseY + tapDepth * (1 - pulseT);
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(px, pulseY, 2.5, 0, Math.PI * 2);
        ctx.fill();

        const leaves = 8;
        for (let l = 0; l < leaves; l++) {
          const a = (l / leaves) * Math.PI + Math.PI;
          const len = cRadius * (0.8 + (l % 2) * 0.35);
          const lx = px + Math.cos(a) * len + sway * 0.3;
          const ly = baseY - 2 + Math.sin(a) * (len * 0.55);

          ctx.fillStyle = l % 2 === 0 ? '#15803d' : '#166534';
          ctx.beginPath();
          ctx.ellipse(lx, ly, len * 0.35, 6, a, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#052e16';
          ctx.lineWidth = 0.8;
          ctx.stroke();

          ctx.strokeStyle = 'rgba(187, 247, 208, 0.45)';
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.lineTo(lx, ly);
          ctx.stroke();
        }

        if (seasonPhase === 'spring_blossom' || seasonPhase === 'summer') {
          [-cRadius * 0.4, cRadius * 0.4].forEach(fx => {
            const fy = baseY - cRadius * 0.45;
            ctx.fillStyle = '#c084fc';
            ctx.beginPath();
            ctx.arc(px + fx + sway * 0.4, fy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fdf2f8';
            ctx.fillRect(px + fx + sway * 0.4 - 1.5, fy + 2, 3, 1.5);
          });
        }

        ctx.restore();
      }

      function drawAtlasCedarCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const tiers = 5;
        const tierHeight = (height * 0.76) / tiers;
        const trunkTopY = py + height * 0.12;

        // 1. Internal woody central leader & muscular horizontal scaffolding arms
        ctx.strokeStyle = '#27272a';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(px, py + height * 0.75);
        ctx.quadraticCurveTo(px + sway * 0.2, py + height * 0.4, px + sway * 0.4, trunkTopY);
        ctx.stroke();

        // Horizontal branching armature supporting each tabular plate
        ctx.lineWidth = 2.0;
        for (let i = 0; i < tiers; i++) {
          const tierY = py + height * 0.22 + (i * tierHeight * 0.92);
          const tRatio = (i + 1) / tiers;
          const wLeft = crownRadius * (0.45 + tRatio * 0.65 + Math.sin(i * 2.1) * 0.12);
          const wRight = crownRadius * (0.42 + tRatio * 0.68 + Math.cos(i * 1.8) * 0.12);
          const tipX = px + sway * (1 - i / tiers);

          ctx.strokeStyle = '#3f3f46';
          ctx.beginPath();
          ctx.moveTo(tipX, tierY);
          ctx.lineTo(tipX - wLeft * 0.82, tierY + 2);
          ctx.moveTo(tipX, tierY);
          ctx.lineTo(tipX + wRight * 0.85, tierY + 3);
          ctx.stroke();
        }

        // 2. Sweeping Tabular Needle Platforms with Top Sun Deck & Shadowed Underside
        for (let i = 0; i < tiers; i++) {
          const tierY = py + height * 0.22 + (i * tierHeight * 0.92);
          const tRatio = (i + 1) / tiers;
          const wLeft = crownRadius * (0.45 + tRatio * 0.65 + Math.sin(i * 2.1) * 0.12);
          const wRight = crownRadius * (0.42 + tRatio * 0.68 + Math.cos(i * 1.8) * 0.12);
          const tipX = px + sway * (1 - i / tiers);
          const shelfThick = 9 + i * 2.2;

          // A. Deep shaded underside plate with downward needle-spray teeth
          ctx.fillStyle = '#082f49';
          ctx.beginPath();
          ctx.moveTo(tipX - wLeft, tierY);
          ctx.quadraticCurveTo(tipX, tierY + shelfThick * 1.25, tipX + wRight, tierY);
          // Serrated underside teeth
          const teeth = 8 + i * 2;
          for (let step = teeth; step >= 0; step--) {
            const rx = tipX - wLeft + (step / teeth) * (wLeft + wRight);
            const drop = (step % 2 === 0 ? shelfThick * 0.75 : shelfThick * 1.15);
            ctx.lineTo(rx, tierY + drop);
          }
          ctx.closePath();
          ctx.fill();

          // B. Midtone glaucous blue-teal needle body
          const grad = ctx.createLinearGradient(tipX - wLeft, tierY - 4, tipX + wRight, tierY + shelfThick);
          grad.addColorStop(0, '#0c4a6e');
          grad.addColorStop(0.3, '#0284c7');
          grad.addColorStop(0.7, seasonPhase === 'spring_blossom' ? '#38bdf8' : '#0ea5e9');
          grad.addColorStop(1, '#075985');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(tipX, tierY, (wLeft + wRight) * 0.5, shelfThick * 0.65, sway * 0.015, 0, Math.PI * 2);
          ctx.fill();

          // C. Sunlit top deck with bristling needle tufts
          ctx.strokeStyle = seasonPhase === 'winter' ? '#bae6fd' : '#7dd3fc';
          ctx.lineWidth = 1.0;
          ctx.beginPath();
          const tuftCount = 10 + i * 3;
          for (let t = 0; t <= tuftCount; t++) {
            const tx = tipX - wLeft * 0.95 + (t / tuftCount) * (wLeft + wRight) * 0.95;
            const ty = tierY - Math.sin((t / tuftCount) * Math.PI) * (shelfThick * 0.45);
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx + (t % 2 === 0 ? 1 : -1), ty - 4.5);
          }
          ctx.stroke();

          // D. Upright barrel-shaped seed cones sitting on upper shelf surface
          if (i <= 2) {
            [-wLeft * 0.42, wRight * 0.36].forEach(cxOffset => {
              const coneX = tipX + cxOffset;
              const coneY = tierY - 8;
              // Barrel cone body
              ctx.fillStyle = '#0f766e';
              ctx.beginPath();
              ctx.ellipse(coneX, coneY, 3.2, 5.5, 0.05, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#134e4a';
              ctx.lineWidth = 0.8;
              ctx.stroke();

              // Resinous golden scale flecks
              ctx.fillStyle = '#facc15';
              ctx.fillRect(coneX - 1.5, coneY - 4, 3, 1.4);
              ctx.fillRect(coneX - 2, coneY, 4, 1.4);
              ctx.fillRect(coneX - 1, coneY + 3, 2, 1.2);
            });
          }
        }

        // 3. Flattened / Gently Nodding Tabular Crown Summit (characteristic of mature Cedars)
        const summitX = px + sway * 0.7;
        const summitY = py + height * 0.12;
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.ellipse(summitX, summitY, crownRadius * 0.38, 6.5, sway * 0.02, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.restore();
      }

      /**
       * Hazelnut Coppice Fountain (`drawHazelnutClump`)
       * Implements multi-stem fountain habit with wands arching outward from the groundline,
       * double-serrated cordate foliage, frilly ruffled nut involucres, and pendulous catkins.
       */
      function drawHazelnutClump(ctx, px, baseY, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const stems = 9;
        const clumpW = Math.max(26, crownRadius * 1.15);
        const clumpH = height * 0.85;

        // 1. Broad woody stool at groundline
        ctx.fillStyle = '#44403c';
        ctx.beginPath();
        ctx.ellipse(px, baseY, 14, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#1c1917';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 2. Multi-stem coppice wands arching outward in a fountain curve
        for (let s = 0; s < stems; s++) {
          const ratio = (s / (stems - 1)) * 2 - 1; // -1 (far left) to 1 (far right)
          const startX = px + ratio * 8;
          // Outer canes bow wide and dip at the tips; center canes reach higher
          const archPeakX = px + ratio * (clumpW * 0.65) + sway * (0.8 + Math.abs(ratio) * 0.4);
          const archPeakY = baseY - (clumpH * (1.05 - Math.abs(ratio) * 0.28));
          const tipX = px + ratio * (clumpW * 0.95) + sway * (1.1 + Math.abs(ratio) * 0.4);
          const tipY = archPeakY + 14 + Math.abs(ratio) * 16;

          // Sinuous tapering hazel wand
          ctx.strokeStyle = s % 2 === 0 ? '#57534e' : '#78716c';
          ctx.lineWidth = 2.6 - Math.abs(ratio) * 0.6;
          ctx.beginPath();
          ctx.moveTo(startX, baseY);
          ctx.quadraticCurveTo(archPeakX, archPeakY, tipX, tipY);
          ctx.stroke();

          // 3. Winter & Early Spring: Pendulous Golden Catkins & Ruby Styles
          if (seasonPhase === 'winter' || seasonPhase === 'spring_blossom') {
            // Hanging golden catkin cylinders swaying at wand tips
            const catkinWave = Math.sin(animTime * 3 + s * 0.8) * 3;
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY);
            ctx.quadraticCurveTo(tipX + catkinWave * 0.5, tipY + 7, tipX + catkinWave, tipY + 15);
            ctx.stroke();

            // Amber scale rings on catkin
            ctx.fillStyle = '#ca8a04';
            ctx.fillRect(tipX + catkinWave * 0.3 - 1, tipY + 4, 2, 1.2);
            ctx.fillRect(tipX + catkinWave * 0.6 - 1, tipY + 8, 2, 1.2);
            ctx.fillRect(tipX + catkinWave * 0.9 - 1, tipY + 12, 2, 1.2);

            // Minute crimson female flower styles on lateral buds
            if (s % 2 === 0) {
              const budX = (startX + archPeakX) / 2;
              const budY = (baseY + archPeakY) / 2;
              ctx.fillStyle = '#dc2626';
              ctx.fillRect(budX - 1, budY - 1, 2.5, 2.5);
            }
          }
        }

        // 4. Summer & Autumn: Shrubby Fountain Foliage & Frilly Nut Clusters
        if (seasonPhase === 'summer' || seasonPhase === 'autumn_foliar') {
          let highlightCol, baseCol, shadowCol;
          if (seasonPhase === 'autumn_foliar') {
            highlightCol = '#fef08a'; baseCol = '#ca8a04'; shadowCol = '#78350f';
          } else {
            highlightCol = '#86efac'; baseCol = plant.foliageColor || '#15803d'; shadowCol = '#064e3b';
          }

          // Tiered sculpted foliage billows along outer fountain rim
          drawSculptedFoliageBillow(ctx, px - clumpW * 0.42, baseY - clumpH * 0.62, clumpW * 0.46, clumpH * 0.36, baseCol, highlightCol, shadowCol, 26.2, sway);
          drawSculptedFoliageBillow(ctx, px + clumpW * 0.42, baseY - clumpH * 0.62, clumpW * 0.46, clumpH * 0.36, baseCol, highlightCol, shadowCol, 27.5, sway);
          drawSculptedFoliageBillow(ctx, px, baseY - clumpH * 0.78, clumpW * 0.54, clumpH * 0.42, baseCol, highlightCol, shadowCol, 28.8, sway);

          // Clustered Hazelnuts wrapped in ruffled green/tan leafy involucres (husks)
          [-clumpW * 0.38, clumpW * 0.34, 2].forEach((hx, hIdx) => {
            const hy = baseY - clumpH * 0.45 + (hIdx * 6);
            const fx = px + hx + sway;

            // Ruffled leafy green/brown husk
            ctx.fillStyle = seasonPhase === 'autumn_foliar' ? '#ca8a04' : '#65a30d';
            ctx.beginPath();
            ctx.arc(fx, hy, 5.5, 0, Math.PI * 2);
            ctx.fill();

            // Smooth hard nut shell peeking through
            ctx.fillStyle = '#a16207';
            ctx.beginPath();
            ctx.ellipse(fx, hy + 2, 3.2, 4.0, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // Frilly jagged husk teeth
            ctx.strokeStyle = seasonPhase === 'autumn_foliar' ? '#a16207' : '#4d7c0f';
            ctx.lineWidth = 0.8;
            for (let t = -2; t <= 2; t++) {
              ctx.beginPath();
              ctx.moveTo(fx + t * 2, hy - 2);
              ctx.lineTo(fx + t * 2.5, hy - 6);
              ctx.stroke();
            }
          });
        }
        ctx.restore();
      }

      function drawChestnutOakCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cy = py + crownRadius * 0.55;
        const grandRadius = crownRadius * 1.35;

        // 1. Winter Skeleton: Grand muscular bare gnarled limb scaffold
        if (seasonPhase === 'winter') {
          ctx.strokeStyle = '#292524';
          ctx.lineWidth = 4.0;
          ctx.beginPath();
          ctx.moveTo(px, cy + grandRadius * 0.5);
          ctx.lineTo(px, cy);
          // Mighty horizontal gnarled limbs
          ctx.quadraticCurveTo(px - grandRadius * 0.35, cy + 4, px - grandRadius * 0.65 + sway * 0.3, cy - grandRadius * 0.28);
          ctx.moveTo(px, cy);
          ctx.quadraticCurveTo(px + grandRadius * 0.35, cy + 4, px + grandRadius * 0.65 + sway * 0.3, cy - grandRadius * 0.28);
          ctx.moveTo(px, cy);
          ctx.quadraticCurveTo(px + grandRadius * 0.1, cy - grandRadius * 0.3, px + sway * 0.2, cy - grandRadius * 0.65);
          ctx.stroke();
          ctx.restore();
          return;
        }

        // 2. Visible Internal Mighty Limb Armature
        ctx.strokeStyle = '#1c1917';
        ctx.lineWidth = 3.6;
        ctx.beginPath();
        ctx.moveTo(px, cy + grandRadius * 0.45);
        ctx.quadraticCurveTo(px - grandRadius * 0.3, cy + 2, px - grandRadius * 0.58 + sway * 0.3, cy - grandRadius * 0.22);
        ctx.moveTo(px, cy + grandRadius * 0.45);
        ctx.quadraticCurveTo(px + grandRadius * 0.3, cy + 2, px + grandRadius * 0.58 + sway * 0.3, cy - grandRadius * 0.22);
        ctx.moveTo(px, cy + grandRadius * 0.45);
        ctx.quadraticCurveTo(px + grandRadius * 0.08, cy - grandRadius * 0.25, px + sway * 0.15, cy - grandRadius * 0.58);
        ctx.stroke();

        // 3. Layered Sculpted Climax Billows with Deep Negative Space Clefts
        let highlightCol, baseCol, shadowCol;
        if (seasonPhase === 'autumn_foliar') {
          highlightCol = '#fde047'; baseCol = '#c2410c'; shadowCol = '#451a03';
        } else if (seasonPhase === 'spring_blossom') {
          highlightCol = '#bef264'; baseCol = '#22c55e'; shadowCol = '#14532d';
        } else {
          highlightCol = '#86efac'; baseCol = plant.foliageColor || '#166534'; shadowCol = '#022c22';
        }

        // 6 Large sculpted billows with intentional sky holes
        drawSculptedFoliageBillow(ctx, px - grandRadius * 0.48, cy + 6, grandRadius * 0.52, grandRadius * 0.42, baseCol, highlightCol, shadowCol, 27.2, sway);
        drawSculptedFoliageBillow(ctx, px + grandRadius * 0.48, cy + 6, grandRadius * 0.52, grandRadius * 0.42, baseCol, highlightCol, shadowCol, 28.5, sway);
        drawSculptedFoliageBillow(ctx, px - grandRadius * 0.26, cy - grandRadius * 0.32, grandRadius * 0.55, grandRadius * 0.48, baseCol, highlightCol, shadowCol, 29.8, sway);
        drawSculptedFoliageBillow(ctx, px + grandRadius * 0.26, cy - grandRadius * 0.32, grandRadius * 0.55, grandRadius * 0.48, baseCol, highlightCol, shadowCol, 30.1, sway);
        drawSculptedFoliageBillow(ctx, px, cy - grandRadius * 0.08, grandRadius * 0.65, grandRadius * 0.56, baseCol, highlightCol, shadowCol, 31.4, sway);

        // Spiky chestnut burrs in Summer / Autumn
        if (/chestnut|castanea/i.test(plant.name || '')) {
          [-grandRadius * 0.38, grandRadius * 0.36, 0].forEach(bx => {
            const by = cy + 14;
            ctx.fillStyle = seasonPhase === 'autumn_foliar' ? '#78350f' : '#65a30d';
            ctx.beginPath();
            ctx.arc(px + bx + sway, by, 4.8, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        ctx.restore();
      }

      /**
       * Arching Berry Canes (`drawBerryCanes`)
       * Implements fountain habit with vigorous biennial canes arching from the groundline,
       * sharp prickles, trifoliate leaflets, white spring blossoms, and nodding thimble drupelets.
       */
      function drawBerryCanes(ctx, px, baseY, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const shrubRadius = Math.max(18, crownRadius * 0.95);
        const caneCount = 7;
        const isBlackberry = /blackberry|mûre/i.test(plant.name || '');

        // 1. Shallow fibrous roots and underground runner sucker
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1.4;
        [-18, -9, 9, 18].forEach(rx => {
          ctx.beginPath();
          ctx.moveTo(px + rx * 0.3, baseY);
          ctx.quadraticCurveTo(px + rx * 0.7, baseY + 6, px + rx, baseY + 12);
          ctx.stroke();
        });

        // Emerging runner sucker sending up fresh cane
        ctx.beginPath();
        ctx.moveTo(px + 4, baseY + 4);
        ctx.lineTo(px + 24, baseY + 4);
        ctx.lineTo(px + 24, baseY - 8);
        ctx.stroke();
        ctx.fillStyle = '#84cc16';
        ctx.fillRect(px + 23, baseY - 10, 3, 3);

        // 2. Arching biennial canes curving outward under their own weight from the groundline
        for (let c = 0; c < caneCount; c++) {
          const ratio = (c / (caneCount - 1)) * 2 - 1;
          const archPeakX = px + ratio * (shrubRadius * 0.68) + sway;
          const archPeakY = baseY - shrubRadius * (1.35 - Math.abs(ratio) * 0.25);
          // Canes bow down to the soil under gravity (tip-rooting habit)
          const tipX = px + ratio * (shrubRadius * 1.25) + sway * 1.2;
          const tipY = baseY - shrubRadius * 0.35 + Math.abs(ratio) * 8;

          ctx.strokeStyle = c % 2 === 0 ? '#65a30d' : '#854d0e';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.quadraticCurveTo(archPeakX, archPeakY, tipX, tipY);
          ctx.stroke();

          // Thorny spines along cane
          ctx.strokeStyle = '#991b1b';
          ctx.lineWidth = 1;
          [0.28, 0.52, 0.78].forEach(t => {
            const qx = (1 - t) * (1 - t) * px + 2 * (1 - t) * t * archPeakX + t * t * tipX;
            const qy = (1 - t) * (1 - t) * baseY + 2 * (1 - t) * t * archPeakY + t * t * tipY;
            ctx.beginPath();
            ctx.moveTo(qx, qy);
            ctx.lineTo(qx + (ratio > 0 ? 3.5 : -3.5), qy + 2.5);
            ctx.stroke();
          });
        }

        // 3. Trifoliate serrated leaves and lateral shoots
        if (seasonPhase !== 'winter') {
          const leafNodes = [
            { x: -shrubRadius * 0.58, y: -shrubRadius * 0.95 },
            { x: -shrubRadius * 0.22, y: -shrubRadius * 1.25 },
            { x: shrubRadius * 0.24, y: -shrubRadius * 1.22 },
            { x: shrubRadius * 0.60, y: -shrubRadius * 0.88 },
            { x: 0, y: -shrubRadius * 0.65 }
          ];

          leafNodes.forEach((node, idx) => {
            const nx = px + node.x + sway;
            const ny = baseY + node.y;

            [-5, 0, 5].forEach(lx => {
              ctx.fillStyle = seasonPhase === 'autumn_foliar' ? '#ca8a04' : (idx % 2 === 0 ? '#16a34a' : '#22c55e');
              ctx.beginPath();
              ctx.ellipse(nx + lx, ny + (lx === 0 ? -4 : 0), 4.5, 2.8, lx * 0.12, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#052e16';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            });
          });

          // 4. White 5-petaled flowers (Spring) or Nodding Thimble Drupelets (Summer/Autumn)
          if (seasonPhase === 'spring_blossom') {
            [-shrubRadius * 0.4, 0, shrubRadius * 0.4].forEach(fx => {
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(px + fx + sway, baseY - shrubRadius * 0.72, 4.0, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#facc15';
              ctx.fillRect(px + fx + sway - 1.2, baseY - shrubRadius * 0.72 - 1.2, 2.4, 2.4);
            });
          } else if (seasonPhase === 'summer' || seasonPhase === 'autumn_foliar') {
            const berries = [
              { x: -shrubRadius * 0.46, y: -shrubRadius * 0.8 },
              { x: shrubRadius * 0.42, y: -shrubRadius * 0.75 },
              { x: 0, y: -shrubRadius * 0.48 },
              { x: -shrubRadius * 0.18, y: -shrubRadius * 1.02 }
            ];

            berries.forEach(b => {
              const bx = px + b.x + sway;
              const by = baseY + b.y;

              // Curved fruiting pedicel
              ctx.strokeStyle = '#65a30d';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(bx, by - 8);
              ctx.quadraticCurveTo(bx + 2, by - 4, bx, by);
              ctx.stroke();
              // Green 5-point calyx star
              ctx.fillStyle = '#4ade80';
              ctx.fillRect(bx - 3, by - 1, 6, 2.2);

              const fruitColor = isBlackberry ? '#09090b' : (plant.fruitColor || '#e11d48');
              const highlightColor = isBlackberry ? '#64748b' : '#fb7185';

              // Thimble aggregate drupelet beads
              [
                { dx: -2.2, dy: 1 }, { dx: 2.2, dy: 1 },
                { dx: -2.0, dy: 4 }, { dx: 2.0, dy: 4 },
                { dx: 0, dy: 7.0 }
              ].forEach(d => {
                ctx.fillStyle = fruitColor;
                ctx.beginPath();
                ctx.arc(bx + d.dx, by + d.dy, 2.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = highlightColor;
                ctx.fillRect(bx + d.dx - 0.7, by + d.dy - 0.7, 1.4, 1.4);
              });
            });
          }
        } else {
          // Dormant winter lateral buds
          [-shrubRadius * 0.45, shrubRadius * 0.45].forEach(bx => {
            ctx.fillStyle = '#991b1b';
            ctx.fillRect(px + bx + sway - 1.5, baseY - shrubRadius * 0.6 - 1.5, 3, 3);
          });
        }

        ctx.restore();
      }

      /**
       * Textured Aromatic Cushion (`drawAromaticCushion`)
       * Implements multi-lobed undulating cushion mounds with serrated leafy perimeter contours,
       * needle/rosette tufts for Lavender/Rosemary/Thyme, and slender tiered flower spikes.
       */
      function drawAromaticCushion(ctx, px, baseY, crownRadius, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cushionW = Math.max(24, crownRadius * 1.18);
        const cushionH = cushionW * 0.68;
        const cy = baseY - cushionH * 0.58;
        const isLavender = /lavender|lavande/i.test(plant.name || '');
        const isRosemary = /rosemary|romarin/i.test(plant.name || '');

        // 1. Soil-binding fibrous root mat below baseY
        ctx.strokeStyle = '#57534e';
        ctx.lineWidth = 1.1;
        [-cushionW * 0.42, -cushionW * 0.2, 0, cushionW * 0.2, cushionW * 0.42].forEach((rx, idx) => {
          ctx.beginPath();
          ctx.moveTo(px + rx * 0.6, baseY);
          ctx.lineTo(px + rx, baseY + 8 + (idx % 2) * 4);
          ctx.stroke();
        });

        // 2. Gnarled woody branching core at base
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 2.4;
        [-cushionW * 0.32, 0, cushionW * 0.32].forEach(bx => {
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.lineTo(px + bx * 0.75 + sway * 0.3, cy + 6);
          ctx.stroke();
        });

        // 3. Multi-lobed undulating perimeter with irregular leafy serrations & tufting
        const lobes = 16;
        const rx = cushionW * 0.55;
        const ry = cushionH * 0.58;

        const domeGrad = ctx.createRadialGradient(px + sway * 0.4 - rx * 0.2, cy - ry * 0.25, rx * 0.1, px + sway * 0.4, cy, rx);
        if (isLavender) {
          domeGrad.addColorStop(0, '#94a3b8');
          domeGrad.addColorStop(0.55, '#64748b');
          domeGrad.addColorStop(1, '#1e293b');
        } else if (isRosemary) {
          domeGrad.addColorStop(0, '#4ade80');
          domeGrad.addColorStop(0.55, '#15803d');
          domeGrad.addColorStop(1, '#064e3b');
        } else {
          domeGrad.addColorStop(0, '#86efac');
          domeGrad.addColorStop(0.6, plant.foliageColor || '#15803d');
          domeGrad.addColorStop(1, '#052e16');
        }

        ctx.beginPath();
        for (let i = 0; i <= lobes; i++) {
          const a = (i / lobes) * Math.PI * 2;
          // Harmonic wave perturbation creating ragged leafy perimeter
          const rPerturb = 1.0 + Math.sin(a * 4 + 1.2) * 0.08 + Math.cos(a * 7) * 0.05;
          const lx = px + sway * 0.4 + Math.cos(a) * (rx * rPerturb);
          const ly = cy + Math.sin(a) * (ry * rPerturb);

          if (i === 0) ctx.moveTo(lx, ly);
          else {
            const prevA = ((i - 0.5) / lobes) * Math.PI * 2;
            const cpx = px + sway * 0.4 + Math.cos(prevA) * (rx * (rPerturb + 0.06));
            const cpy = cy + Math.sin(prevA) * (ry * (rPerturb + 0.06));
            ctx.quadraticCurveTo(cpx, cpy, lx, ly);
          }
        }
        ctx.closePath();
        ctx.fillStyle = domeGrad;
        ctx.fill();

        ctx.strokeStyle = isLavender ? '#334155' : '#052e16';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Linear needle texture sprays breaking the outer contour
        ctx.strokeStyle = isLavender ? '#cbd5e1' : isRosemary ? '#86efac' : '#4ade80';
        ctx.lineWidth = 0.9;
        for (let n = -4; n <= 4; n++) {
          const nx = px + n * (cushionW * 0.11) + sway * 0.4;
          const ny = cy + (n % 2 === 0 ? 3 : -3);
          ctx.beginPath();
          ctx.moveTo(nx, ny);
          ctx.lineTo(nx + (n % 2 === 0 ? 3.5 : -3.5), ny - 6.5);
          ctx.stroke();
        }

        // 4. Slender vertical flower stems & rich purple flower spikes (Spring & Summer)
        if (seasonPhase === 'spring_blossom' || seasonPhase === 'summer') {
          const spikeCount = 7;
          for (let s = 0; s < spikeCount; s++) {
            const ratio = (s / (spikeCount - 1)) * 2 - 1;
            const sx = px + ratio * (cushionW * 0.44) + sway * 0.6;
            const spikeH = 18 + (s % 3) * 6;
            const sy = cy - cushionH * 0.35;
            const tipY = sy - spikeH;

            ctx.strokeStyle = isLavender ? '#64748b' : '#166534';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + ratio * 2.5, tipY);
            ctx.stroke();

            const flowerColor = isLavender ? '#a855f7' : (plant.bloomColor || '#818cf8');
            const lightColor = isLavender ? '#d8b4fe' : '#c7d2fe';

            // Segmented whorls of blossoms
            ctx.fillStyle = flowerColor;
            for (let w = 0; w < 5; w++) {
              const wy = tipY + w * 2.6;
              ctx.fillRect(sx + ratio * 2.5 - 2, wy, 4, 1.8);
            }
            ctx.fillStyle = lightColor;
            ctx.fillRect(sx + ratio * 2.5 - 1, tipY - 1, 2, 2);
          }
        } else if (seasonPhase === 'autumn_foliar' || seasonPhase === 'winter') {
          // Dried rustic seedheads
          for (let s = -2; s <= 2; s++) {
            const sx = px + s * (cushionW * 0.22) + sway * 0.4;
            ctx.strokeStyle = '#78716c';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(sx, cy - cushionH * 0.3);
            ctx.lineTo(sx, cy - cushionH * 0.3 - 10);
            ctx.stroke();
            ctx.fillStyle = '#57534e';
            ctx.fillRect(sx - 1, cy - cushionH * 0.3 - 12, 2, 3);
          }
        }

        ctx.restore();
      }

      const drawShrubCluster = drawBerryCanes;

      function drawPalmCrown(ctx, px, py, crownRadius, plant, sway, animTime, bioActive) {
        ctx.save();
        const frondCount = 7;
        const palmRadius = Math.max(22, crownRadius * 1.15);
        const headY = py + crownRadius * 0.3;

        for (let f = 0; f < frondCount; f++) {
          const angle = (f / (frondCount - 1)) * Math.PI * 0.95 - Math.PI * 0.97;
          const frondLen = palmRadius * 1.35;
          const wave = Math.sin(animTime * 2.8 + f * 0.7) * 4;
          const endX = px + Math.cos(angle) * frondLen + sway + wave;
          const endY = headY + Math.sin(angle) * frondLen * 0.75;
          const midX = (px + endX) / 2 + wave * 0.5;
          const midY = headY - 14;

          ctx.strokeStyle = '#65a30d';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(px, headY);
          ctx.quadraticCurveTo(midX, midY, endX, endY);
          ctx.stroke();

          ctx.fillStyle = f % 2 === 0 ? (plant.foliageColor || '#22c55e') : '#4ade80';
          ctx.beginPath();
          ctx.ellipse((px + endX) / 2, (headY + endY) / 2, frondLen * 0.38, 7, angle, 0, Math.PI * 2);
          ctx.fill();
        }

        const spearH = palmRadius * 0.8;
        ctx.strokeStyle = '#bef264';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, headY);
        ctx.lineTo(px + sway * 0.5, headY - spearH);
        ctx.stroke();
        ctx.restore();
      }

      function drawPioneerSpire(ctx, px, py, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cy = py + crownRadius * 0.5;
        const isCoppiced = plant.status === 'coppiced';

        if (isCoppiced) {
          ctx.fillStyle = '#52525b';
          ctx.fillRect(px - 12, cy + crownRadius * 0.4, 24, 8);
          for (let rod = -8; rod <= 8; rod += 4) {
            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px + rod, cy + crownRadius * 0.4);
            ctx.lineTo(px + rod * 1.4 + sway, cy - 10);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        if (seasonPhase === 'winter') {
          ctx.strokeStyle = '#52525b';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.moveTo(px, cy + crownRadius * 0.6);
          ctx.lineTo(px, cy - crownRadius * 0.4);
          ctx.stroke();
          ctx.restore();
          return;
        }

        const grad = ctx.createRadialGradient(px + sway, cy, crownRadius * 0.1, px + sway, cy, crownRadius);
        if (seasonPhase === 'autumn_foliar') {
          grad.addColorStop(0, '#fde047');
          grad.addColorStop(0.55, '#d97706');
          grad.addColorStop(1, '#78350f');
        } else {
          grad.addColorStop(0, '#86efac');
          grad.addColorStop(0.55, plant.foliageColor || '#4ade80');
          grad.addColorStop(1, '#065f46');
        }

        const lobes = [
          { dx: -crownRadius * 0.4, dy: 6, r: crownRadius * 0.65 },
          { dx: crownRadius * 0.4, dy: 6, r: crownRadius * 0.65 },
          { dx: 0, dy: -crownRadius * 0.35, r: crownRadius * 0.78 }
        ];

        lobes.forEach(l => {
          ctx.beginPath();
          ctx.arc(px + l.dx + sway, cy + l.dy, l.r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        });

        // Upright violet bell panicles in Spring (Paulownia style)
        if (plant.bloomColor || seasonPhase === 'spring_blossom') {
          ctx.fillStyle = plant.bloomColor || '#c084fc';
          [-crownRadius * 0.25, crownRadius * 0.22, 0].forEach(fx => {
            ctx.beginPath();
            ctx.ellipse(px + fx + sway, cy - crownRadius * 0.4, 4, 7, 0, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        ctx.restore();
      }

      function drawBroadleafCrown(ctx, px, py, crownRadius, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cy = py + crownRadius * 0.55;

        // 1. Winter Bare Skeleton
        if (seasonPhase === 'winter') {
          ctx.strokeStyle = '#451a03';
          ctx.lineWidth = 3.0;
          ctx.beginPath();
          ctx.moveTo(px, cy + crownRadius * 0.5);
          ctx.lineTo(px, cy - 4);
          ctx.lineTo(px - crownRadius * 0.5 + sway * 0.3, cy - crownRadius * 0.4);
          ctx.moveTo(px, cy - 4);
          ctx.lineTo(px + crownRadius * 0.5 + sway * 0.3, cy - crownRadius * 0.4);
          ctx.stroke();
          ctx.restore();
          return;
        }

        // 2. Visible Internal Branching
        ctx.strokeStyle = '#3b1803';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(px, cy + crownRadius * 0.45);
        ctx.lineTo(px - crownRadius * 0.42 + sway * 0.3, cy - crownRadius * 0.2);
        ctx.moveTo(px, cy + crownRadius * 0.45);
        ctx.lineTo(px + crownRadius * 0.42 + sway * 0.3, cy - crownRadius * 0.2);
        ctx.stroke();

        // 3. Sculpted Organic Foliage Pads
        let highlightCol, baseCol, shadowCol;
        if (seasonPhase === 'autumn_foliar') {
          highlightCol = '#fde047'; baseCol = '#d97706'; shadowCol = '#78350f';
        } else {
          highlightCol = '#86efac'; baseCol = plant.foliageColor || '#22c55e'; shadowCol = '#052e16';
        }

        drawSculptedFoliageBillow(ctx, px - crownRadius * 0.36, cy + 4, crownRadius * 0.58, crownRadius * 0.48, baseCol, highlightCol, shadowCol, 36.2, sway);
        drawSculptedFoliageBillow(ctx, px + crownRadius * 0.36, cy + 2, crownRadius * 0.58, crownRadius * 0.48, baseCol, highlightCol, shadowCol, 37.5, sway);
        drawSculptedFoliageBillow(ctx, px, cy - crownRadius * 0.28, crownRadius * 0.62, crownRadius * 0.52, baseCol, highlightCol, shadowCol, 38.8, sway);

        ctx.restore();
      }

      function drawBotanicalSpecimen(ctx, px, baseY, plant, h, crownRadius, treePixelHeight, sway, animTime, bioActive = true, monthFloat = 7) {
        const traits = classifyBotanicalSpecimen(plant);
        const silhouette = traits.morphologicalHabit;
        const py = baseY - treePixelHeight;

        const m = (monthFloat != null && !isNaN(monthFloat)) ? Math.max(1, Math.min(12.99, monthFloat)) : 7.0;
        let seasonPhase = 'summer';

        // Stage 1 Semantic Phenology: Evergreens NEVER drop their leaves in winter!
        if (m >= 12 || m < 2.5) {
          if (traits.foliagePhenology === 'needle_evergreen' || traits.foliagePhenology === 'broadleaf_evergreen') {
            seasonPhase = 'winter_evergreen'; // Retains green crown with winter fruit/frost
          } else {
            seasonPhase = 'winter'; // Deciduous bare skeleton mode
          }
        } else if (m >= 2.5 && m < 5.0) {
          seasonPhase = 'spring_blossom'; // Spring bloom & bud burst
        } else if (m >= 5.0 && m < 8.8) {
          seasonPhase = 'summer'; // Full lush summer canopy
        } else {
          seasonPhase = 'autumn_foliar'; // Autumn color shift & late harvest
        }

        // 1. Specialized multi-stem or structural species that draw their own trunks
        if (silhouette === 'hazelnut_coppice') {
          drawHazelnutClump(ctx, px, baseY, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
          return;
        }
        if (silhouette === 'arbor_vine') {
          drawArborVineTrellis(ctx, px, baseY, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
          return;
        }

        // Check for active coppice / chop-and-drop state across all perennials and support trees
        if (plant.status === 'coppiced') {
          drawCoppiceStool(ctx, px, baseY, plant, crownRadius, sway, animTime, bioActive, seasonPhase);
          return;
        }

        // Understory guild dispatch
        if (silhouette === 'comfrey_guild' || silhouette === 'perennial_rosette') {
          drawComfreyGuild(ctx, px, baseY, crownRadius, plant, sway, animTime, bioActive, seasonPhase);
          return;
        }
        if (silhouette === 'aromatic_cushion') {
          drawAromaticCushion(ctx, px, baseY, crownRadius, plant, sway, animTime, bioActive, seasonPhase);
          return;
        }
        if (silhouette === 'berry_shrub') {
          drawBerryCanes(ctx, px, baseY, crownRadius, treePixelHeight, plant, sway, animTime, bioActive, seasonPhase);
          return;
        }

        // 2. Trunk Architecture dynamically anchored to canopy center with 3D Cylindrical Chiaroscuro
        ctx.save();
        const isPoplarOrBirch = /poplar|peuplier|populus|birch|bouleau|betula/i.test(plant.name + ' ' + (plant.botanicalName || ''));
        const cy = py + crownRadius * 0.55;

        // Ambient contact shadow beneath tree base on the turf
        const drawGroundContactShadow = (shadowRadius) => {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.44)';
          ctx.beginPath();
          ctx.ellipse(px, baseY + 1.5, shadowRadius * 1.08, 3.2, 0, 0, Math.PI * 2);
          ctx.fill();
        };

        // Helper 1: Directional Cylindrical Chiaroscuro Gradient (Specular Strip -> Midtone -> Core Shadow -> Rim Bounce)
        const createCylindricalTrunkGradient = (xCenter, halfWidth, highlightCol, midtoneCol, shadowCol, bounceCol) => {
          const w = Math.max(2, halfWidth);
          const grad = ctx.createLinearGradient(xCenter - w, 0, xCenter + w, 0);
          grad.addColorStop(0.0, highlightCol);
          grad.addColorStop(0.18, highlightCol);
          grad.addColorStop(0.48, midtoneCol);
          grad.addColorStop(0.84, shadowCol);
          grad.addColorStop(1.0, bounceCol || shadowCol);
          return grad;
        };

        // Helper 2: Canopy Ambient Occlusion (Soft top-down cast shadow where wood enters dense canopy)
        const drawCanopyAmbientOcclusion = (centerX, topY, spreadW, depth = 18) => {
          ctx.save();
          const aoGrad = ctx.createLinearGradient(0, topY - 4, 0, topY + depth);
          aoGrad.addColorStop(0.0, 'rgba(2, 6, 23, 0.78)');
          aoGrad.addColorStop(0.5, 'rgba(2, 6, 23, 0.38)');
          aoGrad.addColorStop(1.0, 'rgba(2, 6, 23, 0.0)');
          ctx.fillStyle = aoGrad;
          ctx.beginPath();
          ctx.ellipse(centerX, topY + 4, Math.max(10, spreadW * 0.95), depth * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        };

        // Helper 3: Tactile Bark Relief & Living Accents (Moss patina, Lichen flecks, Knothole with grain deflection)
        const drawBarkLivingAccents = (centerX, flareW, baseW, crotchY, heightM, isMature, hasKnothole = true) => {
          if (heightM < 2.2) return; // Young saplings and maiden whips have clean, smooth juvenile bark
          ctx.save();
          // Shaded-flank basal moss patina (velvet green stipples on the right root flare of established trees)
          ctx.fillStyle = 'rgba(21, 128, 61, 0.72)';
          ctx.beginPath();
          ctx.ellipse(centerX + flareW * 0.45, baseY - 2.5, Math.max(2.5, flareW * 0.28), 2.5, 0.18, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(74, 222, 128, 0.55)';
          ctx.beginPath();
          ctx.ellipse(centerX + flareW * 0.40, baseY - 4.2, Math.max(1.8, flareW * 0.18), 1.6, 0.12, 0, Math.PI * 2);
          ctx.fill();

          // White / mint crustose lichen flecks on mid-trunk of established trees
          if (heightM >= 2.6 || isMature) {
            ctx.fillStyle = 'rgba(226, 232, 240, 0.52)';
            ctx.beginPath();
            ctx.ellipse(centerX - baseW * 0.28, (baseY + crotchY) * 0.55, 2.2, 1.5, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(204, 251, 241, 0.42)';
            ctx.beginPath();
            ctx.ellipse(centerX + baseW * 0.15, (baseY + crotchY) * 0.42, 2.5, 1.6, 0.15, 0, Math.PI * 2);
            ctx.fill();
          }

          // Knothole with organic wood grain deflection only on mature weathered trees
          if (hasKnothole && (heightM >= 3.0 || isMature)) {
            const ky = (baseY + crotchY) * 0.52;
            const kx = centerX - baseW * 0.12;
            // Wood grain curve deflection around knothole
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(kx - 4.5, ky - 6);
            ctx.quadraticCurveTo(kx - 6, ky, kx - 4.5, ky + 6);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(kx + 4.5, ky - 6);
            ctx.quadraticCurveTo(kx + 6, ky, kx + 4.5, ky + 6);
            ctx.stroke();

            // Sunken knothole core
            ctx.fillStyle = '#140a05';
            ctx.beginPath();
            ctx.ellipse(kx, ky, 2.4, 3.8, 0.1, 0, Math.PI * 2);
            ctx.fill();
            // Highlighted lower cambium rim
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(kx, ky, 2.5, 0.1, Math.PI * 0.85);
            ctx.stroke();
          }
          ctx.restore();
        };

        // Helper 4: Slender wooden orchard stake (tuteur) for young saplings (h < 2.0m)
        const drawNurseryStake = (crotchY) => {
          if (h >= 2.0) return;
          const sH = Math.min(treePixelHeight * 0.92, 58);
          const stakeX = px + 5.5;
          ctx.fillStyle = '#854d0e';
          ctx.fillRect(stakeX - 1.0, baseY - sH, 2.0, sH + 3);
          ctx.strokeStyle = '#451a03';
          ctx.lineWidth = 0.6;
          ctx.strokeRect(stakeX - 1.0, baseY - sH, 2.0, sH + 3);
          // Green nursery tie binding young whip to stake
          ctx.fillStyle = '#166534';
          ctx.fillRect(px - 1, baseY - sH * 0.55, (stakeX - px) + 2.5, 1.8);
          ctx.fillRect(px - 1, baseY - sH * 0.85, (stakeX - px) + 2.5, 1.8);
        };

        if (silhouette === 'giant_redwood') {
          const maturity = Math.max(0.12, Math.min(1.0, h / (plant.maxHeightMeters || 25.0)));
          const caliper = 1.8 + maturity * 18.0;
          const flareW = caliper * (1.1 + maturity * 1.1);
          const baseW = caliper * 0.95;
          const topW = Math.max(1.2, caliper * 0.38);
          const trunkTopY = py + crownRadius * 0.8;

          drawGroundContactShadow(flareW);
          drawNurseryStake(trunkTopY);

          // Subsoil buttress root spurs plunging below groundline (only for established trees)
          if (maturity > 0.25) {
            ctx.fillStyle = '#310a0a';
            ctx.beginPath();
            ctx.moveTo(px - flareW * 0.9, baseY);
            ctx.quadraticCurveTo(px - flareW * 0.6, baseY + 14, px - flareW * 0.35, baseY + 26);
            ctx.lineTo(px + flareW * 0.35, baseY + 26);
            ctx.quadraticCurveTo(px + flareW * 0.6, baseY + 14, px + flareW * 0.9, baseY);
            ctx.closePath();
            ctx.fill();
          }

          // Above-ground flaring buttress hull with 3D cylindrical chiaroscuro
          const rwGrad = createCylindricalTrunkGradient(px + sway * 0.15, flareW * 0.85, '#dc2626', '#991b1b', '#450a0a', '#78261e');
          ctx.fillStyle = rwGrad;
          ctx.beginPath();
          ctx.moveTo(px - flareW, baseY + 2);
          ctx.quadraticCurveTo(px - baseW * 1.25, baseY - 12, px - topW + sway * 0.3, trunkTopY);
          ctx.lineTo(px + topW + sway * 0.3, trunkTopY);
          ctx.quadraticCurveTo(px + baseW * 1.25, baseY - 12, px + flareW, baseY + 2);
          ctx.quadraticCurveTo(px, baseY + 1, px - flareW, baseY + 2);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#310a0a';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Fluted vertical fibrous bark ridges with 3D shadow & highlight relief (mature only)
          if (maturity > 0.3) {
            [-flareW * 0.65, -flareW * 0.38, -flareW * 0.18, 0, flareW * 0.18, flareW * 0.38, flareW * 0.65].forEach((fx, fIdx) => {
              ctx.strokeStyle = '#3b0808';
              ctx.lineWidth = 1.1;
              ctx.beginPath();
              ctx.moveTo(px + fx, baseY + 4);
              ctx.lineTo(px + fx * 0.28 + sway * 0.3, trunkTopY);
              ctx.stroke();

              if (fx <= 0) {
                ctx.strokeStyle = 'rgba(252, 165, 165, 0.28)';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(px + fx - 1.0, baseY + 4);
                ctx.lineTo(px + (fx - 1.0) * 0.28 + sway * 0.3, trunkTopY);
                ctx.stroke();
              }
            });
          }

          drawBarkLivingAccents(px, flareW, baseW, trunkTopY, h, maturity > 0.6, false);
          drawCanopyAmbientOcclusion(px + sway * 0.3, trunkTopY, flareW * 0.75, 24);

        } else if (silhouette === 'chestnut_oak') {
          const grandRadius = crownRadius * 1.35;
          const oakCy = py + grandRadius * 0.5;
          const maturity = Math.max(0.14, Math.min(1.0, h / (plant.maxHeightMeters || 18.0)));
          const caliper = 1.5 + maturity * 14.5;
          const flareW = caliper * (1.08 + maturity * 0.95);
          const baseW = caliper * 0.95;
          const topW = Math.max(1.1, caliper * 0.5);
          const crotchY = oakCy + grandRadius * 0.34;
          const crotchSpread = grandRadius * 0.44;
          const boughLen = Math.max(8, grandRadius * 0.4);

          drawGroundContactShadow(flareW);
          drawNurseryStake(crotchY);

          // Subsoil root anchor spurs (mature only)
          if (maturity > 0.35) {
            ctx.strokeStyle = '#140f0d';
            ctx.lineWidth = 2.4;
            [-flareW * 0.7, flareW * 0.7].forEach(rx => {
              ctx.beginPath();
              ctx.moveTo(px + rx * 0.6, baseY);
              ctx.quadraticCurveTo(px + rx * 1.1, baseY + 8, px + rx * 1.4, baseY + 16);
              ctx.stroke();
            });
          }

          // Muscular closed tapered trunk hull with cylindrical gradient
          const oakGrad = createCylindricalTrunkGradient(px + sway * 0.2, flareW * 0.85, '#57534e', '#292524', '#140f0d', '#3f3b39');
          ctx.fillStyle = oakGrad;
          ctx.beginPath();
          ctx.moveTo(px - flareW, baseY + 2);
          ctx.quadraticCurveTo(px - baseW * 1.2, baseY - 8, px - baseW, baseY - 16);
          ctx.quadraticCurveTo(px - baseW * 0.8 + sway * 0.15, (baseY + crotchY) / 2, px - topW + sway * 0.35, crotchY);
          ctx.quadraticCurveTo(px - topW - 4 + sway * 0.35, crotchY - boughLen * 0.5, px - crotchSpread + sway * 0.4, crotchY - boughLen);
          ctx.lineTo(px - crotchSpread + caliper * 0.4 + sway * 0.4, crotchY - boughLen - 2);
          ctx.quadraticCurveTo(px + sway * 0.3, crotchY + 2, px + crotchSpread - caliper * 0.4 + sway * 0.4, crotchY - boughLen - 2);
          ctx.lineTo(px + crotchSpread + sway * 0.4, crotchY - boughLen);
          ctx.quadraticCurveTo(px + topW + 4 + sway * 0.35, crotchY - boughLen * 0.5, px + topW + sway * 0.35, crotchY);
          ctx.quadraticCurveTo(px + baseW * 0.8 + sway * 0.15, (baseY + crotchY) / 2, px + baseW, baseY - 16);
          ctx.quadraticCurveTo(px + baseW * 1.2, baseY - 8, px + flareW, baseY + 2);
          ctx.quadraticCurveTo(px, baseY + 1, px - flareW, baseY + 2);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#140f0d';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          // Longitudinal gnarled furrows
          if (maturity > 0.35) {
            [-baseW * 0.5, 0, baseW * 0.5].forEach(fx => {
              ctx.strokeStyle = '#140f0d';
              ctx.lineWidth = 1.1;
              ctx.beginPath();
              ctx.moveTo(px + fx, baseY);
              ctx.quadraticCurveTo(px + fx * 0.6 + sway * 0.15, (baseY + crotchY) / 2, px + fx * 0.35 + sway * 0.3, crotchY);
              ctx.stroke();

              if (fx <= 0) {
                ctx.strokeStyle = 'rgba(214, 211, 209, 0.22)';
                ctx.lineWidth = 0.7;
                ctx.beginPath();
                ctx.moveTo(px + fx - 1.0, baseY);
                ctx.quadraticCurveTo(px + (fx - 1.0) * 0.6 + sway * 0.15, (baseY + crotchY) / 2, px + (fx - 1.0) * 0.35 + sway * 0.3, crotchY);
                ctx.stroke();
              }
            });
          }

          drawBarkLivingAccents(px, flareW, baseW, crotchY, h, maturity > 0.6, true);
          drawCanopyAmbientOcclusion(px + sway * 0.35, crotchY, crotchSpread * 1.15, 22);

        } else if (silhouette === 'palm_banana') {
          const maturity = Math.max(0.18, Math.min(1.0, h / (plant.maxHeightMeters || 4.5)));
          const caliper = 1.8 + maturity * 10.5;
          const flareW = caliper * (1.08 + maturity * 0.45);
          const baseW = caliper * 0.95;
          const topW = Math.max(1.2, caliper * 0.55);
          const trunkTopY = py + crownRadius * 0.45;

          drawGroundContactShadow(flareW);
          drawNurseryStake(trunkTopY);

          // Surface matting feeder roots radiating along mulch (only on established bananas)
          if (maturity > 0.35) {
            ctx.strokeStyle = 'rgba(163, 230, 53, 0.65)';
            ctx.lineWidth = 1.2;
            [-20, -12, -6, 6, 12, 20].forEach((rx, idx) => {
              ctx.beginPath();
              ctx.moveTo(px + (rx > 0 ? 3 : -3), baseY);
              ctx.quadraticCurveTo(px + rx * 0.6, baseY + (idx % 2 === 0 ? 3 : 5), px + rx, baseY + (idx % 2 === 0 ? 4 : 7));
              ctx.stroke();
            });
          }

          // Tapered fleshy pseudostem with 3D cylindrical sheen
