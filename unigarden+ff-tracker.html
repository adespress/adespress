      // ======================================================================
      // 11. PROCEDURAL RENDERERS (STAGE 3: STRICTLY GEOMETRIC & RETRO)
      // ======================================================================

      /**
       * Strictly geometric subterranean root crop renderer (Carrot, Beet, Radish, Potato, Alliums)
       * Renders the root structure directly into the subterranean compost layer below baseY.
       */
      function drawRootCrop(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null) {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        // Dormant Winter State: Mulched soil cap with resting seed/root marker
        if (isDormant) {
          ctx.strokeStyle = '#b45309';
          ctx.lineWidth = 1.5;
          for (let m = -14; m <= 14; m += 7) {
            ctx.beginPath();
            ctx.moveTo(px + m, baseY - 1);
            ctx.lineTo(px + m + 5, baseY - 5);
            ctx.stroke();
          }
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.arc(px, baseY + 8, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.8 + px * 0.12) * 2;

        // ----------------- SUBTERRANEAN ROOT BODIES (Below baseY) -----------------
        if (nameLower.includes('carrot')) {
          // Geometric Tapered Carrot (Inverted Faceted Triangle)
          const rootDepth = (28 + Math.min(16, (plant.daysToMaturity || 70) * 0.2)) * Math.max(0.4, vitality);
          const rootWidth = 11 * Math.max(0.45, vitality);

          // Dark border for retro arcade definition
          ctx.fillStyle = '#7c2d12';
          ctx.beginPath();
          ctx.moveTo(px - rootWidth / 2 - 1, baseY + 1);
          ctx.lineTo(px + rootWidth / 2 + 1, baseY + 1);
          ctx.lineTo(px, baseY + rootDepth + 3);
          ctx.closePath();
          ctx.fill();

          // Main Orange Body
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.moveTo(px - rootWidth / 2, baseY + 2);
          ctx.lineTo(px + rootWidth / 2, baseY + 2);
          ctx.lineTo(px, baseY + rootDepth);
          ctx.closePath();
          ctx.fill();

          // Geometric facet highlight
          ctx.fillStyle = '#fb923c';
          ctx.beginPath();
          ctx.moveTo(px - rootWidth / 2, baseY + 2);
          ctx.lineTo(px, baseY + 2);
          ctx.lineTo(px, baseY + rootDepth);
          ctx.closePath();
          ctx.fill();

          // Geometric horizontal ring steps
          ctx.strokeStyle = '#c2410c';
          ctx.lineWidth = 1;
          for (let y = baseY + 8; y < baseY + rootDepth - 4; y += 7) {
            const span = (rootWidth / 2) * (1 - (y - baseY) / rootDepth);
            ctx.beginPath();
            ctx.moveTo(px - span, y);
            ctx.lineTo(px + span, y);
            ctx.stroke();
          }

        } else if (nameLower.includes('beet')) {
          // Geometric Faceted Ruby Diamond / Hexagon Bulb
          const bulbRadius = 10 * Math.max(0.4, vitality);
          const cy = baseY + bulbRadius + 4;

          ctx.fillStyle = '#881337';
          ctx.beginPath();
          ctx.moveTo(px, cy - bulbRadius);
          ctx.lineTo(px + bulbRadius, cy);
          ctx.lineTo(px, cy + bulbRadius * 1.3);
          ctx.lineTo(px - bulbRadius, cy);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#4c0519';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Taproot anchor tail
          ctx.strokeStyle = '#be123c';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(px, cy + bulbRadius * 1.3);
          ctx.lineTo(px, cy + bulbRadius * 1.9);
          ctx.stroke();

        } else if (nameLower.includes('potato')) {
          // Cluster of 3 Geometric Tubers in Subterranean Hill
          const tuberSizes = [8, 7, 6];
          const tuberOffsets = [
            { dx: -7, dy: 14, w: 9, h: 6 },
            { dx: 6, dy: 16, w: 8, h: 5 },
            { dx: 0, dy: 24, w: 9, h: 6 }
          ];

          tuberOffsets.forEach((t, idx) => {
            const tx = px + t.dx * vitality;
            const ty = baseY + t.dy * vitality;
            ctx.fillStyle = '#a16207';
            ctx.beginPath();
            ctx.rect(tx - t.w / 2, ty - t.h / 2, t.w, t.h);
            ctx.fill();
            ctx.fillStyle = '#ca8a04';
            ctx.fillRect(tx - t.w / 2 + 1, ty - t.h / 2 + 1, t.w - 2, t.h - 2);

            // Stolon connector thread
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px, baseY + 4);
            ctx.lineTo(tx, ty);
            ctx.stroke();
          });

        } else if (nameLower.includes('radish')) {
          // Faceted Magenta Diamond with White Tip
          const rSize = 7 * Math.max(0.45, vitality);
          const cy = baseY + rSize + 2;

          ctx.fillStyle = '#e11d48';
          ctx.beginPath();
          ctx.moveTo(px, cy - rSize);
          ctx.lineTo(px + rSize, cy);
          ctx.lineTo(px, cy + rSize);
          ctx.lineTo(px - rSize, cy);
          ctx.closePath();
          ctx.fill();

          // White retro bottom tip
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.moveTo(px - rSize * 0.4, cy + rSize * 0.5);
          ctx.lineTo(px + rSize * 0.4, cy + rSize * 0.5);
          ctx.lineTo(px, cy + rSize + 4);
          ctx.closePath();
          ctx.fill();

        } else {
          // Alliums (Garlic / Onion / Leek)
          const bulbW = 10 * Math.max(0.4, vitality);
          const bulbH = 12 * Math.max(0.4, vitality);
          const cy = baseY + bulbH * 0.6;

          ctx.fillStyle = nameLower.includes('garlic') ? '#f1f5f9' : '#eab308';
          ctx.beginPath();
          ctx.rect(px - bulbW / 2, cy - bulbH / 2, bulbW, bulbH);
          ctx.fill();
          ctx.strokeStyle = nameLower.includes('garlic') ? '#9333ea' : '#854d0e';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Root beard hairs
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1;
          [-3, 0, 3].forEach(dx => {
            ctx.beginPath();
            ctx.moveTo(px + dx, cy + bulbH / 2);
            ctx.lineTo(px + dx * 1.5, cy + bulbH / 2 + 8);
            ctx.stroke();
          });
        }

        // ----------------- ABOVE-GROUND FOLIAGE (Above baseY) -----------------
        if (nameLower.includes('onion') || nameLower.includes('garlic') || nameLower.includes('leek')) {
          // Spiky upright geometric needles
          const blades = 4;
          for (let b = 0; b < blades; b++) {
            const bladeH = (18 + b * 5) * Math.max(0.35, vitality);
            const bx = px + (b - 1.5) * 4 + sway * 0.4;
            ctx.strokeStyle = '#14b8a6';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(px + (b - 1.5) * 2, baseY);
            ctx.lineTo(bx, baseY - bladeH);
            ctx.stroke();
          }
        } else {
          // Feathery angular plumes (Carrots, Beets, Radish)
          const plumes = 5;
          for (let p = 0; p < plumes; p++) {
            const angle = (p - 2) * 0.35;
            const topH = (16 + Math.abs(p - 2) * 4) * Math.max(0.4, vitality);
            const tx = px + Math.sin(angle) * 14 + sway;
            const ty = baseY - topH;

            ctx.strokeStyle = plant.foliageColor || '#16a34a';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.lineTo(tx, ty);
            ctx.stroke();

            // Geometric polygonal leaf tufts
            ctx.fillStyle = p % 2 === 0 ? '#4ade80' : '#86efac';
            ctx.beginPath();
            ctx.rect(tx - 2.5, ty - 2.5, 5, 5);
            ctx.fill();
            ctx.strokeStyle = '#022c22';
            ctx.lineWidth = 0.7;
            ctx.strokeRect(tx - 2.5, ty - 2.5, 5, 5);
          }
        }
        ctx.restore();
      }

      /**
       * Strictly geometric leafy green renderer (Lettuce, Kale, Cabbage, Spinach)
       */
      function drawLeafyGreen(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null) {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        if (isDormant) {
          ctx.strokeStyle = '#78350f';
          ctx.lineWidth = 1.2;
          for (let m = -10; m <= 10; m += 5) {
            ctx.beginPath();
            ctx.moveTo(px + m, baseY);
            ctx.lineTo(px + m + 4, baseY - 3);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.2 + px * 0.08) * 1.8;

        if (nameLower.includes('kale')) {
          // Lacinato Dinosaur Kale: Central upright stalk with angular palm paddles
          const stemH = 46 * Math.max(0.35, vitality);
          ctx.strokeStyle = '#0f766e';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.lineTo(px + sway * 0.5, baseY - stemH);
          ctx.stroke();

          // Symmetrical angular fronds
          const tiers = 4;
          for (let t = 1; t <= tiers; t++) {
            const ty = baseY - (t / tiers) * stemH;
            [-1, 1].forEach(side => {
              const lx = px + side * (14 + t * 3) + sway;
              ctx.strokeStyle = '#14b8a6';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(px, ty);
              ctx.lineTo(lx, ty - 8);
              ctx.stroke();

              // Serrated rectangular leaf block
              ctx.fillStyle = '#0d9488';
              ctx.beginPath();
              ctx.rect(lx - 4, ty - 12, 8, 7);
              ctx.fill();
              ctx.strokeStyle = '#042f2e';
              ctx.lineWidth = 0.8;
              ctx.strokeRect(lx - 4, ty - 12, 8, 7);
            });
          }

        } else if (nameLower.includes('cabbage')) {
          // Faceted Concentric Sphere Head
          const headRadius = 14 * Math.max(0.4, vitality);
          const cy = baseY - headRadius - 2;

          // Outer guard leaves
          ctx.fillStyle = '#15803d';
          [-10, 10].forEach(dx => {
            ctx.beginPath();
            ctx.rect(px + dx - 6 + sway * 0.5, cy + 2, 12, 10);
            ctx.fill();
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 1;
            ctx.strokeRect(px + dx - 6 + sway * 0.5, cy + 2, 12, 10);
          });

          // Central tightly wrapped globe
          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.rect(px - headRadius + sway * 0.5, cy - headRadius, headRadius * 2, headRadius * 2);
          ctx.fill();
          ctx.strokeStyle = '#14532d';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(px - headRadius + sway * 0.5, cy - headRadius, headRadius * 2, headRadius * 2);

          // Inner heart highlight
          ctx.fillStyle = '#86efac';
          ctx.fillRect(px - headRadius * 0.5 + sway * 0.5, cy - headRadius * 0.5, headRadius, headRadius);

        } else {
          // Butterhead / Romaine Salad Lettuce: Geometric Layered Rosette
          const leaves = 8;
          const radius = Math.min(24, Math.max(9, (plant.crownDiameterMax || 0.35) * 32 * vitality));

          for (let i = 0; i < leaves; i++) {
            const angle = (i / leaves) * Math.PI + Math.PI;
            const lx = px + Math.cos(angle) * radius + sway;
            const ly = baseY - 5 + Math.sin(angle) * (radius * 0.65);

            ctx.fillStyle = i % 2 === 0 ? (plant.foliageColor || '#22c55e') : '#4ade80';
            ctx.beginPath();
            ctx.rect(lx - radius * 0.3, ly - radius * 0.25, radius * 0.6, radius * 0.5);
            ctx.fill();
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 0.9;
            ctx.strokeRect(lx - radius * 0.3, ly - radius * 0.25, radius * 0.6, radius * 0.5);
          }

          // Inner heart tender core
          ctx.fillStyle = '#d9f99d';
          ctx.beginPath();
          ctx.rect(px - 5 + sway * 0.4, baseY - 12 * vitality, 10, 8);
          ctx.fill();
          ctx.strokeStyle = '#65a30d';
          ctx.lineWidth = 1;
          ctx.strokeRect(px - 5 + sway * 0.4, baseY - 12 * vitality, 10, 8);
        }

        ctx.restore();
      }

      /**
       * Strictly geometric vining & trellis crop renderer (Tomatoes, Beans, Peas, Cucumbers)
       */
      function drawViningCrop(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null) {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const stakeHeight = 88;
        const sway = Math.sin(animTime * 2.4 + px * 0.05) * 2;

        // Timber / Bamboo A-Frame Stake
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(px, baseY + 3);
        ctx.lineTo(px, baseY - stakeHeight);
        ctx.stroke();

        // Horizontal geometric tie notches
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 1.2;
        for (let ny = baseY - 18; ny >= baseY - stakeHeight + 10; ny -= 18) {
          ctx.beginPath();
          ctx.moveTo(px - 5, ny);
          ctx.lineTo(px + 5, ny);
          ctx.stroke();
        }

        if (isDormant) {
          // Winter bare stake with tied twine
          ctx.strokeStyle = '#a16207';
          ctx.lineWidth = 1;
          ctx.strokeRect(px - 4, baseY - stakeHeight * 0.7, 8, 4);
          ctx.restore();
          return;
        }

        // Stepped angular zigzag vine climbing upward
        const currentTopY = baseY - (stakeHeight - 10) * Math.max(0.2, vitality);
        ctx.strokeStyle = plant.barkColor || '#15803d';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(px, baseY);
        let leftSide = true;
        for (let y = baseY; y >= currentTopY; y -= 12) {
          const vx = px + (leftSide ? -7 : 7) + sway * 0.4;
          ctx.lineTo(vx, y);
          leftSide = !leftSide;
        }
        ctx.stroke();

        // Geometric foliage diamond blocks & hanging faceted produce
        const nodes = Math.round(5 * Math.max(0.25, vitality));
        for (let n = 1; n <= nodes; n++) {
          const ny = baseY - (n * 16);
          if (ny < currentTopY) continue;
          const side = n % 2 === 0 ? -1 : 1;
          const fx = px + (side * 13) + sway * 0.4;

          // Foliage diamond block
          ctx.fillStyle = plant.foliageColor || '#16a34a';
          ctx.beginPath();
          ctx.rect(fx - 6, ny - 6, 12, 12);
          ctx.fill();
          ctx.strokeStyle = '#052e16';
          ctx.lineWidth = 1;
          ctx.strokeRect(fx - 6, ny - 6, 12, 12);

          // Produce display
          if ((pheno?.stage === 'harvest' || !pheno) && plant.fruitColor) {
            // Faceted Octagonal / Polygonal fruit (e.g. Tomato or Pod)
            if (plant.category === 'vegetable_legume' || /bean|pea/i.test(plant.name)) {
              // Hanging bean pod (angled polygon)
              ctx.fillStyle = plant.fruitColor || '#84cc16';
              ctx.beginPath();
              ctx.moveTo(fx, ny + 4);
              ctx.lineTo(fx + side * 4, ny + 14);
              ctx.lineTo(fx + side * 1, ny + 18);
              ctx.lineTo(fx - side * 2, ny + 8);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = '#365314';
              ctx.lineWidth = 0.8;
              ctx.stroke();
            } else {
              // Tomato / Pepper Gem
              ctx.fillStyle = plant.fruitColor || '#ef4444';
              ctx.beginPath();
              ctx.rect(fx - 4, ny + 6, 8, 8);
              ctx.fill();
              ctx.strokeStyle = '#7f1d1d';
              ctx.lineWidth = 1;
              ctx.strokeRect(fx - 4, ny + 6, 8, 8);

              // 5-point calyx star
              ctx.fillStyle = '#4ade80';
              ctx.fillRect(fx - 2, ny + 4, 4, 2);
            }
          } else if (pheno?.stage === 'flowering') {
            // 4-point yellow star blossom
            ctx.fillStyle = plant.bloomColor || '#facc15';
            ctx.beginPath();
            ctx.rect(fx - 2.5, ny + 4, 5, 5);
            ctx.fill();
          }
        }

        ctx.restore();
      }

      /**
       * Realistic broadleaf bush & companion plant renderer (Squash/Zucchini, Bush Beans, Marigold, Basil)
       * Implements large distinct angular palmate leaf shields overlapping at natural angles for cucurbits.
       */
      function drawPalmateLeafShield(ctx, lx, ly, size, angle, baseColor, highlightColor, veinColor, sway = 0) {
        ctx.save();
        ctx.translate(lx + sway, ly);
        ctx.rotate(angle);

        // 5-Pointed angular palmate leaf shield with triangular sinus clefts
        const lobes = 5;
        const outerR = size;
        const innerR = size * 0.44;

        ctx.beginPath();
        for (let i = 0; i < lobes; i++) {
          const lobeAngle = (i / (lobes - 1)) * (Math.PI * 0.95) - (Math.PI * 0.975);
          const tipX = Math.cos(lobeAngle) * outerR;
          const tipY = Math.sin(lobeAngle) * outerR * 0.85;

          if (i === 0) {
            ctx.moveTo(0, 0);
            ctx.lineTo(tipX, tipY);
          } else {
            const sinusAngle = lobeAngle - (Math.PI * 0.95 / (lobes - 1)) * 0.5;
            const sinusX = Math.cos(sinusAngle) * innerR;
            const sinusY = Math.sin(sinusAngle) * innerR * 0.85;
            ctx.lineTo(sinusX, sinusY);
            ctx.lineTo(tipX, tipY);
          }
        }
        ctx.lineTo(0, 0);
        ctx.closePath();

        // Volumetric radial lighting on leaf surface
        const grad = ctx.createRadialGradient(-size * 0.2, -size * 0.3, size * 0.1, 0, 0, size);
        grad.addColorStop(0, highlightColor);
        grad.addColorStop(0.55, baseColor);
        grad.addColorStop(1, '#052e16');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = '#022c22';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Prominent palmate veins radiating from petiole insertion
        ctx.strokeStyle = veinColor || 'rgba(240, 253, 244, 0.65)';
        ctx.lineWidth = 1;
        for (let i = 0; i < lobes; i++) {
          const lobeAngle = (i / (lobes - 1)) * (Math.PI * 0.95) - (Math.PI * 0.975);
          const tipX = Math.cos(lobeAngle) * (outerR * 0.88);
          const tipY = Math.sin(lobeAngle) * (outerR * 0.75);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(tipX, tipY);
          ctx.stroke();

          // Sub-vein serrations
          [-1, 1].forEach(side => {
            ctx.beginPath();
            ctx.moveTo(tipX * 0.5, tipY * 0.5);
            ctx.lineTo(tipX * 0.5 + Math.cos(lobeAngle + side * 0.6) * 4, tipY * 0.5 + Math.sin(lobeAngle + side * 0.6) * 4);
            ctx.stroke();
          });
        }
        ctx.restore();
      }

      function drawBushCrop(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null) {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        if (isDormant) {
          ctx.strokeStyle = '#78350f';
          ctx.lineWidth = 1.4;
          for (let m = -12; m <= 12; m += 6) {
            ctx.beginPath();
            ctx.moveTo(px + m, baseY);
            ctx.lineTo(px + m + 5, baseY - 4);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.2 + px * 0.06) * 2;

        // ----------------- 1. SQUASH, ZUCCHINI & PUMPKINS (BROADLEAF PALMATE BUSH) -----------------
        if (/zucchini|courgette|squash|pumpkin|potimarron|pepo|moschata/i.test(nameLower)) {
          const bushR = Math.max(18, Math.min(36, (plant.crownDiameterMax || 1.1) * 24 * Math.max(0.4, vitality)));
          const bushH = Math.max(16, bushR * 0.7);

          // Thick, hollow, prickly petioles radiating from central basal crown
          const stalks = [
            { angle: -Math.PI * 0.82, len: bushR * 0.88, shieldSize: 18, shieldAngle: -0.3 },
            { angle: -Math.PI * 0.68, len: bushR * 1.05, shieldSize: 22, shieldAngle: -0.15 },
            { angle: -Math.PI * 0.50, len: bushR * 1.15, shieldSize: 24, shieldAngle: 0.05 },
            { angle: -Math.PI * 0.32, len: bushR * 1.02, shieldSize: 21, shieldAngle: 0.25 },
            { angle: -Math.PI * 0.18, len: bushR * 0.85, shieldSize: 17, shieldAngle: 0.45 },
            // Lower horizontal sprawling petioles
            { angle: -Math.PI * 0.94, len: bushR * 0.72, shieldSize: 16, shieldAngle: -0.5 },
            { angle: -Math.PI * 0.06, len: bushR * 0.70, shieldSize: 16, shieldAngle: 0.55 }
          ];

          // Back-tier petioles and leaf shields
          stalks.slice(0, 3).forEach((s, idx) => {
            const tipX = px + Math.cos(s.angle) * s.len;
            const tipY = baseY + Math.sin(s.angle) * s.len * 0.65;
            const midX = (px + tipX) / 2;
            const midY = (baseY + tipY) / 2 - 4;

            ctx.strokeStyle = '#4d7c0f';
            ctx.lineWidth = 2.8;
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.quadraticCurveTo(midX, midY, tipX + sway * 0.3, tipY);
            ctx.stroke();

            drawPalmateLeafShield(ctx, tipX, tipY, s.shieldSize * vitality, s.shieldAngle, '#15803d', '#22c55e', 'rgba(187, 247, 208, 0.5)', sway * 0.3);
          });

          // Ribbed golden star trumpet flower buds
          if (pheno?.stage === 'flowering' || pheno?.stage === 'harvest' || !pheno) {
            [-bushR * 0.32, bushR * 0.28].forEach((fx, fIdx) => {
              const fy = baseY - bushH * 0.55 + (fIdx * 4);
              ctx.strokeStyle = '#15803d';
              ctx.lineWidth = 1.8;
              ctx.beginPath();
              ctx.moveTo(px, baseY);
              ctx.lineTo(px + fx + sway * 0.4, fy);
              ctx.stroke();

              // 5-Pointed trumpet blossom
              ctx.fillStyle = '#facc15';
              ctx.beginPath();
              for (let p = 0; p < 5; p++) {
                const a = (p / 5) * Math.PI * 2 - Math.PI / 2;
                const r = p % 2 === 0 ? 8 : 4;
                const bx = px + fx + sway * 0.4 + Math.cos(a) * r;
                const by = fy + Math.sin(a) * r;
                if (p === 0) ctx.moveTo(bx, by);
                else ctx.lineTo(bx, by);
              }
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = '#ca8a04';
              ctx.lineWidth = 0.8;
              ctx.stroke();

              // Orange center nectar throat
              ctx.fillStyle = '#ea580c';
              ctx.beginPath();
              ctx.arc(px + fx + sway * 0.4, fy, 2, 0, Math.PI * 2);
              ctx.fill();
            });
          }

          // Zucchini fruit resting realistically on soil/mulch line
          if (pheno?.stage === 'harvest' || (!pheno && plant.fruitColor)) {
            const zx = px + bushR * 0.38 + sway * 0.2;
            const zy = baseY - 2;
            const zLen = Math.min(32, 16 + bushR * 0.45);
            const zThick = Math.min(10, 5 + bushR * 0.14);

            // Curved green peduncle attachment
            ctx.strokeStyle = '#15803d';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.quadraticCurveTo(px + bushR * 0.15, baseY - 6, zx - zLen * 0.45, zy - 2);
            ctx.stroke();

            // Cylindrical tapered ribbed zucchini body
            ctx.save();
            ctx.translate(zx, zy);
            ctx.rotate(0.12);

            const zGrad = ctx.createLinearGradient(-zLen / 2, -zThick / 2, zLen / 2, zThick / 2);
            zGrad.addColorStop(0, '#14532d');
            zGrad.addColorStop(0.35, plant.fruitColor || '#16a34a');
            zGrad.addColorStop(0.7, '#22c55e');
            zGrad.addColorStop(1, '#15803d');

            ctx.fillStyle = zGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, zLen / 2, zThick / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Longitudinal ribbed facet lines
            ctx.strokeStyle = 'rgba(187, 247, 208, 0.45)';
            ctx.lineWidth = 0.8;
            [-zThick * 0.25, 0, zThick * 0.25].forEach(ry => {
              ctx.beginPath();
              ctx.moveTo(-zLen * 0.42, ry);
              ctx.lineTo(zLen * 0.42, ry);
              ctx.stroke();
            });

            // Golden withered blossom remnant at blossom end
            ctx.fillStyle = '#ca8a04';
            ctx.fillRect(zLen / 2 - 1, -1.5, 3, 3);

            ctx.restore();
          }

          // Foreground leaf shields overlapping the fruits and stems
          stalks.slice(3).forEach((s, idx) => {
            const tipX = px + Math.cos(s.angle) * s.len;
            const tipY = baseY + Math.sin(s.angle) * s.len * 0.65;
            const midX = (px + tipX) / 2;
            const midY = (baseY + tipY) / 2 - 3;

            ctx.strokeStyle = '#65a30d';
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.quadraticCurveTo(midX, midY, tipX + sway * 0.4, tipY);
            ctx.stroke();

            drawPalmateLeafShield(ctx, tipX, tipY, s.shieldSize * vitality, s.shieldAngle, '#16a34a', '#4ade80', '#dcfce7', sway * 0.4);
          });

        } else if (/marigold|tagetes|oeillet/i.test(nameLower)) {
          // ----------------- 2. FRENCH MARIGOLD PEST-SHIELD BUSH -----------------
          const mR = 18 * Math.max(0.4, vitality);
          const mH = 24 * Math.max(0.4, vitality);

          // Branching feathery stems
          ctx.strokeStyle = '#15803d';
          ctx.lineWidth = 1.8;
          [-mR * 0.4, 0, mR * 0.4].forEach(bx => {
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.quadraticCurveTo(px + bx * 0.5, baseY - mH * 0.5, px + bx + sway * 0.3, baseY - mH * 0.7);
            ctx.stroke();
          });

          // Dense pinnate feathery foliage tufts
          for (let p = -3; p <= 3; p++) {
            const fx = px + p * (mR * 0.28) + sway * 0.3;
            const fy = baseY - mH * 0.55 + Math.abs(p) * 2;
            ctx.fillStyle = p % 2 === 0 ? '#166534' : '#15803d';
            ctx.beginPath();
            ctx.ellipse(fx, fy, 7, 5, p * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }

          // Multi-tiered ruffled pom-pom blooms (orange and yellow)
          [-mR * 0.45, 0, mR * 0.45].forEach((bx, bIdx) => {
            const by = baseY - mH - (bIdx % 2 === 0 ? 0 : 4);
            const headX = px + bx + sway * 0.4;

            // Outer dark-amber ruffle
            ctx.fillStyle = '#b45309';
            ctx.beginPath();
            ctx.arc(headX, by, 6.5, 0, Math.PI * 2);
            ctx.fill();

            // Mid vibrant orange petals
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(headX, by, 5, 0, Math.PI * 2);
            ctx.fill();

            // Inner bright golden crown
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(headX, by, 3, 0, Math.PI * 2);
            ctx.fill();

            // Green calyx cup
            ctx.fillStyle = '#15803d';
            ctx.fillRect(headX - 2, by + 4, 4, 3);
          });

        } else if (/basil|basilic|ocimum/i.test(nameLower)) {
          // ----------------- 3. SWEET GENOVESE BASIL BUSH -----------------
          const bW = 22 * Math.max(0.4, vitality);
          const bH = 26 * Math.max(0.4, vitality);

          // Upright quadrant stems
          ctx.strokeStyle = '#16a34a';
          ctx.lineWidth = 2.2;
          [-6, 0, 6].forEach(sx => {
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.lineTo(px + sx + sway * 0.3, baseY - bH * 0.85);
            ctx.stroke();
          });

          // Glossy succulent ovate leaves in decussate opposite pairs
          const tiers = 3;
          for (let t = 1; t <= tiers; t++) {
            const ty = baseY - (t / tiers) * bH * 0.85;
            [-1, 1].forEach(side => {
              const lx = px + side * (6 + t * 3) + sway * 0.3;
              ctx.fillStyle = t === tiers ? '#4ade80' : '#22c55e';
              ctx.beginPath();
              ctx.ellipse(lx, ty, 6.5, 4.5, side * 0.35, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#14532d';
              ctx.lineWidth = 0.8;
              ctx.stroke();

              // Central vein highlight
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
              ctx.lineWidth = 0.6;
              ctx.beginPath();
              ctx.moveTo(px, ty);
              ctx.lineTo(lx, ty);
              ctx.stroke();
            });
          }

          // Terminal white bloom spike
          ctx.fillStyle = '#f8fafc';
          for (let sp = 0; sp < 4; sp++) {
            ctx.fillRect(px + sway * 0.3 - 2, baseY - bH - sp * 3, 4, 2);
          }

        } else {
          // ----------------- 4. BUSH BEANS & GENERIC COMPANION BUSHES -----------------
          const bushWidth = 26 * Math.max(0.35, vitality);
          const bushHeight = 32 * Math.max(0.35, vitality);

          // Branching stems
          ctx.strokeStyle = '#15803d';
          ctx.lineWidth = 2.2;
          [-8, 0, 8].forEach(dx => {
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.quadraticCurveTo(px + dx * 0.5, baseY - bushHeight * 0.4, px + dx * vitality + sway * 0.4, baseY - bushHeight * 0.7);
            ctx.stroke();
          });

          // Layered trifoliate rounded leaf pads
          for (let l = -3; l <= 3; l++) {
            const lx = px + l * (bushWidth * 0.16) + sway * 0.4;
            const ly = baseY - bushHeight * 0.65 + Math.abs(l) * 2.5;
            ctx.fillStyle = l % 2 === 0 ? (plant.foliageColor || '#22c55e') : '#4ade80';
            ctx.beginPath();
            ctx.ellipse(lx, ly, 8, 6, l * 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }

          // Produce & Pods
          if ((pheno?.stage === 'harvest' || !pheno) && plant.fruitColor) {
            // Hanging slender legume pods
            [-6, 6].forEach(fx => {
              ctx.strokeStyle = plant.fruitColor || '#84cc16';
              ctx.lineWidth = 2.4;
              ctx.beginPath();
              ctx.moveTo(px + fx + sway * 0.4, baseY - bushHeight * 0.4);
              ctx.quadraticCurveTo(px + fx + 3, baseY - bushHeight * 0.2, px + fx + 1, baseY - 6);
              ctx.stroke();
            });
          } else if (pheno?.stage === 'flowering') {
            ctx.fillStyle = plant.bloomColor || '#facc15';
            ctx.beginPath();
            ctx.arc(px + sway * 0.4, baseY - bushHeight * 0.85, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();
      }

      function getPlantSilhouetteType(plant) {
        const traits = classifyBotanicalSpecimen(plant);
        return traits.morphologicalHabit || 'broadleaf_generic';
      }

      function drawSculptedFoliageBillow(ctx, cx, cy, rx, ry, baseColor, highlightColor, shadowColor, seed = 1.0, sway = 0) {
        ctx.save();
        const ox = cx + sway;
        const lobes = 10;
        ctx.beginPath();
        for (let i = 0; i <= lobes; i++) {
          const a = (i / lobes) * Math.PI * 2;
          const rPerturb = 1.0 + Math.sin(a * 3 + seed) * 0.12 + Math.cos(a * 5 + seed * 1.5) * 0.08;
          const px = ox + Math.cos(a) * (rx * rPerturb);
          const py = cy + Math.sin(a) * (ry * rPerturb);
          if (i === 0) ctx.moveTo(px, py);
          else {
            const prevA = ((i - 0.5) / lobes) * Math.PI * 2;
            const cpx = ox + Math.cos(prevA) * (rx * (rPerturb + 0.1));
            const cpy = cy + Math.sin(prevA) * (ry * (rPerturb + 0.1));
            ctx.quadraticCurveTo(cpx, cpy, px, py);
          }
        }
        ctx.closePath();

        const grad = ctx.createRadialGradient(ox - rx * 0.25, cy - ry * 0.3, rx * 0.15, ox, cy, Math.max(rx, ry));
        grad.addColorStop(0, highlightColor || '#86efac');
        grad.addColorStop(0.55, baseColor || '#16a34a');
        grad.addColorStop(1, shadowColor || '#052e16');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = shadowColor || '#052e16';
        ctx.lineWidth = 1.0;
        ctx.stroke();
        ctx.restore();
      }

      function drawGiantRedwoodCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const tiers = 7;
        const apexY = py - 8;
        const baseY = py + height * 0.72;
        const tipX = px + sway * 0.8;

        for (let i = 0; i < tiers; i++) {
          const tRatio = (i + 1) / tiers;
          const tierY = apexY + (baseY - apexY) * (tRatio * 0.95);
          const w = crownRadius * (0.32 + tRatio * 0.85);
          const droop = 10 + tRatio * 14;
          const boughTipX = px + sway * (1 - (i / tiers) * 0.4);

          const grad = ctx.createLinearGradient(boughTipX - w, tierY, boughTipX + w, tierY + droop);
          grad.addColorStop(0, '#064e3b');
          grad.addColorStop(0.35, '#047857');
          grad.addColorStop(0.7, seasonPhase === 'spring_blossom' ? '#34d399' : '#059669');
          grad.addColorStop(1, '#022c22');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(boughTipX, tierY - 10);
          ctx.quadraticCurveTo(boughTipX - w * 0.5, tierY + droop * 0.3, boughTipX - w, tierY + droop);
          const teeth = 8 + i * 2;
          for (let st = teeth; st >= 0; st--) {
            const rx = boughTipX - w + (st / teeth) * (w * 2);
            const dy = tierY + droop * 0.7 + (st % 2 === 0 ? 0 : droop * 0.35);
            ctx.lineTo(rx, dy);
          }
          ctx.quadraticCurveTo(boughTipX + w * 0.5, tierY + droop * 0.3, boughTipX, tierY - 10);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#022c22';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        ctx.strokeStyle = '#047857';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(px + sway * 0.5, apexY + 12);
        ctx.lineTo(tipX, apexY);
        ctx.stroke();

        ctx.restore();
      }

      function drawColumnarFastigiateCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const isPoplar = /poplar|peuplier|populus/i.test(plant.name + ' ' + (plant.botanicalName || ''));
        const w = Math.max(12, crownRadius * 0.52);
        const apexY = py;
        const crownBottomY = py + height * 0.65;
        const crownH = crownBottomY - apexY;
        const midY = (apexY + crownBottomY) / 2;

        if (isPoplar && seasonPhase === 'winter') {
          ctx.strokeStyle = '#52525b';
          ctx.lineWidth = 2.0;
          for (let r = -4; r <= 4; r++) {
            ctx.beginPath();
            ctx.moveTo(px, crownBottomY);
            ctx.quadraticCurveTo(px + r * 3, midY, px + r * (w * 0.3) + sway * 0.6, apexY + Math.abs(r) * 6);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        let highlightCol, baseCol, shadowCol;
        if (isPoplar && seasonPhase === 'autumn_foliar') {
          highlightCol = '#fef08a'; baseCol = '#f59e0b'; shadowCol = '#78350f';
        } else if (!isPoplar) {
          highlightCol = '#4ade80'; baseCol = '#166534'; shadowCol = '#052e16';
        } else {
          highlightCol = '#86efac'; baseCol = '#22c55e'; shadowCol = '#065f46';
        }

        const lobes = [
          { dy: 0.15, wRatio: 0.6, r: w * 0.55 },
          { dy: 0.35, wRatio: 0.85, r: w * 0.8 },
          { dy: 0.55, wRatio: 1.0, r: w * 0.95 },
          { dy: 0.75, wRatio: 0.85, r: w * 0.85 }
        ];

        lobes.forEach((l, idx) => {
          const ly = apexY + crownH * l.dy;
          const lw = w * l.wRatio;
          const lSway = sway * (1 - l.dy * 0.5);

          [-lw * 0.35, lw * 0.35].forEach((dx, sIdx) => {
            drawSculptedFoliageBillow(ctx, px + dx, ly, lw * 0.55, l.r * 0.8, baseCol, highlightCol, shadowCol, 15 + idx * 3 + sIdx, lSway);
          });
        });

        ctx.fillStyle = baseCol;
        ctx.beginPath();
        ctx.ellipse(px + sway * 0.4, midY, w * 0.75, crownH * 0.48, sway * 0.02, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = shadowCol;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.restore();
      }

      function drawAppleTreeCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cy = py + crownRadius * 0.55;

        if (seasonPhase === 'winter') {
          ctx.strokeStyle = '#451a03';
          ctx.lineWidth = 2.4;
          // Dormant winter terminal twigs extending from bough tips
          [-crownRadius * 0.5, -crownRadius * 0.2, crownRadius * 0.25, crownRadius * 0.52].forEach((ratio, idx) => {
            const bx = px + ratio + sway * 0.3;
            const by = cy + (idx % 2 === 0 ? 4 : -crownRadius * 0.2);
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + (ratio < 0 ? -6 : 6), by - 8);
            ctx.stroke();

            // Lateral gnarled fruiting spurs
            ctx.fillStyle = '#78350f';
            ctx.fillRect(bx - 1.5, by - 10, 3, 2.5);
          });
          ctx.restore();
          return;
        }

        let highlightCol, baseCol, shadowCol;
        if (seasonPhase === 'autumn_foliar') {
          highlightCol = '#fef08a'; baseCol = '#ca8a04'; shadowCol = '#78350f';
        } else {
          highlightCol = '#86efac'; baseCol = plant.foliageColor || '#22c55e'; shadowCol = '#052e16';
        }

        drawSculptedFoliageBillow(ctx, px - crownRadius * 0.45, cy + 4, crownRadius * 0.58, crownRadius * 0.48, baseCol, highlightCol, shadowCol, 12.1, sway);
        drawSculptedFoliageBillow(ctx, px + crownRadius * 0.42, cy - 2, crownRadius * 0.52, crownRadius * 0.45, baseCol, highlightCol, shadowCol, 13.4, sway);
        drawSculptedFoliageBillow(ctx, px - crownRadius * 0.15, cy - crownRadius * 0.32, crownRadius * 0.62, crownRadius * 0.52, baseCol, highlightCol, shadowCol, 14.7, sway);
        drawSculptedFoliageBillow(ctx, px + crownRadius * 0.18, cy - crownRadius * 0.22, crownRadius * 0.55, crownRadius * 0.46, baseCol, highlightCol, shadowCol, 15.2, sway);

        if (seasonPhase === 'spring_blossom') {

            ctx.beginPath();
            ctx.moveTo(ax, ay - loc.r);

            const fruitGrad = ctx.createRadialGradient(ax - loc.r * 0.3, ay - loc.r * 0.3, 1, ax, ay, loc.r);

            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.fillRect(ax - 0.7, ay + loc.r - 1.2, 1.4, 1.2);

            const fR = 5.2;

      function drawCitrusCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase) {
        ctx.save();
        const cy = py + crownRadius * 0.55;

        // Smooth grey-green compact trunk scaffolding
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(px, cy + crownRadius * 0.45);
        ctx.quadraticCurveTo(px - crownRadius * 0.25, cy + 4, px - crownRadius * 0.45 + sway * 0.3, cy - crownRadius * 0.15);
        ctx.moveTo(px, cy + crownRadius * 0.45);
        ctx.quadraticCurveTo(px + crownRadius * 0.25, cy + 4, px + crownRadius * 0.45 + sway * 0.3, cy - crownRadius * 0.15);
        ctx.stroke();

        // Glossy dark emerald broadleaf evergreen billows (PERSISTS YEAR-ROUND IN WINTER)
        const highlightCol = '#4ade80';
        const baseCol = plant.foliageColor || '#15803d';
        const shadowCol = '#052e16';

        drawSculptedFoliageBillow(ctx, px - crownRadius * 0.36, cy + 2, crownRadius * 0.52, crownRadius * 0.44, baseCol, highlightCol, shadowCol, 41.2, sway);
        drawSculptedFoliageBillow(ctx, px + crownRadius * 0.36, cy + 2, crownRadius * 0.52, crownRadius * 0.44, baseCol, highlightCol, shadowCol, 42.5, sway);
        drawSculptedFoliageBillow(ctx, px, cy - crownRadius * 0.22, crownRadius * 0.58, crownRadius * 0.46, baseCol, highlightCol, shadowCol, 43.8, sway);

        // Starry white waxy blossoms (Spring / Early Summer)
        if (seasonPhase === 'spring_blossom' || seasonPhase === 'summer') {
          [-crownRadius * 0.32, crownRadius * 0.28, 0].forEach((bx, idx) => {
            const by = cy - (idx === 2 ? crownRadius * 0.3 : 4);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px + bx + sway, by, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#facc15';
            ctx.fillRect(px + bx + sway - 1, by - 1, 2, 2);
          });
        }

        // Luminous Citrus Fruit Globes (Winter & Spring peak ripening!)
        const isLemon = /lemon|citron/i.test(plant.name || '');
        const fruitColor = plant.fruitColor || (isLemon ? '#facc15' : '#f97316');
        const fruitHighlight = isLemon ? '#fef08a' : '#fed7aa';

        [-crownRadius * 0.38, -crownRadius * 0.12, crownRadius * 0.18, crownRadius * 0.42].forEach((fxOffset, idx) => {
          const fx = px + fxOffset + sway;
          const fy = cy + (idx % 2 === 0 ? 8 : -crownRadius * 0.12);
          const fR = isLemon ? 4.5 : 5.0;

          // Hanging pedicel
          ctx.strokeStyle = '#15803d';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(fx, fy - fR);
          ctx.lineTo(fx, fy - fR - 4);
          ctx.stroke();

          ctx.fillStyle = fruitColor;
          ctx.beginPath();
          if (isLemon) {
            // Elliptical lemon with pointed apex
            ctx.ellipse(fx, fy, fR, fR * 1.25, 0.15, 0, Math.PI * 2);
          } else {
            ctx.arc(fx, fy, fR, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.strokeStyle = isLemon ? '#ca8a04' : '#c2410c';
          ctx.lineWidth = 0.8;
          ctx.stroke();

          // Wax specular sheen
          ctx.fillStyle = fruitHighlight;
          ctx.fillRect(fx - 1.2, fy - 2, 1.8, 1.8);
        });

        ctx.restore();
      }

      function drawBroadleafOrnamentalCrown(ctx, px, py, crownRadius, height, plant, sway, animTime, bioActive, seasonPhase, traits) {
        ctx.save();
        const cy = py + crownRadius * 0.55;

        // 1. Winter Bare Skeleton with delicate architectural twigs
        if (seasonPhase === 'winter') {
          ctx.strokeStyle = plant.barkColor || '#3f3f46';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(px, cy + crownRadius * 0.45);
          ctx.lineTo(px, cy);
          ctx.lineTo(px - crownRadius * 0.55 + sway * 0.3, cy - crownRadius * 0.35);
          ctx.moveTo(px, cy);
          ctx.lineTo(px + crownRadius * 0.55 + sway * 0.3, cy - crownRadius * 0.35);
          ctx.stroke();

          // Fine terminal branchlets
          [-crownRadius * 0.55, crownRadius * 0.55].forEach(side => {
            const bx = px + side + sway * 0.3;
            const by = cy - crownRadius * 0.35;
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + (side < 0 ? -8 : 8), by - 10);
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + (side < 0 ? 6 : -6), by - 12);
            ctx.stroke();
          });
          ctx.restore();
          return;
        }

        // 2. Multi-tiered Sculpted Foliage with Species-Specific Autumn Palette
        let highlightCol, baseCol, shadowCol;
        if (seasonPhase === 'autumn_foliar') {
          if (traits?.autumnColorShift === 'scarlet_crimson') {
            // Intense Japanese Maple / Red Maple Scarlet
            highlightCol = '#fca5a5'; baseCol = '#dc2626'; shadowCol = '#7f1d1d';
          } else if (traits?.autumnColorShift === 'golden_amber') {
            highlightCol = '#fef08a'; baseCol = '#f59e0b'; shadowCol = '#78350f';
          } else {
            highlightCol = '#fdba74'; baseCol = '#c2410c'; shadowCol = '#431407';
          }
        } else if (seasonPhase === 'spring_blossom') {
          highlightCol = '#bef264'; baseCol = '#4ade80'; shadowCol = '#14532d';
        } else {
          highlightCol = '#86efac'; baseCol = plant.foliageColor || '#15803d'; shadowCol = '#052e16';
        }

        // Sculpted layered foliage pads
        drawSculptedFoliageBillow(ctx, px - crownRadius * 0.42, cy + 4, crownRadius * 0.54, crownRadius * 0.44, baseCol, highlightCol, shadowCol, 51.2, sway);
        drawSculptedFoliageBillow(ctx, px + crownRadius * 0.42, cy + 4, crownRadius * 0.54, crownRadius * 0.44, baseCol, highlightCol, shadowCol, 52.5, sway);
        drawSculptedFoliageBillow(ctx, px, cy - crownRadius * 0.25, crownRadius * 0.62, crownRadius * 0.52, baseCol, highlightCol, shadowCol, 53.8, sway);

        // Palmate laceleaf silhouette accents breaking the perimeter
        ctx.fillStyle = highlightCol;
        [-crownRadius * 0.48, 0, crownRadius * 0.48].forEach((lx, idx) => {
          const ly = cy + (idx === 1 ? -crownRadius * 0.38 : 6);
          ctx.beginPath();
          ctx.ellipse(px + lx + sway * 0.35, ly, 6.5, 4.5, (idx - 1) * 0.2, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

            ctx.fill();

          });
