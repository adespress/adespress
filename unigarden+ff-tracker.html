        // Lombardy Poplar: Deciduous fastigiate habit
        if (isPoplar) {
          if (m === 12 || m <= 2) {
            ctx.strokeStyle = theme === 'light' ? '#94a3b8' : '#52525b';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(px, cy + crownRadius * 0.5);
            ctx.lineTo(px + sway * 0.5, cy - treePixelHeight * 0.45);
            ctx.stroke();

            // Ascending fine twigs
            for (let tw = 0; tw < 6; tw++) {
              const twY = cy + crownRadius * 0.2 - (tw * 8);
              ctx.beginPath();
              ctx.moveTo(px, twY);
              ctx.lineTo(px + (tw % 2 === 0 ? 5 : -5) + sway * 0.4, twY - 10);
              ctx.stroke();
            }
            ctx.restore();
            return;
          }

          const flameColor = (m >= 9 && m <= 11) 
            ? (theme === 'light' ? '#d97706' : '#facc15') 
            : (theme === 'light' ? '#059669' : '#047857');
          ctx.fillStyle = flameColor;
          ctx.beginPath();
          ctx.ellipse(px + sway * 0.5, cy - treePixelHeight * 0.15, crownRadius * 0.48, treePixelHeight * 0.46, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = theme === 'light' ? 'rgba(5, 150, 105, 0.6)' : '#022c22';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
          return;
        }

        // Italian Cypress (Cupressus sempervirens) & Sentinel Conifers:
        // Slender, dense, architectural pencil / flame spire acting as an aerodynamic wind barrier
        const spireW = Math.max(14, crownRadius * 0.42);
        const spireH = Math.max(70, treePixelHeight * 0.88);
        const apexY = cy - spireH * 0.45;
        const baseY = cy + spireH * 0.55;

        // Multi-tiered pointed scale chevrons
        const chevrons = 8;
        for (let ch = 0; ch < chevrons; ch++) {
          const chY = baseY - (ch / chevrons) * (spireH * 0.95);
          const chSpan = spireW * (1.0 - (ch / chevrons) * 0.65);
          const chSway = sway * 0.35 * (ch / chevrons);

          ctx.fillStyle = (ch % 2 === 0)
            ? (theme === 'light' ? '#047857' : '#064e3b')
            : (theme === 'light' ? '#065f46' : '#022c22');

          ctx.beginPath();
          ctx.moveTo(px - chSpan + chSway, chY);
          ctx.quadraticCurveTo(px + chSway, chY - 12, px + chSpan + chSway, chY);
          ctx.lineTo(px + chSway, chY - 16);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = theme === 'light' ? 'rgba(5, 150, 105, 0.5)' : '#022c22';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        // Tapered windbreak spire outline
        ctx.strokeStyle = theme === 'light' ? 'rgba(4, 120, 87, 0.75)' : '#022c22';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(px - spireW * 0.8, baseY);
        ctx.quadraticCurveTo(px - spireW * 0.95 + sway * 0.2, cy, px + sway * 0.35, apexY);
        ctx.quadraticCurveTo(px + spireW * 0.95 + sway * 0.2, cy, px + spireW * 0.8, baseY);
        ctx.stroke();

        // Small woody globular galbules (cypress seed cones)
        [-spireW * 0.25, spireW * 0.22, 0].forEach((gx, idx) => {
          const gy = cy + (idx * 16) - 10;
          ctx.fillStyle = '#78350f';
          ctx.beginPath();
          ctx.arc(px + gx + sway * 0.2, gy, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = theme === 'light' ? '#92400e' : '#451a03';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        });

        ctx.restore();
      }

      function drawAtlasCedarCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const tiers = 5;

        // Horizontal stepped boughs with level dark shelf scaffolding
        for (let t = 0; t < tiers; t++) {
          const ty = cy + crownRadius * 0.42 - (t / tiers) * (treePixelHeight * 0.68);
          const tr = crownRadius * (1.18 - t * 0.17);
          const tSway = sway * 0.45 * (t / tiers);

          // Level horizontal shelf limbs extending laterally
          ctx.strokeStyle = theme === 'light' ? '#64748b' : '#1e293b';
          ctx.lineWidth = Math.max(1.8, 3.2 - t * 0.4);
          ctx.beginPath();
          ctx.moveTo(px - tr * 0.95 + tSway, ty + 2);
          ctx.lineTo(px + tr * 0.95 + tSway, ty + 2);
          ctx.stroke();

          // Tabular stepped glaucous blue-teal needle cushions
          drawSculptedFoliageBillow(ctx, px + tSway, ty, tr, crownRadius * 0.26, '#0d9488', animTime, 0, true, monthFloat, '#d97706', theme);

          // Distinct erect barrel cones sitting upright on top of the horizontal shelf boughs
          if (t >= 2) {
            [-tr * 0.45, tr * 0.4].forEach(coneOffset => {
              const coneX = px + tSway + coneOffset;
              const coneY = ty - crownRadius * 0.16;

              // Upright barrel cone body
              ctx.fillStyle = theme === 'light' ? '#b45309' : '#ca8a04';
              ctx.beginPath();
              ctx.ellipse(coneX, coneY, 3.2, 5.8, 0, 0, Math.PI * 2);
              ctx.fill();

              // Horizontal cone scale ridges
              ctx.strokeStyle = theme === 'light' ? 'rgba(120, 53, 15, 0.6)' : '#451a03';
              ctx.lineWidth = 0.7;
              for (let sc = -3; sc <= 3; sc += 2) {
                ctx.beginPath();
                ctx.moveTo(coneX - 2.5, coneY + sc);
                ctx.lineTo(coneX + 2.5, coneY + sc);
                ctx.stroke();
              }
            });
          }
        }
        ctx.restore();
      }

      function drawUmbrellaPineCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        // Mediterranean Umbrella Pine (Pinus pinea / Pin parasol):
        // High clear trunk with forked reddish-cinnamon boughs, broad parasol needle clouds, and heavy stone pine cones

        // High-forking reddish-cinnamon ascending boughs (candelabra / champagne-flute structure)
        const crotchY = cy + crownRadius * 0.42;
        const boughTops = [
          { dx: -crownRadius * 0.75, dy: -crownRadius * 0.05 },
          { dx: -crownRadius * 0.32, dy: -crownRadius * 0.16 },
          { dx: crownRadius * 0.32, dy: -crownRadius * 0.16 },
          { dx: crownRadius * 0.75, dy: -crownRadius * 0.05 }
        ];

        boughTops.forEach((bt, idx) => {
          const boughSway = sway * 0.75 + (idx % 2 === 0 ? 1 : -1) * 1.5;
          ctx.strokeStyle = theme === 'light' ? '#c2410c' : '#9a3412';
          ctx.lineWidth = Math.max(2.4, 4.2 - idx * 0.4);
          ctx.beginPath();
          ctx.moveTo(px, crotchY);
          ctx.quadraticCurveTo(
            px + bt.dx * 0.45,
            crotchY - 8,
            px + bt.dx + boughSway,
            cy + bt.dy
          );
          ctx.stroke();

          // Warm terracotta bark highlight
          ctx.strokeStyle = theme === 'light' ? 'rgba(251, 146, 60, 0.6)' : 'rgba(234, 88, 12, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        });

        // Heavy stone pine cones (pignes / pommes de pin) nestled securely on the upper forks
        const cones = [
          { dx: -crownRadius * 0.35, dy: 2 },
          { dx: 0, dy: -crownRadius * 0.08 },
          { dx: crownRadius * 0.38, dy: 4 }
        ];

        cones.forEach((cone, idx) => {
          const coneX = px + cone.dx + sway * 0.6;
          const coneY = cy + cone.dy;

          ctx.fillStyle = theme === 'light' ? '#78350f' : '#92400e';
          ctx.beginPath();
          ctx.ellipse(coneX, coneY, 4.5, 6.2, idx * 0.15 - 0.1, 0, Math.PI * 2);
          ctx.fill();

          // Diamond cone scale facets
          ctx.strokeStyle = theme === 'light' ? 'rgba(120, 53, 15, 0.7)' : '#b45309';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(coneX - 3.5, coneY - 2);
          ctx.lineTo(coneX + 3.5, coneY + 2);
          ctx.moveTo(coneX - 3.5, coneY + 2);
          ctx.lineTo(coneX + 3.5, coneY - 2);
          ctx.stroke();
        });

        // Broad parasol needle clouds (wide rounded flattened umbrella canopy)
        const parasolRx = crownRadius * 1.34;
        const parasolRy = crownRadius * 0.54;
        drawSculptedFoliageBillow(ctx, px, cy - crownRadius * 0.18, parasolRx, parasolRy, '#047857', animTime, sway, true, monthFloat, '#047857', theme);
        drawSculptedFoliageBillow(ctx, px, cy - crownRadius * 0.38, parasolRx * 0.82, parasolRy * 0.46, '#064e3b', animTime, sway * 0.85, true, monthFloat, '#064e3b', theme);

        ctx.restore();
      }

      function drawCitrusCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);

        drawSculptedFoliageBillow(ctx, px, cy, crownRadius * 0.95, crownRadius * 0.85, '#15803d', animTime, sway, true, monthFloat, '#d97706', theme);

        // Fragrant waxy white blossoms in spring
        if (m >= 4 && m <= 6) {
          [-crownRadius * 0.3, crownRadius * 0.25].forEach(bx => {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px + bx + sway, cy - crownRadius * 0.15, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = theme === 'light' ? '#86efac' : '#14532d';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          });
        }

        // Glowing winter citrus fruits
        if (m === 12 || (m >= 1 && m <= 4)) {
          [-crownRadius * 0.35, 0, crownRadius * 0.3].forEach((fx, idx) => {
            ctx.fillStyle = p.fruitColor || '#facc15';
            ctx.beginPath();
            ctx.arc(px + fx + sway, cy + (idx % 2 === 0 ? crownRadius * 0.15 : -crownRadius * 0.05), 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = theme === 'light' ? '#ca8a04' : '#713f12';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          });
        }
        ctx.restore();
      }

      function drawBroadleafOrnamentalCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, autumnShift = 'scarlet_crimson', theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        if (m === 12 || m <= 2) {
          ctx.strokeStyle = theme === 'light' ? '#64748b' : '#3f3f46';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px, cy + crownRadius * 0.4);
          ctx.lineTo(px - crownRadius * 0.5 + sway, cy - crownRadius * 0.3);
          ctx.stroke();
          ctx.restore();
          return;
        }

        const autumnColor = (autumnShift === 'scarlet_crimson') ? '#dc2626' : '#d97706';
        drawSculptedFoliageBillow(ctx, px, cy, crownRadius * 1.05, crownRadius * 0.8, '#16a34a', animTime, sway, false, monthFloat, autumnColor, theme);
        ctx.restore();
      }

      function drawChestnutOakCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        if (m === 12 || m <= 2) {
          ctx.strokeStyle = theme === 'light' ? '#78716c' : '#1c1917';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(px, cy + crownRadius * 0.4);
          ctx.lineTo(px - crownRadius * 0.7 + sway, cy - crownRadius * 0.2);
          ctx.moveTo(px, cy + crownRadius * 0.4);
          ctx.lineTo(px + crownRadius * 0.7 + sway, cy - crownRadius * 0.2);
          ctx.stroke();
          ctx.restore();
          return;
        }

        drawSculptedFoliageBillow(ctx, px, cy, crownRadius * 1.25, crownRadius * 0.85, '#14532d', animTime, sway, false, monthFloat, '#78350f', theme);
        ctx.restore();
      }

      function drawPioneerSpire(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        if (m === 12 || m <= 2) {
          ctx.strokeStyle = theme === 'light' ? '#94a3b8' : '#71717a';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px, cy + crownRadius * 0.5);
          ctx.lineTo(px + sway, cy - treePixelHeight * 0.4);
          ctx.stroke();
          ctx.restore();
          return;
        }

        drawSculptedFoliageBillow(ctx, px, cy, crownRadius * 0.85, treePixelHeight * 0.4, '#22c55e', animTime, sway, false, monthFloat, '#eab308', theme);
        ctx.restore();
      }

      function drawPalmCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const fronds = 7;
        for (let f = 0; f < fronds; f++) {
          const angle = (f / (fronds - 1) - 0.5) * 2.2;
          const frondL = crownRadius * 1.1;
          const fx = px + Math.sin(angle) * frondL + sway;
          const fy = cy + Math.cos(angle) * (frondL * 0.4);

          ctx.fillStyle = theme === 'light' ? '#16a34a' : '#22c55e';
          ctx.beginPath();
          ctx.ellipse(fx, fy, frondL * 0.45, frondL * 0.18, angle, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = theme === 'light' ? 'rgba(21, 128, 61, 0.4)' : '#052e16';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBotanicalSpecimen(ctx, px, baseY, p, h, crownRadius, treePixelHeight, sway, animTime, bioluminescence, monthFloat, theme = 'dark') {
        ctx.save();
        const traits = classifyBotanicalSpecimen(p);

        if (p.status === 'coppiced') {
          drawCoppiceStool(ctx, px, baseY, animTime, theme);
          ctx.restore();
          return;
        }

        if (traits.morphologicalHabit === 'perennial_rosette') {
          drawPerennialRosette(ctx, px, baseY, p, animTime, monthFloat);
          ctx.restore();
          return;
        }
        if (traits.morphologicalHabit === 'hazelnut_coppice') {
          drawHazelnutClump(ctx, px, baseY, p, crownRadius, treePixelHeight, sway, animTime, monthFloat, theme);
          ctx.restore();
          return;
        }
        if (traits.morphologicalHabit === 'berry_shrub') {
          drawBerryCanes(ctx, px, baseY, p, crownRadius, treePixelHeight, sway, animTime, monthFloat, theme);
          ctx.restore();
          return;
        }
        if (traits.morphologicalHabit === 'aromatic_cushion') {
          drawAromaticCushion(ctx, px, baseY, p, crownRadius, animTime, monthFloat, theme);
          ctx.restore();
          return;
        }
        if (traits.morphologicalHabit === 'comfrey_guild') {
          drawComfreyGuild(ctx, px, baseY, animTime, monthFloat);
          ctx.restore();
          return;
        }
        if (traits.morphologicalHabit === 'arbor_vine') {
          drawArborVineTrellis(ctx, px, baseY, p, crownRadius, sway, animTime, monthFloat, theme);
          ctx.restore();
          return;
        }

        const cy = baseY - treePixelHeight + crownRadius * 0.6;
        const crotchY = cy + crownRadius * 0.35;
        const trunkTopY = Math.max(cy + 4, crotchY);

        const isYoung = h < 1.8;
        const caliper = isYoung 
          ? Math.max(2.2, h * 1.8) 
          : Math.max(4.5, Math.min(22, (h * 1.7) * (traits.agronomicType === 'timber_climax' ? 1.5 : 1.0)));

        ctx.fillStyle = theme === 'light' ? 'rgba(0, 0, 0, 0.22)' : 'rgba(0, 0, 0, 0.45)';
        ctx.beginPath();
        ctx.ellipse(px, baseY + 1.5, caliper * 1.8, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        const barkColor = p.barkColor || '#451a03';
        const trunkGrad = createCylindricalTrunkGradient(ctx, px - caliper * 1.2, px + caliper * 1.2, barkColor, false, theme);

        ctx.fillStyle = trunkGrad;
        ctx.beginPath();
        ctx.moveTo(px - caliper * 1.2, baseY);
        ctx.quadraticCurveTo(px - caliper * 0.7, (baseY + trunkTopY) * 0.5, px - caliper * 0.5, trunkTopY);
        ctx.lineTo(px + caliper * 0.5, trunkTopY);
        ctx.quadraticCurveTo(px + caliper * 0.7, (baseY + trunkTopY) * 0.5, px + caliper * 1.2, baseY);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = trunkGrad;
        ctx.lineWidth = Math.max(1.8, caliper * 0.6);
        ctx.beginPath();
        ctx.moveTo(px, trunkTopY);
        ctx.quadraticCurveTo(px - crownRadius * 0.35, crotchY - 8, px - crownRadius * 0.45 + sway * 0.5, cy + 2);
        ctx.moveTo(px, trunkTopY);
        ctx.quadraticCurveTo(px + crownRadius * 0.35, crotchY - 8, px + crownRadius * 0.45 + sway * 0.5, cy + 2);
        ctx.stroke();

        drawBarkLivingAccents(ctx, px, baseY, trunkTopY, caliper, h, p, animTime, theme);

        const habit = traits.morphologicalHabit;
        if (habit === 'umbrella_pine') {
          drawUmbrellaPineCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'apple_pome') {
          drawAppleTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'pear_pome') {
          drawPearTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'quince_pome') {
          drawQuinceTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'cherry_stone') {
          drawSweetCherryCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'peach_stone') {
          drawPeachApricotCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'plum_stone') {
          drawPlumMirabelleCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'fig_ficus') {
          drawFigTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'olive_evergreen') {
          drawOliveTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'persimmon_kaki') {
          drawPersimmonCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'paulownia_empress') {
          drawPaulowniaCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'white_willow_whip') {
          drawWhiteWillowWhipCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'black_locust') {
          drawBlackLocustCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'ancient_oak') {
          drawAncientOakCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'sweet_chestnut') {
          drawSweetChestnutCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'plane_tree') {
          drawPlaneTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'weeping_willow') {
          drawWeepingWillowCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'support_spire') {
          drawWhiteWillowWhipCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'parasol_mulberry') {
          drawParasolMulberryCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'giant_redwood') {
          drawGiantRedwoodCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'columnar_fastigiate') {
          drawColumnarFastigiateCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'atlas_cedar') {
          drawAtlasCedarCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'citrus_evergreen') {
          drawCitrusCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'mango_tropical') {
          drawMangoCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'avocado_tropical') {
          drawAvocadoCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'pomegranate_exotic') {
          drawPomegranateCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'loquat_evergreen') {
          drawLoquatCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'feijoa_shrub' || habit === 'guava_tropical') {
          drawFeijoaCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'walnut_nut' || habit === 'macadamia_nut') {
          drawWalnutNutCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'broadleaf_ornamental') {
          drawBroadleafOrnamentalCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, traits.autumnColorShift, theme);
        } else if (habit === 'chestnut_oak') {
          drawChestnutOakCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else if (habit === 'palm_banana') {
          drawPalmCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        } else {
          drawAppleTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme);
        }

        drawCanopyAmbientOcclusion(ctx, px, trunkTopY, caliper * 1.5, theme === 'light' ? 0.15 : 0.45);
        ctx.restore();
      }

      // ======================================================================
      // 12. INTERACTIVE CANVAS COMPONENT (ABSTRACTED TREES + RAISED BEDS)
      // ======================================================================
      function InteractiveTreeLinesCanvas({ plants, simulatedYears, timeScale = 'macro', microMonth = 7, availableLines = [1, 2, 3], activeLineFilter = 'all', skyMode = 'day', onCycleSkyMode, shadeTelemetry, theme = 'dark', onSelectLineFilter, onSelectPlant, onOpenShadeModal }) {
        const canvasRef = useRef(null);
        const containerRef = useRef(null);
        const [scrollX, setScrollX] = useState(0);
        const [scrollY, setScrollY] = useState(0);
        const [isDragging, setIsDragging] = useState(false);
        const [bioluminescence, setBioluminescence] = useState(true);
        const [hoveredLandmark, setHoveredLandmark] = useState(null);
        const dragStart = useRef({ x: 0, y: 0, scrollX: 0, scrollY: 0 });
        const touchMoved = useRef(false);

        const filteredPlants = useMemo(() => {
          return plants.filter(p => p.line != null && (activeLineFilter === 'all' || Number(p.line) === Number(activeLineFilter)));
        }, [plants, activeLineFilter]);

        const linesToDraw = useMemo(() => {
          return activeLineFilter === 'all' ? availableLines : [Number(activeLineFilter)];
        }, [activeLineFilter, availableLines]);

        const maxPosition = useMemo(() => {
          let max = 15;
          plants.forEach(p => {
            const pos = Number(p.linePosition);
            if (!isNaN(pos) && pos > max) max = pos;
          });
          return max;
        }, [plants]);

        const TOTAL_WIDTH = useMemo(() => {
          return Math.max(1800, (maxPosition + 3) * 145);
        }, [maxPosition]);

        const totalTerrainHeight = useMemo(() => {
          if (activeLineFilter !== 'all') return 520;
          return Math.max(520, 200 + (linesToDraw.length - 1) * 160 + 100);
        }, [activeLineFilter, linesToDraw]);

        const maxScrollY = Math.max(0, totalTerrainHeight - 520);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animId;

          const render = () => {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const width = containerRef.current?.clientWidth || 900;

        const handleMouseDown = e => {

        };

          setIsDragging(true);

          if (!isDragging || !e.touches || e.touches.length === 0) return;

              onSelectPlant(closestPlant);
              return;
            }
          }

      // ======================================================================
      // 14b. PERMACULTURE SECTOR MAP (STAGE 2: DYNAMIC ENERGY VECTORS & TELEMETRY)
      // ======================================================================
      function normalizeSectorCode(val) {
        if (!val) return 'S';
        const str = String(val).trim().toUpperCase();
        if (['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'].includes(str)) return str;
        if (/^(NORTH[- ]?WEST|NW|NORD[- ]?OUEST)$/i.test(str)) return 'NW';
        if (/^(NORTH[- ]?EAST|NE|NORD[- ]?EST)$/i.test(str)) return 'NE';
        if (/^(SOUTH[- ]?WEST|SW|SUD[- ]?OUEST)$/i.test(str)) return 'SW';
        if (/^(SOUTH[- ]?EAST|SE|SUD[- ]?EST)$/i.test(str)) return 'SE';
        if (/^(NORTH|NORD|SEPTENTRIONAL)$/i.test(str)) return 'N';
        if (/^(SOUTH|SUD|PLEIN SUD)$/i.test(str)) return 'S';
        if (/^(EAST|EST|LEVANT)$/i.test(str)) return 'E';
        if (/^(WEST|OUEST|COUCHANT)$/i.test(str)) return 'W';
        return 'S';
      }

      const CARDINAL_SECTORS = [
        { code: 'N', name: 'North', compassDeg: 0, aspect: 'Cold Polar Gales • Climax Shade • Winter Frost Buffer', defaultColor: '#38bdf8' },
        { code: 'NE', name: 'North-East', compassDeg: 45, aspect: 'Early Morning Sun • Cold Continental Winds', defaultColor: '#818cf8' },
        { code: 'E', name: 'East', compassDeg: 90, aspect: 'Gentle Awakening Dawn Heat • Morning Insolation', defaultColor: '#c084fc' },
        { code: 'SE', name: 'South-East', compassDeg: 135, aspect: 'High Morning Light • Early Solar Thermal Gain', defaultColor: '#f472b6' },
        { code: 'S', name: 'South', compassDeg: 180, aspect: 'Maximum Solar Radiation • High Midday Insolation', defaultColor: '#facc15' },
        { code: 'SW', name: 'South-West', compassDeg: 225, aspect: 'Intense Afternoon Heat • Warm Western Winds', defaultColor: '#fb923c' },
        { code: 'W', name: 'West', compassDeg: 270, aspect: 'Late Afternoon Heat • Prevailing Atlantic Squalls', defaultColor: '#f87171' },
        { code: 'NW', name: 'North-West', compassDeg: 315, aspect: 'Violent Winter Storms • Late Sunset Light', defaultColor: '#2dd4bf' }
      ];

      function calculateSectorDefenseTelemetry(plants, simulatedYears, sectorConfig = DEFAULT_SECTOR_CONFIG) {
        const winterSector = normalizeSectorCode(sectorConfig.winterWindSector || 'NW');
        const frostSector = normalizeSectorCode(sectorConfig.frostHazardSector || 'N');

        // 1. Windbreak Shielding Rating (sentinels defending against calibrated winter gale sector)
        const windbreakSentinels = plants.filter(p => {
          const sec = normalizeSectorCode(p.cardinalSector);
          const isGuardingSector = sec === winterSector || sec === 'N' || sec === 'NW';
          const isSentinel = p.category === 'canopy_timber' || p.isSupportSpecies || /sequoia|cedar|pine|oak|poplar|willow|chestnut/i.test(p.name);
          return isGuardingSector && isSentinel;
        });

        let totalEffectiveHeight = 0;
        windbreakSentinels.forEach(p => {
          const h = (p.initialHeightMeters || 1.0) + (p.growthRateMPerYear || 0.5) * simulatedYears;
          totalEffectiveHeight += h;
        });
        const windbreakEfficiency = Math.min(98, Math.max(15, Math.round((totalEffectiveHeight / 28) * 100)));

        // 2. Solar Capture Index: Fruiting crops & vegetables situated in prime solar arc (SE, S, SW)
        const sunLovingCrops = plants.filter(p => p.category === 'fruit_tree' || p.category === 'vegetable_fruit' || p.isVegetable);
        const wellPlacedSunCrops = sunLovingCrops.filter(p => {
          const sec = normalizeSectorCode(p.cardinalSector);
          return sec === 'S' || sec === 'SW' || sec === 'SE';
        });
        const solarCaptureIndex = sunLovingCrops.length > 0 
          ? Math.round((wellPlacedSunCrops.length / sunLovingCrops.length) * 100) 
          : 90;

        // 3. Hydrological Swale & Runoff Infiltration
        const waterInterceptors = plants.filter(p => {
          const blob = (p.name + ' ' + (p.landmarkAnchor || '') + ' ' + (p.boundaryAssignment || '')).toLowerCase();
          return blob.includes('swale') || blob.includes('pond') || blob.includes('willow') || blob.includes('comfrey') || blob.includes('banana');
        });
        const waterCatchmentRating = Math.min(96, Math.max(25, Math.round(waterInterceptors.length * 10)));

        // 4. Thermal Stone & Courtyard Microclimate Heat Sinks
        const heatSinkPlants = plants.filter(p => {
          const blob = ((p.sunAspect || '') + ' ' + (p.landmarkAnchor || '') + ' ' + (p.notes || '')).toLowerCase();
          return blob.includes('heat sink') || blob.includes('stone wall') || blob.includes('courtyard') || blob.includes('terrace');
        });

        // 5. Frost Vulnerability Diagnostic: Tender crops planted in the designated frost hazard sector
        const vulnerableCrops = plants.filter(p => {
          const sec = normalizeSectorCode(p.cardinalSector);
          if (sec !== frostSector) return false;
          const isTender = /apricot|abricot|peach|peche|fig|figue|tomato|tomate|pepper|zucchini/i.test(p.name);
          return isTender;
        });

        // Composite Resilience Score (0 - 100)
        const resilienceScore = Math.min(100, Math.round(
          (windbreakEfficiency * 0.35) + 
          (solarCaptureIndex * 0.35) + 
          (waterCatchmentRating * 0.20) + 
          (Math.min(10, heatSinkPlants.length) * 1.0)
        ));

        return {
          northSentinelsCount: windbreakSentinels.length,
          windbreakEfficiency,
          solarCaptureIndex,
          waterCatchmentRating,
          waterInterceptorsCount: waterInterceptors.length,
          heatSinkCount: heatSinkPlants.length,
          vulnerableCrops,
          resilienceScore,
          isNorthProtected: windbreakEfficiency >= 60
        };
      }

      function PermacultureSectorRadarView({ plants, simulatedYears, timeScale = 'macro', microMonth = 7, sectorConfig = DEFAULT_SECTOR_CONFIG, theme = 'dark', focusedPlantId = null, onClearFocus = null, onOpenCalibration, onOpenAudit, onSelectPlant }) {
        const radarCanvasRef = useRef(null);
        const containerRef = useRef(null);
        const [activeSector, setActiveSector] = useState('all');
        const [hoveredPlant, setHoveredPlant] = useState(null);
        const [hoveredSector, setHoveredSector] = useState(null);
        const [isRadarRotating, setIsRadarRotating] = useState(true);
        const lastTouchTime = useRef(0);

        // When a focused plant is selected from Sentinels, isolate its sector
        useEffect(() => {
          if (focusedPlantId) {
            const target = plants.find(p => p.id === focusedPlantId);
            if (target) {
              const sec = normalizeSectorCode(target.cardinalSector);
              setActiveSector(sec);
            }
          }
        }, [focusedPlantId, plants]);

        // Stage 2: Toggleable Wild Energy Layers
        const [energyLayers, setEnergyLayers] = useState({
          solar: true,
          wind: true,
          hydrology: true,
          thermal: true
        });

        const toggleLayer = (layerKey) => {
          soundEngine.playTone(540, 0.03, 'sine');
          setEnergyLayers(prev => ({ ...prev, [layerKey]: !prev[layerKey] }));
        };

        const defenseTelemetry = useMemo(() => {
          return calculateSectorDefenseTelemetry(plants, simulatedYears, sectorConfig);
        }, [plants, simulatedYears, sectorConfig]);

        const sectorStats = useMemo(() => {
          const map = {};
          CARDINAL_SECTORS.forEach(sec => {
            const list = plants.filter(p => normalizeSectorCode(p.cardinalSector) === sec.code);
            map[sec.code] = {
              ...sec,
              count: list.length,
              plants: list,
              vegetableCount: list.filter(p => p.isVegetable || p.lifecycleType === 'annual').length,
              treeCount: list.filter(p => !p.isVegetable && p.lifecycleType !== 'annual').length
            };
          });
          return map;
        }, [plants]);

        const displayedPlants = useMemo(() => {
          if (activeSector === 'all') return plants;
          return plants.filter(p => normalizeSectorCode(p.cardinalSector) === activeSector);
        }, [plants, activeSector]);

        useEffect(() => {
          const canvas = radarCanvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          let animId;

          const renderRadar = () => {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            const width = containerRef.current?.clientWidth || 700;
            const height = Math.min(560, Math.max(460, width * 0.85));

            if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
              canvas.width = Math.floor(width * dpr);
              canvas.height = Math.floor(height * dpr);
            }

            ctx.save();
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const animTime = performance.now() * 0.001;
            const cx = width / 2;
            const cy = height / 2;
            const maxR = Math.min(cx, cy) - 34;

            ctx.clearRect(0, 0, width, height);

            // 1. Canvas Background (Architectural parchment/slate blueprint in light mode, deep space black in dark mode)
            const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxR + 25);
            if (theme === 'light') {
              bgGrad.addColorStop(0, '#ffffff');
              bgGrad.addColorStop(0.65, '#f8fafc');
              bgGrad.addColorStop(1, '#e2e8f0');
            } else {
              bgGrad.addColorStop(0, '#020617');
              bgGrad.addColorStop(0.65, '#030d1a');
              bgGrad.addColorStop(1, '#021812');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // ----------------- STAGE 2 LAYER 1: THERMAL MICROCLIMATES & FROST -----------------
            if (energyLayers.thermal) {
              ctx.save();
              const frostSecCode = normalizeSectorCode(sectorConfig.frostHazardSector || 'N');
              const frostSecDef = CARDINAL_SECTORS.find(s => s.code === frostSecCode) || CARDINAL_SECTORS[0];
              const frostRad = ((frostSecDef.compassDeg - 90) * Math.PI) / 180;
              const frostDist = maxR * 0.65;
              const frostCx = cx + Math.cos(frostRad) * frostDist;
              const frostCy = cy + Math.sin(frostRad) * frostDist;

              const frostGrad = ctx.createRadialGradient(frostCx, frostCy, 10, frostCx, frostCy, maxR * 0.42);
              frostGrad.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
              frostGrad.addColorStop(0.7, 'rgba(14, 165, 233, 0.06)');
              frostGrad.addColorStop(1, 'rgba(14, 165, 233, 0)');
              ctx.fillStyle = frostGrad;
              ctx.beginPath();
              ctx.arc(frostCx, frostCy, maxR * 0.42, 0, Math.PI * 2);
              ctx.fill();

              // Radiant South Stone Wall Heat Sink Terrace in Zone 1 (Warm Amber Pulse)
              const heatPulse = Math.sin(animTime * 2.2) * 0.05 + 0.95;
              const heatGrad = ctx.createRadialGradient(cx + 8, cy + 24, 4, cx + 8, cy + 24, 48 * heatPulse);
              heatGrad.addColorStop(0, 'rgba(251, 146, 60, 0.35)');
              heatGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.14)');
              heatGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');
              ctx.fillStyle = heatGrad;
              ctx.beginPath();
              ctx.arc(cx + 8, cy + 24, 48 * heatPulse, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            // ----------------- STAGE 2 LAYER 2: HYDROLOGICAL SLOPE & RUNOFF -----------------
            if (energyLayers.hydrology) {
              ctx.save();
              const slopeSecCode = normalizeSectorCode(sectorConfig.slopeDirection || 'S');
              const slopeSecDef = CARDINAL_SECTORS.find(s => s.code === slopeSecCode) || CARDINAL_SECTORS[4];
              const slopeRad = ((slopeSecDef.compassDeg - 90) * Math.PI) / 180;

              ctx.strokeStyle = theme === 'light' ? 'rgba(8, 145, 178, 0.5)' : 'rgba(6, 182, 212, 0.38)';
              ctx.lineWidth = 1.2;
              ctx.setLineDash([4, 6]);

              // Topography swale contour lines
              [0.36, 0.58].forEach(ratio => {
                ctx.beginPath();
                const r = maxR * ratio;
                ctx.ellipse(cx, cy + r * 0.25, r, r * 0.6, 0.15, Math.PI * 0.1, Math.PI * 0.9);
                ctx.stroke();
              });
              ctx.setLineDash([]);

              // Animated Overland Runoff Flow Beads
              for (let drop = 0; drop < 7; drop++) {
                const tDrop = (animTime * 0.35 + drop * 0.16) % 1;
                const startDist = maxR * 0.15;
                const endDist = maxR * (0.65 + (drop % 3) * 0.1);
                const curDist = startDist + (endDist - startDist) * tDrop;
                const lateral = ((drop - 3) * 12);
                const curX = cx + Math.cos(slopeRad) * curDist + Math.sin(slopeRad) * lateral;
                const curY = cy + Math.sin(slopeRad) * curDist - Math.cos(slopeRad) * lateral;

                ctx.fillStyle = theme === 'light' ? '#0891b2' : 'rgba(103, 232, 249, 0.75)';
                ctx.beginPath();
                ctx.arc(curX, curY, 1.8, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();
            }

            // 2. 8 Cardinal Sector Wedges
            CARDINAL_SECTORS.forEach(sec => {
              const compassDeg = sec.compassDeg;
              const isSelected = activeSector === sec.code;
              const isHovered = hoveredSector === sec.code;

              const startRad = ((compassDeg - 22.5 - 90) * Math.PI) / 180;
              const endRad = ((compassDeg + 22.5 - 90) * Math.PI) / 180;

              ctx.save();
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, maxR, startRad, endRad);
              ctx.closePath();

              if (isSelected) {
                ctx.fillStyle = theme === 'light' ? 'rgba(245, 158, 11, 0.22)' : 'rgba(245, 158, 11, 0.18)';
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2.0;
                ctx.stroke();
              } else if (isHovered) {
                ctx.fillStyle = theme === 'light' ? 'rgba(6, 182, 212, 0.18)' : 'rgba(6, 182, 212, 0.12)';
                ctx.fill();
                ctx.strokeStyle = theme === 'light' ? '#0284c7' : '#06b6d4';
                ctx.lineWidth = 1.4;
                ctx.stroke();
              } else {
                ctx.strokeStyle = theme === 'light' ? 'rgba(100, 116, 139, 0.5)' : 'rgba(30, 41, 59, 0.6)';
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
              ctx.restore();

              // Cardinal Sector Label on Outer Rim
              const midRad = ((compassDeg - 90) * Math.PI) / 180;
              const labelR = maxR + 18;
              const lx = cx + Math.cos(midRad) * labelR;
              const ly = cy + Math.sin(midRad) * labelR;

              ctx.font = '800 8.5px "Press Start 2P", monospace';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = isSelected 
                ? '#b45309' 
                : isHovered 
                  ? (theme === 'light' ? '#0284c7' : '#38bdf8') 
                  : (theme === 'light' ? '#334155' : sec.defaultColor);
              ctx.fillText(sec.code, lx, ly);
            });

            // ----------------- STAGE 2 LAYER 3: DYNAMIC SOLAR ARC TRAJECTORY -----------------
            if (energyLayers.solar) {
              ctx.save();
              const monthFloat = microMonth;
              const m = Math.floor(monthFloat);
              const isSummer = m >= 5 && m <= 8;
              const isWinter = m === 12 || m <= 2;

              const sunriseDeg = isSummer ? 58 : isWinter ? 124 : 90;
              const sunsetDeg = isSummer ? 302 : isWinter ? 236 : 270;

              const sunStartRad = ((sunriseDeg - 90) * Math.PI) / 180;
              const sunEndRad = ((sunsetDeg - 90) * Math.PI) / 180;

              ctx.beginPath();
              ctx.arc(cx, cy, maxR * 0.76, sunStartRad, sunEndRad);
              ctx.strokeStyle = theme === 'light' ? 'rgba(217, 119, 6, 0.75)' : 'rgba(251, 191, 36, 0.65)';
              ctx.lineWidth = 2.4;
              ctx.setLineDash([5, 4]);
              ctx.stroke();
              ctx.setLineDash([]);

              const solarBeamGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, maxR * 0.85);
              solarBeamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.02)');
              solarBeamGrad.addColorStop(0.5, theme === 'light' ? 'rgba(245, 158, 11, 0.12)' : 'rgba(251, 191, 36, 0.08)');
              solarBeamGrad.addColorStop(1, 'rgba(251, 191, 36, 0)');
              ctx.fillStyle = solarBeamGrad;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.arc(cx, cy, maxR * 0.85, sunStartRad, sunEndRad);
              ctx.closePath();
              ctx.fill();

              const sunProgress = (animTime * 0.15) % 1;
              const currentSunRad = sunStartRad + (sunEndRad - sunStartRad) * sunProgress;
              const sunOrbX = cx + Math.cos(currentSunRad) * (maxR * 0.76);
              const sunOrbY = cy + Math.sin(currentSunRad) * (maxR * 0.76);

              ctx.fillStyle = '#f59e0b';
              ctx.beginPath();
              ctx.arc(sunOrbX, sunOrbY, 4.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }

            // ----------------- STAGE 2 LAYER 4: WIND VECTORS & WINDBREAK DEFLECTION -----------------
            if (energyLayers.wind) {
              ctx.save();
              const isShielded = defenseTelemetry.isNorthProtected;
              const winterSecCode = normalizeSectorCode(sectorConfig.winterWindSector || 'NW');
              const winterSecDef = CARDINAL_SECTORS.find(s => s.code === winterSecCode) || CARDINAL_SECTORS[7];
              const baseCompassDeg = winterSecDef.compassDeg;

              [-24, -8, 8, 24].forEach((offsetDeg, wIdx) => {
                const windPhase = (animTime * 1.5 + wIdx * 0.28) % 1;
                const windCompassDeg = (baseCompassDeg + offsetDeg + 360) % 360;
                const rad = ((windCompassDeg - 90) * Math.PI) / 180;
                const startDist = maxR * 1.15;

${shadeTelemetry.criticalDeficits.map(d => `- ${d.victimPlant.name} suffers -${d.deficitPct}% solar deficit from ${d.aggressorPlant.name} (${d.distanceMeters}m away). Advice: ${d.advice}`).join('\n') || '- None detected.'}

${shadeTelemetry.crowdingClashes.map(c => `- ${c.treeA.name} interlocks with ${c.treeB.name} by ${c.overlapMeters}m. ${c.advice}`).join('\n') || '- None detected.'}

3. BENEFICIAL SUMMER NURSE SHADE (${shadeTelemetry.beneficialNurseShades.length}):
${shadeTelemetry.beneficialNurseShades.map(n => `- ${n.benefitedCrop.name} cooled by ${n.nurseTree.name} (+${n.coolingRatingPct}% thermal relief)`).join('\n') || '- None active currently.'}`;
        };

        const copyReport = () => {
          soundEngine.playTone(600, 0.04, 'triangle');
          try {
            const text = generateShadeReportText();
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          } catch(e) {}
        };

        return React.createElement('div', { className: 'fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 overflow-y-auto' },
          React.createElement('div', { className: 'relative w-full max-w-2xl bg-slate-950 border-2 border-amber-500/80 rounded-2xl p-4 sm:p-6 shadow-2xl text-left space-y-3.5 my-auto max-h-[92vh] overflow-y-auto' },
            React.createElement('div', { className: 'flex items-center justify-between border-b border-amber-500/30 pb-2' },
              React.createElement('div', { className: 'flex items-center gap-2' },
                React.createElement('span', { className: 'text-2xl drop-shadow-[0_0_10px_#f59e0b]' }, '☀️'),
                React.createElement('div', null,
                  React.createElement('h3', { className: 'font-sci-fi font-black text-sm text-amber-300' }, currentLang === 'fr' ? 'ANALYSE DE L\'OMBRE & CANOPÉE' : 'CANOPY SHADE & SOLAR DEFICIT AUDIT'),
                  React.createElement('p', { className: 'font-mono text-[9px] text-slate-400' }, currentLang === 'fr' ? 'Interférence spatiale de l\'ombre, protection estivale et chevauchement' : 'Spatial solar shadow interference, summer nurse cooling & canopy crowding')
                )
              ),
              React.createElement('button', { onClick: onClose, className: 'text-slate-400 hover:text-white font-mono text-base' }, '✕')
            ),

            // Top Overview Telemetry Cards (Clickable to switch tabs)
            React.createElement('div', { className: 'grid grid-cols-2 sm:grid-cols-4 gap-2 font-mono text-center text-[9px]' },
              React.createElement('div', {
                onClick: () => setActiveTab('all'),
                className: `p-2 rounded bg-black/70 border cursor-pointer transition-all ${activeTab === 'all' ? 'border-amber-400 shadow-[0_0_8px_rgba(245,158,11,0.4)]' : 'border-amber-500/30 hover:border-amber-400'}`
              },
                React.createElement('span', { className: 'font-arcade text-[6px] text-amber-300 block' }, currentLang === 'fr' ? 'EFFICACITÉ SOLAIRE' : 'SOLAR EFFICIENCY'),
                React.createElement('span', { className: 'text-sm font-bold text-amber-400' }, `${shadeTelemetry.siteSolarEfficiencyPct}%`),
                React.createElement('span', { className: 'text-[6.5px] text-slate-400 block' }, currentLang === 'fr' ? 'Voir le registre' : 'View registry')
              ),
              React.createElement('div', {
                onClick: () => setActiveTab('deficits'),
                className: `p-2 rounded bg-black/70 border cursor-pointer transition-all ${activeTab === 'deficits' ? 'border-rose-400 shadow-[0_0_8px_rgba(244,63,94,0.4)]' : 'border-rose-500/30 hover:border-rose-400'}`
              },
                React.createElement('span', { className: 'font-arcade text-[6px] text-rose-300 block' }, currentLang === 'fr' ? 'DÉFICITS CRITIQUES' : 'CRITICAL DEFICITS'),
                React.createElement('span', { className: `text-sm font-bold ${shadeTelemetry.criticalDeficitCount > 0 ? 'text-rose-400 animate-pulse' : 'text-emerald-400'}` }, `${shadeTelemetry.criticalDeficitCount}`),
                React.createElement('span', { className: 'text-[6.5px] text-slate-400 block' }, currentLang === 'fr' ? 'Légumes ombragés' : 'Shaded crops')
              ),
              React.createElement('div', {
                onClick: () => setActiveTab('nurse'),
                className: `p-2 rounded bg-black/70 border cursor-pointer transition-all ${activeTab === 'nurse' ? 'border-teal-400 shadow-[0_0_8px_rgba(20,184,166,0.4)]' : 'border-teal-500/30 hover:border-teal-400'}`
              },
                React.createElement('span', { className: 'font-arcade text-[6px] text-teal-300 block' }, currentLang === 'fr' ? 'OMBRES BÉNÉFIQUES' : 'NURSE COOLING'),
                React.createElement('span', { className: 'text-sm font-bold text-teal-300' }, `${shadeTelemetry.beneficialNurseShades.length}`),
                React.createElement('span', { className: 'text-[6.5px] text-slate-400 block' }, currentLang === 'fr' ? 'Fraîcheur estivale' : 'Summer relief')
              ),
              React.createElement('div', {
                onClick: () => setActiveTab('clashes'),
                className: `p-2 rounded bg-black/70 border cursor-pointer transition-all ${activeTab === 'clashes' ? 'border-cyan-400 shadow-[0_0_8px_rgba(6,182,212,0.4)]' : 'border-cyan-500/30 hover:border-cyan-400'}`
              },
                React.createElement('span', { className: 'font-arcade text-[6px] text-cyan-300 block' }, currentLang === 'fr' ? 'CONFLITS CANOPÉE' : 'CROWDING CLASHES'),
                React.createElement('span', { className: 'text-sm font-bold text-cyan-300' }, `${shadeTelemetry.crowdingClashes.length}`),
                React.createElement('span', { className: 'text-[6.5px] text-slate-400 block' }, currentLang === 'fr' ? 'Arbres serrés' : 'Interlocking boughs')
              )
            ),

            // Tab Buttons
            React.createElement('div', { className: 'flex items-center justify-between gap-2 flex-wrap border-b border-slate-800 pb-2 text-[7.5px] font-arcade' },
              React.createElement('div', { className: 'flex gap-1.5 flex-wrap' },
                React.createElement('button', {
                  onClick: () => setActiveTab('deficits'),
                  className: `px-2.5 py-1 rounded border transition-all ${activeTab === 'deficits' ? 'bg-rose-700 text-white border-rose-300 shadow-[0_0_8px_#f43f5e]' : 'bg-slate-900 text-slate-400 border-slate-800'}`
                }, `${currentLang === 'fr' ? 'DÉFICITS' : 'DEFICITS'} (${shadeTelemetry.criticalDeficitCount})`),
                React.createElement('button', {
                  onClick: () => setActiveTab('clashes'),
                  className: `px-2.5 py-1 rounded border transition-all ${activeTab === 'clashes' ? 'bg-cyan-600 text-white border-cyan-300 shadow-[0_0_8px_#06b6d4]' : 'bg-slate-900 text-slate-400 border-slate-800'}`
                }, `${currentLang === 'fr' ? 'CONFLITS' : 'CROWDING'} (${shadeTelemetry.crowdingClashes.length})`),
                React.createElement('button', {
                  onClick: () => setActiveTab('nurse'),
                  className: `px-2.5 py-1 rounded border transition-all ${activeTab === 'nurse' ? 'bg-teal-600 text-white border-teal-300 shadow-[0_0_8px_#14b8a6]' : 'bg-slate-900 text-slate-400 border-slate-800'}`
                }, `${currentLang === 'fr' ? 'OMBRES BÉNÉFIQUES' : 'NURSE SHADE'} (${shadeTelemetry.beneficialNurseShades.length})`),
                React.createElement('button', {
                  onClick: () => setActiveTab('all'),
                  className: `px-2.5 py-1 rounded border transition-all ${activeTab === 'all' ? 'bg-amber-600 text-white border-amber-300 shadow-[0_0_8px_#f59e0b]' : 'bg-slate-900 text-slate-400 border-slate-800'}`
                }, `${currentLang === 'fr' ? 'REGISTRE SOLAIRE' : 'ALL CROPS'} (${plants.length})`)
              ),
              React.createElement('span', { className: 'font-mono text-[8px] text-slate-400' },
                `${currentLang === 'fr' ? 'Canopée moyenne :' : 'Avg Canopy:'} ${shadeTelemetry.averageCanopyHeight}m`
              )
            ),

            // Tab Contents
            React.createElement('div', { className: 'space-y-2 max-h-[310px] overflow-y-auto pr-1 font-mono text-xs' },
              // TAB 1: CRITICAL DEFICITS
              activeTab === 'deficits' && (
                shadeTelemetry.criticalDeficits.length > 0 ? (
                  shadeTelemetry.criticalDeficits.map((def, idx) => {
                    const isSupportPioneer = def.aggressorPlant.isSupportSpecies ||
                      def.aggressorPlant.category === 'support_pioneer' ||
                      /willow|saule|poplar|peuplier|paulownia|locust|robinia|alder|aune/i.test(def.aggressorPlant.name);

                    return React.createElement('div', {
                      key: idx,
                      className: 'p-3 rounded-xl bg-rose-950/30 border border-rose-500/50 space-y-1.5'
                    },
                      React.createElement('div', { className: 'flex justify-between items-center' },
                        React.createElement('span', { className: 'font-bold text-amber-300 text-xs' }, `⚠️ ${def.victimPlant.name}`),
                        React.createElement('span', { className: 'font-arcade text-[6.5px] px-1.5 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-500' },
                          `-${def.deficitPct}% ${currentLang === 'fr' ? 'DÉFICIT SOLAIRE' : 'SOLAR DEFICIT'}`
                        )
                      ),
                      React.createElement('p', { className: 'text-[9.5px] text-slate-200 leading-relaxed' },
                        `${currentLang === 'fr' ? 'Ombragé par :' : 'Shaded by:'} "${def.aggressorPlant.name}" (${def.distanceMeters}m ${currentLang === 'fr' ? 'de distance' : 'away'}, ${currentLang === 'fr' ? 'portée d\'ombre :' : 'shadow reach:'} ${def.shadowReachMeters}m).`
                      ),
                      React.createElement('p', { className: 'text-[9px] text-amber-200/90 italic' }, `💡 ${def.advice}`),

                      // One-Click Quick Chop Aggressor for Biomass Pioneers
                      isSupportPioneer ? React.createElement('div', { className: 'pt-1.5 flex items-center justify-between border-t border-rose-500/20' },
                        React.createElement('span', { className: 'text-[7.5px] text-emerald-400 font-mono' },
                          currentLang === 'fr' ? '🌱 Arbre pionnier régénérateur (repose en taillis)' : '🌱 Rapid pioneer support (safe to coppice)'
                        ),
                        React.createElement('button', {
                          onClick: () => onChopAndDrop(def.aggressorPlant.id),
                          className: 'px-2.5 py-1 bg-emerald-700 hover:bg-emerald-600 text-white font-arcade text-[6.5px] rounded border border-emerald-400 active:scale-95 shadow flex items-center gap-1 animate-pulse'
                        }, `✂️ ${currentLang === 'fr' ? 'TAILLER L\'AGRESSEUR :' : 'QUICK CHOP AGGRESSOR:'} ${def.aggressorPlant.name}`)
                      ) : React.createElement('div', { className: 'pt-1 text-[7.5px] text-amber-300 font-mono italic' },
                        currentLang === 'fr'
                          ? `⚠️ "${def.aggressorPlant.name}" est un arbre nourricier pérenne. Effectuez une taille douce d'éclaircie ou avancez le bac maraîcher.`
                          : `⚠️ "${def.aggressorPlant.name}" is a permanent orchard tree. Thin lower boughs or shift vegetable bed southward.`
                      )
                    );
                  })
                ) : (
                  React.createElement('div', { className: 'p-8 text-center text-slate-400 italic bg-black/40 rounded-xl' },
                    currentLang === 'fr'
                      ? '✓ Aucun déficit solaire critique détecté. Tous les légumes exigeants en lumière reçoivent une insolation suffisante.'
                      : '✓ No critical solar deficits detected. All light-hungry vegetables receive adequate insolation.'
                  )
                )
              ),

              // TAB 2: CROWDING CLASHES
              activeTab === 'clashes' && (
                shadeTelemetry.crowdingClashes.length > 0 ? (
                  shadeTelemetry.crowdingClashes.map((clash, idx) => React.createElement('div', {
                    key: idx,
                    className: 'p-3 rounded-xl bg-cyan-950/40 border border-cyan-500/60 space-y-1.5'
                  },
                    React.createElement('div', { className: 'flex justify-between items-center' },
                      React.createElement('span', { className: 'font-bold text-cyan-300 text-xs' }, `🌳 ${clash.treeA.name} ✕ ${clash.treeB.name}`),
                      React.createElement('span', { className: 'font-arcade text-[6.5px] px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-200 border border-cyan-500' },
                        `${clash.overlapMeters}m ${currentLang === 'fr' ? 'CHEVAUCHEMENT' : 'OVERLAP'}`
                      )
                    ),
                    React.createElement('p', { className: 'text-[9.5px] text-slate-300 leading-relaxed' }, clash.advice),
                    (clash.treeA.isSupportSpecies || clash.treeB.isSupportSpecies) && React.createElement('div', { className: 'pt-1 flex justify-end gap-2' },
                      clash.treeA.isSupportSpecies && React.createElement('button', {
                        onClick: () => onChopAndDrop(clash.treeA.id),
                        className: 'px-2 py-0.5 bg-emerald-800 hover:bg-emerald-700 text-white font-arcade text-[6px] rounded border border-emerald-400'
                      }, `✂️ ${currentLang === 'fr' ? 'Tailler' : 'Chop'} ${clash.treeA.name}`),
                      clash.treeB.isSupportSpecies && React.createElement('button', {
                        onClick: () => onChopAndDrop(clash.treeB.id),
                        className: 'px-2 py-0.5 bg-emerald-800 hover:bg-emerald-700 text-white font-arcade text-[6px] rounded border border-emerald-400'
                      }, `✂️ ${currentLang === 'fr' ? 'Tailler' : 'Chop'} ${clash.treeB.name}`)
                    )
                  ))
                ) : (
                  React.createElement('div', { className: 'p-8 text-center text-slate-400 italic bg-black/40 rounded-xl' },
                    currentLang === 'fr'
                      ? '✓ Aucun encombrement de canopée. Les arbres adultes disposent d\'un espacement adéquat.'
                      : '✓ No canopy interlocking crowding detected. Mature trees have adequate spacing.'
                  )
                )
              ),

              // TAB 3: NURSE SHADE
              activeTab === 'nurse' && (
                shadeTelemetry.beneficialNurseShades.length > 0 ? (
                  shadeTelemetry.beneficialNurseShades.map((nurse, idx) => React.createElement('div', {
                    key: idx,
                    className: 'p-3 rounded-xl bg-teal-950/40 border border-teal-500/60 space-y-1'
                  },
                    React.createElement('div', { className: 'flex justify-between items-center' },
                      React.createElement('span', { className: 'font-bold text-teal-300 text-xs' }, `❄️ ${nurse.benefitedCrop.name}`),
                      React.createElement('span', { className: 'font-arcade text-[6.5px] px-1.5 py-0.5 rounded bg-teal-950 text-teal-200 border border-teal-500' },
                        `+${nurse.coolingRatingPct}% ${currentLang === 'fr' ? 'PROTECTION ESTIVALE' : 'COOLING BENEFIT'}`
                      )
                    ),
                    React.createElement('p', { className: 'text-[9.5px] text-slate-300 leading-relaxed' }, nurse.note)
                  ))
                ) : (
                  React.createElement('div', { className: 'p-8 text-center text-slate-400 italic bg-black/40 rounded-xl' },
                    currentLang === 'fr'
                      ? 'Aucune ombre bienfaisante active actuellement. Les ombrages bénéfiques pour les salades et épinards se manifestent en plein été (mai-août).'
                      : 'No active nurse shading currently. Summer cooling benefits activate during peak heat months (May - August).'
                  )
                )
              ),

              // TAB 4: ALL CROPS / SOLAR REGISTRY
              activeTab === 'all' && React.createElement('div', { className: 'space-y-1.5' },
                plants.map(p => {
                  const shadeInfo = shadeTelemetry.plantShadeMap?.[p.id] || { solarAccessPct: 100, isObscured: false, isBenefited: false };
                  const lightProf = getPlantLightProfile(p);
                  const tierBadgeColor = lightProf.tier === 'heliophile' ? 'bg-amber-950 text-amber-300 border-amber-500/50'
                    : lightProf.tier === 'sciaphile' ? 'bg-teal-950 text-teal-300 border-teal-500/50'
                    : lightProf.tier === 'canopy_dominant' ? 'bg-purple-950 text-purple-300 border-purple-500/50'
                    : 'bg-slate-900 text-slate-300 border-slate-700';

                  const solarPct = shadeInfo.solarAccessPct;
                  const barColor = solarPct >= 80 ? 'bg-emerald-500' : solarPct >= 50 ? 'bg-amber-400' : 'bg-rose-500';

                  return React.createElement('div', {
                    key: p.id,
                    className: 'p-2.5 rounded-lg border border-slate-800 bg-slate-900/60 flex items-center justify-between gap-3'
                  },
                    React.createElement('div', { className: 'min-w-0 flex-1' },
                      React.createElement('div', { className: 'flex items-center gap-2 mb-0.5' },
                        React.createElement('span', { className: 'font-bold text-white text-xs truncate' }, p.name),
                        React.createElement('span', { className: `font-arcade text-[5.5px] px-1.5 py-0.5 rounded border ${tierBadgeColor}` },
                          lightProf.tier.toUpperCase()
                        )
                      ),
                      React.createElement('div', { className: 'flex items-center gap-2 text-[8px] text-slate-400' },
                        React.createElement('span', null, `${p.line ? `Bed ${p.line}` : `Zone ${p.zone}`}`),
                        React.createElement('span', null, `• ${lightProf.minSunHours}h sun needed`),
                        shadeInfo.primaryAggressorName && React.createElement('span', { className: 'text-rose-400' },
                          `• Shaded by: ${shadeInfo.primaryAggressorName}`
                        )
                      )
                    ),
                    React.createElement('div', { className: 'flex items-center gap-2.5 flex-shrink-0' },
                      React.createElement('div', { className: 'w-24 text-right' },
                        React.createElement('div', { className: 'flex justify-between text-[7px] font-mono text-slate-300 mb-0.5' },
                          React.createElement('span', null, 'SOLAR:'),
                          React.createElement('span', { className: 'font-bold' }, `${solarPct}%`)
                        ),
                        React.createElement('div', { className: 'w-full h-1.5 bg-slate-800 rounded-full overflow-hidden' },
                          React.createElement('div', { className: `h-full ${barColor}`, style: { width: `${solarPct}%` } })
                        )
                      ),
                      React.createElement('span', {
                        className: `font-arcade text-[6px] px-1.5 py-0.5 rounded border ${
                          shadeInfo.isObscured ? 'bg-rose-950 text-rose-300 border-rose-500'
                          : shadeInfo.isBenefited ? 'bg-teal-950 text-teal-300 border-teal-500'
                          : 'bg-emerald-950 text-emerald-300 border-emerald-500'
                        }`
                      },
                        shadeInfo.isObscured ? '⚠️ DEFICIT'
                        : shadeInfo.isBenefited ? '❄️ NURSED'
                        : '✓ OPTIMAL'
                      )
                    )
                  );
                })
              )
            ),

            // Bottom Action Bar
            React.createElement('div', { className: 'flex justify-between items-center border-t border-slate-800 pt-2.5 flex-wrap gap-2' },
              React.createElement('button', {
                onClick: copyReport,
                className: 'px-3 py-1.5 rounded bg-slate-900 border border-slate-700 hover:border-amber-400 text-amber-300 font-arcade text-[6.5px] active:scale-95 flex items-center gap-1'
              }, copied ? '✓ COPIED!' : '📋 COPY SHADE AUDIT'),

              React.createElement('div', { className: 'flex items-center gap-2' },
                apiKey && onAskGemini && React.createElement('button', {
                  onClick: onAskGemini,
                  className: 'px-3.5 py-1.5 rounded bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-arcade text-[7px] border border-purple-400 shadow active:scale-95 flex items-center gap-1'
                }, currentLang === 'fr' ? '🤖 CONSEIL TAILLE GEMINI' : '🤖 ASK GEMINI CANOPY ADVICE'),

                React.createElement('button', {
                  onClick: onClose,
                  className: 'px-4 py-1.5 rounded bg-slate-900 border border-slate-700 font-arcade text-[7px] text-slate-300'
                }, currentLang === 'fr' ? 'FERMER' : 'CLOSE')
              )
            )
          )
        );
      }

      // Render Application to DOM
      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(FoodForestDashboard));
    </script>
  </body>
</html>
