      // ======================================================================
      function getSystemDateContext() {
        let year = 2026;
        let month = 9;
        let day = 26;
        let hours = 8;
        let minutes = 46;
        try {
          const now = new Date();
          const y = now.getFullYear();
          if (!isNaN(y) && y >= 2020 && y <= 2050) {
            year = y;
            month = now.getMonth() + 1; // 1-12
            day = now.getDate();
            hours = now.getHours();
            minutes = now.getMinutes();
          }
        } catch (e) {}

        const timeDecimal = hours + (minutes / 60);
        const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        
        // Atmospheric diurnal phase mapping
        let diurnalPhase = 'night';
        if (timeDecimal >= 6.0 && timeDecimal < 8.5) {
          diurnalPhase = 'twilight'; // Dawn / Early morning
        } else if (timeDecimal >= 8.5 && timeDecimal < 18.0) {
          diurnalPhase = 'day'; // Daylight insolation
        } else if (timeDecimal >= 18.0 && timeDecimal < 21.0) {
          diurnalPhase = 'dusk'; // Sunset / Golden hour
        } else {
          diurnalPhase = 'night'; // Nocturnal / Stars
        }
        
        // Continuous float representing day progress through the year's month
        const monthFloat = Math.max(1, Math.min(12.99, month + (day - 1) / 30.5));
        const isoDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const fullTimestamp = `${isoDate} ${timeStr}`;
        return { year, month, day, hours, minutes, timeStr, timeDecimal, diurnalPhase, monthFloat, isoDate, fullTimestamp };
      }

      // 2. OFFLINE PARSER & HEURISTIC ENGINE (Trees + Garden Polycultures)
      // ======================================================================
      function matchBotanicalProfile(rawName) {
        const lower = rawName.toLowerCase();
        for (const item of BOTANICAL_DICTIONARY) {
          if (item.keywords.some(kw => lower.includes(kw))) {
            return item;
          }
        }

        // Contextual vegetable fallback detection
        const isVegClimbing = lower.includes("tomato") || lower.includes("bean") || lower.includes("pea") || lower.includes("cucumber");
        const isVegRoot = lower.includes("carrot") || lower.includes("radish") || lower.includes("beet") || lower.includes("potato") || lower.includes("onion") || lower.includes("garlic");
        const isVegLeafy = lower.includes("lettuce") || lower.includes("salad") || lower.includes("cabbage") || lower.includes("kale") || lower.includes("spinach");

        if (isVegClimbing || isVegRoot || isVegLeafy) {
          return {
            name: rawName,
            commonName: rawName,
            botanicalName: "Garden Cultivar",
            category: isVegRoot ? "vegetable_root" : isVegLeafy ? "vegetable_leafy" : "vegetable_fruit",
            lifecycleType: "annual",
            isVegetable: true,
            growthHabit: isVegClimbing ? "climbing_trellis" : isVegRoot ? "root_subterranean" : "rosette",
            daysToMaturity: isVegRoot ? 65 : isVegLeafy ? 45 : 75,
            spacingCm: isVegRoot ? 10 : isVegLeafy ? 25 : 45,
            growthRate: 0.3,
            maxHeight: isVegClimbing ? 1.5 : 0.4,
            crownDiameter: 0.4,
            foliageType: "broadleaf",
            barkColor: "#15803d",
            foliageColor: "#22c55e",
            fruitColor: "#ea580c",
            harvestSeason: "Summer",
            companionPlants: ["Basil", "Marigold", "Lettuce"],
            notes: "Vegetable garden specimen automatically categorized by the botanical engine."
          };
        }

        return {
          name: rawName,
          commonName: rawName,
          botanicalName: "Specimen",
          category: lower.includes("willow") || lower.includes("poplar") ? "support_pioneer" : "fruit_tree",
          lifecycleType: "perennial",
          isVegetable: false,
          growthRate: 0.40,
          maxHeight: 4.5,
          crownDiameter: 3.0,
          foliageType: "broadleaf",
          barkColor: "#451a03",
          foliageColor: "#22c55e",
          fruitColor: "#f97316",
          harvestSeason: "Autumn",
          isSupportSpecies: lower.includes("willow") || lower.includes("poplar") || lower.includes("support")
        };
      }

      function extractDirectionalContext(text) {
        const lower = text.toLowerCase();
        let cardinalSector = "S";
        let sunAspect = "Full Sun";
        let boundaryAssignment = "Central Food Forest Alley";
        let landmarkAnchor = "Tree Line Bed";

        if (/\b(north[- ]?west|nw|nord[- ]?ouest)\b/i.test(lower)) {
          cardinalSector = "NW";
          sunAspect = "Afternoon Sun / West Wind Exposure";
          boundaryAssignment = "North-Western Perimeter Windbreak";
        } else if (/\b(north[- ]?east|ne|nord[- ]?est)\b/i.test(lower)) {
          cardinalSector = "NE";
          sunAspect = "Morning Sun / Cold Wind Shield";
          boundaryAssignment = "North-Eastern Perimeter Shelter";
        } else if (/\b(south[- ]?west|sw|sud[- ]?ouest)\b/i.test(lower)) {
          cardinalSector = "SW";
          sunAspect = "High Solar Insolation / Afternoon Warmth";
          boundaryAssignment = "South-Western Solar Guild";
        } else if (/\b(south[- ]?east|se|sud[- ]?est)\b/i.test(lower)) {
          cardinalSector = "SE";
          sunAspect = "Gentle Morning Warmth / Early Solar Gain";
          boundaryAssignment = "South-Eastern High-Light Zone";
        } else if (/\b(north|northern|nord|septentrional)\b/i.test(lower)) {
          cardinalSector = "N";
          sunAspect = "North Windbreak / Climax Canopy Shade";
          boundaryAssignment = "Northern Boundary Climax Forest";
        } else if (/\b(south|southern|sud|plein sud)\b/i.test(lower)) {
          cardinalSector = "S";
          sunAspect = "Full South Sun Exposure";
          boundaryAssignment = "Southern Agroforestry Alley";
        } else if (/\b(east|eastern|est|levant)\b/i.test(lower)) {
          cardinalSector = "E";
          sunAspect = "Morning Sun / East Exposure";
          boundaryAssignment = "Eastern Boundary Buffer";
        } else if (/\b(west|western|ouest|couchant)\b/i.test(lower)) {
          cardinalSector = "W";
          sunAspect = "Afternoon Heat & West Winds";
          boundaryAssignment = "Western Windbreak Screen";
        }

        if (/\b(raised bed|potager|vegetable bed|planche|bac|serre)\b/i.test(lower)) {
          boundaryAssignment = "Intensive Vegetable Raised Bed";
          landmarkAnchor = "Kitchen Garden Raised Bed";
        } else if (/\b(greenhouse|polytunnel|serre|tunnel|châssis)\b/i.test(lower)) {
          landmarkAnchor = "Solar Polytunnel & Nursery";
        } else if (/\b(chicken\s*(?:run|coop)?|poulailler|hens)\b/i.test(lower)) {
          landmarkAnchor = "Chicken Run Forage Border";
        } else if (/\b(house|homestead|maison|home|courtyard|kitchen|patio)\b/i.test(lower)) {
          landmarkAnchor = "Homestead & Kitchen Courtyard";
        } else if (/\b(pond|mare|bassin|lake|water)\b/i.test(lower)) {
          landmarkAnchor = "Wildlife Pond & Aquatic Margin";
        } else if (/\b(swale|fossé|baissière|contour)\b/i.test(lower)) {
          landmarkAnchor = "Hydrological Swale Contour";
        }

        return { cardinalSector, sunAspect, boundaryAssignment, landmarkAnchor };
      }

      function parseOfflineText(text) {
        if (!text || !text.trim()) return [];
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        const results = [];
        let autoLine = 1;
        let lineCounters = { 1: 1, 2: 1, 3: 1 };

        const isDelimited = lines.some(l => l.includes(",") || l.includes("\t") || l.includes(";"));
        const firstLine = lines[0].toLowerCase();
        const isHeader = (firstLine.includes("name") || firstLine.includes("species") || firstLine.includes("crop") || firstLine.includes("tree")) && (firstLine.includes(",") || firstLine.includes("\t") || firstLine.includes(";"));

        if (isDelimited && (isHeader || lines.length > 2)) {
          const delim = lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
          const startIndex = isHeader ? 1 : 0;
          let headerCols = isHeader ? lines[0].split(delim).map(c => c.trim().toLowerCase().replace(/['"]/g, "")) : ["name", "line", "position", "height"];

          for (let i = startIndex; i < lines.length; i++) {
            const rawCols = lines[i].split(delim).map(c => c.trim().replace(/^['"]|['"]$/g, ""));
            if (rawCols.length === 0 || !rawCols[0]) continue;

            const row = {};
            headerCols.forEach((col, idx) => { row[col] = rawCols[idx] || ""; });

            const name = row.name || row.species || row.crop || row.tree || rawCols[0];
            if (!name || name.length < 2) continue;

            const profile = matchBotanicalProfile(name);
            const lineNum = Number(row.line || row.row || row.bed || autoLine) || autoLine;
            const linePos = Number(row.position || row.pos || lineCounters[lineNum] || 1);
            lineCounters[lineNum] = linePos + 1;

            const heightMatch = (row.height || lines[i]).match(/(\d+(\.\d+)?)\s*(m|meter|meters|cm)?/i);
            const initialHeight = heightMatch ? (heightMatch[3]?.toLowerCase() === 'cm' ? Number(heightMatch[1])/100 : Number(heightMatch[1])) : (profile.isVegetable ? profile.maxHeight : profile.growthRate * 2);

            const yearMatch = (row.planted || row.year || lines[i]).match(/\b(20\d\d)\b/);
            const plantedYear = yearMatch ? Number(yearMatch[1]) : 2025;

            const combinedText = `${lines[i]} ${row.sector || ''} ${row.aspect || ''} ${row.landmark || ''}`;
            const dirContext = extractDirectionalContext(combinedText);

            results.push({
              id: `parsed-${Date.now()}-${results.length + 1}`,
              name: name,
              commonName: profile.commonName || name,
              botanicalName: profile.botanicalName,
              category: row.category || profile.category,
              lifecycleType: profile.lifecycleType || "perennial",
              isVegetable: profile.isVegetable || false,
              growthHabit: profile.growthHabit || "upright",
              daysToMaturity: Number(row.days || row.maturity) || profile.daysToMaturity || null,
              spacingCm: Number(row.spacing) || profile.spacingCm || 30,
              companionPlants: profile.companionPlants || [],
              zone: Number(row.zone) || (dirContext.landmarkAnchor.includes("Kitchen") ? 1 : 2),
              line: lineNum,
              linePosition: linePos,
              plantedYear: plantedYear,
              initialHeightMeters: initialHeight || 0.4,
              maxHeightMeters: profile.maxHeight,
              growthRateMPerYear: profile.growthRate,
              crownDiameterMax: profile.crownDiameter,
              foliageType: profile.foliageType,
              barkColor: profile.barkColor,
              foliageColor: profile.foliageColor,
              fruitColor: profile.fruitColor,
              bloomColor: profile.bloomColor,
              harvestSeason: profile.harvestSeason,
              isSupportSpecies: profile.isSupportSpecies || false,
              nitrogenFixer: profile.nitrogenFixer || false,
              cardinalSector: row.sector || dirContext.cardinalSector,
              sunAspect: row.aspect || dirContext.sunAspect,
              boundaryAssignment: dirContext.boundaryAssignment,
              landmarkAnchor: dirContext.landmarkAnchor,
              notes: row.notes || profile.notes || `Specimen imported via table parser.`,
              status: "thriving"
            });
          }
          if (results.length > 0) return results;
        }

        lines.forEach(rawLine => {
          let lineStr = rawLine.replace(/^[-*•#|0-9.)\s]+/, "").trim();
          if (lineStr.length < 2) return;

          const lineMatch = rawLine.match(/(?:line|row|ligne|rang|bed|bac)\s*([0-9]{1,2})/i);
          const currentLine = lineMatch ? Number(lineMatch[1]) : autoLine;

          const posMatch = rawLine.match(/(?:pos|position|#)\s*([0-9]{1,2})/i);
          const currentPos = posMatch ? Number(posMatch[1]) : (lineCounters[currentLine] || 1);
          lineCounters[currentLine] = currentPos + 1;

          const profile = matchBotanicalProfile(lineStr);
          const dirContext = extractDirectionalContext(rawLine);

          results.push({
            id: `parsed-${Date.now()}-${results.length + 1}`,
            name: lineStr.split(/[,;(]/)[0].trim() || profile.name,
            commonName: profile.commonName,
            botanicalName: profile.botanicalName,
            category: profile.category,
            lifecycleType: profile.lifecycleType || "perennial",
            isVegetable: profile.isVegetable || false,
            growthHabit: profile.growthHabit || "upright",
            daysToMaturity: profile.daysToMaturity || null,
            spacingCm: profile.spacingCm || 30,
            companionPlants: profile.companionPlants || [],
            zone: dirContext.landmarkAnchor.includes("Kitchen") ? 1 : 2,
            line: currentLine,
            linePosition: currentPos,
            plantedYear: 2025,
            initialHeightMeters: profile.isVegetable ? profile.maxHeight : (profile.growthRate * 2.2),
            maxHeightMeters: profile.maxHeight,
            growthRateMPerYear: profile.growthRate,
            crownDiameterMax: profile.crownDiameter,
            foliageType: profile.foliageType,
            barkColor: profile.barkColor,
            foliageColor: profile.foliageColor,
            fruitColor: profile.fruitColor,
            bloomColor: profile.bloomColor,
            harvestSeason: profile.harvestSeason,
            isSupportSpecies: profile.isSupportSpecies || false,
            nitrogenFixer: profile.nitrogenFixer || false,
            cardinalSector: dirContext.cardinalSector,
            sunAspect: dirContext.sunAspect,
            boundaryAssignment: dirContext.boundaryAssignment,
            landmarkAnchor: dirContext.landmarkAnchor,
            notes: profile.notes || `Extracted from garden log: "${rawLine.slice(0, 90)}"`,
            status: "thriving"
          });
        });

        return results;
      }

      // ======================================================================
      // 3. SOUND ENGINE
      // ======================================================================
      class RetroSoundEngine {
        constructor() {
          this.ctx = null;
          this.isMuted = false;
        }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted')) {
            this.ctx.resume().catch(() => {});
          }
        }
        playTone(freq, duration = 0.1, type = 'sine', vol = 0.12) {
          if (!this.ctx || this.isMuted) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            const now = this.ctx.currentTime;
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(vol, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration);
          } catch(e) {}
        }
        playWindWhoosh() {
          this.init();
          if (!this.ctx || this.isMuted) return;
          try {
            const now = this.ctx.currentTime;
            const dur = 0.6;
            const buffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(300, now);
            filter.frequency.exponentialRampToValueAtTime(1100, now + dur * 0.4);
            filter.frequency.exponentialRampToValueAtTime(250, now + dur);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            noise.connect(filter);

      function calculateHarvestTelemetry(plants, simulatedYears, baselineYear = 2025, timeScale = 'macro', microMonth = 7) {
        const currentYear = baselineYear + simulatedYears;
        let totalCurrentYield = 0;
        let totalMatureYield = 0;
        let bearingTreesCount = 0;
        let totalFruitingCount = 0;
        let activeHarvestCropsCount = 0;
        const activeHarvestCropsList = [];
        const byCategory = { stone: 0, pome: 0, berry_nut: 0, vegetable: 0, exotic: 0 };

        plants.forEach(p => {
          if (p.isSupportSpecies || p.category === 'support_pioneer' || p.category === 'canopy_timber') return;
          totalFruitingCount++;
          
          const nameLower = (p.name + " " + (p.commonName || "")).toLowerCase();
          const pheno = getCropMicroPhenology(p, microMonth);

          if (p.isVegetable || p.category?.startsWith('vegetable_') || p.lifecycleType === 'annual') {
            const vegAnnualMature = nameLower.includes("zucchini") ? 14 : nameLower.includes("squash") ? 16 : nameLower.includes("tomato") ? 10 : 5;
            totalMatureYield += vegAnnualMature;

            if (timeScale === 'micro') {
              if (pheno.inHarvest) {
                activeHarvestCropsCount++;
                activeHarvestCropsList.push(p.name);
                totalCurrentYield += pheno.monthlyKg;
                byCategory.vegetable += pheno.monthlyKg;
              }
            } else {
              // Macro 10-year scale: annual vegetables yield steadily every year
              bearingTreesCount++;
              totalCurrentYield += vegAnnualMature;
              byCategory.vegetable += vegAnnualMature;
            }
            return;
          }

          // Perennial Orchard Species
          let baseMatureKg = 25;
          let cat = "exotic";
          if (nameLower.includes("apple") || nameLower.includes("pear") || nameLower.includes("quince")) {
            baseMatureKg = nameLower.includes("crab") ? 15 : 45;
            cat = "pome";
          } else if (nameLower.includes("plum") || nameLower.includes("mirabelle") || nameLower.includes("peach") || nameLower.includes("apricot") || nameLower.includes("cherry")) {
            baseMatureKg = 35;
            cat = "stone";
          } else if (nameLower.includes("hazel") || nameLower.includes("walnut") || nameLower.includes("almond") || nameLower.includes("chestnut") || nameLower.includes("berry") || nameLower.includes("currant")) {
            baseMatureKg = 12;
            cat = "berry_nut";
          } else {
            baseMatureKg = 20;
            cat = "exotic";
          }

          totalMatureYield += baseMatureKg;
          const firstFruitYear = (p.plantedYear || baselineYear) + 2;

          if (timeScale === 'micro') {
            if (pheno.inHarvest) {
              activeHarvestCropsCount++;
              activeHarvestCropsList.push(p.name);
              totalCurrentYield += pheno.monthlyKg;
              byCategory[cat] = (byCategory[cat] || 0) + pheno.monthlyKg;
            }
          } else {
            if (currentYear >= firstFruitYear) {
              bearingTreesCount++;
              const ageBearing = currentYear - firstFruitYear + 0.5;
              const maturityRatio = Math.min(1.0, Math.max(0.25, ageBearing / 3.5));
              const currentYield = Math.round(baseMatureKg * maturityRatio);
              totalCurrentYield += currentYield;
              byCategory[cat] = (byCategory[cat] || 0) + currentYield;
            }
          }
        });

        const capacityPct = totalMatureYield > 0 ? Math.min(100, Math.round((totalCurrentYield / totalMatureYield) * 100)) : 0;
        return {
          totalCurrentYield: Math.round(totalCurrentYield),
          totalMatureYield,
          capacityPct,
          bearingTreesCount,
          totalFruitingCount,
          activeHarvestCropsCount,
          activeHarvestCropsList,
          byCategory
        };
      }

      function calculateBiomassTelemetry(plants, simulatedYears, coppiceCount = 0, timeScale = 'macro', microMonth = 7) {
        const supportPlants = plants.filter(p => p.isSupportSpecies || p.category === 'support_pioneer');
        let readyCount = 0;
        let availableBiomassKg = 0;

        supportPlants.forEach(p => {
          const currentHeight = (p.initialHeightMeters || 0.6) + (p.growthRateMPerYear || 1.2) * (timeScale === 'micro' ? 1.0 : simulatedYears);
          const spread = Math.min(p.crownDiameterMax || 3, (p.crownDiameterMax || 2.5) * 0.6 + (timeScale === 'micro' ? 0.3 : simulatedYears * 0.2));
          const biomass = p.status === 'coppiced' ? 2 : Math.max(5, Math.round(currentHeight * spread * 4.2));
          availableBiomassKg += biomass;

          if (currentHeight >= 1.8 && p.status !== 'coppiced') {
            readyCount++;
          }
        });

        // Add garden vegetable biomass in micro mode (prunings, sucker pinchings, vine clearance)
        if (timeScale === 'micro') {
          const m = Math.floor(microMonth);
          const gardenGreenMulch = m >= 5 && m <= 10 ? 25 + m * 3 : 10;
          availableBiomassKg += gardenGreenMulch;
        }

        const seasonFraction = timeScale === 'micro' ? ((microMonth - 1) / 12) : (simulatedYears % 1);
        const isSpring = seasonFraction >= 0.15 && seasonFraction < 0.38;
        const isAutumn = seasonFraction >= 0.65 && seasonFraction < 0.88;
        const isOptimalWindow = isSpring || isAutumn;

        let windowName = isSpring ? "🌸 Spring Chop Window" : isAutumn ? "🍂 Autumn Mulch Window" : "☀️ Summer Aeration Window";
        let urgencyBase = (seasonFraction * 75) % 100;
        if (isOptimalWindow) urgencyBase += 20;
        urgencyBase -= Math.min(50, coppiceCount * 7);
        const urgencyPct = Math.max(10, Math.min(99, Math.round(urgencyBase)));

        return {
          supportCount: supportPlants.length,
          readyCount,
          availableBiomassKg,
          urgencyPct,
          windowName,
          isOptimalWindow
        };
      }

      function calculateEcologyTelemetry(plants, simulatedYears, baselineYear = 2025) {
        const currentYear = baselineYear + simulatedYears;
        const seasonFraction = (simulatedYears % 1);
        const isLateSummerAutumn = seasonFraction >= 0.45 && seasonFraction < 0.85;
        
        let severeHornetRiskTrees = 0;
        let moderateWaspRiskTrees = 0;
        let pollinatorHubCount = 0;
        let companionFlowerCount = 0;

        plants.forEach(p => {
          const nameLower = (p.name + " " + (p.commonName || "") + " " + (p.botanicalName || "")).toLowerCase();
          const isBearing = currentYear >= ((p.plantedYear || baselineYear) + 2);

          if (p.category === 'companion_flower' || nameLower.includes('marigold') || nameLower.includes('nasturtium') || nameLower.includes('borage')) {
            companionFlowerCount++;
          }

          if (nameLower.includes("willow") || nameLower.includes("paulownia") || nameLower.includes("locust") || nameLower.includes("hazel") || nameLower.includes("comfrey") || nameLower.includes("clover") || p.category === 'companion_flower') {
            pollinatorHubCount++;
          }

          if (isBearing && isLateSummerAutumn) {
            if (nameLower.includes("fig") || nameLower.includes("pear")) {
              severeHornetRiskTrees++;
            } else if (nameLower.includes("plum") || nameLower.includes("mirabelle") || nameLower.includes("peach") || nameLower.includes("grape")) {
              moderateWaspRiskTrees++;
            }
          }
        });

        return {
          severeHornetRiskTrees,
          moderateWaspRiskTrees,
          pollinatorHubCount,
          companionFlowerCount,
          isWarningActive: severeHornetRiskTrees > 0
        };
      }

      function calculateSuccessionTelemetry(plants, microMonthFloat, simulatedYears, timeScale = 'micro') {
        const m = Math.max(1, Math.min(12, Math.floor(microMonthFloat)));
        const sowIndoorList = [];
        const directSowList = [];
        const transplantList = [];
        const activeHarvestList = [];
        const restingList = [];

        const bedsSet = new Set();
        let raisedBedCount = 0;
        let orchardLineCount = 0;
        let totalVegetableSpecimens = 0;
        let nitrogenFixerCount = 0;
        let companionShieldCount = 0;

        plants.forEach(p => {
          const lineNum = Number(p.line) || 1;
          bedsSet.add(lineNum);
          const isVeg = p.isVegetable || p.lifecycleType === 'annual' || p.category?.startsWith('vegetable_');
          if (isVeg) totalVegetableSpecimens++;
          if (p.nitrogenFixer) nitrogenFixerCount++;
          if (p.category === 'companion_flower' || /marigold|tagetes|nasturtium|borage/i.test(p.name)) companionShieldCount++;

          const pheno = getCropMicroPhenology(p, m);
          const nameLower = (p.name + " " + (p.commonName || "")).toLowerCase();

          if (pheno.inHarvest) {
            activeHarvestList.push({ name: p.name, category: p.category, monthlyKg: pheno.monthlyKg, bed: lineNum });
          } else if (pheno.stage === 'sown') {
            if (nameLower.includes("tomato") || nameLower.includes("pepper") || nameLower.includes("eggplant")) {
              sowIndoorList.push({ name: p.name, bed: lineNum, days: p.daysToMaturity || 75 });
            } else {
              directSowList.push({ name: p.name, bed: lineNum, days: p.daysToMaturity || 50 });
            }
          } else if (pheno.stage === 'vegetative' && m === 5) {
            transplantList.push({ name: p.name, bed: lineNum });
          } else if (pheno.stage === 'dormant') {
            restingList.push({ name: p.name, bed: lineNum });
          }
        });

        bedsSet.forEach(l => {
          const bedPlants = plants.filter(p => Number(p.line) === l);
          const hasVeg = bedPlants.some(p => p.isVegetable || p.lifecycleType === 'annual');
          if (hasVeg) raisedBedCount++;
          else orchardLineCount++;
        });

        const activePickingCrops = activeHarvestList.length;
        const totalSowingNow = sowIndoorList.length + directSowList.length;
        const successionScore = Math.min(100, Math.round((activePickingCrops * 15) + (totalSowingNow * 10) + (companionShieldCount * 8)));

        return {
          currentMonthNum: m,
          sowIndoorList,
          directSowList,
          transplantList,
          activeHarvestList,
          restingList,
          totalBeds: bedsSet.size,
          raisedBedCount,
          orchardLineCount,
          totalVegetableSpecimens,
          nitrogenFixerCount,
          companionShieldCount,
          successionScore
        };
      }

      const DEFAULT_PLANTS = createStarterTemplatePlants(SYSTEM_DATE.year);

      // Baseline year is the earliest planting date among the template plants (6 years prior to present year)

        name: "UNIVERSAL TREE + GARDEN TRACKER",
        location: "Permaculture Food Forest & Raised Beds • Zone 8b",
        baselineYear: SYSTEM_DATE.year - 6,
        currentObservationYear: SYSTEM_DATE.year

      // ======================================================================
      // 5. MAIN DASHBOARD APPLICATION COMPONENT
      // ======================================================================
      function FoodForestDashboard() {
        const sysDate = useMemo(() => getSystemDateContext(), []);
        const [currentTimeInfo, setCurrentTimeInfo] = useState(() => getSystemDateContext());

        // Refresh time context every 30 seconds to maintain synchronized diurnal tracking
        useEffect(() => {
          const timer = setInterval(() => {
            setCurrentTimeInfo(getSystemDateContext());
          }, 30000);
          return () => clearInterval(timer);
        }, []);

        const [gardenMeta, setGardenMeta] = useState(() => {
          try {
            const savedName = localStorage.getItem('ff_garden_name');
            const savedLoc = localStorage.getItem('ff_garden_location');
            const savedYear = Number(localStorage.getItem('ff_garden_year'));
            return {
              name: savedName || DEFAULT_GARDEN_META.name,
              location: savedLoc || DEFAULT_GARDEN_META.location,
              baselineYear: !isNaN(savedYear) && savedYear > 1950 ? savedYear : (sysDate.year - 6),
              currentObservationYear: sysDate.year
            };
          } catch(e) {
            return DEFAULT_GARDEN_META;
          }
        });

        // Initialize plants: upgrade automatically if user has older template or none
        const [plants, setPlants] = useState(() => {
          try {
            const ver = localStorage.getItem('ff_template_ver');
            const saved = localStorage.getItem('ff_plants_data');
            if (saved && ver === STARTER_TEMPLATE_VERSION) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch(e) {}
          return DEFAULT_PLANTS;
        });

        const [apiKey, setApiKey] = useState(() => {
          return localStorage.getItem('ff_gemini_api_key') || '';
        });

        const [sectorConfig, setSectorConfig] = useState(() => {
          try {
            const saved = localStorage.getItem('ff_sector_config');
            return saved ? JSON.parse(saved) : DEFAULT_SECTOR_CONFIG;
          } catch(e) {
            return DEFAULT_SECTOR_CONFIG;
          }
        });

        const [pruningHistory, setPruningHistory] = useState(() => {
          try {
            const saved = localStorage.getItem('ff_pruning_history');
            return saved ? JSON.parse(saved) : [];
          } catch(e) {
            return [];
          }
        });

        useEffect(() => {
          try {
            localStorage.setItem('ff_template_ver', STARTER_TEMPLATE_VERSION);
            localStorage.setItem('ff_plants_data', JSON.stringify(plants));
            localStorage.setItem('ff_garden_name', gardenMeta.name);
            localStorage.setItem('ff_garden_location', gardenMeta.location);
            localStorage.setItem('ff_garden_year', String(gardenMeta.baselineYear));
            localStorage.setItem('ff_pruning_history', JSON.stringify(pruningHistory));
            localStorage.setItem('ff_sector_config', JSON.stringify(sectorConfig));
          } catch(e) {}
        }, [plants, gardenMeta, pruningHistory, sectorConfig]);

        // Calculate the initial elapsed years from earliest planting (baselineYear) to today
        const initialSimulatedYears = useMemo(() => {
          const diff = sysDate.year - (gardenMeta.baselineYear || (sysDate.year - 6));
          return Math.max(0, Math.min(10, diff));
        }, [gardenMeta.baselineYear, sysDate.year]);

        const [activeView, setActiveView] = useState('tree_lines');
        
        // DUAL-SCALE TIME STATE
        const [timeScale, setTimeScale] = useState('macro'); // 'macro' | 'micro'
        // Macro Scale: Starts synchronized to today's year relative to earliest planting!
        const [simulatedTimeSeconds, setSimulatedTimeSeconds] = useState(() => (initialSimulatedYears / 10) * 600);
        const [simulatedYears, setSimulatedYears] = useState(() => initialSimulatedYears);
        
        // Micro Scale: Starts synchronized to the browser's current month!
        const [microMonth, setMicroMonth] = useState(() => sysDate.monthFloat);
        
        const [isPlayingTime, setIsPlayingTime] = useState(false);
        const [playbackSpeed, setPlaybackSpeed] = useState(1);
        const [coppiceCount, setCoppiceCount] = useState(0);
        const [activeLineFilter, setActiveLineFilter] = useState('all');
        const [selectedPlant, setSelectedPlant] = useState(null);

        const resetToStarterTemplate = () => {
          soundEngine.playChime();
          const freshPlants = createStarterTemplatePlants(sysDate.year);
          const freshMeta = {
            name: DEFAULT_GARDEN_META.name,
            location: DEFAULT_GARDEN_META.location,
            baselineYear: sysDate.year - 6,
            currentObservationYear: sysDate.year
          };
          setPlants(freshPlants);
          setGardenMeta(freshMeta);
          setSimulatedYears(6.0);
          setSimulatedTimeSeconds(360);
          setMicroMonth(sysDate.monthFloat);
          setToast({ text: `↺ Template reset to present date & time: ${CALENDAR_MONTHS[sysDate.month - 1].name} ${sysDate.year} at ${sysDate.timeStr} (${sysDate.diurnalPhase.toUpperCase()})`, color: "#34d399" });
        };
        
        // Modals
        const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
        const [isBrandingModalOpen, setIsBrandingModalOpen] = useState(false);
        const [isPruningModalOpen, setIsPruningModalOpen] = useState(false);
        const [isExportModalOpen, setIsExportModalOpen] = useState(false);
        const [isSuccessionModalOpen, setIsSuccessionModalOpen] = useState(false);
        const [isChatModalOpen, setIsChatModalOpen] = useState(false);
        const [isCalibrationModalOpen, setIsCalibrationModalOpen] = useState(false);
        const [isSectorAuditModalOpen, setIsSectorAuditModalOpen] = useState(false);
        const [isDropActive, setIsDropActive] = useState(false);
        const [toast, setToast] = useState(null);

        const availableLines = useMemo(() => {
          const lines = new Set();
          plants.forEach(p => {
            if (p.line != null && !isNaN(p.line)) {
              lines.add(Number(p.line));
            }
          });
          return lines.size > 0 ? Array.from(lines).sort((a, b) => a - b) : [1];
        }, [plants]);

        const currentMonthInfo = useMemo(() => {
          const idx = Math.max(0, Math.min(11, Math.floor(microMonth) - 1));
          return CALENDAR_MONTHS[idx];
        }, [microMonth]);

        const harvestTelemetry = useMemo(() => {
          return calculateHarvestTelemetry(plants, simulatedYears, gardenMeta.baselineYear, timeScale, microMonth);
        }, [plants, simulatedYears, gardenMeta.baselineYear, timeScale, microMonth]);

        const biomassTelemetry = useMemo(() => {
          return calculateBiomassTelemetry(plants, simulatedYears, coppiceCount, timeScale, microMonth);
        }, [plants, simulatedYears, coppiceCount, timeScale, microMonth]);

        const ecologyTelemetry = useMemo(() => {
          return calculateEcologyTelemetry(plants, simulatedYears, gardenMeta.baselineYear);
        }, [plants, simulatedYears, gardenMeta.baselineYear]);

        const vegetableStats = useMemo(() => {
          const vegs = plants.filter(p => p.isVegetable || p.lifecycleType === 'annual' || p.category?.startsWith('vegetable_'));
          return {
            totalVegs: vegs.length,
            annuals: plants.filter(p => p.lifecycleType === 'annual').length,
            perennials: plants.filter(p => p.lifecycleType === 'perennial').length
          };
        }, [plants]);

        const successionTelemetry = useMemo(() => {
          return calculateSuccessionTelemetry(plants, microMonth, simulatedYears, timeScale);
        }, [plants, microMonth, simulatedYears, timeScale]);

        useEffect(() => {
          setSimulatedYears((simulatedTimeSeconds / 600) * 10);
        }, [simulatedTimeSeconds]);

        useEffect(() => {
          if (!isPlayingTime) return;
          const interval = setInterval(() => {
            if (timeScale === 'macro') {
              setSimulatedTimeSeconds(prev => {
                const next = prev + (0.1 * playbackSpeed);
                if (next >= 600) {
                  setIsPlayingTime(false);
                  soundEngine.playChime();
                  setToast({ text: "★ 10-YEAR CANOPY MATURITY REACHED ★", color: "#34d399" });
                  return 600;
                }
                return next;
              });
            } else {
              setMicroMonth(prev => {
                let next = prev + (0.015 * playbackSpeed);
                if (next > 12.99) {
                  next = 1.0;
                  soundEngine.playChime();
                  setToast({ text: "🌱 New Garden Year Begun (January)!", color: "#34d399" });
                }
                return next;
              });
            }
          }, 50);
          return () => clearInterval(interval);
        }, [isPlayingTime, playbackSpeed, timeScale]);

        // Drag and Drop
        useEffect(() => {
          const handleDragOver = (e) => { e.preventDefault(); setIsDropActive(true); };
          const handleDragLeave = (e) => {
            if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
              setIsDropActive(false);
            }
          };
          const handleDrop = (e) => {
            e.preventDefault();
            setIsDropActive(false);
            const file = e.dataTransfer?.files?.[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (evt) => {
                const text = evt.target.result;
                if (file.name.endsWith('.json')) {
                  try {
                    const data = JSON.parse(text);
                    const incoming = Array.isArray(data.plants) ? data.plants : Array.isArray(data) ? data : null;
                    if (incoming) {
                      setPlants(incoming);
                      if (data.gardenMeta?.name) setGardenMeta(data.gardenMeta);
                      soundEngine.playChime();
                      setToast({ text: `📂 Loaded ${incoming.length} specimens from JSON backup!`, color: "#34d399" });
                      return;
                    }
                  } catch(e) {}
                }
                window.__preloaded_doc_text = text;
                setIsSyncModalOpen(true);
              };
              reader.readAsText(file);
            }
          };

          window.addEventListener('dragover', handleDragOver);
          window.addEventListener('dragleave', handleDragLeave);
          window.addEventListener('drop', handleDrop);
          return () => {
            window.removeEventListener('dragover', handleDragOver);
            window.removeEventListener('dragleave', handleDragLeave);
            window.removeEventListener('drop', handleDrop);
          };
        }, []);

        const handleSaveKey = (key) => {
          setApiKey(key);
          try { localStorage.setItem('ff_gemini_api_key', key); } catch(e) {}
        };

        const handleChopAndDrop = (id) => {
          const target = plants.find(p => p.id === id);
          if (!target) return;
          soundEngine.playWindWhoosh();
          setCoppiceCount(prev => prev + 1);
          setPlants(prev => prev.map(p => p.id === id ? { ...p, status: "coppiced" } : p));
          
          const event = {
            id: `chop-${Date.now()}`,
            plantId: id,
            plantName: target.name,
            simulatedYear: timeScale === 'macro' ? (gardenMeta.baselineYear + Math.floor(simulatedYears)) : `${currentMonthInfo.name} Garden Clearance`,
            timestamp: new Date().toLocaleTimeString(),
            notes: "Biomass chopped and dropped to soil mulch line."
          };
          setPruningHistory(prev => [event, ...prev.slice(0, 40)]);
          setToast({ text: `✂️ CHOP AND DROP: ${target.name} returned as soil mulch!`, color: "#34d399" });
        };

        const handleBatchChop = () => {
          let count = 0;
          soundEngine.playWindWhoosh();
          setPlants(prev => prev.map(p => {
            const h = (p.initialHeightMeters || 0.6) + (p.growthRateMPerYear || 1.2) * (timeScale === 'micro' ? 1 : simulatedYears);
            if (p.isSupportSpecies && h >= 1.8 && p.status !== 'coppiced') {
              count++;
              return { ...p, status: "coppiced" };
            }
            return p;
          }));

          if (count > 0) {
            setCoppiceCount(prev => prev + count);
            setToast({ text: `✂️ BATCH CHOPPED ${count} ready support trees! Mulch blanket deposited.`, color: "#34d399" });
          } else {
            setToast({ text: `ℹ️ No uncoppiced support trees above 1.8m height threshold.`, color: "#38bdf8" });
          }
        };

        const activeSimulatedCalendarYear = gardenMeta.baselineYear + Math.floor(simulatedYears);
        const isPresentDaySimulated = activeSimulatedCalendarYear === sysDate.year;

        return React.createElement('div', { className: 'min-h-screen w-full bg-[#030712] text-slate-100 flex flex-col items-center p-2 sm:p-4 pb-[max(7rem,calc(7rem+env(safe-area-inset-bottom,0px)))] pt-[max(0.5rem,env(safe-area-inset-top))] pl-[max(0.5rem,env(safe-area-inset-left))] pr-[max(0.5rem,env(safe-area-inset-right))] selection:bg-emerald-500 selection:text-black relative' },
          React.createElement('div', { className: 'fixed inset-0 pointer-events-none opacity-20 z-0 scanlines' }),

          // Global Drag and Drop Target
          isDropActive && React.createElement('div', {
            className: 'fixed inset-0 z-50 bg-black/90 backdrop-blur-md border-4 border-dashed border-emerald-400 flex flex-col items-center justify-center gap-3 text-center pointer-events-none animate-pulse'
          },
            React.createElement('span', { className: 'text-6xl drop-shadow-[0_0_15px_#34d399]' }, '🌱'),
            React.createElement('h2', { className: 'font-sci-fi font-black text-xl text-emerald-400' }, 'DROP ANY GARDEN LOG OR SPREADSHEET HERE'),
            React.createElement('p', { className: 'font-mono text-xs text-slate-300 max-w-md' }, 'Accepts .csv, .tsv, .md, .txt, or .json. Ready for instant offline rule parsing or Gemini AI analysis.')
          ),

          // Toast Message
          toast && React.createElement('div', {
            className: 'fixed top-3 z-50 py-2 px-4 rounded-lg bg-black/95 border font-arcade text-[8px] sm:text-[9px] shadow-2xl flex items-center gap-3 animate-bounce',
            style: { borderColor: toast.color, color: toast.color }
          },
            React.createElement('span', null, toast.text),
            React.createElement('button', { onClick: () => setToast(null), className: 'text-slate-400 hover:text-white text-xs' }, '✕')
          ),

          // Header (Stage 2a: Responsive Mobile HUD & View Switcher)
          React.createElement('header', { className: 'w-full max-w-[1240px] z-10 mb-2' },
            React.createElement('div', { className: 'py-2.5 px-3 rounded-xl bg-gradient-to-r from-emerald-950 via-slate-900 to-teal-950 border border-emerald-500/50 shadow-xl flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3' },
              
              // Site Branding & Real-Time Status Block
              React.createElement('div', { className: 'text-left min-w-0 flex-1 cursor-pointer group', onClick: () => setIsBrandingModalOpen(true), title: 'Click to customize tracker name, location & baseline year' },
                React.createElement('div', { className: 'flex items-center gap-1.5 sm:gap-2 mb-1 flex-wrap' },
                  React.createElement('span', { className: 'font-arcade text-[6px] sm:text-[6.5px] px-1.5 py-0.5 rounded bg-cyan-950/90 border border-cyan-400/80 text-cyan-300 shadow-[0_0_8px_rgba(6,182,212,0.4)] font-bold tracking-wider' },
                    '🧪 TEST TEMPLATE'
                  ),
                  React.createElement('span', { className: 'block text-[8px] sm:text-[9.5px] tracking-widest font-extrabold opacity-90 uppercase group-hover:text-amber-300 transition-colors' },
                    `📍 ${gardenMeta.location}`
                  ),
                  React.createElement('span', { 
                    className: 'font-arcade text-[6px] sm:text-[6.5px] px-1.5 py-0.5 rounded bg-emerald-950/90 border border-emerald-400/80 text-emerald-300 shadow-[0_0_8px_rgba(52,211,153,0.3)] font-bold tracking-wider',

      const CURATED_MODEL_LADDER = [
        "gemini-3-flash-preview",
        "gemini-2.5-flash",
        "gemini-2.0-flash",
        "gemini-1.5-flash",

        "gemini-2.5-pro",
        "gemini-1.5-pro"
      ];

      async function fetchWithExponentialBackoff(url, options, maxRetries = 3) {
        let delayMs = 1000;
        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const resp = await fetch(url, options);
            if ((resp.status === 429 || resp.status === 503) && attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delayMs));
              delayMs *= 2;
              continue;
            }
            return resp;
          } catch (networkErr) {
            if (attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delayMs));
              delayMs *= 2;
              continue;
            }
            throw networkErr;
          }
        }
      }

      function scoreGeminiModel(name) {
        const lower = name.toLowerCase();
        if (lower === 'gemini-3-flash-preview') return 1000;
        if (lower.startsWith('gemini-3') && lower.includes('flash')) return 950;
        if (lower.includes('3-flash')) return 920;
        if (lower.startsWith('gemini-2.5-flash')) return 850;
        if (lower.startsWith('gemini-2.0-flash')) return 780;
        if (lower.startsWith('gemini-1.5-flash')) return 700;
        if (lower.includes('3-pro')) return 650;
        if (lower.includes('2.5-pro')) return 600;
        return 300;
      }

      async function getAvailableGeminiModels(apiKey = '') {
        const trimmedKey = (apiKey || '').trim();
        if (trimmedKey) {
          try {
            const res = await fetchWithExponentialBackoff(
              `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(trimmedKey)}`,
              { method: 'GET' },
              2
            );
            if (res && res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.models)) {
                const candidates = data.models
                  .filter(m => {
                    const rawName = (m.name || '').replace('models/', '');
                    const isGemini = rawName.toLowerCase().includes('gemini');
                    const canGenerate = Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent');
                    const isSpecialized = /embedding|imagen|image-generation|tts|transcribe|realtime|robotics/i.test(rawName);
                    return isGemini && canGenerate && !isSpecialized;
                  })
                  .map(m => m.name.replace('models/', ''));

                if (candidates.length > 0) {
                  candidates.sort((a, b) => scoreGeminiModel(b) - scoreGeminiModel(a));
                  const finalList = [];
                  for (const model of candidates) {
                    if (!finalList.includes(model)) finalList.push(model);
                  }
                  for (const fallback of CURATED_MODEL_LADDER) {
                    if (!finalList.includes(fallback)) finalList.push(fallback);
                  }
                  return finalList;
                }
              }
            }
          } catch (e) {}
        }
        return CURATED_MODEL_LADDER;
