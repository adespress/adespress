            detectedLocale = navigator.language;

          if (typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
            detectedTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';

        if (lowerLocale.startsWith('fr')) {
          initialLang = 'fr';
        } else {
          initialLang = 'en';
        }

      // ======================================================================
      // 0. DYNAMIC SYSTEM DATE RESOLVER (BROWSER CLOCK WITH 2026 FALLBACK)
      // ======================================================================
      function getSystemDateContext() {
        let year = 2026;
        let month = 9;
        let day = 26;
        let hours = 8;
        let minutes = 46;
        try {
          const now = new Date();
          const y = now.getFullYear();
          if (!isNaN(y) && y >= 2020 && y <= 2050) {
            year = y;
            month = now.getMonth() + 1; // 1-12
            day = now.getDate();
            hours = now.getHours();
            minutes = now.getMinutes();
          }
        } catch (e) {}

        const timeDecimal = hours + (minutes / 60);
        const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        
        // Atmospheric diurnal phase mapping
        let diurnalPhase = 'night';
        if (timeDecimal >= 6.0 && timeDecimal < 8.5) {
          diurnalPhase = 'twilight'; // Dawn / Early morning
        } else if (timeDecimal >= 8.5 && timeDecimal < 18.0) {
          diurnalPhase = 'day'; // Daylight insolation
        } else if (timeDecimal >= 18.0 && timeDecimal < 21.0) {
          diurnalPhase = 'dusk'; // Sunset / Golden hour
        } else {
          diurnalPhase = 'night'; // Nocturnal / Stars
        }
        
        // Continuous float representing day progress through the year's month
        const monthFloat = Math.max(1, Math.min(12.99, month + (day - 1) / 30.5));
        const isoDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const fullTimestamp = `${isoDate} ${timeStr}`;
        return { year, month, day, hours, minutes, timeStr, timeDecimal, diurnalPhase, monthFloat, isoDate, fullTimestamp };
      }

          agronomicType = 'edible_fruit';
          autumnColorShift = 'evergreen_persistent';
          isEvergreen = true;
          isFruitBearing = true;
        } else if (/\b(macadamia|noyer du queensland)\b/i.test(lower)) {
          morphologicalHabit = 'macadamia_nut';
          foliagePhenology = 'broadleaf_evergreen';
          agronomicType = 'nut';

          isEvergreen = true;
          isFruitBearing = true;
        } else if (/\b(walnut|noyer|juglans|pecan|pacanier|carya)\b/i.test(lower)) {
          morphologicalHabit = 'walnut_nut';
          foliagePhenology = 'deciduous';
          agronomicType = 'nut';
          autumnColorShift = 'golden_amber';
          isFruitBearing = true;

        // --- Parasol & Courtyard Shade ---
        } else if (/\b(murier platane|plane-tree mulberry|morus kagayamae|morus bombycis|morus platanifolia|parasol|ombrage|mulberry|murier|morus)\b/i.test(lower)) {
          morphologicalHabit = 'parasol_mulberry';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'golden_amber';
          isFruitBearing = true;

        // --- Climax Giants: Oak, Chestnut & London Plane ---
        } else if (/\b(oak|chêne|chene|quercus)\b/i.test(lower)) {
          morphologicalHabit = 'ancient_oak';
          foliagePhenology = 'deciduous';
          agronomicType = 'timber_climax';
          autumnColorShift = 'warm_copper_bronze';
        } else if (/\b(chestnut|châtaign|chataign|castanea|walnut|noyer|juglans)\b/i.test(lower)) {
          morphologicalHabit = 'sweet_chestnut';
          foliagePhenology = 'deciduous';
          agronomicType = 'nut';
          autumnColorShift = 'warm_copper_bronze';
          isFruitBearing = true;
        } else if (/\b(plane tree|platane|platanus|sycamore|london plane)\b/i.test(lower)) {
          morphologicalHabit = 'plane_tree';
          foliagePhenology = 'deciduous';
          agronomicType = 'timber_climax';
          autumnColorShift = 'golden_amber';

        // --- Maples & Sculptural Ornamentals ---
        } else if (/\b(acer|japanese maple|érable|erable|palmatum|sugar maple|red maple)\b/i.test(lower)) {
          morphologicalHabit = 'broadleaf_ornamental';
          foliagePhenology = 'deciduous';
          agronomicType = 'ornamental';
          autumnColorShift = 'scarlet_crimson';
        } else if (/\b(ginkgo|birch|bouleau|betula|linden|tilleul|tilia|ash|frêne|fraxinus|elm|orme|ulmus|beech|hêtre|hetre|fagus)\b/i.test(lower)) {
          morphologicalHabit = 'broadleaf_ornamental';
          foliagePhenology = 'deciduous';
          agronomicType = 'ornamental';
          autumnColorShift = /ginkgo|birch|linden/i.test(lower) ? 'golden_amber' : 'warm_copper_bronze';

        // --- Pome Fruits ---
        } else if (/\b(pear|poire|pyrus|conference|williams|nashi)\b/i.test(lower)) {
          morphologicalHabit = 'pear_pome';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'warm_copper_bronze';
          isFruitBearing = true;
        } else if (/\b(quince|coing|cydonia|medlar|mespilus|nefle)\b/i.test(lower)) {
          morphologicalHabit = 'quince_pome';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'persimmon_orange';
          isFruitBearing = true;
        } else if (/\b(apple|pomme|malus|starking|gala|fuji|reinette|evereste|crabapple|crab apple)\b/i.test(lower)) {
          morphologicalHabit = 'apple_pome';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'yellow_chartreuse';
          isFruitBearing = true;

        // --- Stone Fruits & Almonds ---
        } else if (/\b(cherry|cerise|avium|cerisier)\b/i.test(lower)) {
          morphologicalHabit = 'cherry_stone';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'scarlet_crimson';
          isFruitBearing = true;
        } else if (/\b(peach|peche|pêche|persica|apricot|abricot|armeniaca|nectarine|almond|amandier|dulcis)\b/i.test(lower)) {
          morphologicalHabit = 'peach_stone';
          foliagePhenology = 'deciduous';
          const isAlmond = /almond|amandier|dulcis/i.test(lower);
          agronomicType = isAlmond ? 'nut' : 'edible_fruit';
          autumnColorShift = 'persimmon_orange';
          isFruitBearing = true;
        } else if (/\b(plum|prune|mirabelle|reine claude|greengage|damson|syriaca|domestica|prunier)\b/i.test(lower)) {
          morphologicalHabit = 'plum_stone';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'yellow_chartreuse';
          isFruitBearing = true;

        // --- Subtropicals & Persimmons ---
        } else if (/\b(persimmon|kaki|diospyros)\b/i.test(lower)) {
          morphologicalHabit = 'persimmon_kaki';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'persimmon_orange';
          isFruitBearing = true;
        } else if (/\b(banana|bananier|musa)\b/i.test(lower)) {
          morphologicalHabit = 'palm_banana';
          foliagePhenology = 'broadleaf_evergreen';
          agronomicType = 'biomass_support';
          autumnColorShift = 'evergreen_persistent';
          isSupport = true;
        } else if (/\b(kiwi|kiwiberry|kiwai|actinidia|grape|vigne|vitis)\b/i.test(lower)) {
          morphologicalHabit = 'arbor_vine';
          foliagePhenology = 'deciduous';
          agronomicType = 'edible_fruit';
          autumnColorShift = 'golden_amber';
          isFruitBearing = true;

        // --- Nut Climax & Coppice ---
        } else if (/\b(hazel|hazelnut|noisette|corylus|noisetier)\b/i.test(lower)) {
          morphologicalHabit = 'hazelnut_coppice';
          foliagePhenology = 'deciduous';
          agronomicType = 'nut';
          autumnColorShift = 'golden_amber';
          isFruitBearing = true;

        // --- Support Pioneers Fallback ---
        } else if (/\b(alder|aune|alnus)\b/i.test(lower) || obj.isSupportSpecies) {
          morphologicalHabit = 'white_willow_whip';
          foliagePhenology = 'deciduous';
          agronomicType = 'biomass_support';
          autumnColorShift = 'golden_amber';
          isSupport = true;

        // --- Understory Guilds & Rosettes ---
        } else if (/\b(rhubarb|rhubarbe|rheum|artichoke|artichaut|cynara)\b/i.test(lower)) {
          morphologicalHabit = 'perennial_rosette';
          foliagePhenology = 'herbaceous_dieback';
          agronomicType = 'vegetable';
          autumnColorShift = 'yellow_chartreuse';
        } else if (/\b(comfrey|consoude|symphytum)\b/i.test(lower)) {
          morphologicalHabit = 'comfrey_guild';
          foliagePhenology = 'herbaceous_dieback';
          agronomicType = 'biomass_support';
          autumnColorShift = 'yellow_chartreuse';
          isSupport = true;
        } else if (/\b(lavender|lavande|rosemary|romarin|thyme|thym|sage|sauge|hyssop)\b/i.test(lower)) {
          morphologicalHabit = 'aromatic_cushion';
          foliagePhenology = 'broadleaf_evergreen';
          agronomicType = 'aromatic_herb';
          autumnColorShift = 'evergreen_persistent';
          isEvergreen = true;
        } else if (/\b(berry|framboise|rubus|currant|cassis|blackberry|mûre|strawberry|fraise)\b/i.test(lower)) {
          morphologicalHabit = /strawberry|fraise/i.test(lower) ? 'perennial_rosette' : 'berry_shrub';
          foliagePhenology = 'deciduous';
          agronomicType = 'shrub_berry';
          autumnColorShift = 'scarlet_crimson';
          isFruitBearing = true;
        }

        // --- SMART FALLBACK HEURISTICS FOR UNRECOGNIZED SPECIES ---
        if (morphologicalHabit === 'broadleaf_generic') {
          const hasTropicalKeyword = /\b(tropical|subtropical|exotic|tropics|equatorial|caribbean|mediterranean|evergreen fruit|warm climate|papaya|pawpaw|passionfruit|maracuja|passion fruit|pitaya|dragon fruit|sapote|starfruit|carambola|longan|lychee|litchi|cherimoya|custard apple|soursop|corossol|jackfruit|breadfruit|tamarind|mangosteen)\b/i.test(lower);
          
          const hasExplicitFruitWord = /\b(fruit|fruits|fruiting|berry|berries|mango|apple|pear|peach|plum|cherry|citrus|orange|lemon|fig|apricot|nut|edible fruit|pomme|verger|orchard|recolte|harvest)\b/i.test(lower);
          const hasTreeWord = /\b(tree|arbre|specimen|cultivar|bush|arbuste|plant|plante)\b/i.test(lower);
          const hasFruitingNotes = /\b(fruiting|harvest|sweet|edible|picking|yield|crop|fruits|delicious|juicy|taste|flavor|flavour|jam|fresh eating|dessert|ripe|ripen|bearing)\b/i.test(lower) || 
            Boolean(obj.fruitColor) || 
            Boolean(obj.harvestSeason && obj.harvestSeason !== 'N/A') || 
            obj.category === 'fruit_tree' || obj.category === 'shrub_berry';

          const isIdentifiedAsFruitBearing = hasExplicitFruitWord || (hasTreeWord && hasFruitingNotes) || hasTropicalKeyword;

          if (isIdentifiedAsFruitBearing) {
            isFruitBearing = true;
            agronomicType = 'edible_fruit';

            if (hasTropicalKeyword) {
              morphologicalHabit = 'mango_tropical';
              foliagePhenology = 'broadleaf_evergreen';
              isEvergreen = true;
              autumnColorShift = 'evergreen_persistent';
            } else {
              morphologicalHabit = 'apple_pome';
              foliagePhenology = 'deciduous';
              autumnColorShift = 'golden_amber';
            }
          }
        }

        // Overrides if explicitly specified on object
        if (obj.isSupportSpecies != null) isSupport = Boolean(obj.isSupportSpecies);
        if (obj.isVegetable) agronomicType = 'vegetable';

        return {
          morphologicalHabit,
          foliagePhenology,
          agronomicType,
          autumnColorShift,
          isEvergreen,
          isSupport,
          isFruitBearing,
          category: obj.category || (agronomicType === 'vegetable' ? 'vegetable_leafy' : agronomicType === 'nut' ? 'nut_tree' : agronomicType === 'biomass_support' ? 'support_pioneer' : agronomicType === 'timber_climax' ? 'canopy_timber' : agronomicType === 'ornamental' ? 'ornamental_tree' : 'fruit_tree')
        };
      }

      function getSentinelCategory(plant) {
        const name = (plant.name + ' ' + (plant.botanicalName || '') + ' ' + (plant.category || '')).toLowerCase();
        if (/conifer|pine|cedar|sequoia|redwood|spruce|fir|cypress|épicéa|sapin|cyprès|pin|cèdre/i.test(name)) {
          return 'evergreen';
        }
        if (/plane|platane|paulownia|empress|oak|chêne|chestnut|châtaign|poplar|peuplier|beech|hêtre/i.test(name)) {
          return 'shade';
        }
        return 'sculptural';
      }

      function getSentinelBufferRole(plant, sectorConfig = DEFAULT_SECTOR_CONFIG, currentLang = 'en') {
        const sec = normalizeSectorCode(plant?.cardinalSector);
        const winter = normalizeSectorCode(sectorConfig?.winterWindSector || 'NW');
        const frost = normalizeSectorCode(sectorConfig?.frostHazardSector || 'N');
        const summer = normalizeSectorCode(sectorConfig?.summerWindSector || 'SW');
        const isFr = currentLang === 'fr';

        if (sec === winter) {
          return {
            type: 'winter_wind',
            badge: isFr ? `💨 Atténue tempêtes hiver (${sec})` : `💨 Buffers Winter Gales (${sec})`,
            color: 'cyan',
            desc: isFr ? `Protège le site des vents violents du secteur ${sec}` : `Defends site against gale squalls from ${sec}`
          };
        }
        if (sec === frost) {
          return {
            type: 'frost',
            badge: isFr ? `❄️ Protège couloir de gel (${sec})` : `❄️ Buffers Frost Pocket (${sec})`,
            color: 'sky',
            desc: isFr ? `Freine l'accumulation d'air froid du secteur ${sec}` : `Blocks cold air drainage pooling from ${sec}`
          };
        }
        if (sec === summer) {
          return {
            type: 'summer_wind',
            badge: isFr ? `🔥 Écran vents desséchants (${sec})` : `🔥 Screens Hot Winds (${sec})`,
            color: 'amber',
            desc: isFr ? `Limite l'évapotranspiration due aux vents chauds du ${sec}` : `Shields site from desiccating winds from ${sec}`
          };
        }
        return {
          type: 'general',
          badge: isFr ? `🧭 Ceinture de protection (${sec})` : `🧭 Boundary Shelter (${sec})`,
          color: 'emerald',
          desc: isFr ? `Sentinelle de bordure secteur ${sec}` : `Perimeter sentinel in sector ${sec}`
        };
      }

      // ======================================================================
      // 2. OFFLINE PARSER & HEURISTIC ENGINE (Trees + Garden Polycultures)
      // ======================================================================
      function matchBotanicalProfile(rawName) {
        const lower = rawName.toLowerCase();
        for (const item of BOTANICAL_DICTIONARY) {
          if (item.keywords.some(kw => lower.includes(kw))) {
            return item;
          }
        }

        // Contextual vegetable fallback detection
        const isVegClimbing = lower.includes("tomato") || lower.includes("bean") || lower.includes("pea") || lower.includes("cucumber");
        const isVegRoot = lower.includes("carrot") || lower.includes("radish") || lower.includes("beet") || lower.includes("potato") || lower.includes("onion") || lower.includes("garlic");
        const isVegLeafy = lower.includes("lettuce") || lower.includes("salad") || lower.includes("cabbage") || lower.includes("kale") || lower.includes("spinach");

        if (isVegClimbing || isVegRoot || isVegLeafy) {
          return {
            name: rawName,
            commonName: rawName,
            botanicalName: "Garden Cultivar",
            category: isVegRoot ? "vegetable_root" : isVegLeafy ? "vegetable_leafy" : "vegetable_fruit",
            lifecycleType: "annual",
            isVegetable: true,
            growthHabit: isVegClimbing ? "climbing_trellis" : isVegRoot ? "root_subterranean" : "rosette",
            daysToMaturity: isVegRoot ? 65 : isVegLeafy ? 45 : 75,
            spacingCm: isVegRoot ? 10 : isVegLeafy ? 25 : 45,
            growthRate: 0.3,
            maxHeight: isVegClimbing ? 1.5 : 0.4,
            crownDiameter: 0.4,
            foliageType: "broadleaf",
            barkColor: "#15803d",
            foliageColor: "#22c55e",
            fruitColor: "#ea580c",
            harvestSeason: "Summer",
            companionPlants: ["Basil", "Marigold", "Lettuce"],
            notes: "Vegetable garden specimen automatically categorized by the botanical engine."
          };
        }

        // Stage 1 Semantic Taxonomy Fallback for Unknown Perennials & Trees
        const traits = classifyBotanicalSpecimen(rawName);

        return {
          name: rawName,
          commonName: rawName,
          botanicalName: traits.agronomicType === 'edible_fruit' ? (traits.isEvergreen ? "Tropical Cultivar" : "Fruiting Cultivar") : "Specimen",
          category: traits.category,
          lifecycleType: "perennial",
          isVegetable: false,
          growthRate: traits.isSupport ? 1.20 : traits.isEvergreen ? 0.40 : 0.45,
          maxHeight: traits.agronomicType === 'timber_climax' ? 18.0 : traits.agronomicType === 'ornamental' ? 6.0 : 4.5,
          crownDiameter: traits.agronomicType === 'timber_climax' ? 10.0 : 3.5,
          foliageType: traits.foliagePhenology === 'needle_evergreen' ? 'conifer' : traits.foliagePhenology === 'broadleaf_evergreen' ? 'evergreen' : 'broadleaf',
          barkColor: traits.morphologicalHabit === 'umbrella_pine' ? '#9a3412' : traits.morphologicalHabit === 'cherry_stone' ? '#581c87' : traits.morphologicalHabit === 'olive_fig' ? '#71717a' : traits.morphologicalHabit === 'giant_redwood' ? '#991b1b' : '#451a03',
          foliageColor: traits.foliagePhenology === 'needle_evergreen' ? '#064e3b' : traits.foliagePhenology === 'broadleaf_evergreen' ? '#14532d' : '#22c55e',
          fruitColor: traits.isFruitBearing ? (traits.morphologicalHabit === 'citrus_evergreen' ? '#facc15' : '#ea580c') : null,
          harvestSeason: traits.isFruitBearing ? (traits.morphologicalHabit === 'citrus_evergreen' ? 'Winter - Spring' : traits.isEvergreen ? 'Summer (Jun - Sep)' : 'Autumn') : 'N/A',
          isSupportSpecies: traits.isSupport
        };
      }

      function extractDirectionalContext(text) {
        const lower = text.toLowerCase();
        let cardinalSector = "S";
        let sunAspect = "Full Sun";
        let boundaryAssignment = "Central Food Forest Alley";
        let landmarkAnchor = "Tree Line Bed";

        if (/\b(north[- ]?west|nw|nord[- ]?ouest)\b/i.test(lower)) {
          cardinalSector = "NW";
          sunAspect = "Afternoon Sun / West Wind Exposure";
          boundaryAssignment = "North-Western Perimeter Windbreak";
        } else if (/\b(north[- ]?east|ne|nord[- ]?est)\b/i.test(lower)) {
          cardinalSector = "NE";
          sunAspect = "Morning Sun / Cold Wind Shield";
          boundaryAssignment = "North-Eastern Perimeter Shelter";
        } else if (/\b(south[- ]?west|sw|sud[- ]?ouest)\b/i.test(lower)) {
          cardinalSector = "SW";
          sunAspect = "High Solar Insolation / Afternoon Warmth";
          boundaryAssignment = "South-Western Solar Guild";
        } else if (/\b(south[- ]?east|se|sud[- ]?est)\b/i.test(lower)) {
          cardinalSector = "SE";
          sunAspect = "Gentle Morning Warmth / Early Solar Gain";
          boundaryAssignment = "South-Eastern High-Light Zone";
        } else if (/\b(north|northern|nord|septentrional)\b/i.test(lower)) {
          cardinalSector = "N";
          sunAspect = "North Windbreak / Climax Canopy Shade";
          boundaryAssignment = "Northern Boundary Climax Forest";
        } else if (/\b(south|southern|sud|plein sud)\b/i.test(lower)) {
          cardinalSector = "S";
          sunAspect = "Full South Sun Exposure";
          boundaryAssignment = "Southern Agroforestry Alley";
        } else if (/\b(east|eastern|est|levant)\b/i.test(lower)) {
          cardinalSector = "E";
          sunAspect = "Morning Sun / East Exposure";
          boundaryAssignment = "Eastern Boundary Buffer";
        } else if (/\b(west|western|ouest|couchant)\b/i.test(lower)) {
          cardinalSector = "W";
          sunAspect = "Afternoon Heat & West Winds";
          boundaryAssignment = "Western Windbreak Screen";
        }

        if (/\b(raised bed|potager|vegetable bed|planche|bac|serre)\b/i.test(lower)) {
          boundaryAssignment = "Intensive Vegetable Raised Bed";
          landmarkAnchor = "Kitchen Garden Raised Bed";
        } else if (/\b(greenhouse|polytunnel|serre|tunnel|châssis)\b/i.test(lower)) {
          landmarkAnchor = "Solar Polytunnel & Nursery";
        } else if (/\b(chicken\s*(?:run|coop)?|poulailler|hens)\b/i.test(lower)) {
          landmarkAnchor = "Chicken Run Forage Border";
        } else if (/\b(house|homestead|maison|home|courtyard|kitchen|patio)\b/i.test(lower)) {
          landmarkAnchor = "Homestead & Kitchen Courtyard";
        } else if (/\b(pond|mare|bassin|lake|water)\b/i.test(lower)) {
          landmarkAnchor = "Wildlife Pond & Aquatic Margin";
        } else if (/\b(swale|fossé|baissière|contour)\b/i.test(lower)) {
          landmarkAnchor = "Hydrological Swale Contour";
        }

        return { cardinalSector, sunAspect, boundaryAssignment, landmarkAnchor };
      }

      function parseOfflineText(text) {
        if (!text || !text.trim()) return [];
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        const results = [];
        let autoLine = 1;
        let lineCounters = { 1: 1, 2: 1, 3: 1, 4: 1 };
        let activeZone = 2;

        const isDelimited = lines.some(l => l.includes(",") || l.includes("\t") || l.includes(";"));
        const firstLine = lines[0].toLowerCase();
        const isHeader = (firstLine.includes("name") || firstLine.includes("species") || firstLine.includes("crop") || firstLine.includes("tree")) && (firstLine.includes(",") || firstLine.includes("\t") || firstLine.includes(";"));

        if (isDelimited && (isHeader || lines.length > 2)) {
          const delim = lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
          const startIndex = isHeader ? 1 : 0;
          let headerCols = isHeader ? lines[0].split(delim).map(c => c.trim().toLowerCase().replace(/['"]/g, "")) : ["name", "line", "position", "height"];

          for (let i = startIndex; i < lines.length; i++) {
            const rawCols = lines[i].split(delim).map(c => c.trim().replace(/^['"]|['"]$/g, ""));
            if (rawCols.length === 0 || !rawCols[0]) continue;

            const row = {};
            headerCols.forEach((col, idx) => { row[col] = rawCols[idx] || ""; });

            const name = row.name || row.species || row.crop || row.tree || rawCols[0];
            if (!name || name.length < 2) continue;

            const profile = matchBotanicalProfile(name);
            const lineNum = Number(row.line || row.row || row.bed || autoLine) || autoLine;
            const linePos = Number(row.position || row.pos || lineCounters[lineNum] || 1);
            lineCounters[lineNum] = linePos + 1;

            const heightMatch = (row.height || lines[i]).match(/(\d+(\.\d+)?)\s*(m|meter|meters|cm)?/i);
            const initialHeight = heightMatch ? (heightMatch[3]?.toLowerCase() === 'cm' ? Number(heightMatch[1])/100 : Number(heightMatch[1])) : (profile.isVegetable ? profile.maxHeight : profile.growthRate * 2);

            const yearMatch = (row.planted || row.year || lines[i]).match(/\b(20\d\d)\b/);
            const plantedYear = yearMatch ? Number(yearMatch[1]) : 2025;

            const combinedText = `${lines[i]} ${row.sector || ''} ${row.aspect || ''} ${row.landmark || ''}`;
            const dirContext = extractDirectionalContext(combinedText);

            results.push({
              id: `parsed-${Date.now()}-${results.length + 1}`,
              name: name,
              commonName: profile.commonName || name,
              botanicalName: profile.botanicalName,
              category: row.category || profile.category,
              lifecycleType: profile.lifecycleType || "perennial",
              isVegetable: profile.isVegetable || false,
              growthHabit: profile.growthHabit || "upright",
              daysToMaturity: Number(row.days || row.maturity) || profile.daysToMaturity || null,
              spacingCm: Number(row.spacing) || profile.spacingCm || 30,
              companionPlants: profile.companionPlants || [],
              zone: Number(row.zone) || (dirContext.landmarkAnchor.includes("Kitchen") ? 1 : 2),
              line: lineNum,
              linePosition: linePos,
              plantedYear: plantedYear,
              initialHeightMeters: initialHeight || 0.4,
              maxHeightMeters: profile.maxHeight,
              growthRateMPerYear: profile.growthRate,
              crownDiameterMax: profile.crownDiameter,
              foliageType: profile.foliageType,
              barkColor: profile.barkColor,
              foliageColor: profile.foliageColor,
              fruitColor: profile.fruitColor,
              bloomColor: profile.bloomColor,
              harvestSeason: profile.harvestSeason,
              isSupportSpecies: profile.isSupportSpecies || false,
              nitrogenFixer: profile.nitrogenFixer || false,
              cardinalSector: row.sector || dirContext.cardinalSector,
              sunAspect: row.aspect || dirContext.sunAspect,
              boundaryAssignment: dirContext.boundaryAssignment,
              landmarkAnchor: dirContext.landmarkAnchor,
              notes: row.notes || profile.notes || `Specimen imported via table parser.`,
              status: "thriving"
            });
          }
          if (results.length > 0) return results;
        }

        lines.forEach(rawLine => {
          // 1. Detect Markdown Zone / Landmark Section Headers
          if (rawLine.startsWith('#')) {
            const lowerHeader = rawLine.toLowerCase();
            if (lowerHeader.includes('zone 1') || lowerHeader.includes('kitchen') || lowerHeader.includes('raised bed') || lowerHeader.includes('potager')) {
              activeZone = 1;
              autoLine = 1;
            } else if (lowerHeader.includes('zone 2') || lowerHeader.includes('orchard') || lowerHeader.includes('agroforestry') || lowerHeader.includes('verger')) {
              activeZone = 2;
              autoLine = 1;
            } else if (lowerHeader.includes('zone 3') || lowerHeader.includes('courtyard') || lowerHeader.includes('biomass') || lowerHeader.includes('banana')) {
              activeZone = 3;
            } else if (lowerHeader.includes('zone 4') || lowerHeader.includes('windbreak') || lowerHeader.includes('sentinel') || lowerHeader.includes('perimeter') || lowerHeader.includes('brise-vent')) {
              activeZone = 4;
            }
            return;
          }

          // Skip instructional comments, format instructions, or empty bullets
          if (rawLine.startsWith('<!--') || rawLine.toLowerCase().startsWith('format:') || rawLine.trim() === '-' || rawLine.trim() === '*') {
            return;
          }

          // 2. Handle Pipe-Delimited Markdown Lines: e.g. "- Roma Tomato | Bed 1 | Pos 1 | S | 2026 | Notes..."
          if (rawLine.includes('|')) {
            const parts = rawLine.replace(/^[-*•#\s]+/, '').split('|').map(s => s.trim());
            const rawPlantName = parts[0] || '';
            if (rawPlantName.length < 2 || rawPlantName.toLowerCase().startsWith('name')) return;

            const profile = matchBotanicalProfile(rawPlantName);
            const linePart = parts[1] || '';
            const posPart = parts[2] || '';
            const sectorPart = parts[3] || '';
            const yearOrDaysPart = parts[4] || '';
            const notesPart = parts[5] || '';

            // Extract Line / Bed number
            let lineNum = null;
            const lineNumMatch = linePart.match(/(?:bed|bac|line|rang|row)?\s*(\d{1,2})/i);
            if (lineNumMatch) {
              lineNum = Number(lineNumMatch[1]);
            } else if (activeZone === 1 || activeZone === 2) {
              lineNum = autoLine;
            }

            // Extract Position
            let linePos = null;
            const posMatch = posPart.match(/(?:pos|position|#)?\s*(\d{1,2})/i);
            if (posMatch) {
              linePos = Number(posMatch[1]);
            } else if (lineNum != null) {
              linePos = lineCounters[lineNum] || 1;
              lineCounters[lineNum] = linePos + 1;
            }

            // Extract Sector
            const sectorMatch = (sectorPart + ' ' + linePart).match(/\b(N|NE|E|SE|S|SW|W|NW)\b/i);
            const cardinalSector = sectorMatch ? sectorMatch[1].toUpperCase() : 'S';

            // Extract Planting Year
            const yearMatch = (yearOrDaysPart + ' ' + rawLine).match(/\b(20\d\d)\b/);
            const plantedYear = yearMatch ? Number(yearMatch[1]) : (profile.isVegetable ? 2026 : 2024);

            const dirContext = extractDirectionalContext(`${rawLine} ${linePart} ${notesPart}`);

            results.push({
              id: `parsed-${Date.now()}-${results.length + 1}`,
              name: rawPlantName,
              commonName: profile.commonName || rawPlantName,
              botanicalName: profile.botanicalName,
              category: profile.category,
              lifecycleType: profile.lifecycleType || (profile.isVegetable ? "annual" : "perennial"),
              isVegetable: profile.isVegetable || false,
              growthHabit: profile.growthHabit || "upright",
              daysToMaturity: profile.daysToMaturity || (profile.isVegetable ? 65 : null),
              spacingCm: profile.spacingCm || 30,
              companionPlants: profile.companionPlants || [],
              zone: activeZone,
              line: lineNum,
              linePosition: linePos,
              plantedYear: plantedYear,
              initialHeightMeters: profile.isVegetable ? profile.maxHeight : (profile.growthRate * 2.0),
              maxHeightMeters: profile.maxHeight,
              growthRateMPerYear: profile.growthRate,
              crownDiameterMax: profile.crownDiameter,
              foliageType: profile.foliageType,
              barkColor: profile.barkColor,
              foliageColor: profile.foliageColor,
              fruitColor: profile.fruitColor,
              bloomColor: profile.bloomColor,
              harvestSeason: profile.harvestSeason,
              isSupportSpecies: profile.isSupportSpecies || false,
              nitrogenFixer: profile.nitrogenFixer || false,
              cardinalSector: cardinalSector,
              sunAspect: dirContext.sunAspect,
              boundaryAssignment: linePart || dirContext.boundaryAssignment,
              landmarkAnchor: linePart.length > 3 ? linePart : dirContext.landmarkAnchor,
              notes: notesPart || profile.notes || `Imported from blueprint.`,
              status: "thriving"
            });
            return;
          }

          let lineStr = rawLine.replace(/^[-*•#|0-9.)\s]+/, "").trim();
          if (lineStr.length < 2) return;

          const lineMatch = rawLine.match(/(?:line|row|ligne|rang|bed|bac)\s*([0-9]{1,2})/i);
          const currentLine = lineMatch ? Number(lineMatch[1]) : autoLine;

          const posMatch = rawLine.match(/(?:pos|position|#)\s*([0-9]{1,2})/i);
          const currentPos = posMatch ? Number(posMatch[1]) : (lineCounters[currentLine] || 1);
          lineCounters[currentLine] = currentPos + 1;

          const profile = matchBotanicalProfile(lineStr);
          const dirContext = extractDirectionalContext(rawLine);

          results.push({
            id: `parsed-${Date.now()}-${results.length + 1}`,
            name: lineStr.split(/[,;(]/)[0].trim() || profile.name,
            commonName: profile.commonName,
            botanicalName: profile.botanicalName,
            category: profile.category,
            lifecycleType: profile.lifecycleType || "perennial",
            isVegetable: profile.isVegetable || false,
            growthHabit: profile.growthHabit || "upright",
            daysToMaturity: profile.daysToMaturity || null,
            spacingCm: profile.spacingCm || 30,
            companionPlants: profile.companionPlants || [],
            zone: activeZone || (dirContext.landmarkAnchor.includes("Kitchen") ? 1 : 2),
            line: currentLine,
            linePosition: currentPos,
            plantedYear: 2025,
            initialHeightMeters: profile.isVegetable ? profile.maxHeight : (profile.growthRate * 2.2),
            maxHeightMeters: profile.maxHeight,
            growthRateMPerYear: profile.growthRate,
            crownDiameterMax: profile.crownDiameter,
            foliageType: profile.foliageType,
            barkColor: profile.barkColor,
            foliageColor: profile.foliageColor,
            fruitColor: profile.fruitColor,
            bloomColor: profile.bloomColor,
            harvestSeason: profile.harvestSeason,
            isSupportSpecies: profile.isSupportSpecies || false,
            nitrogenFixer: profile.nitrogenFixer || false,
            cardinalSector: dirContext.cardinalSector,
            sunAspect: dirContext.sunAspect,
            boundaryAssignment: dirContext.boundaryAssignment,
            landmarkAnchor: dirContext.landmarkAnchor,
            notes: profile.notes || `Extracted from garden log: "${rawLine.slice(0, 90)}"`,
            status: "thriving"
          });
        });

        return results;
      }

      class RetroSoundEngine {
        constructor() {
          this.ctx = null;
          this.isMuted = false;
        }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted')) {
            this.ctx.resume().catch(() => {});
          }
        }
        playTone(freq, duration = 0.1, type = 'sine', vol = 0.12) {
          if (!this.ctx || this.isMuted) return;
          try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            const now = this.ctx.currentTime;
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(vol, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration);
          } catch(e) {}
        }
        playWindWhoosh() {
          this.init();
          if (!this.ctx || this.isMuted) return;
          try {
            const now = this.ctx.currentTime;
            const dur = 0.6;
            const buffer = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(300, now);
            filter.frequency.exponentialRampToValueAtTime(1100, now + dur * 0.4);
            filter.frequency.exponentialRampToValueAtTime(250, now + dur);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.12, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);
            noise.stop(now + dur);
          } catch(e) {}
        }
        playChime() {
          this.init();
          [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
            setTimeout(() => this.playTone(f, 0.3, 'triangle', 0.15), idx * 80);
          });
        }
      }
      const soundEngine = new RetroSoundEngine();

          const meta = seasonBadges[i];

      function getCropMicroPhenology(plant, microMonthFloat) {
        const m = Math.max(1, Math.min(12, Math.floor(microMonthFloat)));
        const nameLower = (plant.name + " " + (plant.commonName || "") + " " + (plant.botanicalName || "")).toLowerCase();
        const traits = classifyBotanicalSpecimen(plant);
        const isVeg = plant.isVegetable || plant.lifecycleType === 'annual' || plant.category?.startsWith('vegetable_') || traits.agronomicType === 'vegetable';

        if (isVeg) {
          // 1. Nightshades (Tomatoes, Peppers, Eggplants, Potatoes)
          if (nameLower.includes("tomato") || nameLower.includes("pepper") || nameLower.includes("eggplant") || nameLower.includes("aubergine") || nameLower.includes("potato")) {
            if (m < 3 || m > 10) return { stage: 'dormant', stageLabel: '❄️ Winter Rest / Mulch', stageColor: '#64748b', vitality: 0.05, inHarvest: false, monthlyKg: 0 };
            if (m >= 3 && m <= 4) return { stage: 'sown', stageLabel: '🌱 Indoor Nursery Seedling', stageColor: '#38bdf8', vitality: 0.25, inHarvest: false, monthlyKg: 0 };

            // Months 7, 8, 9, 10: Peak harvest

              return { stage: 'harvest', stageLabel: '🧺 Continuous Fruit Picking', stageColor: '#16a34a', vitality: 1.0, inHarvest: true, monthlyKg: squashYield };
            }
            return { stage: 'harvest', stageLabel: '🎃 Autumn Curing & Storage', stageColor: '#f97316', vitality: 0.8, inHarvest: true, monthlyKg: 4.0 };
          }

          // 3. Root Crops (Carrots, Beets, Radishes)
          if (nameLower.includes("carrot") || nameLower.includes("radish") || nameLower.includes("beet")) {
            if (m < 3 || m > 11) return { stage: 'dormant', stageLabel: '❄️ Subterranean Soil Rest', stageColor: '#64748b', vitality: 0.05, inHarvest: false, monthlyKg: 0 };
            if (m === 3 || m === 4) return { stage: 'sown', stageLabel: '🌱 Spring Germination & Rootlet', stageColor: '#38bdf8', vitality: 0.35, inHarvest: false, monthlyKg: 0 };

        if (traits.isSupport || traits.agronomicType === 'biomass_support' || plant.isSupportSpecies || plant.category === 'support_pioneer') {

      function calculateHarvestTelemetry(plants, simulatedYears, baselineYear = 2025, timeScale = 'macro', microMonth = 7) {
        const currentYear = baselineYear + simulatedYears;
        let totalCurrentYield = 0;
        let totalMatureYield = 0;
        let bearingTreesCount = 0;
        let totalFruitingCount = 0;
        let activeHarvestCropsCount = 0;
        const activeHarvestCropsList = [];
        const byCategory = { stone: 0, pome: 0, citrus: 0, berry_nut: 0, vegetable: 0, exotic: 0 };

        plants.forEach(p => {
          const traits = classifyBotanicalSpecimen(p);
          const nameLower = (p.name + " " + (p.commonName || "") + " " + (p.botanicalName || "")).toLowerCase();
          const isVeg = p.isVegetable || p.lifecycleType === 'annual' || p.category?.startsWith('vegetable_') || traits.agronomicType === 'vegetable';

          // Strictly decouple non-food species: only plants classified as edible fruit, nut, berry, or vegetable generate harvest yield
          const isFoodCrop = isVeg || traits.isFruitBearing || ['edible_fruit', 'nut', 'vegetable', 'shrub_berry'].includes(traits.agronomicType);
          const isExcluded = traits.isSupport || traits.agronomicType === 'biomass_support' || traits.agronomicType === 'timber_climax' || traits.agronomicType === 'ornamental' || traits.agronomicType === 'aromatic_herb' || traits.agronomicType === 'companion_flower';

          if (!isFoodCrop || isExcluded) return;

          totalFruitingCount++;
          const pheno = getCropMicroPhenology(p, microMonth);

          if (isVeg) {
            const vegAnnualMature = nameLower.includes("zucchini") ? 14 : nameLower.includes("squash") ? 16 : nameLower.includes("tomato") ? 10 : 5;
            totalMatureYield += vegAnnualMature;

            if (timeScale === 'micro') {
              if (pheno.inHarvest) {
                activeHarvestCropsCount++;
                activeHarvestCropsList.push(p.name);
                totalCurrentYield += pheno.monthlyKg;
                byCategory.vegetable += pheno.monthlyKg;
              }
            } else {
              // Macro 10-year scale: annual vegetables yield steadily every year
              bearingTreesCount++;
              totalCurrentYield += vegAnnualMature;
              byCategory.vegetable += vegAnnualMature;
            }
            return;
          }

          // Perennial Orchard Species
          let baseMatureKg = 25;
          let cat = "exotic";

          if (traits.morphologicalHabit === 'citrus_evergreen' || /citrus|lemon|citron|orange|lime|mandarin|clementine/i.test(nameLower)) {
            baseMatureKg = 25;
            cat = "citrus";
          } else if (nameLower.includes("apple") || nameLower.includes("pear") || nameLower.includes("quince") || traits.morphologicalHabit === 'apple_pome' || traits.morphologicalHabit === 'pear_pome' || traits.morphologicalHabit === 'quince_pome') {
            baseMatureKg = nameLower.includes("crab") ? 15 : 45;
            cat = "pome";
          } else if (nameLower.includes("plum") || nameLower.includes("mirabelle") || nameLower.includes("peach") || nameLower.includes("apricot") || nameLower.includes("cherry") || traits.morphologicalHabit === 'cherry_stone' || traits.morphologicalHabit === 'peach_stone' || traits.morphologicalHabit === 'plum_stone') {
            baseMatureKg = 35;
            cat = "stone";
          } else if (nameLower.includes("hazel") || nameLower.includes("walnut") || nameLower.includes("almond") || nameLower.includes("chestnut") || nameLower.includes("berry") || nameLower.includes("currant") || traits.morphologicalHabit === 'hazelnut_coppice' || traits.morphologicalHabit === 'berry_shrub') {
            baseMatureKg = 12;
            cat = "berry_nut";
          } else {
            baseMatureKg = 20;
            cat = "exotic";
          }

          totalMatureYield += baseMatureKg;
          const firstFruitYear = (p.plantedYear || baselineYear) + 2;

          if (timeScale === 'micro') {
            if (pheno.inHarvest) {
              activeHarvestCropsCount++;
              activeHarvestCropsList.push(p.name);
              totalCurrentYield += pheno.monthlyKg;
              byCategory[cat] = (byCategory[cat] || 0) + pheno.monthlyKg;
            }
          } else {
            if (currentYear >= firstFruitYear) {
              bearingTreesCount++;
              const ageBearing = currentYear - firstFruitYear + 0.5;
              const maturityRatio = Math.min(1.0, Math.max(0.25, ageBearing / 3.5));
              const currentYield = Math.round(baseMatureKg * maturityRatio);
              totalCurrentYield += currentYield;
              byCategory[cat] = (byCategory[cat] || 0) + currentYield;
            }
          }
        });

        const capacityPct = totalMatureYield > 0 ? Math.min(100, Math.round((totalCurrentYield / totalMatureYield) * 100)) : 0;
        return {
          totalCurrentYield: Math.round(totalCurrentYield),
          totalMatureYield,
          capacityPct,
          bearingTreesCount,
          totalFruitingCount,
          activeHarvestCropsCount,
          activeHarvestCropsList,
          byCategory
        };
      }

      function calculateBiomassTelemetry(plants, simulatedYears, coppiceCount = 0, timeScale = 'macro', microMonth = 7) {
        const supportPlants = plants.filter(p => {
          const traits = classifyBotanicalSpecimen(p);
          return p.isSupportSpecies || p.category === 'support_pioneer' || traits.isSupport || traits.agronomicType === 'biomass_support';
        });
        let readyCount = 0;
        let availableBiomassKg = 0;

        supportPlants.forEach(p => {
          const currentHeight = (p.initialHeightMeters || 0.6) + (p.growthRateMPerYear || 1.2) * (timeScale === 'micro' ? 1.0 : simulatedYears);
          const spread = Math.min(p.crownDiameterMax || 3, (p.crownDiameterMax || 2.5) * 0.6 + (timeScale === 'micro' ? 0.3 : simulatedYears * 0.2));
          const biomass = p.status === 'coppiced' ? 2 : Math.max(5, Math.round(currentHeight * spread * 4.2));
          availableBiomassKg += biomass;

          if (currentHeight >= 1.8 && p.status !== 'coppiced') {
            readyCount++;
          }
        });

        // Add garden vegetable biomass in micro mode (prunings, sucker pinchings, vine clearance)
        if (timeScale === 'micro') {
          const m = Math.floor(microMonth);
          const gardenGreenMulch = m >= 5 && m <= 10 ? 25 + m * 3 : 10;
          availableBiomassKg += gardenGreenMulch;
        }

        const seasonFraction = ((microMonth - 1) / 12);
        const isSpring = seasonFraction >= 0.15 && seasonFraction < 0.38;
        const isAutumn = seasonFraction >= 0.65 && seasonFraction < 0.88;
        const isOptimalWindow = isSpring || isAutumn;

        let windowName = isSpring ? "🌸 Spring Chop Window" : isAutumn ? "🍂 Autumn Mulch Window" : "☀️ Summer Aeration Window";
        let urgencyBase = (seasonFraction * 75) % 100;
        if (isOptimalWindow) urgencyBase += 20;
        urgencyBase -= Math.min(50, coppiceCount * 7);
        const urgencyPct = Math.max(10, Math.min(99, Math.round(urgencyBase)));

        return {
          supportCount: supportPlants.length,
          readyCount,
          availableBiomassKg,
          urgencyPct,
          windowName,
          isOptimalWindow
        };
      }

      function calculateEcologyTelemetry(plants, simulatedYears, baselineYear = 2025, microMonth = 9) {
        const currentYear = baselineYear + simulatedYears;
        const seasonFraction = ((microMonth - 1) / 12);
        const isLateSummerAutumn = seasonFraction >= 0.45 && seasonFraction < 0.85;
        
        let severeHornetRiskTrees = 0;
        let moderateWaspRiskTrees = 0;
        let pollinatorHubCount = 0;
        let companionFlowerCount = 0;

        plants.forEach(p => {
          const nameLower = (p.name + " " + (p.commonName || "") + " " + (p.botanicalName || "")).toLowerCase();
          const isBearing = currentYear >= ((p.plantedYear || baselineYear) + 2);

          if (p.category === 'companion_flower' || nameLower.includes('marigold') || nameLower.includes('nasturtium') || nameLower.includes('borage')) {
            companionFlowerCount++;
          }

          if (nameLower.includes("willow") || nameLower.includes("paulownia") || nameLower.includes("locust") || nameLower.includes("hazel") || nameLower.includes("comfrey") || nameLower.includes("clover") || p.category === 'companion_flower') {
            pollinatorHubCount++;
          }

          if (isBearing && isLateSummerAutumn) {
            if (nameLower.includes("fig") || nameLower.includes("pear")) {
              severeHornetRiskTrees++;
            } else if (nameLower.includes("plum") || nameLower.includes("mirabelle") || nameLower.includes("peach") || nameLower.includes("grape")) {
              moderateWaspRiskTrees++;
            }
          }
        });

        return {
          severeHornetRiskTrees,
          moderateWaspRiskTrees,
          pollinatorHubCount,
          companionFlowerCount,
          isWarningActive: severeHornetRiskTrees > 0
        };
      }

      const DEFAULT_SECTOR_CONFIG = {
        winterWindSector: 'NW',
        summerWindSector: 'SW',
        slopeDirection: 'S',
        frostHazardSector: 'N'
      };

      function calculateSuccessionTelemetry(plants, microMonthFloat, simulatedYears, timeScale = 'micro') {
        const m = Math.max(1, Math.min(12, Math.floor(microMonthFloat)));
        const sowIndoorList = [];
        const directSowList = [];
        const transplantList = [];
        const activeHarvestList = [];
        const restingList = [];

        const bedsSet = new Set();
        let raisedBedCount = 0;
        let orchardLineCount = 0;
        let totalVegetableSpecimens = 0;
        let nitrogenFixerCount = 0;
        let companionShieldCount = 0;

        plants.forEach(p => {
          const lineNum = Number(p.line) || 1;
          bedsSet.add(lineNum);
          const isVeg = p.isVegetable || p.lifecycleType === 'annual' || p.category?.startsWith('vegetable_');
          if (isVeg) totalVegetableSpecimens++;
          if (p.nitrogenFixer) nitrogenFixerCount++;
          if (p.category === 'companion_flower' || /marigold|tagetes|nasturtium|borage/i.test(p.name)) companionShieldCount++;

          const pheno = getCropMicroPhenology(p, m);
          const nameLower = (p.name + " " + (p.commonName || "")).toLowerCase();

          if (pheno.inHarvest) {
            activeHarvestList.push({ name: p.name, category: p.category, monthlyKg: pheno.monthlyKg, bed: lineNum });
          } else if (pheno.stage === 'sown') {
            if (nameLower.includes("tomato") || nameLower.includes("pepper") || nameLower.includes("eggplant")) {
              sowIndoorList.push({ name: p.name, bed: lineNum, days: p.daysToMaturity || 75 });
            } else {
              directSowList.push({ name: p.name, bed: lineNum, days: p.daysToMaturity || 50 });
            }
          } else if (pheno.stage === 'vegetative' && m === 5) {
            transplantList.push({ name: p.name, bed: lineNum });
          } else if (pheno.stage === 'dormant') {
            restingList.push({ name: p.name, bed: lineNum });
          }
        });

        bedsSet.forEach(l => {
          const bedPlants = plants.filter(p => Number(p.line) === l);
          const hasVeg = bedPlants.some(p => p.isVegetable || p.lifecycleType === 'annual');
          if (hasVeg) raisedBedCount++;
          else orchardLineCount++;
        });

        const activePickingCrops = activeHarvestList.length;
        const totalSowingNow = sowIndoorList.length + directSowList.length;
        const successionScore = Math.min(100, Math.round((activePickingCrops * 15) + (totalSowingNow * 10) + (companionShieldCount * 8)));

        return {
          currentMonthNum: m,
          sowIndoorList,
          directSowList,
          transplantList,
          activeHarvestList,
          restingList,
          totalBeds: bedsSet.size,
          raisedBedCount,
          orchardLineCount,
          totalVegetableSpecimens,
          nitrogenFixerCount,
          companionShieldCount,
          successionScore
        };
      }

      /**
       * STAGE 1: Biological Solar Profiles
       * Maps each specimen to solar exposure tiers with unambiguous French, English and Latin alias resolution:
       * - canopy_dominant: Upper overstory forest layer capturing full zenith insolation.
       * - heliophile: Full-sun demanders requiring >= 7.0h direct sun for pollination, fruit swell, and fungal defense.
       * - moderate: Partial-sun crops productive in 4.5-6h direct solar exposure.
       * - sciaphile: Forest understory / shade-loving species (< 3.5h) where summer canopy shields from heat stress and bolting.
       */
      function getPlantLightProfile(plant) {
        if (!plant) {
          return {
            tier: 'moderate',
            label: 'Moderate / Partial Sun',
            minSunHours: 5.0,
            preferredAspect: 'Morning Sun / Dappled Light',
            tolerance: 'Standard Flexibility',
            description: 'Standard temperate crop with flexible light requirements.'
          };
        }

        const nameLower = (plant.name + " " + (plant.commonName || "") + " " + (plant.botanicalName || "")).toLowerCase();
        const traits = classifyBotanicalSpecimen(plant);
        const isVeg = plant.isVegetable || plant.lifecycleType === 'annual' || plant.category?.startsWith('vegetable_') || traits.agronomicType === 'vegetable';

        // 1. Canopy Dominants (Upper overstory timber, windbreak sentinels, tall pioneer biomass spires)
        if (!isVeg && (
          traits.agronomicType === 'timber_climax' || 
          traits.isSupport || 
          plant.isSupportSpecies || 
          /sequoia|redwood|cedar|cèdre|cedrus|oak|chêne|quercus|poplar|peuplier|populus|willow|saule|salix|paulownia|plane|platane|platanus|chestnut|châtaign|castanea|walnut|noyer|juglans|pecan|pacanier|carya|spruce|épicéa|picea|fir|sapin|abies|douglas|pine|pin|pinus/i.test(nameLower)
        )) {
          return {
            tier: 'canopy_dominant',
            label: 'Canopy Dominant',
            minSunHours: 8.0,
            preferredAspect: 'High Climax Canopy / Zenith Overstory',
            tolerance: 'Dominant Light Harvester',
            description: 'Upper forest layer capturing full overhead zenith insolation while projecting shadows northward.'
          };
        }

        // 2. Sciaphile: Forest Understory & Shade-Tolerant species (Summer canopy shields from thermal bolting)
        if (
          /spinach|épinard|lettuce|laitue|salade|mâche|corn salad|chard|blette|arugula|roquette|watercress|cresson|comfrey|consoude|symphytum|rhubarb|rhubarbe|rheum|strawberry|fraise|fragaria|raspberry|framboise|currant|cassis|groseille|ribes|blackberry|mûre|rubus|gooseberry|myrtille|blueberry|mint|menthe|wild garlic|ail des ours/i.test(nameLower) ||
          plant.category === 'shrub_berry' ||
          traits.morphologicalHabit === 'perennial_rosette' ||
          traits.morphologicalHabit === 'comfrey_guild'
        ) {
          return {
            tier: 'sciaphile',
            label: 'Shade Tolerant / Understory',
            minSunHours: 3.0,
            preferredAspect: 'Dappled Understory / Living Mulch',
            tolerance: 'High Shade Tolerance',
            description: 'Thrives in lower guild shade; summer canopy cover shields succulent foliage from thermal heat stress and premature bolting.'
          };
        }

        // 3. Heliophile: Full Sun Demanders (Nightshades, Cucurbits, Melons, Stone fruits, Figs, Vines, Subtropicals)
        if (

      /**
       * STAGE 1: Spatial Shade & Overlap Engine
       * - Resolves physical 2D coordinates (X along row, Y across alleys in meters).
       * - Calculates dynamic crown radius and mature tree heights across the 10-year timeline.
       * - Computes northward midday solar shadow reach based on calendar month solar altitude.
       * - Discovers critical solar deficits on light-hungry crops under expanding canopy branches.
       * - Identifies beneficial summer nurse cooling shade for sensitive understory greens.
       * - Detects canopy interlocking crowding clashes between adjacent timber trees.
       */
      function calculateShadeInterferenceTelemetry(plants, simulatedYears = 0, microMonthFloat = 7, baselineYear = 2025) {
        if (!plants || plants.length === 0) {
          return {
            criticalDeficitCount: 0,
            criticalDeficits: [],
            crowdingClashes: [],
            beneficialNurseShades: [],
            siteSolarEfficiencyPct: 100,
            averageCanopyHeight: 0,
            plantShadeMap: {}
          };
        }

        const m = Math.max(1, Math.min(12, Math.floor(microMonthFloat)));
        const isSummer = m >= 5 && m <= 8;

        // Seasonal midday solar altitude shadow multiplier (temperate latitude ~44°N - 48°N)
        // Midsummer (June/July): high solar zenith (~68°), shadow reach ~0.40x height.
        // Equinox (March/Sept): medium solar zenith (~45°), shadow reach ~1.0x height.
        // Midwinter (Dec/Jan): low solar angle (~21°), shadow reach ~2.65x height.
        const seasonalProgress = ((microMonthFloat - 6.5) / 12) * 2 * Math.PI;
        const shadowFactor = Math.max(0.40, Math.min(2.65, 1.15 - 0.72 * Math.cos(seasonalProgress)));

        // 1. Establish metric physical 2D coordinates (X: West->East, Y: South->North in meters)
        // Line 1: Southernmost agroforestry alley (Y = 0m)
        // Line 2: Kitchen Garden Bed #1 (Y = 4.0m)
        // Line 3: Kitchen Garden Bed #2 (Y = 8.0m)
        // Line 4: Courtyard Terrace / Agroforestry Alley (Y = 12.0m)
        // Zone 3: Banana / Biomass Basin (X = 18m, Y = 6m)
        // Zone 4: Northern Climax Windbreak Sentinels (Y = 17.0m)
        const spatialPlants = plants.map((p, idx) => {
          const lineNum = Number(p.line);
          const pos = Number(p.linePosition) || (idx + 1);
          const isVeg = p.isVegetable || p.lifecycleType === 'annual' || p.category?.startsWith('vegetable_');
          const zone = Number(p.zone) || 2;

          let x = 0;
          let y = 0;

          if (!isNaN(lineNum) && lineNum > 0) {
            y = (lineNum - 1) * 4.0;
            x = (pos - 1) * (isVeg ? 0.6 : 2.2);
          } else if (zone === 4) {
            y = 17.0;
            x = (idx % 6) * 3.8;
          } else if (zone === 3) {
            y = 6.0;
            x = 18.0 + (idx % 4) * 2.5;
          } else {
            y = 8.0;
            x = (idx % 8) * 2.5;
          }

          // Calculate dynamic height and mature crown spread at current simulated timeline
          const maxH = p.maxHeightMeters || (isVeg ? 0.6 : 4.5);
          const rawH = (p.initialHeightMeters || (isVeg ? 0.3 : 0.6)) + (p.growthRateMPerYear || (isVeg ? 0.4 : 0.45)) * simulatedYears;
          const currentHeight = p.status === 'coppiced' ? 0.4 : Math.min(maxH * 1.08, rawH);

          const matureSpreadM = p.crownDiameterMax || (maxH * 0.75);
          const maturityRatio = Math.min(1.0, Math.max(0.3, currentHeight / maxH));
          const crownRadiusM = p.status === 'coppiced' 
            ? 0.4 
            : Math.max(0.25, (matureSpreadM / 2) * (0.35 + 0.65 * maturityRatio));

          const shadowLengthM = currentHeight * shadowFactor;
          const lightProfile = getPlantLightProfile(p);

          return {
            ...p,
            x,
            y,
            currentHeight,
            crownRadiusM,
            shadowLengthM,
            lightProfile,
            isVeg
          };
        });

        const criticalDeficits = [];
        const crowdingClashes = [];
        const beneficialNurseShades = [];
        const plantShadeMap = {};

        spatialPlants.forEach(target => {
          let directOverhangCount = 0;
          let shadowIntersections = 0;
          let maxShadowIntensity = 0;
          const shadingAggressors = [];

          spatialPlants.forEach(source => {
            if (source.id === target.id) return;

            // Compute Euclidean physical distance in meters
            const dx = target.x - source.x;
            const dy = target.y - source.y;
            const dist = Math.hypot(dx, dy);

            // A. Direct Crown Overhang Check (source branches physically extend over target)
            const isOverhung = dist < source.crownRadiusM;
            if (isOverhung && source.currentHeight > target.currentHeight + 0.4) {
              directOverhangCount++;
              const overhangIntensity = Math.min(0.95, 0.55 + (source.currentHeight / 12) * 0.4);
              if (overhangIntensity > maxShadowIntensity) maxShadowIntensity = overhangIntensity;
              shadingAggressors.push({ plant: source, type: 'overhang', intensity: overhangIntensity, dist });
            }

            // B. Midday Solar Shadow Cone Check (source is south of target, casting shadow northward toward +Y)
            const isSouthOfTarget = source.y < target.y;
            const northwardDistance = target.y - source.y;
            const lateralOffset = Math.abs(target.x - source.x);

            if (isSouthOfTarget && northwardDistance <= source.shadowLengthM && lateralOffset <= (source.crownRadiusM * 1.25)) {
              shadowIntersections++;
              const shadowProximityRatio = 1.0 - (northwardDistance / source.shadowLengthM);
              const shadowIntensity = Math.max(0.2, shadowProximityRatio * 0.75);

              if (shadowIntensity > maxShadowIntensity) maxShadowIntensity = shadowIntensity;
              shadingAggressors.push({ plant: source, type: 'shadow_cone', intensity: shadowIntensity, dist });
            }

            // C. Crown Crowding Clashes (Adjacent mature trees interlocking boughs)
            if (!target.isVeg && !source.isVeg && target.currentHeight >= 2.0 && source.currentHeight >= 2.0) {
              const combinedRadius = target.crownRadiusM + source.crownRadiusM;
              if (dist < combinedRadius && source.id < target.id) {
                const overlapMeters = Math.round((combinedRadius - dist) * 10) / 10;
                crowdingClashes.push({
                  treeA: source,
                  treeB: target,
                  distanceMeters: Math.round(dist * 10) / 10,
                  overlapMeters,
                  advice: `Crowns interlock by ${overlapMeters}m. Selectively prune interlocking boughs or coppice support pioneer to ensure lateral airflow.`
                });
              }
            }
          });

          const solarAccessPct = Math.max(10, Math.round((1.0 - maxShadowIntensity) * 100));
          const primaryAggressor = shadingAggressors.sort((a, b) => b.intensity - a.intensity)[0]?.plant || null;

          // 1. Critical Solar Deficits: Full-sun demanders (heliophiles) shaded significantly (>= 45%)
          if (target.lightProfile.tier === 'heliophile' && maxShadowIntensity >= 0.45 && primaryAggressor) {
            const deficitPct = Math.round(maxShadowIntensity * 100);
            let advice = `Relocate Bed ${target.line || 1} crops to southern clearing or reduce aggressor canopy.`;
            if (primaryAggressor.isSupportSpecies || primaryAggressor.category === 'support_pioneer') {
              advice = `Aggressor "${primaryAggressor.name}" is a fast biomass pioneer: coppice back to base stool (chop & drop) to reopen the solar chimney.`;
            }

            criticalDeficits.push({
              victimPlant: target,
              aggressorPlant: primaryAggressor,
              deficitPct,
              solarAccessPct,
              shadowReachMeters: Math.round(primaryAggressor.shadowLengthM * 10) / 10,
              distanceMeters: Math.round(Math.hypot(target.x - primaryAggressor.x, target.y - primaryAggressor.y) * 10) / 10,
              advice
            });
          }

          // 2. Beneficial Nurse Cooling Shade: Understory greens shielded from scorching summer heat
          if (target.lightProfile.tier === 'sciaphile' && maxShadowIntensity >= 0.30 && isSummer && primaryAggressor) {
            const coolingRatingPct = Math.min(95, Math.round(maxShadowIntensity * 100));
            beneficialNurseShades.push({
              benefitedCrop: target,
              nurseTree: primaryAggressor,
              coolingRatingPct,
              note: `Beneficial thermal nurse shade from "${primaryAggressor.name}" reduces midday soil evaporation and prevents heat bolting in ${target.name}.`
            });
          }

          plantShadeMap[target.id] = {
            solarAccessPct,
            isObscured: maxShadowIntensity >= 0.45,
            primaryAggressorName: primaryAggressor?.name || null,
            shadingAggressorsCount: shadingAggressors.length,
            isBenefited: target.lightProfile.tier === 'sciaphile' && maxShadowIntensity >= 0.30 && isSummer
          };
        });

        // 3. Composite Site Solar Efficiency Score (0 - 100%)
        const totalPlants = spatialPlants.length;
        const severelyDeficitedCount = criticalDeficits.length;
        const canopyTrees = spatialPlants.filter(p => !p.isVeg);
        const avgCanopyHeight = canopyTrees.length > 0 
          ? Math.round((canopyTrees.reduce((acc, t) => acc + t.currentHeight, 0) / canopyTrees.length) * 10) / 10 
          : 0;

        const siteSolarEfficiencyPct = totalPlants > 0
          ? Math.max(15, Math.min(100, Math.round(((totalPlants - severelyDeficitedCount * 1.5) / totalPlants) * 100)))
          : 100;

        return {
          criticalDeficitCount: criticalDeficits.length,
          criticalDeficits,
          crowdingClashes,
          beneficialNurseShades,
          siteSolarEfficiencyPct,
          averageCanopyHeight: avgCanopyHeight,
          plantShadeMap
        };
      }

          try {

            if (saved && (saved === 'en' || saved === 'fr')) return saved;
          } catch(e) {}
          return browserLocaleInfo.initialLang;
        });

        // ------------------------------------------------------------------

        // ------------------------------------------------------------------
        const [theme, setTheme] = useState(() => {
          try {
            const saved = localStorage.getItem('ff_theme');
            if (saved === 'light' || saved === 'dark') return saved;
          } catch(e) {}
          return 'dark';
        });

        const toggleTheme = () => {
          soundEngine.playTone(700, 0.04, 'triangle');
          setTheme(prev => {
            const next = prev === 'dark' ? 'light' : 'dark';
            try {
              localStorage.setItem('ff_theme', next);
            } catch(e) {}
            return next;
          });
        };

        useEffect(() => {
          try {
            document.body.classList.remove('dark', 'light');
            document.body.classList.add(theme);
          } catch(e) {}
        }, [theme]);

        // ------------------------------------------------------------------
        // GLOBAL TIME-OF-DAY ATMOSPHERE STATE & CYCLE HANDLER
        // ------------------------------------------------------------------
        const [skyMode, setSkyMode] = useState(() => sysDate.diurnalPhase || 'day');

        const cycleSkyMode = useCallback(() => {
          soundEngine.playTone(520, 0.04, 'triangle');
          setSkyMode(prev => {
            const cycle = ['day', 'dusk', 'night', 'twilight'];
            const nextIdx = (cycle.indexOf(prev) + 1) % cycle.length;
            return cycle[nextIdx];
          });
        }, []);

        const handleSetLang = (newLang) => {
          soundEngine.playTone(560, 0.04, 'triangle');
          setCurrentLang(newLang);
          try {
            localStorage.setItem('ff_lang', newLang);
          } catch(e) {}
        };

        const t = useCallback((key) => {
          return I18N[currentLang]?.[key] || I18N['en']?.[key] || key;
        }, [currentLang]);

        const calendarMonths = useMemo(() => {
          return getLocalizedCalendarMonths(currentLang);
        }, [currentLang]);

        // Refresh time context every 30 seconds to maintain synchronized diurnal tracking
        useEffect(() => {
          const timer = setInterval(() => {
            setCurrentTimeInfo(getSystemDateContext());
          }, 30000);
          return () => clearInterval(timer);
        }, []);

        const [gardenMeta, setGardenMeta] = useState(() => {

      function ExportModal({ isOpen, gardenMeta, plants, simulatedYears, harvestTelemetry, biomassTelemetry, pruningHistory, sectorConfig, currentLang = 'en', browserLocaleInfo = null, onClose }) {
        if (!isOpen) return null;

        const downloadFile = (filename, content, mime) => {
          soundEngine.playTone(600, 0.05, 'triangle');
          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          a.click();
          URL.revokeObjectURL(url);
        };

        const exportJSON = () => {
          const regionContext = browserLocaleInfo || getBrowserLocaleInfo();
          const payload = {
            gardenMeta,
            userRegion: {
              detectedLocale: regionContext.detectedLocale || 'en-US',
              activeLanguage: currentLang || 'en',
              timeZone: regionContext.detectedTimezone || 'UTC',
              systemTimestamp: new Date().toISOString()
            },
            exportDate: new Date().toISOString(),
            simulatedYears,
            totalPlantsCount: plants.length,
            harvestTelemetry,
            biomassTelemetry,
            pruningHistory,
            sectorConfig: sectorConfig || DEFAULT_SECTOR_CONFIG,
            plants
          };
          const jsonStr = JSON.stringify(payload, null, 2);
          downloadFile(`${gardenMeta.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_data.json`, jsonStr, 'application/json');
        };

        const exportCSV = () => {
          const headers = ["ID", "Name", "Common Name", "Botanical Name", "Category", "Lifecycle", "Is Vegetable", "Days To Maturity", "Spacing (cm)", "Habit", "Zone", "Line/Bed", "Position", "Sector", "Aspect", "Landmark Anchor", "Planted Year", "Initial Height (m)", "Max Height (m)", "Status", "Is Support", "Nitrogen Fixer", "Notes"];
          const rows = plants.map(p => {
            return [
              p.id,
              `"${(p.name || '').replace(/"/g, '""')}"`,
              `"${(p.commonName || '').replace(/"/g, '""')}"`,
              `"${(p.botanicalName || '').replace(/"/g, '""')}"`,
              p.category || 'fruit_tree',
              p.lifecycleType || 'perennial',
              p.isVegetable ? 'YES' : 'NO',
              p.daysToMaturity || '',
              p.spacingCm || '',
              p.growthHabit || 'upright',
              p.zone || 2,
              p.line || 1,
              p.linePosition || 1,
              `"${p.cardinalSector || 'S'}"`,
              `"${(p.sunAspect || 'Full Sun').replace(/"/g, '""')}"`,
              `"${(p.landmarkAnchor || '').replace(/"/g, '""')}"`,
              p.plantedYear || 2025,
              p.initialHeightMeters || 0.6,
              p.maxHeightMeters || 4.5,
              p.status || 'thriving',
              p.isSupportSpecies ? 'YES' : 'NO',
              p.nitrogenFixer ? 'YES' : 'NO',
              `"${(p.notes || '').replace(/"/g, '""')}"`
            ].join(',');
          });
          const csvContent = [headers.join(','), ...rows].join('\n');
          downloadFile(`${gardenMeta.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_inventory.csv`, csvContent, 'text/csv');
        };

        const exportMarkdown = () => {
          const simulatedYearInt = gardenMeta.baselineYear + Math.floor(simulatedYears);
          const activeSecConfig = sectorConfig || DEFAULT_SECTOR_CONFIG;
          let md = `# Garden & Agroforestry Audit Report
**Site Name**: ${gardenMeta.name}  
**Location**: ${gardenMeta.location}  
**Baseline Year**: ${gardenMeta.baselineYear}  
**Simulated Horizon**: Year ${simulatedYearInt} (+${simulatedYears.toFixed(1)} Years)  
**Total Plantings**: ${plants.length} Specimens across ${new Set(plants.map(p => p.line || 1)).size} Beds & Lines  

---

## 1. Executive Telemetry
- **Annual Harvest Projection**: ~${harvestTelemetry.totalCurrentYield} kg/year (${harvestTelemetry.capacityPct}% of mature capacity)
- **Bearing Fruit & Vegetable Producers**: ${harvestTelemetry.bearingTreesCount} of ${harvestTelemetry.totalFruitingCount} active fruiting crops
- **Available Support Biomass**: ~${biomassTelemetry.availableBiomassKg} kg fresh mulch pool
- **Pruning Urgency**: ${biomassTelemetry.urgencyPct}% (${biomassTelemetry.readyCount} support trees ready for coppice)

---

## 2. Permaculture Sector & Energy Vector Calibration
- **Prevailing Winter Gale Corridor**: Sector ${activeSecConfig.winterWindSector}
- **Summer Hot Wind / Fire Hazard**: Sector ${activeSecConfig.summerWindSector}
- **Topography Drainage Slope**: Towards ${activeSecConfig.slopeDirection}
- **Frost Pocket Basin**: Sector ${activeSecConfig.frostHazardSector}

---

## 3. Species Inventory by Line / Bed
`;
          const lines = Array.from(new Set(plants.map(p => Number(p.line || 1)))).sort((a, b) => a - b);
          lines.forEach(l => {
            md += `\n### Bed / Line ${l}\n`;
            md += `| Pos | Sector | Crop / Tree | Botanical Name | Type | Days/Harvest | Spacing |\n`;
            md += `| :---: | :---: | :--- | :--- | :---: | :---: | :---: |\n`;
            const lPlants = plants.filter(p => Number(p.line || 1) === l).sort((a, b) => (a.linePosition || 0) - (b.linePosition || 0));
            lPlants.forEach(p => {
              const type = p.isVegetable ? "🥬 Veg" : p.isSupportSpecies ? "✂️ Support" : "🍎 Perennial";
              const days = p.daysToMaturity ? `${p.daysToMaturity}d` : p.harvestSeason || 'N/A';
              const spacing = p.spacingCm ? `${p.spacingCm}cm` : `${p.crownDiameterMax || 3}m`;
              md += `| ${p.linePosition || '-'} | **${p.cardinalSector || 'S'}** | ${p.name} | *${p.botanicalName || 'N/A'}* | ${type} | ${days} | ${spacing} |\n`;
            });
          });

          downloadFile(`${gardenMeta.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_audit_report.md`, md, 'text/markdown');
        };

        return React.createElement('div', { className: 'fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto' },
          React.createElement('div', { className: 'relative w-full max-w-lg bg-slate-950 border-2 border-cyan-500/70 rounded-2xl p-5 shadow-2xl text-left space-y-4 my-auto' },
            React.createElement('div', { className: 'flex items-center justify-between border-b border-slate-800 pb-2' },
              React.createElement('div', null,
                React.createElement('h3', { className: 'font-sci-fi font-black text-sm text-cyan-300' }, '💾 EXPORT & SHARE GARDEN STATE'),
                React.createElement('p', { className: 'font-mono text-[9px] text-slate-400' }, 'Generate clean offline backups and reports')
              ),
              React.createElement('button', { onClick: onClose, className: 'text-slate-400 hover:text-white font-mono text-base' }, '✕')
            ),

            React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-2.5 font-arcade text-[7px]' },
              React.createElement('div', {
                onClick: exportJSON,
                className: 'p-3 rounded-xl bg-slate-900/90 border border-slate-700 hover:border-emerald-400 cursor-pointer flex flex-col justify-between items-center text-center gap-2 group transition-all'
              },
                React.createElement('span', { className: 'text-2xl group-hover:scale-110 transition-transform' }, '💾'),
                React.createElement('span', { className: 'font-bold text-white' }, 'JSON BACKUP'),
                React.createElement('span', { className: 'font-mono text-[8px] text-slate-400' }, 'Complete state restore')
              ),
              React.createElement('div', {
                onClick: exportCSV,
                className: 'p-3 rounded-xl bg-slate-900/90 border border-slate-700 hover:border-cyan-400 cursor-pointer flex flex-col justify-between items-center text-center gap-2 group transition-all'

                React.createElement('span', { className: 'text-2xl group-hover:scale-110 transition-transform' }, '📊'),
                React.createElement('span', { className: 'font-bold text-cyan-300' }, 'CSV TABLE'),
                React.createElement('span', { className: 'font-mono text-[8px] text-slate-400' }, 'Excel & Google Sheets')

              'Files export locally inside your browser via standard HTML5 Blobs. No cloud upload required.'

            )
          )
        );
      }

      const CURATED_MODEL_LADDER = [

      async function fetchWithExponentialBackoff(url, options, maxRetries = 3) {
        let delayMs = 1000;
        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const resp = await fetch(url, options);
            if ((resp.status === 429 || resp.status === 503) && attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delayMs));
              delayMs *= 2;
              continue;
            }
            return resp;
          } catch (networkErr) {
            if (attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delayMs));
              delayMs *= 2;
              continue;
            }
            throw networkErr;
          }
        }
      }

      function scoreGeminiModel(name) {
        const lower = name.toLowerCase();
        if (lower === 'gemini-3-flash-preview') return 1000;
        if (lower.startsWith('gemini-3') && lower.includes('flash')) return 950;
        if (lower.includes('3-flash')) return 920;
        if (lower.startsWith('gemini-2.5-flash')) return 850;
        if (lower.startsWith('gemini-2.0-flash')) return 780;
        if (lower.startsWith('gemini-1.5-flash')) return 700;
        if (lower.includes('3-pro')) return 650;
        if (lower.includes('2.5-pro')) return 600;
        return 300;
      }

      async function getAvailableGeminiModels(apiKey = '') {
        const trimmedKey = (apiKey || '').trim();
        if (trimmedKey) {
          try {
            const res = await fetchWithExponentialBackoff(
              `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(trimmedKey)}`,
              { method: 'GET' },
              2
            );
            if (res && res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.models)) {
                const candidates = data.models
                  .filter(m => {
                    const rawName = (m.name || '').replace('models/', '');
                    const isGemini = rawName.toLowerCase().includes('gemini');
                    const canGenerate = Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent');
                    const isSpecialized = /embedding|imagen|image-generation|tts|transcribe|realtime|robotics/i.test(rawName);
                    return isGemini && canGenerate && !isSpecialized;
                  })
                  .map(m => m.name.replace('models/', ''));

                if (candidates.length > 0) {
                  candidates.sort((a, b) => scoreGeminiModel(b) - scoreGeminiModel(a));
                  const finalList = [];
                  for (const model of candidates) {
                    if (!finalList.includes(model)) finalList.push(model);
                  }
                  for (const fallback of CURATED_MODEL_LADDER) {
                    if (!finalList.includes(fallback)) finalList.push(fallback);
                  }
                  return finalList;
                }
              }
            }
          } catch (e) {}
        }
        return CURATED_MODEL_LADDER;
      }
