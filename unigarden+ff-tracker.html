      /**
       * Strictly geometric subterranean root crop renderer (Carrot, Beet, Radish, Potato, Alliums)
       * Renders the root structure directly into the subterranean compost layer below baseY.
       */
      function drawRootCrop(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null) {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        // Dormant Winter State: Mulched soil cap with resting seed/root marker
        if (isDormant) {
          ctx.strokeStyle = '#b45309';
          ctx.lineWidth = 1.5;
          for (let m = -14; m <= 14; m += 7) {
            ctx.beginPath();
            ctx.moveTo(px + m, baseY - 1);
            ctx.lineTo(px + m + 5, baseY - 5);
            ctx.stroke();
          }
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.arc(px, baseY + 8, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.8 + px * 0.12) * 2;

        // ----------------- SUBTERRANEAN ROOT BODIES (Below baseY) -----------------
        if (nameLower.includes('carrot')) {
          // Geometric Tapered Carrot (Inverted Faceted Triangle)
          const rootDepth = (28 + Math.min(16, (plant.daysToMaturity || 70) * 0.2)) * Math.max(0.4, vitality);
          const rootWidth = 11 * Math.max(0.45, vitality);

          // Dark border for retro arcade definition
          ctx.fillStyle = '#7c2d12';
          ctx.beginPath();
          ctx.moveTo(px - rootWidth / 2 - 1, baseY + 1);
          ctx.lineTo(px + rootWidth / 2 + 1, baseY + 1);
          ctx.lineTo(px, baseY + rootDepth + 3);
          ctx.closePath();
          ctx.fill();

          // Main Orange Body
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.moveTo(px - rootWidth / 2, baseY + 2);
          ctx.lineTo(px + rootWidth / 2, baseY + 2);
          ctx.lineTo(px, baseY + rootDepth);
          ctx.closePath();
          ctx.fill();

          // Geometric facet highlight
          ctx.fillStyle = '#fb923c';
          ctx.beginPath();
          ctx.moveTo(px - rootWidth / 2, baseY + 2);
          ctx.lineTo(px, baseY + 2);
          ctx.lineTo(px, baseY + rootDepth);
          ctx.closePath();
          ctx.fill();

          // Geometric horizontal ring steps
          ctx.strokeStyle = '#c2410c';
          ctx.lineWidth = 1;
          for (let y = baseY + 8; y < baseY + rootDepth - 4; y += 7) {
            const span = (rootWidth / 2) * (1 - (y - baseY) / rootDepth);
            ctx.beginPath();
            ctx.moveTo(px - span, y);
            ctx.lineTo(px + span, y);
            ctx.stroke();
          }

        } else if (nameLower.includes('beet')) {
          // Geometric Faceted Ruby Diamond / Hexagon Bulb
          const bulbRadius = 10 * Math.max(0.4, vitality);
          const cy = baseY + bulbRadius + 4;

          ctx.fillStyle = '#881337';
          ctx.beginPath();
          ctx.moveTo(px, cy - bulbRadius);
          ctx.lineTo(px + bulbRadius, cy);
          ctx.lineTo(px, cy + bulbRadius * 1.3);
          ctx.lineTo(px - bulbRadius, cy);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#4c0519';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Taproot anchor tail
          ctx.strokeStyle = '#be123c';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(px, cy + bulbRadius * 1.3);
          ctx.lineTo(px, cy + bulbRadius * 1.9);
          ctx.stroke();

        } else if (nameLower.includes('potato')) {
          // Cluster of 3 Geometric Tubers in Subterranean Hill
          const tuberSizes = [8, 7, 6];
          const tuberOffsets = [
            { dx: -7, dy: 14, w: 9, h: 6 },
            { dx: 6, dy: 16, w: 8, h: 5 },
            { dx: 0, dy: 24, w: 9, h: 6 }
          ];

          tuberOffsets.forEach((t, idx) => {
            const tx = px + t.dx * vitality;
            const ty = baseY + t.dy * vitality;
            ctx.fillStyle = '#a16207';
            ctx.beginPath();
            ctx.rect(tx - t.w / 2, ty - t.h / 2, t.w, t.h);
            ctx.fill();
            ctx.fillStyle = '#ca8a04';
            ctx.fillRect(tx - t.w / 2 + 1, ty - t.h / 2 + 1, t.w - 2, t.h - 2);

            // Stolon connector thread
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(px, baseY + 4);
            ctx.lineTo(tx, ty);
            ctx.stroke();
          });

        } else if (nameLower.includes('radish')) {
          // Faceted Magenta Diamond with White Tip
          const rSize = 7 * Math.max(0.45, vitality);
          const cy = baseY + rSize + 2;

          ctx.fillStyle = '#e11d48';
          ctx.beginPath();
          ctx.moveTo(px, cy - rSize);
          ctx.lineTo(px + rSize, cy);
          ctx.lineTo(px, cy + rSize);
          ctx.lineTo(px - rSize, cy);
          ctx.closePath();
          ctx.fill();

          // White retro bottom tip
          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.moveTo(px - rSize * 0.4, cy + rSize * 0.5);
          ctx.lineTo(px + rSize * 0.4, cy + rSize * 0.5);
          ctx.lineTo(px, cy + rSize + 4);
          ctx.closePath();
          ctx.fill();

        } else {
          // Alliums (Garlic / Onion / Leek)
          const bulbW = 10 * Math.max(0.4, vitality);
          const bulbH = 12 * Math.max(0.4, vitality);
          const cy = baseY + bulbH * 0.6;

          ctx.fillStyle = nameLower.includes('garlic') ? '#f1f5f9' : '#eab308';
          ctx.beginPath();
          ctx.rect(px - bulbW / 2, cy - bulbH / 2, bulbW, bulbH);
          ctx.fill();
          ctx.strokeStyle = nameLower.includes('garlic') ? '#9333ea' : '#854d0e';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Root beard hairs
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1;
          [-3, 0, 3].forEach(dx => {
            ctx.beginPath();
            ctx.moveTo(px + dx, cy + bulbH / 2);
            ctx.lineTo(px + dx * 1.5, cy + bulbH / 2 + 8);
            ctx.stroke();
          });
        }

        // ----------------- ABOVE-GROUND FOLIAGE (Above baseY) -----------------
        if (nameLower.includes('onion') || nameLower.includes('garlic') || nameLower.includes('leek')) {
          // Spiky upright geometric needles
          const blades = 4;
          for (let b = 0; b < blades; b++) {
            const bladeH = (18 + b * 5) * Math.max(0.35, vitality);
            const bx = px + (b - 1.5) * 4 + sway * 0.4;
            ctx.strokeStyle = '#14b8a6';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(px + (b - 1.5) * 2, baseY);
            ctx.lineTo(bx, baseY - bladeH);
            ctx.stroke();
          }
        } else {
          // Feathery angular plumes (Carrots, Beets, Radish)
          const plumes = 5;
          for (let p = 0; p < plumes; p++) {
            const angle = (p - 2) * 0.35;
            const topH = (16 + Math.abs(p - 2) * 4) * Math.max(0.4, vitality);
            const tx = px + Math.sin(angle) * 14 + sway;
            const ty = baseY - topH;

            ctx.strokeStyle = plant.foliageColor || '#16a34a';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.lineTo(tx, ty);
            ctx.stroke();

            // Geometric polygonal leaf tufts
            ctx.fillStyle = p % 2 === 0 ? '#4ade80' : '#86efac';
            ctx.beginPath();
            ctx.rect(tx - 2.5, ty - 2.5, 5, 5);
            ctx.fill();
            ctx.strokeStyle = '#022c22';
            ctx.lineWidth = 0.7;
            ctx.strokeRect(tx - 2.5, ty - 2.5, 5, 5);
          }
        }
        ctx.restore();
      }

      /**
       * Permaculture Landmark: Thermal Stone Wall Heat Sink
       * Renders rustic limestone/granite masonry behind heat-sink crops (Fig, Persimmon, Apricot).
       * Stores daytime solar insolation and radiates heat to adjacent crops during cold nights.
       */
      function drawThermalStoneWall(ctx, startX, endX, baseY, animTime, bioActive = true) {
        ctx.save();
        const wallW = endX - startX;
        const wallH = 68;
        const wallTopY = baseY - wallH;

        // 1. Shaded backdrop behind wall
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(startX - 12, wallTopY, wallW + 24, wallH);

        // 2. Multi-course weathered stone masonry courses
        const courses = 5;
        const courseH = wallH / courses;
        for (let c = 0; c < courses; c++) {
          const cy = wallTopY + c * courseH;
          const blockOffset = (c % 2 === 0 ? 0 : 22);
          const blockW = 38;

          for (let bx = startX - 10 + blockOffset; bx < endX + 16; bx += blockW + 3) {
            const thisW = Math.min(blockW, endX + 14 - bx);
            if (thisW <= 4) continue;

            // Varied warm earth tones for limestone & sandstone
            const seed = Math.sin(bx * 0.13 + c * 1.7);
            const stoneColor = seed > 0.3 ? '#57534e' : seed > -0.2 ? '#44403c' : '#78716c';
            const highlightColor = seed > 0.3 ? '#a8a29e' : '#d6d3d1';

            ctx.fillStyle = stoneColor;
            ctx.fillRect(bx, cy, thisW, courseH - 2);

            // Chiaroscuro top edge highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.fillRect(bx, cy, thisW, 1.5);

            // Shaded lower mortar groove
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(bx, cy + courseH - 2.5, thisW, 1.5);
            ctx.fillRect(bx + thisW - 1.5, cy, 1.5, courseH - 2);

            // Crevice sedums / stonecrops
            if ((c === 2 || c === 3) && Math.abs(seed) > 0.6) {
              ctx.fillStyle = '#22c55e';
              ctx.fillRect(bx + 4, cy + courseH - 3, 5, 2.5);
              ctx.fillStyle = '#facc15';
              ctx.fillRect(bx + 6, cy + courseH - 4.5, 2, 2);
            }
          }
        }

        // 3. Heavy coping stones on wall crest
        ctx.fillStyle = '#292524';
        ctx.fillRect(startX - 16, wallTopY - 4, wallW + 32, 5);
        ctx.strokeStyle = '#a8a29e';
        ctx.lineWidth = 1;
        ctx.strokeRect(startX - 16, wallTopY - 4, wallW + 32, 5);

        // 4. Amber Thermal Convection Heat Shimmer Particles rising into tree canopy
        if (bioActive) {
          ctx.fillStyle = 'rgba(251, 146, 60, 0.45)';
          const shimmerCount = 8;
          for (let s = 0; s < shimmerCount; s++) {
            const sx = startX + ((s * 48 + animTime * 28) % wallW);
            const riseProgress = ((animTime * 0.8 + s * 0.22) % 1);
            const sy = wallTopY + 12 - (riseProgress * (wallH + 20));
            const waveX = Math.sin(animTime * 3 + s) * 3;
            ctx.beginPath();
            ctx.arc(sx + waveX, sy, 1.8 * (1 - riseProgress * 0.5), 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.restore();
      }

      /**
       * Permaculture Landmark: Wildlife Pond & Swale Catchment Margin
       * Renders an aquatic basin with clear turquoise/deep water gradient, underwater gravel,
       * surface lily pads with blossoms, and vertical bulrushes/cattails (Typha latifolia).
       */
      function drawWildlifePond(ctx, x, baseY, animTime, bioActive = true) {
        ctx.save();
        const pondW = 95;
        const pondDepth = 36;
        const startX = x - pondW / 2;

        // 1. Excavated pond basin cutaway below baseY
        const pondGrad = ctx.createLinearGradient(0, baseY, 0, baseY + pondDepth);
        pondGrad.addColorStop(0, '#0284c7');
        pondGrad.addColorStop(0.35, '#0369a1');
        pondGrad.addColorStop(0.75, '#082f49');
        pondGrad.addColorStop(1, '#021827');

        ctx.fillStyle = pondGrad;
        ctx.beginPath();
        ctx.moveTo(startX, baseY);
        ctx.quadraticCurveTo(x, baseY + pondDepth * 1.15, startX + pondW, baseY);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // 2. Subsoil gravel & stone lining
        ctx.fillStyle = '#475569';
        [-38, -22, -8, 8, 22, 38].forEach((gx, idx) => {
          const gy = baseY + Math.sin(((gx + 47) / 95) * Math.PI) * (pondDepth * 0.95);
          ctx.beginPath();
          ctx.ellipse(x + gx, gy, 4, 2.5, idx * 0.2, 0, Math.PI * 2);
          ctx.fill();
        });

        // 3. Water surface caustics & specular ripples
        ctx.strokeStyle = 'rgba(224, 242, 254, 0.65)';
        ctx.lineWidth = 1.2;
        for (let r = 0; r < 3; r++) {
          const rx = x - 28 + r * 26 + Math.sin(animTime * 2 + r) * 4;
          const ry = baseY + 2 + r * 1.5;
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(rx + 16, ry);
          ctx.stroke();
        }

        // 4. Floating water lily pads & white lotus blossom
        [-20, 14].forEach((lx, idx) => {
          const ly = baseY + 3;
          ctx.fillStyle = '#15803d';
          ctx.beginPath();
          ctx.ellipse(x + lx, ly, 7, 3, 0.1, 0.2, Math.PI * 1.85);
          ctx.fill();
          ctx.strokeStyle = '#052e16';
          ctx.lineWidth = 0.6;
          ctx.stroke();

          if (idx === 1) {
            // Blooming water lily flower
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x + lx + 2, ly - 2, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(x + lx + 2, ly - 2, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // 5. Tall wetland bulrushes & cattails (Typha latifolia) swaying at pond edge
        [-pondW * 0.46, -pondW * 0.38, pondW * 0.38, pondW * 0.44].forEach((rx, idx) => {
          const reedX = x + rx;
          const reedH = 42 + (idx % 2) * 12;
          const sway = Math.sin(animTime * 2.4 + idx) * 3;

          // Reed stalk
          ctx.strokeStyle = '#166534';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(reedX, baseY + 6);
          ctx.quadraticCurveTo(reedX + sway * 0.5, baseY - reedH * 0.5, reedX + sway, baseY - reedH);
          ctx.stroke();

          // Brown velvet sausage cattail head
          ctx.fillStyle = '#451a03';
          ctx.beginPath();
          ctx.ellipse(reedX + sway, baseY - reedH + 10, 2.5, 9, sway * 0.05, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#291002';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        });

        ctx.restore();
      }

      /**
       * Permaculture Landmark: Integrated Chicken Forage Run (Poulailler)
       * Renders timber posts, diamond chicken-wire netting, coop shelter,
       * and animated foraging hens scratching through the woodchip mulch.
       */
      function drawChickenRun(ctx, x, baseY, animTime) {
        ctx.save();
        const fenceW = 105;
        const fenceH = 58;
        const startX = x - fenceW / 2;
        const topY = baseY - fenceH;

        // 1. Weathered timber posts
        const postSpacing = 35;
        ctx.fillStyle = '#78350f';
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 1.1;

        for (let px = startX; px <= startX + fenceW + 2; px += postSpacing) {
          ctx.fillRect(px - 2.5, topY - 3, 5, fenceH + 4);
          ctx.strokeRect(px - 2.5, topY - 3, 5, fenceH + 4);
        }

        // Top & bottom tension wires
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(startX - 4, topY);
        ctx.lineTo(startX + fenceW + 4, topY);
        ctx.moveTo(startX - 4, baseY - 2);
        ctx.lineTo(startX + fenceW + 4, baseY - 2);
        ctx.moveTo(startX - 4, topY + fenceH * 0.5);
        ctx.lineTo(startX + fenceW + 4, topY + fenceH * 0.5);
        ctx.stroke();

        // 2. Diamond wire mesh netting
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        for (let gx = startX; gx < startX + fenceW; gx += 8) {
          ctx.moveTo(gx, topY);
          ctx.lineTo(gx + 12, baseY);
          ctx.moveTo(gx + 12, topY);
          ctx.lineTo(gx, baseY);
        }
        ctx.stroke();

        // 3. Small timber hen shelter / coop roofline on left edge
        ctx.fillStyle = '#854d0e';
        ctx.beginPath();
        ctx.moveTo(startX - 18, baseY);
        ctx.lineTo(startX - 18, topY + 12);
        ctx.lineTo(startX + 6, topY + 4);
        ctx.lineTo(startX + 6, baseY);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // Slanted cedar plank roof
        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.moveTo(startX - 22, topY + 14);
        ctx.lineTo(startX + 10, topY + 2);
        ctx.lineTo(startX + 10, topY + 6);
        ctx.lineTo(startX - 22, topY + 18);
        ctx.closePath();
        ctx.fill();

        // Nest box round pophole door
        ctx.fillStyle = '#1c1917';
        ctx.beginPath();
        ctx.arc(startX - 6, baseY - 12, 6, Math.PI, 0);
        ctx.lineTo(startX, baseY);
        ctx.lineTo(startX - 12, baseY);
        ctx.closePath();
        ctx.fill();

        // 4. Animated retro foraging hens scratching in the mulch
        const hens = [
          { dx: 14, color: '#ea580c', comb: '#ef4444', isPecking: true },
          { dx: 38, color: '#f8fafc', comb: '#dc2626', isPecking: false }
        ];

        hens.forEach((hen, idx) => {
          const hx = startX + hen.dx;
          const hy = baseY - 2;
          const peckT = Math.sin(animTime * 4.5 + idx * 2.2);
          const headDrop = hen.isPecking ? Math.max(0, peckT * 4) : 0;

          // Hen plump body
          ctx.fillStyle = hen.color;
          ctx.beginPath();
          ctx.ellipse(hx, hy - 6, 6, 4.5, -0.15, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#7c2d12';
          ctx.lineWidth = 0.6;
          ctx.stroke();

          // Tail feathers perked up
          ctx.fillStyle = hen.color;
          ctx.beginPath();
          ctx.moveTo(hx - 5, hy - 7);
          ctx.lineTo(hx - 9, hy - 11);
          ctx.lineTo(hx - 4, hy - 9);
          ctx.closePath();
          ctx.fill();

          // Head & beak bobbing
          ctx.fillStyle = hen.color;
          ctx.beginPath();
          ctx.arc(hx + 5, hy - 9 + headDrop, 3, 0, Math.PI * 2);
          ctx.fill();

          // Yellow beak
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.moveTo(hx + 7, hy - 9 + headDrop);
          ctx.lineTo(hx + 10, hy - 8 + headDrop);
          ctx.lineTo(hx + 7, hy - 7 + headDrop);
          ctx.closePath();
          ctx.fill();

          // Red comb
          ctx.fillStyle = hen.comb;
          ctx.fillRect(hx + 4, hy - 13 + headDrop, 2.5, 2.5);

          // Slender yellow legs
          ctx.strokeStyle = '#ca8a04';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(hx - 1, hy - 2);
          ctx.lineTo(hx - 1, hy);
          ctx.moveTo(hx + 2, hy - 2);
          ctx.lineTo(hx + 2, hy);
          ctx.stroke();
        });

        ctx.restore();
      }

      /**
       * Permaculture Landmark: Woodshed Depot & Firewood Cordwood Stacks
       * Renders a timber lean-to shed with cedar shingles, neatly stacked cordwood logs,
       * and garden hand tools resting against the post.
       */
      function drawToolDepotWoodshed(ctx, x, baseY) {
        ctx.save();
        const shedW = 68;
        const shedH = 56;
        const startX = x - shedW / 2;
        const topY = baseY - shedH;

        // Timber upright frame posts
        ctx.fillStyle = '#78350f';
        ctx.fillRect(startX, topY, 4.5, shedH);
        ctx.fillRect(startX + shedW - 4.5, topY + 8, 4.5, shedH - 8);
        ctx.fillRect(startX, topY, shedW, 4);

        // Slanted cedar corrugated roof
        ctx.fillStyle = '#9a3412';
        ctx.beginPath();
        ctx.moveTo(startX - 6, topY - 2);
        ctx.lineTo(startX + shedW + 6, topY + 8);
        ctx.lineTo(startX + shedW + 6, topY + 12);
        ctx.lineTo(startX - 6, topY + 2);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Stacked firewood logs with concentric tree ring ends
        const logR = 4.2;
        for (let row = 0; row < 4; row++) {
          const ly = baseY - 5 - row * 7.5;
          const colsInRow = 6 - (row % 2);
          for (let col = 0; col < colsInRow; col++) {
            const lx = startX + 8 + col * 8.5 + (row % 2 === 1 ? 4 : 0);
            ctx.fillStyle = '#d97706';
            ctx.beginPath();
            ctx.arc(lx, ly, logR, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#78350f';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            // Heartwood ring
            ctx.fillStyle = '#92400e';
            ctx.beginPath();
            ctx.arc(lx, ly, 1.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Garden pitchfork leaning against timber post
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(startX + shedW + 2, baseY);
        ctx.lineTo(startX + shedW - 2, topY + 14);
        ctx.stroke();

        // 3 Tines
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.0;
        [-2, 0, 2].forEach(tx => {
          ctx.beginPath();
          ctx.moveTo(startX + shedW + 2 + tx, baseY);
          ctx.lineTo(startX + shedW + 1 + tx, baseY - 6);
          ctx.stroke();
        });

        ctx.restore();
      }

      /**
       * Permaculture Hydrological Swale & Mound Berm Cross-Section
       * Replaces flat turf with an authentic swale contour:
       * - Uphill concave ditch basin that slows and catches overland rainwater runoff
       * - Infiltrating water arrows penetrating subterranean subsoil
       * - Uncompacted raised berm mound where trees are planted, capped in organic ramial mulch
       */
      function drawPermacultureSwaleDitch(ctx, stationX, baseY, animTime, bioActive = true) {
        ctx.save();
        const ditchW = 48;
        const ditchDepth = 15;
        const ditchLeft = stationX - 70;
        const ditchCenter = ditchLeft + ditchW / 2;

        // 1. Excavated concave swale ditch cross-section
        const ditchGrad = ctx.createLinearGradient(0, baseY, 0, baseY + ditchDepth + 8);
        ditchGrad.addColorStop(0, '#1c1917');
        ditchGrad.addColorStop(0.5, '#0c0a09');
        ditchGrad.addColorStop(1, '#022c22');
        ctx.fillStyle = ditchGrad;

        ctx.beginPath();
        ctx.moveTo(ditchLeft, baseY);
        ctx.quadraticCurveTo(ditchCenter, baseY + ditchDepth, ditchLeft + ditchW, baseY);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#365314';
        ctx.lineWidth = 1.4;
        ctx.stroke();

        // 2. Slow pooling rainwater in swale basin
        const waterDepth = 6;
        ctx.fillStyle = 'rgba(6, 182, 212, 0.45)';
        ctx.beginPath();
        ctx.moveTo(ditchLeft + 6, baseY + ditchDepth - waterDepth);
        ctx.quadraticCurveTo(ditchCenter, baseY + ditchDepth, ditchLeft + ditchW - 6, baseY + ditchDepth - waterDepth);
        ctx.closePath();
        ctx.fill();

        // 3. Subterranean moisture infiltration arrows feeding tree roots
        if (bioActive) {
          const flowProgress = (animTime * 0.7) % 1;
          const arrowY = baseY + ditchDepth + (flowProgress * 18);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.65)';
          ctx.beginPath();
          ctx.arc(ditchCenter, arrowY, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. Raised uncompacted planting berm mound under the tree root collar
        const bermRadius = 45;
        ctx.fillStyle = '#292524';
        ctx.beginPath();
        ctx.ellipse(stationX, baseY, bermRadius, 6, 0, Math.PI, 0);
        ctx.fill();

        // Thick woodchip / ramial mulch blanket capping the berm
        ctx.fillStyle = '#b45309';
        ctx.fillRect(stationX - bermRadius * 0.9, baseY - 4, bermRadius * 1.8, 3.5);

        ctx.restore();
      }

      function drawTwilightSky(ctx, width, height, skyMode = 'twilight', simulatedYears = 0, animTime = 0, scrollX = 0, totalWorldWidth = 2000, theme = 'dark') {
        ctx.save();
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        if (skyMode === 'night') {
          skyGrad.addColorStop(0, '#020617');
          skyGrad.addColorStop(0.45, '#090d16');
          skyGrad.addColorStop(0.85, '#0c1a1a');
          skyGrad.addColorStop(1, '#052e16');
        } else if (skyMode === 'dusk') {
          skyGrad.addColorStop(0, '#1e1b4b');
          skyGrad.addColorStop(0.35, '#581c87');
          skyGrad.addColorStop(0.65, '#9a3412');
          skyGrad.addColorStop(0.88, '#d97706');
          skyGrad.addColorStop(1, '#14532d');
        } else if (skyMode === 'day') {
          skyGrad.addColorStop(0, '#0284c7');
          skyGrad.addColorStop(0.4, '#38bdf8');
          skyGrad.addColorStop(0.75, '#bae6fd');
          skyGrad.addColorStop(0.92, '#ecfdf5');
          skyGrad.addColorStop(1, '#15803d');
        } else {
          // 'twilight' (Dawn / early morning)
          skyGrad.addColorStop(0, '#0f172a');
          skyGrad.addColorStop(0.35, '#312e81');
          skyGrad.addColorStop(0.65, '#701a75');
          skyGrad.addColorStop(0.85, '#b45309');
          skyGrad.addColorStop(1, '#064e3b');
        }
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        if (skyMode === 'night' || skyMode === 'twilight') {
          const starCount = skyMode === 'night' ? 65 : 30;
          for (let s = 0; s < starCount; s++) {
            const sx = ((s * 97 + 13) % (width + 200)) - (scrollX * 0.05) % width;
            const sy = (s * 43 + 17) % (height * 0.55);
            const twinkle = Math.sin(animTime * 3.5 + s * 1.7) * 0.4 + 0.6;
            ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * (skyMode === 'night' ? 0.9 : 0.6)})`;
            ctx.fillRect((sx + width) % width, sy, (s % 7 === 0) ? 2 : 1.2, (s % 7 === 0) ? 2 : 1.2);
          }
        }

        const isNightOrTwilight = skyMode === 'night' || skyMode === 'twilight';
        const orbX = width * 0.78 - (scrollX * 0.03);
        const orbY = height * 0.22;
        const orbR = isNightOrTwilight ? 18 : 26;

        const coronaGrad = ctx.createRadialGradient(orbX, orbY, orbR * 0.5, orbX, orbY, orbR * 3.2);
        if (skyMode === 'day') {
          coronaGrad.addColorStop(0, 'rgba(254, 240, 138, 0.7)');
          coronaGrad.addColorStop(0.5, 'rgba(253, 224, 71, 0.25)');
          coronaGrad.addColorStop(1, 'rgba(253, 224, 71, 0)');
          ctx.fillStyle = coronaGrad;
          ctx.beginPath();
          ctx.arc(orbX, orbY, orbR * 3.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(orbX, orbY, orbR, 0, Math.PI * 2);
          ctx.fill();
        } else if (skyMode === 'dusk') {
          coronaGrad.addColorStop(0, 'rgba(251, 146, 60, 0.8)');
          coronaGrad.addColorStop(0.4, 'rgba(239, 68, 68, 0.3)');
          coronaGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
          ctx.fillStyle = coronaGrad;
          ctx.beginPath();
          ctx.arc(orbX, orbY, orbR * 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#fb923c';
          ctx.beginPath();
          ctx.arc(orbX, orbY, orbR, 0, Math.PI * 2);
          ctx.fill();
        } else {
          coronaGrad.addColorStop(0, 'rgba(224, 242, 254, 0.45)');
          coronaGrad.addColorStop(0.6, 'rgba(186, 230, 253, 0.12)');
          coronaGrad.addColorStop(1, 'rgba(186, 230, 253, 0)');
          ctx.fillStyle = coronaGrad;
          ctx.beginPath();
          ctx.arc(orbX, orbY, orbR * 2.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f8fafc';
          ctx.beginPath();
          ctx.arc(orbX, orbY, orbR, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = skyMode === 'night' ? '#090d16' : '#312e81';
          ctx.beginPath();
          ctx.arc(orbX + 5, orbY - 3, orbR * 0.85, 0, Math.PI * 2);
          ctx.fill();
        }

        const horizonBaseY = height * 0.68;
        const parallaxOffset = scrollX * 0.12;

        ctx.fillStyle = skyMode === 'night' ? 'rgba(6, 78, 59, 0.25)' : skyMode === 'dusk' ? 'rgba(88, 28, 135, 0.35)' : 'rgba(14, 116, 144, 0.28)';
        ctx.beginPath();
        ctx.moveTo(0, horizonBaseY);
        for (let x = 0; x <= width + 40; x += 30) {
          const worldX = x + parallaxOffset;
          const wave1 = Math.sin(worldX * 0.0035) * 45;
          const wave2 = Math.cos(worldX * 0.008) * 22;
          ctx.lineTo(x, horizonBaseY - 60 + wave1 + wave2);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        const midParallax = scrollX * 0.25;
        ctx.fillStyle = skyMode === 'night' ? 'rgba(2, 44, 34, 0.55)' : skyMode === 'dusk' ? 'rgba(67, 20, 7, 0.45)' : 'rgba(21, 128, 61, 0.35)';
        ctx.beginPath();
        ctx.moveTo(0, horizonBaseY);
        for (let x = 0; x <= width + 30; x += 25) {
          const worldX = x + midParallax;
          const hWave = Math.sin(worldX * 0.006) * 28 + Math.cos(worldX * 0.014) * 12;
          ctx.lineTo(x, horizonBaseY - 20 + hWave);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function drawMycorrhizalWeb(ctx, plants, baseY, animTime, bioluminescence = true) {
        if (!plants || plants.length < 2) return;
        ctx.save();
        ctx.strokeStyle = bioluminescence ? 'rgba(52, 211, 153, 0.35)' : 'rgba(148, 163, 184, 0.2)';
        ctx.lineWidth = 1;

        for (let i = 0; i < plants.length - 1; i++) {
          const p1 = plants[i];
          const p2 = plants[i + 1];
          const x1 = 140 + ((Number(p1.linePosition) || 1) - 1) * 145;
          const x2 = 140 + ((Number(p2.linePosition) || 1) - 1) * 145;
          const y1 = baseY + 18 + ((i % 3) * 6);
          const y2 = baseY + 18 + (((i + 1) % 3) * 6);
          const midX = (x1 + x2) / 2;
          const dipY = Math.max(y1, y2) + 14 + Math.sin(animTime * 1.5 + i) * 3;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo(midX, dipY, x2, y2);
          ctx.stroke();

          if (bioluminescence) {
            const pulseT = (animTime * 0.6 + i * 0.28) % 1;
            const px = Math.pow(1 - pulseT, 2) * x1 + 2 * (1 - pulseT) * pulseT * midX + Math.pow(pulseT, 2) * x2;
            const py = Math.pow(1 - pulseT, 2) * y1 + 2 * (1 - pulseT) * pulseT * dipY + Math.pow(pulseT, 2) * y2;

            ctx.fillStyle = '#34d399';
            ctx.beginPath();
            ctx.arc(px, py, 1.6, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function createCylindricalTrunkGradient(ctx, x1, x2, barkColor, isHighlighted = false, theme = 'dark') {
        const grad = ctx.createLinearGradient(x1, 0, x2, 0);
        if (isHighlighted) {
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.3, barkColor);
          grad.addColorStop(0.8, theme === 'light' ? '#334155' : '#1e293b');
          grad.addColorStop(1, theme === 'light' ? '#0f172a' : '#020617');
          return grad;
        }
        grad.addColorStop(0, theme === 'light' ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.35)');
        grad.addColorStop(0.18, barkColor);
        grad.addColorStop(0.48, barkColor);
        grad.addColorStop(0.82, theme === 'light' ? '#292524' : '#0c0a09');
        grad.addColorStop(1, theme === 'light' ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 255, 255, 0.12)');
        return grad;
      }

      function drawCanopyAmbientOcclusion(ctx, px, topY, radius, intensity = 0.45) {
        ctx.save();
        const occGrad = ctx.createRadialGradient(px, topY, 2, px, topY, radius);
        occGrad.addColorStop(0, `rgba(0, 0, 0, ${intensity})`);
        occGrad.addColorStop(0.65, `rgba(0, 0, 0, ${intensity * 0.4})`);
        occGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = occGrad;
        ctx.beginPath();
        ctx.arc(px, topY, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBarkLivingAccents(ctx, px, baseY, trunkTopY, caliper, h, p, animTime, theme = 'dark') {
        ctx.save();
        const isMature = h >= 2.5;
        const isLight = theme === 'light';

        if (isMature) {
          ctx.fillStyle = isLight ? '#166534' : '#15803d';
          const mossDots = [
            { dx: caliper * 0.5, dy: -3, r: 2.2 },
            { dx: caliper * 0.8, dy: -6, r: 1.8 },
            { dx: caliper * 0.3, dy: -10, r: 2.0 },
            { dx: caliper * 0.6, dy: -14, r: 1.5 }
          ];
          mossDots.forEach(m => {
            ctx.beginPath();
            ctx.arc(px + m.dx, baseY + m.dy, m.r, 0, Math.PI * 2);
            ctx.fill();
          });

          ctx.fillStyle = isLight ? '#86efac' : '#a7f3d0';
          ctx.beginPath();
          ctx.arc(px - caliper * 0.2, baseY - (baseY - trunkTopY) * 0.4, 1.4, 0, Math.PI * 2);
          ctx.arc(px + caliper * 0.1, baseY - (baseY - trunkTopY) * 0.65, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }

        if (h < 2.0) {
          const stakeX = px - caliper - 5;
          ctx.fillStyle = isLight ? '#92400e' : '#78350f';
          ctx.fillRect(stakeX, trunkTopY - 8, 2.5, (baseY - trunkTopY) + 14);
          ctx.strokeStyle = isLight ? 'rgba(69, 26, 3, 0.3)' : 'rgba(0, 0, 0, 0.4)';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(stakeX, trunkTopY - 8, 2.5, (baseY - trunkTopY) + 14);

          ctx.fillStyle = isLight ? '#15803d' : '#16a34a';
          ctx.fillRect(stakeX, baseY - (baseY - trunkTopY) * 0.35, caliper + 7, 2);
          ctx.fillRect(stakeX, baseY - (baseY - trunkTopY) * 0.75, caliper + 7, 2);
        }
        ctx.restore();
      }

      /**
       * STAGE 1: Core Geometry Engine Upgrade (Multi-Arc Cloud Splines & Depth Layers)
       * Replaces rigid straight-line polygon vertices with an ensemble of overlapping rounded
       * convex cloud cushions across 3 volumetric depth layers (Shadow, Main Body, Sunward Highlight).
       */
      function drawOrganicCloudPuff(ctx, px, py, rX, rY, mainColor, highlightColor, shadowColor, theme = 'dark', outlineAlpha = 0.2) {
        ctx.save();
        // Light source is positioned top-left (solar azimuth ~10 o'clock)
        const lightOffX = -rX * 0.32;
        const lightOffY = -rY * 0.38;
        const grad = ctx.createRadialGradient(
          px + lightOffX, py + lightOffY, Math.max(2, rX * 0.12),
          px, py, Math.max(rX, rY) * 1.05
        );

        if (theme === 'light') {
          grad.addColorStop(0, highlightColor);
          grad.addColorStop(0.38, mainColor);
          grad.addColorStop(0.85, shadowColor);
          grad.addColorStop(1, shadowColor);
        } else {
          grad.addColorStop(0, highlightColor);
          grad.addColorStop(0.40, mainColor);
          grad.addColorStop(0.85, shadowColor);
          grad.addColorStop(1, '#021e17');
        }

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(px, py, Math.max(4, rX), Math.max(3, rY), 0, 0, Math.PI * 2);
        ctx.fill();

        if (outlineAlpha > 0) {
          ctx.strokeStyle = theme === 'light'
            ? `rgba(20, 83, 45, ${outlineAlpha * 0.7})`
            : `rgba(0, 0, 0, ${outlineAlpha})`;
          ctx.lineWidth = 0.75;
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawSculptedFoliageBillow(ctx, cx, cy, rx, ry, baseColor, animTime = 0, sway = 0, isEvergreen = false, monthFloat = 7, autumnColor = '#d97706', theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        let fillColor = baseColor;

        if (!isEvergreen) {
          if (m >= 9 && m <= 11) {
            fillColor = autumnColor;
          } else if (m >= 3 && m <= 4) {
            fillColor = '#86efac';
          }
        }

        const isAutumn = (!isEvergreen && m >= 9 && m <= 11);
        const isSpring = (!isEvergreen && m >= 3 && m <= 4);

        // Derive harmonious light and shadow tints based on seasonal base color & theme
        let highlightTint = 'rgba(255, 255, 255, 0.38)';
        let deepShadowTint = '#14532d';

        if (isAutumn) {
          highlightTint = 'rgba(254, 240, 138, 0.45)';
          deepShadowTint = theme === 'light' ? '#7c2d12' : '#451a03';
        } else if (isSpring) {
          highlightTint = 'rgba(255, 255, 255, 0.55)';
          deepShadowTint = theme === 'light' ? '#15803d' : '#064e3b';
        } else {
          deepShadowTint = theme === 'light' ? '#14532d' : '#022c22';
        }

        // Sub-cluster definitions: 6 overlapping rounded convex cloud cushions
        // Each cluster has independent harmonic wind rustle offsets
        const clusters = [
          // 1. Deep Core Base
          { dx: 0, dy: 0, rxMult: 0.78, ryMult: 0.74, phase: 0.0, layer: 'mid' },
          // 2. Left Shoulder
          { dx: -rx * 0.44, dy: -ry * 0.12, rxMult: 0.54, ryMult: 0.52, phase: 0.8, layer: 'mid' },
          // 3. Right Shoulder
          { dx: rx * 0.44, dy: -ry * 0.08, rxMult: 0.56, ryMult: 0.54, phase: 1.6, layer: 'mid' },
          // 4. Apex Crown Crest
          { dx: -rx * 0.06, dy: -ry * 0.48, rxMult: 0.58, ryMult: 0.52, phase: 2.3, layer: 'top' },
          // 5. Lower-Left Skirt
          { dx: -rx * 0.36, dy: ry * 0.28, rxMult: 0.52, ryMult: 0.46, phase: 3.1, layer: 'bottom' },
          // 6. Lower-Right Skirt
          { dx: rx * 0.36, dy: ry * 0.28, rxMult: 0.54, ryMult: 0.48, phase: 3.9, layer: 'bottom' }
        ];

        // ----------------- PASS 1: REAR VOLUMETRIC DEPTH (DEEP SHADOW CUSHIONS) -----------------
        // Offset down and away from the sun to establish heavy understory depth
        ctx.save();
        const rearShadowColor = theme === 'light' ? 'rgba(20, 83, 45, 0.28)' : 'rgba(2, 44, 34, 0.75)';
        [-rx * 0.28, 0, rx * 0.28].forEach((offX, idx) => {
          const rearSway = sway * 0.65 + Math.sin(animTime * 1.8 + idx) * 1.5;
          ctx.fillStyle = rearShadowColor;
          ctx.beginPath();
          ctx.ellipse(
            cx + offX + rearSway,
            cy + ry * 0.22,
            rx * 0.58,
            ry * 0.46,
            0, 0, Math.PI * 2
          );
          ctx.fill();
        });
        ctx.restore();

        // ----------------- PASS 2: MAIN MID-TONE CANOPY CUSHIONS -----------------
        clusters.forEach(c => {
          const clusterSway = sway + Math.sin(animTime * 2.2 + c.phase) * (rx * 0.035);
          const px = cx + c.dx + clusterSway;
          const py = cy + c.dy;
          const curRx = rx * c.rxMult;
          const curRy = ry * c.ryMult;

          drawOrganicCloudPuff(
            ctx, px, py, curRx, curRy,
            fillColor,
            highlightTint,
            deepShadowTint,
            theme,
            0.20
          );
        });

        // ----------------- PASS 3: SUNWARD HIGHLIGHT PILLOWS (UPPER-LEFT SUN KISSES) -----------------
        const highlightClusters = [
          { dx: -rx * 0.24, dy: -ry * 0.38, rxMult: 0.36, ryMult: 0.32, phase: 1.1 },
          { dx: rx * 0.12, dy: -ry * 0.42, rxMult: 0.34, ryMult: 0.28, phase: 2.0 },
          { dx: -rx * 0.32, dy: -ry * 0.06, rxMult: 0.32, ryMult: 0.28, phase: 2.8 }
        ];

        highlightClusters.forEach(hc => {
          const hlSway = sway * 1.1 + Math.sin(animTime * 2.4 + hc.phase) * (rx * 0.03);
          const px = cx + hc.dx + hlSway;
          const py = cy + hc.dy;
          const curRx = rx * hc.rxMult;
          const curRy = ry * hc.ryMult;

          ctx.save();
          const hlGrad = ctx.createRadialGradient(
            px - curRx * 0.25, py - curRy * 0.3, 2,
            px, py, curRx
          );
          hlGrad.addColorStop(0, theme === 'light' ? 'rgba(255, 255, 255, 0.45)' : 'rgba(255, 255, 255, 0.25)');
          hlGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.08)');
          hlGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = hlGrad;
          ctx.beginPath();
          ctx.ellipse(px, py, curRx, curRy, -0.15, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

        ctx.restore();
      }

      function drawLeafyGreen(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null, theme = 'dark') {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        if (isDormant) {
          ctx.strokeStyle = '#b45309';
          ctx.lineWidth = 1.5;
          for (let m = -14; m <= 14; m += 7) {
            ctx.beginPath();
            ctx.moveTo(px + m, baseY);
            ctx.lineTo(px + m + 5, baseY - 5);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.2 + px * 0.1) * 1.8;
        const bushW = (24 + Math.min(20, (plant.crownDiameter || 0.4) * 25)) * Math.max(0.4, vitality);
        const bushH = (18 + Math.min(22, (plant.maxHeightMeters || 0.4) * 28)) * Math.max(0.4, vitality);
        const petals = nameLower.includes('kale') ? 7 : 6;

        for (let p = 0; p < petals; p++) {
          const angle = (p / (petals - 1) - 0.5) * 1.8;
          const petioleL = bushH * 0.9;
          const tx = px + Math.sin(angle) * (bushW * 0.6) + sway;
          const ty = baseY - Math.cos(angle) * petioleL;

          ctx.strokeStyle = theme === 'light' ? '#15803d' : '#166534';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.lineTo(tx, ty);
          ctx.stroke();

          ctx.fillStyle = plant.foliageColor || (theme === 'light' ? '#16a34a' : '#15803d');
          ctx.beginPath();
          ctx.arc(tx, ty, bushW * 0.28, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = theme === 'light' ? 'rgba(20, 83, 45, 0.4)' : '#052e16';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.strokeStyle = theme === 'light' ? '#86efac' : '#4ade80';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx - 4, ty - 5);
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + 4, ty - 5);
          ctx.stroke();
        }

        if (pheno && pheno.stage === 'harvest') {
          ctx.fillStyle = theme === 'light' ? '#16a34a' : '#22c55e';
          ctx.beginPath();
          ctx.ellipse(px + 8, baseY - 5, 10, 4.5, 0.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawPalmateLeafShield(ctx, px, baseY, bushW, bushH, animTime, pheno, theme = 'dark') {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const sway = Math.sin(animTime * 2.2 + px) * 2;
        const lobes = 5;

        // 1. Thick succulent hollow leaf petioles arching outward
        for (let i = 0; i < lobes; i++) {
          const angle = (i / (lobes - 1) - 0.5) * 2.2;
          const stalkLen = bushH * 0.88;
          const midX = px + Math.sin(angle) * (bushW * 0.35) + sway * 0.5;
          const midY = baseY - stalkLen * 0.5;
          const lx = px + Math.sin(angle) * (bushW * 0.65) + sway;
          const ly = baseY - Math.cos(angle * 0.65) * stalkLen;

          ctx.strokeStyle = theme === 'light' ? '#166534' : '#15803d';
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.quadraticCurveTo(midX, midY, lx, ly);
          ctx.stroke();

          // 2. Scalloped rounded palmate umbrella shield leaf
          const leafR = bushW * 0.28;
          ctx.fillStyle = theme === 'light' ? '#15803d' : '#14532d';
          ctx.beginPath();
          ctx.ellipse(lx, ly, leafR * 1.1, leafR * 0.85, angle, 0, Math.PI * 2);
          ctx.fill();

          // Delicate scalloped wavy leaf border
          ctx.strokeStyle = theme === 'light' ? 'rgba(21, 128, 61, 0.5)' : '#052e16';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Distinct palmate radiating leaf veins
          ctx.strokeStyle = theme === 'light' ? '#86efac' : '#4ade80';
          ctx.lineWidth = 0.9;
          [-0.35, 0, 0.35].forEach(vAngle => {
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx + Math.sin(angle + vAngle) * (leafR * 0.75), ly - Math.cos(angle + vAngle) * (leafR * 0.65));
            ctx.stroke();
          });
        }

        // 3. Fruit swell & ruffled golden star blossoms
        if (pheno && pheno.stage === 'harvest') {
          // Glossy ribbed summer zucchini or rounded golden winter squash
          ctx.fillStyle = theme === 'light' ? '#166534' : '#15803d';
          ctx.beginPath();
          ctx.ellipse(px + 12, baseY - 7, 18 * vitality, 7 * vitality, 0.12, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = theme === 'light' ? '#052e16' : '#022c22';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Pale longitudinal ribbing stripes
          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.moveTo(px - 4, baseY - 7);
          ctx.quadraticCurveTo(px + 12, baseY - 9, px + 28, baseY - 6);
          ctx.stroke();

          // Flower scar at fruit apex
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(px + 12 + 18 * vitality, baseY - 6, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (pheno && pheno.stage === 'flowering') {
          // Large ruffled golden bee pollinator cup blossom
          const fx = px + 4 + sway * 0.5;
          const fy = baseY - bushH * 0.45;
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(fx, fy, 7 * vitality, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#eab308';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.arc(fx, fy, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawViningCrop(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null, theme = 'dark') {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        if (isDormant) {
          ctx.strokeStyle = '#b45309';
          ctx.lineWidth = 1.5;
          for (let m = -12; m <= 12; m += 6) {
            ctx.beginPath();
            ctx.moveTo(px + m, baseY);
            ctx.lineTo(px + m + 4, baseY - 4);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.4 + px * 0.1) * 2;
        const vineH = Math.max(28, 85 * Math.max(0.35, vitality));

        ctx.strokeStyle = theme === 'light' ? '#78350f' : '#92400e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px - 1, baseY);
        ctx.lineTo(px + sway * 0.2, baseY - vineH - 12);
        ctx.stroke();

        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1;
        for (let y = baseY - 18; y > baseY - vineH; y -= 22) {
          ctx.beginPath();
          ctx.moveTo(px - 6, y);
          ctx.lineTo(px + 6, y);
          ctx.stroke();
        }

        ctx.strokeStyle = theme === 'light' ? '#15803d' : '#22c55e';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(px, baseY);
        const steps = 6;
        for (let s = 1; s <= steps; s++) {
          const sy = baseY - (s / steps) * vineH;
          const sx = px + (s % 2 === 0 ? 5 : -5) + (s / steps) * sway;
          ctx.lineTo(sx, sy);
        }
        ctx.stroke();

        for (let s = 1; s <= steps; s++) {
          const sy = baseY - (s / steps) * vineH;
          const sx = px + (s % 2 === 0 ? 6 : -6) + (s / steps) * sway;
          ctx.fillStyle = plant.foliageColor || (theme === 'light' ? '#16a34a' : '#15803d');
          ctx.beginPath();
          ctx.ellipse(sx, sy, 7 * vitality, 4.5 * vitality, (s % 2 === 0 ? 0.3 : -0.3), 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = theme === 'light' ? 'rgba(21, 128, 61, 0.4)' : '#052e16';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        if (pheno && pheno.stage === 'flowering') {
          const isTomato = nameLower.includes('tomato') || nameLower.includes('tomate');
          const isBean = nameLower.includes('bean') || nameLower.includes('pea');
          const flColor = isTomato ? '#facc15' : isBean ? '#ef4444' : '#fef08a';

          for (let f = 2; f <= 5; f += 2) {
            const fy = baseY - (f / steps) * vineH;
            const fx = px + (f % 2 === 0 ? 11 : -11) + sway;
            ctx.fillStyle = flColor;
            ctx.beginPath();
            ctx.arc(fx, fy, 3, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (pheno && pheno.stage === 'harvest') {
          const isTomato = nameLower.includes('tomato') || nameLower.includes('tomate');
          const isCucumber = nameLower.includes('cucumber') || nameLower.includes('concombre');

          if (isTomato) {
            const fruitSpots = [
              { dx: 9, yRatio: 0.35, r: 4.5, c: plant.fruitColor || '#ef4444' },
              { dx: 14, yRatio: 0.42, r: 4.0, c: '#ea580c' },
              { dx: -10, yRatio: 0.55, r: 4.8, c: plant.fruitColor || '#ef4444' },
              { dx: -14, yRatio: 0.62, r: 3.8, c: '#84cc16' }
            ];
            fruitSpots.forEach(fs => {
              const fy = baseY - fs.yRatio * vineH;
              const fx = px + fs.dx + sway * 0.5;
              ctx.fillStyle = fs.c;
              ctx.beginPath();
              ctx.arc(fx, fy, fs.r * Math.max(0.6, vitality), 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#7f1d1d';
              ctx.lineWidth = 0.8;
              ctx.stroke();

              ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
              ctx.beginPath();
              ctx.arc(fx - 1.2, fy - 1.2, 1.2, 0, Math.PI * 2);
              ctx.fill();
            });
          } else if (isCucumber) {
            [-8, 9].forEach((cxOff, idx) => {
              const cy = baseY - (0.4 + idx * 0.25) * vineH;
              ctx.fillStyle = '#16a34a';
              ctx.beginPath();
              ctx.ellipse(px + cxOff + sway, cy, 3.5, 9 * vitality, 0.1, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#052e16';
              ctx.lineWidth = 0.8;
              ctx.stroke();
            });
          } else {
            [-7, 8, -6].forEach((bxOff, idx) => {
              const by = baseY - (0.35 + idx * 0.2) * vineH;
              ctx.strokeStyle = '#84cc16';
              ctx.lineWidth = 2.4;
              ctx.beginPath();
              ctx.moveTo(px + bxOff, by);
              ctx.quadraticCurveTo(px + bxOff + (idx % 2 === 0 ? 4 : -4), by + 7, px + bxOff, by + 12);
              ctx.stroke();
            });
          }
        }
        ctx.restore();
      }

      function drawBushCrop(ctx, px, baseY, plant, animTime, bioActive = true, pheno = null, theme = 'dark') {
        ctx.save();
        const vitality = pheno ? pheno.vitality : 1.0;
        const isDormant = pheno && pheno.stage === 'dormant';
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        if (nameLower.includes('zucchini') || nameLower.includes('courgette') || nameLower.includes('squash') || nameLower.includes('pumpkin')) {
          const bushW = (28 + Math.min(24, (plant.crownDiameter || 0.8) * 30)) * Math.max(0.4, vitality);
          const bushH = (22 + Math.min(22, (plant.maxHeightMeters || 0.6) * 30)) * Math.max(0.4, vitality);
          drawPalmateLeafShield(ctx, px, baseY, bushW, bushH, animTime, pheno, theme);
          ctx.restore();
          return;
        }

        if (isDormant) {
          ctx.strokeStyle = '#b45309';
          ctx.lineWidth = 1.5;
          for (let m = -12; m <= 12; m += 6) {
            ctx.beginPath();
            ctx.moveTo(px + m, baseY);
            ctx.lineTo(px + m + 4, baseY - 4);
            ctx.stroke();
          }
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.2 + px * 0.1) * 1.8;
        const bushW = (22 + Math.min(18, (plant.crownDiameter || 0.4) * 25)) * Math.max(0.4, vitality);
        const bushH = (22 + Math.min(24, (plant.maxHeightMeters || 0.5) * 30)) * Math.max(0.4, vitality);

        ctx.strokeStyle = theme === 'light' ? '#15803d' : '#166534';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(px, baseY);
        ctx.lineTo(px, baseY - bushH * 0.4);
        ctx.lineTo(px - bushW * 0.35 + sway, baseY - bushH * 0.85);
        ctx.moveTo(px, baseY - bushH * 0.4);
        ctx.lineTo(px + bushW * 0.35 + sway, baseY - bushH * 0.85);
        ctx.moveTo(px, baseY - bushH * 0.4);
        ctx.lineTo(px + sway * 0.5, baseY - bushH);
        ctx.stroke();

        [-bushW * 0.35, 0, bushW * 0.35].forEach((offX, idx) => {
          const cy = baseY - bushH * (idx === 1 ? 0.9 : 0.7);
          ctx.fillStyle = plant.foliageColor || (theme === 'light' ? '#16a34a' : '#15803d');
          ctx.beginPath();
          ctx.ellipse(px + offX + sway, cy, bushW * 0.32, bushH * 0.28, (idx - 1) * 0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = theme === 'light' ? 'rgba(21, 128, 61, 0.4)' : '#052e16';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        });

        const isEggplant = nameLower.includes('eggplant') || nameLower.includes('aubergine');
        const isPepper = nameLower.includes('pepper') || nameLower.includes('poivron') || nameLower.includes('chili') || nameLower.includes('piment');
        const isMarigold = nameLower.includes('marigold') || nameLower.includes('oeillet');

        if (pheno && pheno.stage === 'flowering') {
          const fColor = isEggplant ? '#c084fc' : isMarigold ? '#f59e0b' : '#ffffff';
          [-6, 6].forEach(fx => {
            ctx.fillStyle = fColor;
            ctx.beginPath();
            ctx.arc(px + fx + sway, baseY - bushH * 0.7, 3, 0, Math.PI * 2);
            ctx.fill();
          });
        } else if (pheno && pheno.stage === 'harvest') {
          if (isEggplant) {
            ctx.fillStyle = '#3b0764';
            ctx.beginPath();
            ctx.ellipse(px + 6 + sway, baseY - bushH * 0.45, 5, 8.5 * vitality, 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1e1b4b';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.arc(px + 6 + sway, baseY - bushH * 0.45 - 8.5 * vitality + 2, 3, 0, Math.PI * 2);
            ctx.fill();
          } else if (isPepper) {
            ctx.fillStyle = plant.fruitColor || '#ea580c';
            ctx.beginPath();
            ctx.ellipse(px + (sway > 0 ? 5 : -5), baseY - bushH * 0.5, 4.2, 7.5 * vitality, 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#7c2d12';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          } else if (isMarigold) {
            [-7, 7, 0].forEach((fx, idx) => {
              ctx.fillStyle = idx === 1 ? '#f59e0b' : '#ea580c';
              ctx.beginPath();
              ctx.arc(px + fx + sway, baseY - bushH * 0.75 - (idx === 2 ? 4 : 0), 4, 0, Math.PI * 2);
              ctx.fill();
            });
          }
        }
        ctx.restore();
      }

      function drawPerennialRosette(ctx, px, baseY, plant, animTime, monthFloat) {
        ctx.save();
        const m = Math.floor(monthFloat);
        const isWinter = m === 12 || m <= 2;
        const nameLower = (plant.name + ' ' + (plant.commonName || '')).toLowerCase();

        if (isWinter) {
          ctx.fillStyle = '#b45309';
          ctx.fillRect(px - 14, baseY - 4, 28, 4);
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2 + px) * 2;
        const isRhubarb = nameLower.includes('rhubarb') || nameLower.includes('rhubarbe');
        const leaves = isRhubarb ? 6 : 8;

        for (let i = 0; i < leaves; i++) {
          const angle = (i / (leaves - 1) - 0.5) * 2.2;
          const petioleL = (isRhubarb ? 32 : 15) + (i % 2) * 5;
          const tx = px + Math.sin(angle) * (petioleL * 1.35) + sway;
          const ty = baseY - Math.cos(angle) * (petioleL * 0.65);

          // Stalk (Ruby red for rhubarb, pale green for strawberry)
          ctx.strokeStyle = isRhubarb ? '#dc2626' : '#15803d';
          ctx.lineWidth = isRhubarb ? 3.6 : 1.8;
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.quadraticCurveTo(px + Math.sin(angle) * 10, baseY - 6, tx, ty);
          ctx.stroke();

          if (isRhubarb) {
            // Giant rounded savoy-crinkled living-mulch umbrella shield
            ctx.fillStyle = '#15803d';
            ctx.beginPath();
            ctx.ellipse(tx, ty, 16, 12, angle, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#052e16';
            ctx.lineWidth = 0.9;
            ctx.stroke();

            // Distinct red veins radiating from the leaf base
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx + Math.sin(angle) * 8, ty - Math.cos(angle) * 7);
            ctx.stroke();
          } else {
            // Alpine Strawberry: Trifoliate rounded scalloped leaflets
            [-5, 0, 5].forEach((offset, idx) => {
              ctx.fillStyle = '#22c55e';
              ctx.beginPath();
              ctx.arc(tx + offset, ty + (idx === 1 ? -3 : 2), 5, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#14532d';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            });
          }
        }

        // Strawberries: white blossoms in spring, sweet red alpine berries all summer
        if (!isRhubarb) {
          if (m >= 4 && m <= 6) {
            [-8, 6].forEach(fx => {
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(px + fx, baseY - 12, 3, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#facc15';
              ctx.beginPath();
              ctx.arc(px + fx, baseY - 12, 1, 0, Math.PI * 2);
              ctx.fill();
            });
          }
          if (m >= 5 && m <= 10) {
            [-12, -4, 8, 14].forEach((bx, idx) => {
              ctx.fillStyle = '#ef4444';
              ctx.beginPath();
              ctx.ellipse(px + bx, baseY - 4, 3, 4, (idx % 2 === 0 ? 0.2 : -0.2), 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#facc15';
              ctx.fillRect(px + bx - 0.5, baseY - 5, 1, 1);
            });
          }
        }
        ctx.restore();
      }

      function drawComfreyGuild(ctx, px, baseY, animTime, monthFloat) {
        ctx.save();
        const m = Math.floor(monthFloat);
        if (m === 12 || m <= 2) {
          ctx.fillStyle = '#b45309';
          ctx.fillRect(px - 14, baseY - 3, 28, 3);
          ctx.restore();
          return;
        }

        const sway = Math.sin(animTime * 2.2 + px) * 1.6;
        const leaves = 9;

        // Dynamic accumulator mound: thick rounded lance-ovate leaves cascading down to soil mulch
        for (let i = 0; i < leaves; i++) {
          const angle = (i / (leaves - 1) - 0.5) * 2.3;
          const len = 24 + (i % 3) * 5;
          const lx = px + Math.sin(angle) * (len * 1.25) + sway;
          const ly = baseY - Math.cos(angle * 0.7) * (len * 0.65);

          ctx.strokeStyle = '#14532d';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(px, baseY);
          ctx.quadraticCurveTo(px + Math.sin(angle) * 8, baseY - 5, lx, ly);
          ctx.stroke();

          ctx.fillStyle = '#15803d';
          ctx.beginPath();
          ctx.ellipse(lx, ly, 12, 6.5, angle, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#052e16';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        // Nodding violet/pink bell cymes
        if (m >= 4 && m <= 9) {
          [-10, 0, 10].forEach((bx, idx) => {
            const bellX = px + bx + sway;
            const bellY = baseY - 18 - (idx % 2) * 3;
            ctx.fillStyle = idx === 1 ? '#c084fc' : '#f472b6';
            ctx.beginPath();
            ctx.arc(bellX, bellY, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#581c87';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          });
        }
        ctx.restore();
      }

      function drawCoppiceStool(ctx, px, baseY, animTime, theme = 'dark') {
        ctx.save();
        ctx.fillStyle = theme === 'light' ? '#78350f' : '#451a03';
        ctx.fillRect(px - 10, baseY - 8, 20, 8);
        ctx.strokeStyle = theme === 'light' ? '#451a03' : '#1c1917';
        ctx.lineWidth = 1;
        ctx.strokeRect(px - 10, baseY - 8, 20, 8);

        ctx.fillStyle = '#ca8a04';
        ctx.beginPath();
        ctx.ellipse(px, baseY - 8, 10, 3, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 0.8;
        ctx.stroke();

        const shoots = 5;
        const sway = Math.sin(animTime * 3 + px) * 2;
        for (let i = 0; i < shoots; i++) {
          const angle = (i / (shoots - 1) - 0.5) * 1.5;
          const shootLen = 18 + (i % 2) * 6;
          const sx = px + Math.sin(angle) * (shootLen * 0.9) + sway * 0.5;
          const sy = baseY - 8 - Math.cos(angle) * shootLen;

          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(px + (i - 2) * 3, baseY - 8);
          ctx.lineTo(sx, sy);
          ctx.stroke();

          ctx.fillStyle = '#22c55e';
          ctx.beginPath();
          ctx.arc(sx, sy, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.font = '600 6px "Press Start 2P", monospace';
        ctx.fillStyle = theme === 'light' ? '#b45309' : '#eab308';
        ctx.textAlign = 'center';
        ctx.fillText('COPPICED', px, baseY - 16);
        ctx.restore();
      }

      function drawHazelnutClump(ctx, px, baseY, p, crownRadius, treePixelHeight, sway, animTime, monthFloat, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        const stems = 7;

        for (let s = 0; s < stems; s++) {
          const angle = (s / (stems - 1) - 0.5) * 1.4;
          const stemH = treePixelHeight * 0.85 + (s % 3) * 6;
          const tx = px + Math.sin(angle) * (crownRadius * 0.9) + sway;
          const ty = baseY - stemH;

          ctx.strokeStyle = theme === 'light' ? '#78716c' : '#57534e';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(px + (s - 3) * 3, baseY);
          ctx.quadraticCurveTo(px + Math.sin(angle) * (crownRadius * 0.4), baseY - stemH * 0.5, tx, ty);
          ctx.stroke();
        }

        if (m === 12 || m <= 2) {
          if (m === 1 || m === 2) {
            [-crownRadius * 0.4, 0, crownRadius * 0.4].forEach(cxOff => {
              ctx.strokeStyle = '#facc15';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(px + cxOff + sway, baseY - treePixelHeight * 0.5);
              ctx.lineTo(px + cxOff + sway, baseY - treePixelHeight * 0.5 + 8);
              ctx.stroke();
            });
          }
          ctx.restore();
          return;
        }

        drawSculptedFoliageBillow(ctx, px, baseY - treePixelHeight * 0.65, crownRadius * 1.05, crownRadius * 0.75, p.foliageColor || '#15803d', animTime, sway, false, monthFloat, '#ca8a04', theme);

        if (m >= 8 && m <= 10) {
          [-crownRadius * 0.35, crownRadius * 0.3].forEach((hx, idx) => {
            const hy = baseY - treePixelHeight * 0.5 + idx * 8;
            ctx.fillStyle = '#a16207';
            ctx.beginPath();
            ctx.arc(px + hx + sway, hy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#65a30d';
            ctx.lineWidth = 1.2;
            ctx.stroke();
          });
        }
        ctx.restore();
      }

      function drawBerryCanes(ctx, px, baseY, p, crownRadius, treePixelHeight, sway, animTime, monthFloat, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        const canes = 6;

        for (let c = 0; c < canes; c++) {
          const dir = c % 2 === 0 ? 1 : -1;
          const caneSpan = (crownRadius * 0.75) * (0.5 + (c / canes) * 0.5);
          const archH = treePixelHeight * 0.8 + (c % 2) * 8;
          const tipX = px + dir * caneSpan + sway;

          ctx.strokeStyle = theme === 'light' ? '#78350f' : '#854d0e';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(px + (c - 2.5) * 2, baseY);
          ctx.quadraticCurveTo(px + dir * (caneSpan * 0.4), baseY - archH, tipX, baseY - archH * 0.35);
          ctx.stroke();

          if (m >= 4 && m <= 11) {
            ctx.fillStyle = p.foliageColor || (theme === 'light' ? '#16a34a' : '#15803d');
            ctx.beginPath();
            ctx.ellipse(tipX, baseY - archH * 0.4, 7, 5, dir * 0.4, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (m >= 6 && m <= 9) {
          [-crownRadius * 0.4, 0, crownRadius * 0.4].forEach((bx, idx) => {
            const by = baseY - treePixelHeight * 0.45 + (idx % 2) * 6;
            ctx.fillStyle = p.fruitColor || '#dc2626';
            ctx.beginPath();
            ctx.arc(px + bx + sway, by, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          });
        }
        ctx.restore();
      }

      function drawAromaticCushion(ctx, px, baseY, p, crownRadius, animTime, monthFloat, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        const nameLower = (p.name + ' ' + (p.botanicalName || '')).toLowerCase();
        const isLavender = nameLower.includes('lavender') || nameLower.includes('lavande');
        const isRosemary = nameLower.includes('rosemary') || nameLower.includes('romarin');

        const cushionW = Math.max(16, crownRadius * 0.9);
        const cushionH = Math.max(12, cushionW * 0.65);
        const sway = Math.sin(animTime * 2.2 + px) * 1.5;

        const baseColor = isLavender ? '#64748b' : isRosemary ? '#334155' : '#15803d';
        ctx.fillStyle = baseColor;
        ctx.beginPath();
        ctx.ellipse(px + sway * 0.3, baseY - cushionH * 0.5, cushionW, cushionH, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = theme === 'light' ? 'rgba(30, 41, 59, 0.4)' : '#020617';
        ctx.lineWidth = 1;
        ctx.stroke();

        if (m >= 5 && m <= 8) {
          const spikeColor = isLavender ? '#a855f7' : isRosemary ? '#818cf8' : '#f472b6';
          const spikes = 7;
          for (let s = 0; s < spikes; s++) {
            const sx = px + (s / (spikes - 1) - 0.5) * (cushionW * 1.4) + sway;
            const sy = baseY - cushionH - 4 - (s % 3) * 3;
            ctx.strokeStyle = spikeColor;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(sx, baseY - cushionH * 0.6);
            ctx.lineTo(sx, sy);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawArborVineTrellis(ctx, px, baseY, p, crownRadius, sway, animTime, monthFloat, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        const trellisW = Math.max(45, crownRadius * 1.6);
        const trellisH = Math.max(55, crownRadius * 1.4);
        const topY = baseY - trellisH;

        ctx.strokeStyle = theme === 'light' ? '#78350f' : '#451a03';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, baseY);
        ctx.lineTo(px, topY);
        ctx.moveTo(px - trellisW * 0.5, topY);
        ctx.lineTo(px + trellisW * 0.5, topY);
        ctx.stroke();

        ctx.strokeStyle = '#92400e';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(px - 3, baseY);
        ctx.quadraticCurveTo(px + 4, baseY - trellisH * 0.5, px - 2, topY);
        ctx.stroke();

        if (m === 12 || m <= 2) {
          ctx.strokeStyle = '#78350f';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(px - trellisW * 0.45, topY);
          ctx.lineTo(px + trellisW * 0.45, topY);
          ctx.stroke();
          ctx.restore();
          return;
        }

        drawSculptedFoliageBillow(ctx, px - trellisW * 0.25, topY - 6, crownRadius * 0.65, crownRadius * 0.45, p.foliageColor || '#16a34a', animTime, sway, false, monthFloat, '#d97706', theme);
        drawSculptedFoliageBillow(ctx, px + trellisW * 0.25, topY - 6, crownRadius * 0.65, crownRadius * 0.45, p.foliageColor || '#16a34a', animTime, sway, false, monthFloat, '#d97706', theme);

        if (m >= 8 && m <= 10) {
          const isGrape = (p.name + ' ' + (p.botanicalName || '')).toLowerCase().includes('grape') || (p.name || '').toLowerCase().includes('vigne');
          [-trellisW * 0.25, trellisW * 0.25].forEach(fx => {
            if (isGrape) {
              ctx.fillStyle = p.fruitColor || '#581c87';
              for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3 - r; c++) {
                  const gx = px + fx + (c - (3 - r) * 0.5) * 3.5 + sway;
                  const gy = topY + 6 + r * 3.5;
                  ctx.beginPath();
                  ctx.arc(gx, gy, 2, 0, Math.PI * 2);
                  ctx.fill();
                }
              }
            } else {
              ctx.fillStyle = '#854d0e';
              ctx.beginPath();
              ctx.ellipse(px + fx + sway, topY + 8, 3.5, 5, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          });
        }
        ctx.restore();
      }

      function drawAppleTreeCrown(ctx, px, cy, crownRadius, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        const isWinter = m === 12 || m <= 2;
        const isAutumn = m >= 8 && m <= 11;

        if (isWinter) {
          ctx.strokeStyle = theme === 'light' ? '#78350f' : (p.barkColor || '#451a03');
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(px, cy + crownRadius * 0.4);
          ctx.quadraticCurveTo(px - crownRadius * 0.3, cy, px - crownRadius * 0.6 + sway, cy - crownRadius * 0.3);
          ctx.moveTo(px, cy + crownRadius * 0.4);
          ctx.quadraticCurveTo(px + crownRadius * 0.3, cy, px + crownRadius * 0.7 + sway, cy - crownRadius * 0.2);
          ctx.stroke();
          ctx.restore();
          return;
        }

        // Balanced, globular rounded dome with 6-7 rounded billow pads
        drawSculptedFoliageBillow(ctx, px, cy, crownRadius * 1.1, crownRadius * 0.85, p.foliageColor || '#22c55e', animTime, sway, false, monthFloat, '#ca8a04', theme);

        // Spring blossom clusters (pink-and-white buds)
        if (m === 4 || m === 5) {
          [-crownRadius * 0.45, -crownRadius * 0.1, crownRadius * 0.35].forEach((bx, idx) => {
            const by = cy + (idx % 2 === 0 ? crownRadius * 0.15 : -crownRadius * 0.15);
            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.arc(px + bx + sway, by, 3.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(px + bx + sway, by, 2.2, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        // Autumn crisp apples with realistic specular shine
        if (isAutumn) {
          [-crownRadius * 0.45, -crownRadius * 0.15, crownRadius * 0.18, crownRadius * 0.48].forEach((fx, idx) => {
            const fy = cy + (idx % 2 === 0 ? crownRadius * 0.22 : -crownRadius * 0.12);
            ctx.fillStyle = p.fruitColor || '#dc2626';
            ctx.beginPath();
            ctx.arc(px + fx + sway, fy, 4.5, 0, Math.PI * 2);
            ctx.fill();

      function drawPaulowniaCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();

          ctx.moveTo(px, cy + crownRadius * 0.5);
          ctx.lineTo(px + sway * 0.4, cy - treePixelHeight * 0.35);

          [-crownRadius * 0.3, crownRadius * 0.3].forEach((sx, idx) => {
            ctx.fillStyle = theme === 'light' ? '#78350f' : '#451a03';
            ctx.beginPath();
            ctx.ellipse(px + sx + sway, cy - treePixelHeight * 0.12 + idx * 4, 3, 5, 0.1, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
          return;
        }

        // High umbrella shade habit: broad majestic ascending boughs
        ctx.strokeStyle = theme === 'light' ? '#78716c' : '#52525b';
        ctx.lineWidth = 3.6;
        ctx.beginPath();
        ctx.moveTo(px, cy + crownRadius * 0.45);
        ctx.quadraticCurveTo(px - crownRadius * 0.35, cy + 4, px - crownRadius * 0.65 + sway * 0.6, cy - crownRadius * 0.1);
        ctx.moveTo(px, cy + crownRadius * 0.45);
        ctx.quadraticCurveTo(px + crownRadius * 0.35, cy + 4, px + crownRadius * 0.65 + sway * 0.6, cy - crownRadius * 0.1);

        // Spring: Upright conical/pyramidal panicles of soft lavender/violet foxglove-like trumpet blossoms
        if (m === 4 || m === 5) {

            const panicleX = px + fx + sway;
            const panicleY = cy - crownRadius * 0.35 - (idx % 2) * 8;

            ctx.fillStyle = '#c084fc';
            ctx.beginPath();
            ctx.moveTo(panicleX, panicleY - 14);
            ctx.lineTo(panicleX - 6.5, panicleY);
            ctx.lineTo(panicleX + 6.5, panicleY);

            ctx.beginPath();
            ctx.arc(panicleX, panicleY - 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#7e22ce';
            ctx.lineWidth = 0.8;
            ctx.stroke();

        drawSculptedFoliageBillow(ctx, px, cy, crownRadius * 1.38, crownRadius * 0.92, '#16a34a', animTime, sway, false, monthFloat, '#eab308', theme);
        drawSculptedFoliageBillow(ctx, px, cy - crownRadius * 0.38, crownRadius * 0.98, crownRadius * 0.68, '#22c55e', animTime, sway * 0.8, false, monthFloat, '#eab308', theme);

        if (m >= 9 && m <= 11) {

            ctx.beginPath();
            ctx.ellipse(px + sx + sway, cy + crownRadius * 0.12, 3.5, 5.5, 0, 0, Math.PI * 2);

            ctx.strokeStyle = '#451a03';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          });
        }
        ctx.restore();
      }

      function drawWhiteWillowWhipCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const m = Math.floor(monthFloat);
        const isWinter = m === 12 || m <= 2;
        const wands = 11;

        // Upright fountain sheaf of flexible wands radiating outward from pollard stool
        for (let w = 0; w < wands; w++) {
          const angle = (w / (wands - 1) - 0.5) * 1.6;
          const wandH = (treePixelHeight * 0.88) + (w % 3) * 6;
          const tx = px + Math.sin(angle) * (crownRadius * 0.95) + sway;
          const ty = cy - wandH * 0.5;

          ctx.strokeStyle = isWinter ? (theme === 'light' ? '#d97706' : '#eab308') : (theme === 'light' ? '#4d7c0f' : '#65a30d');
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(px + (w - 5) * 2.5, cy + crownRadius * 0.45);
          ctx.quadraticCurveTo(px + Math.sin(angle) * (crownRadius * 0.4), cy, tx, ty);
          ctx.stroke();

          if (!isWinter) {
            // Soft rounded lanceolate cloudlets fluttering rapidly in wind
            const fastSway = Math.sin(animTime * 3.6 + w) * 3;
            drawSculptedFoliageBillow(ctx, tx + fastSway, ty, crownRadius * 0.35, crownRadius * 0.26, '#4ade80', animTime, fastSway, false, monthFloat, '#facc15', theme);
          } else if (m === 2 || m === 3) {
            // Silvery pussy willow catkin puffs
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(tx, ty + 4, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      function drawGiantRedwoodCrown(ctx, px, cy, crownRadius, treePixelHeight, sway, animTime, monthFloat, p, theme = 'dark') {
        ctx.save();
        const isLight = theme === 'light';
        const tiers = 6;
        for (let t = 0; t < tiers; t++) {
          const tierY = cy + crownRadius * 0.5 - (t / tiers) * (treePixelHeight * 0.85);
          const tierR = crownRadius * (1.0 - (t / tiers) * 0.75);
          const tierSway = sway * (t / tiers);

          ctx.fillStyle = isLight ? '#047857' : '#064e3b';
          ctx.beginPath();
          ctx.moveTo(px - tierR + tierSway, tierY);
          ctx.quadraticCurveTo(px + tierSway, tierY - 14, px + tierR + tierSway, tierY);
          ctx.lineTo(px + tierSway, tierY - 18);
          ctx.closePath();
          ctx.fill();

          // Soft natural foliage border without harsh pitch black outlines
          ctx.strokeStyle = isLight ? 'rgba(5, 150, 105, 0.7)' : '#022c22';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Needle fringe strokes along tier skirts
          ctx.strokeStyle = isLight ? 'rgba(16, 185, 129, 0.45)' : 'rgba(4, 120, 87, 0.5)';
          ctx.lineWidth = 0.8;
          for (let n = -tierR * 0.75; n <= tierR * 0.75; n += 6) {
            ctx.beginPath();
            ctx.moveTo(px + tierSway + n, tierY);
            ctx.lineTo(px + tierSway + n + (n > 0 ? 3 : -3), tierY + 3.5);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
